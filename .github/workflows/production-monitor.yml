name: Production monitor
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Fail this run to verify the owner's GitHub notification, without stopping production
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe API, database and SPA
        run: node scripts/verify-deployment.mjs
      - name: Test alert delivery
        if: inputs.test_alert
        run: |
          echo '::error::Intentional alert delivery test. Production was not modified.'
          exit 1
