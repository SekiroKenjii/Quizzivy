name: CI

# How this workflow decides what to run is in docs/setup/ci.md. In short: Plan
# hashes the files each job reads, and a job is skipped when its newest marker
# for that hash is a pass. Every job checks out only those files, so the hash
# covers everything the job can see. Each job ends by recording its outcome.
on:
  pull_request:
  push:
    branches: [main, develop, "work/**"]

# A newer push supersedes an in-flight run on the same pull request. On a
# branch a run in progress is never cancelled, but runs go one at a time and
# only the newest waiting one is kept: a push that arrives while another
# waits replaces it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # 11.12.0 is a release pnpm itself refuses to install
  # (ERR_PNPM_BROKEN_PNPM_RELEASE): its @pnpm/exe build shipped without a
  # binary -- 16KB unpacked against 18MB for a real one.
  PNPM_VERSION: "11.25.0"
  GO_VERSION: "1.27"

jobs:
  # ------------------------------------------------------------------- plan
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the plan
        run: node --test "scripts/ci/tests/*.test.mjs"

      - name: Decide which jobs run
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan.mjs

  # ------------------------------------------------------------------- deck
  deck:
    name: Deck
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs.deck.run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs.deck) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node scripts/check-design-deck.mjs

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # --------------------------------------------------------------- contract
  # api/openapi.yaml is the single source of truth. This job lints it, asserts
  # its invariants, regenerates both sides and fails if the committed output
  # differs. `make gen-check` runs `make contract` first.
  contract:
    name: Contract
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs.contract.run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs.contract) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}

      - name: Lint the contract, regenerate and fail on drift
        run: make gen-check

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # ------------------------------------------------------------ server lint
  server-lint:
    name: Server lint
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['server-lint'].run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['server-lint']) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      # SA1019 is what enforces AGENTS.md's "never use a deprecated
      # identifier"; go vet does not check that.
      - name: Staticcheck
        working-directory: server
        run: go tool staticcheck ./...

      # server/.golangci.yml carries the Sonar-shaped rules (cognitive
      # complexity, nesting, duplication, unused parameters) so a finding fails
      # here, before it reaches SonarLint or SonarCloud. The web job gets the
      # same from eslint-plugin-sonarjs inside `pnpm lint`. Same pin as the
      # Makefile's GOLANGCI_VERSION.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: server
          args: --build-tags integration,e2e

      - name: Check formatting
        working-directory: server
        run: |
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"; echo "$unformatted"; exit 1
          fi

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # ----------------------------------------------------------- server tests
  server-test:
    name: Server tests
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['server-test'].run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        # Pinned to 18: uuidv7() and virtual generated columns do not exist
        # before it, and internal/db/pg18_test.go asserts the major version.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['server-test']) }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://quizzivy_migrate:migrate@localhost:5432/quizzivy?sslmode=disable
      # Enables the migration round trip, which drops and recreates schema app.
      # Safe here -- the service container is thrown away after the job. Locally
      # it is off by default so `go test ./...` cannot wipe a seeded database.
      TEST_DESTRUCTIVE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/db-tools

      # The same script docker/initdb calls locally, so the two cannot drift.
      - name: Provision roles and database
        run: ./scripts/provision-db.sh

      # Migrations run BEFORE the tests, not by one of them: `go test ./...`
      # runs packages in parallel, and only internal/db applies migrations --
      # every other database-backed package opens a pool and assumes the tables
      # are there. This makes the schema a precondition of the step rather than
      # a race one package usually wins, and matches `make migrate` before
      # `make test-api`.
      - name: Apply migrations
        run: goose -dir migrations postgres "$TEST_DATABASE_URL" up

      # The three tiers the test taxonomy names, each its own step so a failure
      # says which tier fell: unit (no database), integration (repositories
      # and use cases against Postgres and the object store), end-to-end (the
      # whole application in-process over HTTP). The converter tests are
      # integration tests that need the converter image and a step of their
      # own. Each step writes its own coverage profile; Sonar reads all four.
      - name: Unit tests
        working-directory: server
        run: go test ./... -covermode=atomic -coverprofile=coverage-unit.out

      # Up before the integration tier: the storage client's tests and the
      # import intake, artifact and PDF pipeline tests store real objects, and
      # so does the end-to-end tier after them.
      - name: Start MinIO
        uses: ./.github/actions/minio
        with:
          token: ${{ github.token }}

      # S3_* is set on the steps that use the object store, never on the job:
      # one storage test file carries no build tag, so the unit tier compiles
      # it too and has to skip it there, before MinIO is up. The bucket is the
      # private one imports are kept in.
      - name: Integration tests
        working-directory: server
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: quizzivy-imports
          S3_ACCESS_KEY_ID: quizzivy
          S3_SECRET_ACCESS_KEY: quizzivy-dev-secret
          S3_FORCE_PATH_STYLE: "true"
        run: go test -tags integration ./internal/... -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage-integration.out

      # The converter refuses a tag and takes an image id, so the id is what
      # the next step is given.
      - name: Build the Word converter image
        id: converter
        run: |
          docker build --tag quizzivy-word-converter:ci docker/word-converter
          image="$(docker image inspect --format '{{.Id}}' quizzivy-word-converter:ci)"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The tests that run LibreOffice in that image, and the pipeline test
      # that takes a paper through it; the integration tier skips them for
      # want of TEST_WORD_CONVERTER_IMAGE, and -run keeps this step to them.
      # A conversion holds one Docker-wide slot, a container with a fixed
      # name, and a second one that finds it taken answers busy. The tests
      # live in two packages, one of which occupies the slot on purpose, so
      # -p 1 runs the packages one after the other. Without an image id every
      # one of these tests skips and the packages still read ok, so the step
      # fails before go test when it has none.
      - name: Import converter tests
        working-directory: server
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: quizzivy-imports
          S3_ACCESS_KEY_ID: quizzivy
          S3_SECRET_ACCESS_KEY: quizzivy-dev-secret
          S3_FORCE_PATH_STYLE: "true"
          TEST_WORD_CONVERTER_IMAGE: ${{ steps.converter.outputs.image }}
        run: |
          case "$TEST_WORD_CONVERTER_IMAGE" in
            sha256:*) ;;
            *) echo "::error::no converter image id, so every converter test would skip"; exit 1 ;;
          esac
          go test -tags integration -p 1 -count=1 -run '^(TestDocker|TestRealPipeline)' \
            ./internal/platform/wordconvert/... ./internal/modules/imports/repositories/... \
            -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage-converter.out

      # Temporary, for the acceptance run of #298: the two tests that replaced
      # the timing-dependent one, thirty times each, every result printed.
      # A -run that matched nothing would read ok, so the step counts the
      # passes itself. Revert the commit that added this step before the merge.
      - name: Converter timeout and slot tests, thirty times (#298)
        working-directory: server
        env:
          TEST_WORD_CONVERTER_IMAGE: ${{ steps.converter.outputs.image }}
        run: |
          set -o pipefail
          go test -v -tags integration -p 1 -count=30 \
            -run '^(TestDockerConversionTimeout|TestDockerHeldSlot)' \
            ./internal/platform/wordconvert/... | tee "$RUNNER_TEMP/acceptance-298.log"
          for name in TestDockerConversionTimeoutDoesNotLeaveContainerOrStaging TestDockerHeldSlotRefusesSecondConversion; do
            passed="$(grep -c "^--- PASS: $name " "$RUNNER_TEMP/acceptance-298.log" || true)"
            echo "#298 acceptance: $name passed $passed of 30"
            [ "$passed" -eq 30 ]
          done

      # The two-teacher isolation suite uploads real images, audio and Word
      # sources. Its harness defaults to the compose endpoint, credentials and
      # buckets.
      - name: End-to-end tests
        working-directory: server
        run: go test -tags e2e ./tests/... -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage-e2e.out

      # Explicitly re-run the round trip against a database that has never seen
      # these migrations, which is the state that matters for a first deploy.
      - name: Migrations apply and reverse on a clean database
        env:
          MIGRATION_DATABASE_URL: postgres://quizzivy_migrate:migrate@localhost:5432/quizzivy_migration_roundtrip?sslmode=disable
        run: |
          createdb --owner=quizzivy_migrate quizzivy_migration_roundtrip
          goose -dir migrations postgres "$MIGRATION_DATABASE_URL" up
          goose -dir migrations postgres "$MIGRATION_DATABASE_URL" reset
          goose -dir migrations postgres "$MIGRATION_DATABASE_URL" up

      # always(): a failing test still produced a profile for everything that
      # did run, and that is exactly the run where Sonar's view is worth most.
      # Kept as long as a marker, because Sonar reads the profile of the run
      # that proved these files when this job is skipped.
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: server/coverage-*.out
          retention-days: 30
          overwrite: true

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # ------------------------------------------------------------- web checks
  web-check:
    name: Web checks
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['web-check'].run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['web-check']) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}

      # §2: "CI fails on lint errors."
      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Format check
        working-directory: web
        run: pnpm format:check

      - name: Integration tests
        working-directory: web
        run: pnpm test:integration

      - name: Build
        working-directory: web
        run: pnpm build

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # --------------------------------------------------------- web unit tests
  # Split into shards because the suite is the longest single step on the web
  # side. scripts/ci/plan.mjs sets the number of shards. The name carries no
  # expression: GitHub appends the shard itself, and a skipped job would show
  # an expression unexpanded.
  web-unit:
    name: Web unit
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['web-unit'].run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.plan).jobs['web-unit'].shards }}
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['web-unit']) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}

      - name: Unit tests
        working-directory: web
        run: pnpm test:unit --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[strategy.job-index][job.status] }}

  # -------------------------------------------------------------------- e2e
  e2e:
    name: E2E
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs.e2e.run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs.e2e) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer runs `pnpm build && pnpm preview`, so this
      # exercises a real production build rather than the dev server.
      - name: Run Playwright
        working-directory: web
        run: pnpm e2e

      - name: Run content editor prototype
        working-directory: web
        run: pnpm e2e:content

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          overwrite: true

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # --------------------------------------------------------------- e2e-live
  # The one browser suite that talks to a real API (§14), because its claims
  # are about the two halves meeting: E2E 1a uploads a real mp3 so the §11.1
  # sniff, size check and duration probe run rather than being mocked.
  #
  # Separate from `e2e` so the stubbed suite stays independent of postgres,
  # MinIO and a Go build.
  e2e-live:
    name: E2E (live API)
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).jobs['e2e-live'].run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      JOB: ${{ toJSON(fromJSON(needs.plan.outputs.plan).jobs['e2e-live']) }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MIGRATE_URL: postgres://quizzivy_migrate:migrate@localhost:5432/quizzivy?sslmode=disable
      DATABASE_URL: postgres://quizzivy_app:app@localhost:5432/quizzivy?sslmode=disable
      APP_ENV: development
      API_PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      JWT_SIGNING_KEY: e2e-live-signing-key-not-a-secret-32b
      # base64 of "e2e-live-join-code-key-not-secre", 32 bytes. Throwaway.
      JOIN_CODE_KEY: ZTJlLWxpdmUtam9pbi1jb2RlLWtleS1ub3Qtc2VjcmU=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: quizzivy-media
      S3_ACCESS_KEY_ID: quizzivy
      S3_SECRET_ACCESS_KEY: quizzivy-dev-secret
      # MinIO is addressed by path, not by virtual host. Without this the SDK
      # sends the bucket as a subdomain, MinIO reads the first path segment as
      # the bucket instead, and every upload fails with NoSuchBucket for a
      # bucket named "audio". .env sets it for the same reason; only R2 in
      # production leaves it unset.
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ fromJSON(env.JOB).sparse }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/db-tools

      # MinIO comes from the repo's own compose file rather than a service
      # container: a service container cannot override the image command, and
      # MinIO needs `server /data`. Reusing compose also means CI and a
      # developer's machine start the same MinIO with the same buckets, created
      # and made private by the same minio-init step.
      - name: Start MinIO
        uses: ./.github/actions/minio
        with:
          token: ${{ github.token }}

      - name: Provision roles and database
        run: ./scripts/provision-db.sh

      - name: Apply migrations and seed
        run: |
          goose -dir migrations postgres "$MIGRATE_URL" up
          for f in seed/*.sql; do psql "$MIGRATE_URL" -v ON_ERROR_STOP=1 -f "$f"; done

      # Built rather than `go run`, so a compile error fails here with a clear
      # message instead of as a connection refused thirty seconds later.
      - name: Start the API
        run: |
          go -C server build -o "$RUNNER_TEMP/api" ./cmd/api
          "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      - uses: ./.github/actions/web
        with:
          node: ${{ env.NODE_VERSION }}
          pnpm: ${{ env.PNPM_VERSION }}

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the live E2Es
        working-directory: web
        run: pnpm e2e:live

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-live
          path: web/playwright-report/
          retention-days: 7
          overwrite: true

      - uses: ./.github/actions/record
        if: always()
        with:
          marker: ${{ fromJSON(env.JOB).outcomes[0][job.status] }}

  # ----------------------------------------------------------------- result
  # The one check the branch rules require. always(): a job skipped by its `if`
  # counts as passed for a required check, so this must run and fail when a
  # needed job failed, was cancelled, or never started.
  #
  # Only a pull request's run reports it under the required name. The head of
  # a pull request from main, develop or a work branch also has a push run,
  # which tests the branch and not the merge; its green result must not stand
  # in for the merge's.
  result:
    name: ${{ github.event_name == 'pull_request' && 'CI result' || 'CI result (push)' }}
    needs: [plan, deck, contract, server-lint, server-test, web-check, web-unit, e2e, e2e-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Compare what ran with the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs

  # ------------------------------------------------------------------ sonar
  # Static analysis on top of the language-specific jobs above, not instead of
  # them: `go vet`, eslint and tsc stay authoritative for their own languages
  # and fail fast. This adds the cross-cutting things they do not look for --
  # duplication, complexity, and coverage on new code.
  sonar:
    name: Sonar
    # needs: only to order this after the coverage upload -- NOT to make the
    # analysis conditional on the tests passing. A red build is when static
    # analysis has the most to say.
    needs: [plan, server-test]
    # develop only, until the plan allows reading non-main branches.
    # SonarCloud's main branch is the only one this organization can read, so
    # `develop` is set as the main branch there -- and an analysis submitted
    # for any OTHER branch lands somewhere nobody can open.
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads git history to decide what counts as new code and to
          # attribute issues. A shallow clone silently makes every line look new.
          fetch-depth: 0

      # Coverage is an input to the scan, not a precondition for it. When the
      # server tests were skipped, the profile comes from the run that proved
      # the same server files; if there is none, analyse without it.
      - name: Download Go coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: go-coverage
          path: server
          run-id: ${{ fromJSON(needs.plan.outputs.plan).jobs['server-test'].proof || github.run_id }}
          github-token: ${{ github.token }}

      # Skips rather than fails while SONAR_TOKEN is unset, so this job can be
      # merged before the SonarCloud project exists.
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Say why it was skipped
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not set, so no analysis ran."
          echo "See the setup steps at the top of sonar-project.properties."
