name: Deploy

# Merging release/* into main is what ships. This runs AFTER CI concludes on
# main rather than on the push itself, so a merge that breaks something is not
# deployed while its own test run is still red.
#
# It is a separate workflow, not a job inside CI, for one reason worth stating:
# a deploy that fails for an infrastructure reason -- an expired token, a Fly
# region hiccup -- can be re-run on its own from workflow_dispatch, without
# paying for twenty minutes of tests that already passed on the same commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options: [all, api, web]

# Never cancel a deploy in flight. A cancelled `flyctl deploy` can leave the app
# mid-rollout, and a cancelled release_command can leave migrations half applied
# -- both far worse than one queued run waiting its turn.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # 11.12.0 is a release pnpm itself refuses to install
  # (ERR_PNPM_BROKEN_PNPM_RELEASE): its @pnpm/exe build shipped without a
  # binary -- 16KB unpacked against 18MB for a real one.
  PNPM_VERSION: "11.25.0"
  # Where the SPA is told to find the API. Baked into the bundle at build time,
  # so it is a build input rather than runtime configuration.
  API_ORIGIN: https://api.quizzivy.com
  PAGES_PROJECT: quizzivy-web
  # The version that has deployed this project; bump deliberately.
  WRANGLER_VERSION: 3.90.0

jobs:
  # The commit CI validated, resolved once so both jobs deploy the same thing.
  #
  # workflow_run does NOT check out the triggering commit by default -- it
  # checks out the default branch's tip. On a quiet repo those are the same
  # commit and the difference never shows; on a busy afternoon it silently
  # deploys something CI never saw.
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      api: ${{ steps.pick.outputs.api }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      - id: pick
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          target="${{ inputs.target || 'all' }}"
          echo "sha=$sha"                                    >> "$GITHUB_OUTPUT"
          echo "api=${{ inputs.target == 'web' && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "web=${{ inputs.target == 'api' && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "Deploying $target at $sha"

  # ------------------------------------------------------------------- api
  api:
    name: API → Fly
    needs: resolve
    if: needs.resolve.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Fail before touching production rather than half way through it. A
      # missing token otherwise surfaces as an auth error from flyctl after the
      # image has already been built.
      - name: Check the token is present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Create a deploy token with"
            echo "::error::  fly tokens create deploy -a quizzivy-api"
            echo "::error::then add it with: gh secret set FLY_API_TOKEN"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Ask, before building anything, whether the configuration this app will
      # boot with is one it accepts.
      #
      # config.Load has two all-or-nothing groups -- Google and object storage --
      # and refuses a partial set by exiting 1. Both have now shipped partial,
      # and each cost a full build, a migration, a rollout and a health check to
      # discover, with the cause visible only in the app's own stderr. The names
      # are knowable up front: fly.toml is in this checkout and `secrets list`
      # prints the rest.
      #
      # Names only, never values. A secret set to the wrong string still gets
      # through here, and that is a different failure with a different symptom.
      - name: Preflight the production configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          have=$( {
            sed -n '/^\[env\]/,/^\[[a-z]/p' fly.toml | grep -oE '^ *[A-Z0-9_]+' | tr -d ' '
            flyctl secrets list -a quizzivy-api --json | jq -r '.[] | (.Name // .name)'
          } | sort -u )
          echo "configured names:"; echo "$have" | sed 's/^/  /'

          fail=0
          has() { echo "$have" | grep -qx "$1"; }
          need() { has "$1" || { echo "::error::$1 is required and is not set"; fail=1; }; }

          # Configured as a set or not at all, never in between.
          group() {
            label=$1; shift
            present=0; total=0; missing=
            for name in "$@"; do
              total=$((total + 1))
              if has "$name"; then present=$((present + 1)); else missing="$missing $name"; fi
            done
            if [ "$present" -ne 0 ] && [ "$present" -ne "$total" ]; then
              echo "::error::$label is $present of $total configured — the app refuses this and exits. Missing:$missing"
              fail=1
            fi
          }

          need DATABASE_URL
          need JWT_SIGNING_KEY
          need CORS_ALLOWED_ORIGINS

          # loadGoogle takes the client id from either name, so the group is
          # satisfied by whichever is present.
          if has GOOGLE_CLIENT_ID || has VITE_GOOGLE_CLIENT_ID; then
            for name in GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI; do
              has "$name" || { echo "::error::google sign-in is partly configured; $name is missing"; fail=1; }
            done
          fi

          group "object storage" S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY

          # R2_* are read by `make verify-r2` and by nothing else. Setting those
          # instead of the S3_* names is what docs/setup/dns.md used to instruct,
          # and it looks like storage is configured when none of it reaches the
          # server.
          if has R2_ACCESS_KEY_ID && ! has S3_ACCESS_KEY_ID; then
            echo "::error::R2_ACCESS_KEY_ID is set but S3_ACCESS_KEY_ID is not. The server reads the S3_* names and derives nothing from R2_*; see docs/setup/dns.md"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "configuration is complete"

      # --remote-only builds on Fly's builders, so this runner needs no Docker
      # layer cache and the image is built next to where it will run.
      #
      # fly.toml's release_command applies migrations before the new version
      # takes traffic and rolls the deploy back if they fail, which is why the
      # schema change and the code that needs it ship as one action.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 10m

      # `flyctl deploy` updated the config of a machine that was already
      # stopped, logged "reached stopped state" followed by "is now in a good
      # state", and exited 0. Nothing was started and no smoke check ran, so the
      # deploy reported success on a version that had never executed.
      #
      # A machine is left stopped by the PREVIOUS deploy failing, which makes
      # this the exact path a recovery deploy takes -- the one run where the
      # difference matters most.
      - name: Make sure the machine is actually running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list -a quizzivy-api
          stopped=$(flyctl machines list -a quizzivy-api --json \
            | jq -r '.[] | select(.state != "started") | .id')
          for id in $stopped; do
            echo "starting $id"
            flyctl machine start "$id" -a quizzivy-api
          done
          # Started is not serving. Give the process a moment to bind before the
          # health check below decides.
          sleep 10
          flyctl machines list -a quizzivy-api
          running=$(flyctl machines list -a quizzivy-api --json \
            | jq -r '[.[] | select(.state == "started")] | length')
          echo "machines started: $running"
          [ "$running" -ge 1 ] || { echo "::error::no machine is running"; exit 1; }

      # Fly reports a deploy as successful once health checks pass; this asks
      # the app the one question the health check exists to answer.
      - name: Verify the API answers
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$API_ORIGIN/healthz") && break
            echo "attempt $attempt failed; retrying in 6s"; sleep 6
          done
          echo "$body"
          echo "$body" | grep -q '"database":"ok"' || {
            echo "::error::/healthz did not report database:ok"; exit 1; }

      # What Fly's own failure output does not give you.
      #
      # A crash-on-boot is reported as "the app appears to be crashing" followed
      # by "here's the last lines below" and then nothing at all -- the machine
      # died before Fly attached to its log stream. The actual cause was one
      # line on the app's stderr, and finding it took reproducing the production
      # environment locally. This prints that line in the run that failed.
      #
      # Names only from `secrets list`: Fly does not print values, and the
      # question a boot failure raises is almost always which name is missing.
      - name: Why it crashed
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::app logs"
          flyctl logs -a quizzivy-api --no-tail | tail -80 || echo "(no logs available)"
          echo "::endgroup::"
          echo "::group::configured secret names (values are never printed)"
          flyctl secrets list -a quizzivy-api || true
          echo "::endgroup::"
          echo "::group::env baked into fly.toml"
          flyctl config env -a quizzivy-api || true
          echo "::endgroup::"

  # ------------------------------------------------------------------- web
  # After the API, deliberately. The SPA is the half that calls the other, so
  # the window between the two deploys is old-SPA-against-new-API rather than
  # the reverse -- and the contract only ever grows, so that direction is safe.
  web:
    name: Web → Cloudflare Pages
    needs: [resolve, api]
    if: ${{ !cancelled() && needs.resolve.outputs.web == 'true' && (needs.api.result == 'success' || needs.api.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check the credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          # Not a secret -- it travels in the authorization URL the browser
          # follows -- but it IS environment-specific, and a build without it
          # simply hides the Google button rather than failing, which is the
          # kind of breakage nobody reports.
          [ -n "$VITE_GOOGLE_CLIENT_ID" ] || missing="$missing VITE_GOOGLE_CLIENT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::not configured:$missing"
            echo "::error::see docs/setup/deploy.md"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # VITE_ values are inlined at build time, so this is the step that decides
      # which API the deployed SPA talks to. There is no runtime override.
      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ env.API_ORIGIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_DEFAULT_LOCALE: vi
        run: pnpm build

      # The check that stops the whole point of the deploy going wrong quietly.
      # client.ts falls back to http://localhost:8080 when VITE_API_BASE_URL is
      # unset, so a mis-scoped variable produces a bundle that builds, uploads,
      # serves, and cannot reach anything.
      - name: Assert the bundle points at production
        working-directory: web
        run: |
          grep -rq "$API_ORIGIN" dist/assets/*.js || {
            echo "::error::$API_ORIGIN is not in the bundle -- VITE_API_BASE_URL did not reach the build"
            exit 1; }
          echo "bundle targets $API_ORIGIN"

      # A pinned direct call, with no installer between us and the deploy tool.
      # wrangler-action installed wrangler into web/ at deploy time with
      # whatever package manager it found there -- an unpinned `pnpm add` into
      # the checkout after the build had already succeeded, whose version came
      # from the action's default and whose postinstall needed an approval in
      # web/pnpm-workspace.yaml for a package this project does not depend on
      # (#47). npx has no build-script gating, the version is pinned here, and
      # nothing is written into web/.
      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
