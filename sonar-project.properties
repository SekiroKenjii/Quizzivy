# SonarCloud analysis. Runs in CI only -- see the `sonar` job in
# .github/workflows/ci.yml. Nothing here runs on a developer machine.
#
# BEFORE THE FIRST RUN, someone with a SonarCloud login has to:
#   1. Import this repository at https://sonarcloud.io (it is public, so the
#      free plan covers it).
#   2. Set the analysis method to "CI-based", not Automatic Analysis. Automatic
#      Analysis does not cover Go, which is most of the server.
#   3. Put the generated token in the repository secret SONAR_TOKEN.
#      Until that secret exists the `sonar` job skips itself rather than
#      failing, so merging this does not turn every push red.
#
# The organization and project keys below are already filled in. If SonarCloud
# assigns a different projectKey on import, this file is what has to agree with
# it -- the scan fails loudly on a mismatch rather than analysing the wrong
# project.

sonar.projectKey=SekiroKenjii_Quizzivy
sonar.organization=sekirokenjii

sonar.sourceEncoding=UTF-8

# Two languages, two trees. `migrations/` is left out on purpose: SonarCloud
# analyses PL/SQL and T-SQL, not plain PostgreSQL DDL, so including it adds a
# directory of files nothing looks at.
sonar.sources=server,web/src
sonar.tests=web/tests

# Go keeps its tests beside the code, so they are moved out of `sources` by
# pattern rather than by directory.
sonar.test.inclusions=server/**/*_test.go

sonar.exclusions=\
  server/gen/**,\
  server/internal/media/probe/testdata/**,\
  web/src/lib/api/schema.d.ts,\
  web/src/lib/api/client.typecheck.ts,\
  web/src/components/ui/**

# Why each exclusion:
#   server/gen/**            oapi-codegen output. The contract job already
#                            fails on drift, so findings here are findings
#                            about a generator nobody edits.
#   probe/testdata/**        Deliberately malformed audio. Every file in it is
#                            broken on purpose.
#   web/src/lib/api/schema.d.ts  Generated from api/openapi.yaml, same reason.
#   web/src/lib/api/client.typecheck.ts
#                            NOT generated -- excluded for a different reason.
#                            It is a type-level test that only looks like code:
#                            `tsc -b` is the assertion and there is nothing to
#                            run. Its `void _binding` lines exist to stop the
#                            compiler reporting a deliberately-unused binding,
#                            and S3735 ("remove this use of the void operator")
#                            fired on all six of them -- 6 of the 15 findings,
#                            in a file that cannot have a runtime bug because it
#                            has no runtime. It lives in src/ rather than tests/
#                            so that `tsc -b` covers it; the build tree-shakes it
#                            out, so it never reaches production.
#   web/src/components/ui/** Vendored shadcn primitives. Issues raised here are
#                            issues in upstream code this project does not
#                            maintain, and they would drown the ones that are
#                            actually ours.

sonar.go.coverage.reportPaths=server/coverage.out

# Web coverage is NOT wired up yet: it needs @vitest/coverage-v8, which is not
# in web/package.json. Adding a dependency means regenerating the lockfile, and
# `pnpm install --frozen-lockfile` in CI fails if the two disagree. To enable:
#   cd web && pnpm add -D @vitest/coverage-v8
# then add `coverage: { reporter: ["lcov"] }` to the `test` block in
# vite.config.ts, `--coverage` to the unit-test step, and uncomment this:
# sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
