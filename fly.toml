# Fly.io deployment for the Go API. See docs/setup/dns.md.
app = "quizzivy-api"

# Singapore -- the closest Fly region to Vietnam.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Migrations run before the new version takes traffic, as quizzivy_migrate.
# The app itself connects as quizzivy_app and cannot run DDL (§13.5), so this
# is the only place the schema changes.
[deploy]
  release_command = "/app/migrate -dir /app/migrations up"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  API_PORT = "8080"
  # Cloudflare proxies api.quizzivy.com, and CF-Connecting-IP is the one header
  # it OVERWRITES. Never X-Forwarded-For: proxies append to it, so a client
  # could prepend a value and pick its own rate-limit bucket (§6.5).
  CLIENT_IP_HEADER = "CF-Connecting-IP"
  CORS_ALLOWED_ORIGINS = "https://app.quizzivy.com"

  # Where Google returns the browser (§5.3). Matched EXACTLY at exchange time;
  # prefix matching on redirect URIs is the classic OAuth mistake. Not a secret:
  # it travels in the authorization URL the browser follows.
  #
  # Google config is all-or-nothing on purpose, and this is the half that was
  # missing. The comment above used to claim "the client id and secret were
  # already set" -- the secret was, via `fly secrets`, but the CLIENT ID was set
  # nowhere: not here, not in secrets, and the SPA's VITE_GOOGLE_CLIENT_ID is a
  # build input for the frontend that never reaches this process. Two of three
  # present is exactly the case loadGoogle refuses, so the API exited before it
  # could listen and Fly's smoke check reported only "the app appears to be
  # crashing".
  #
  # It belongs here rather than in secrets for the same reason the redirect does:
  # it is a public identifier that already ships inside a JS bundle any visitor
  # can read. Storing a public value as a secret is how it drifts out of sync
  # with the one the frontend bundles, and the failure then is every Google
  # sign-in rejected for a bad audience.
  GOOGLE_CLIENT_ID = "825841392899-8aaqpsf9nt94usmovva6pifsqopk3dab.apps.googleusercontent.com"
  GOOGLE_REDIRECT_URI = "https://app.quizzivy.com/auth/google/callback"

  # Argon2id holds a 64 MiB arena for the duration of every hash and this
  # machine has 512 MB, so eight simultaneous logins would exceed it -- see
  # R-13. Raise this only alongside the machine's memory.
  MAX_CONCURRENT_PASSWORD_HASHES = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  # Always warm. This app has a server-authoritative timer and a 1.5s autosave
  # loop; a cold start when a class all begins a test at once is both slow and
  # visible. At one shared-cpu-1x machine the cost of never sleeping is small.
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
