extends: ["spectral:oas"]
rules:
  # This file is read by people as much as by generators, so every operation
  # must explain itself.
  operation-description: error
  operation-operationId: error
  operation-tag-defined: error
  operation-operationId-unique: error
  body-limit-status:
    description: A body limit selects only the supported oversized response statuses.
    severity: error
    given: "$..['x-body-limit-status']"
    then:
      function: schema
      functionOptions:
        schema:
          type: integer
          enum: [400, 413]
