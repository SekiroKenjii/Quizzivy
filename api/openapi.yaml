        - { in: body, name: /bundle/group/members/-/questionId, kind: none }
        - { in: body, name: /bundle/group/stimuli/-/id, kind: none }
        - { in: body, name: /bundle/group/stimuli/-/content/blocks/-/assetId, kind: media }
        - { in: body, name: /bundle/group/stimuli/-/gaps/-/questionId, kind: none }
        - { in: body, name: /bundle/group/recordings/-/id, kind: none }
        - { in: body, name: /bundle/group/recordings/-/assetId, kind: media }
        - { in: body, name: /bundle/questions/-/id, kind: none }
        - { in: body, name: /bundle/questions/-/input/mediaAssetId, kind: media }
        - { in: body, name: /bundle/questions/-/input/options/-/id, kind: none }
