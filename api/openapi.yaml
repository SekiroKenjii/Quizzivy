        '501': { $ref: '#/components/responses/AiOff' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /teacher/ai/attempts/{attemptId}/answers/{questionId}/score-suggestion:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: questionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      operationId: suggestAiScore
      x-resource:
        - { in: path, name: attemptId, kind: attempt }
        - { in: path, name: questionId, kind: version-question }
      x-permission: ai.use
      tags: [teacher-ai]
      summary: Suggest a score for a short answer
      description: |
        Reads the question's prompt, type, points and accepted or sample
        answers and the student's answer text, and proposes a score and a
        comment. The student's name, email, id and class, the attempt's id and
        the student's other answers are never sent. The caller must hold
        `teaching.grading` as well as `ai.use`, the attempt must be one they
        reach as the grading reads do, and their `ai.readStudentAnswers`
        preference must be on (`AI_READ_OFF`). The reasons and the comment are
        written in the language of the caller's `ai.language` preference. The
        AI never writes a mark: a teacher saves one with `gradeAttempt`.
      responses:
        '200':
          description: The suggestion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiScoreSuggestion' }
        '402': { $ref: '#/components/responses/AiCreditsExhausted' }
        '403': { $ref: '#/components/responses/AiNotAllowed' }
        '404':
          description: The attempt, or a question that is not on its paper, is not in the caller's reach.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `ATTEMPT_IN_PROGRESS` or `ATTEMPT_VOIDED` — nothing to grade yet, or
            nothing that counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: The question is not a short answer waiting for a mark by hand (the grader marked this answer itself), or the student left it unanswered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /teacher/ai/assignments/{id}/insights:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: explainAssignmentResults
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: ai.use
      tags: [teacher-ai]
      summary: Explain how an assignment's results came out
      description: |
        Reads, per question, the correct rate and the eight most frequent wrong
        answer texts with their counts, over the papers handed in by the
        students the caller reaches, and writes what the class got wrong and
        what to do about it. No name, id or attempt is sent, and nothing says
        who wrote what. The caller needs `teaching.grading` as well as `ai.use`,
        and their `ai.readStudentAnswers` preference must be on
        (`AI_READ_OFF`). The text is written in the language of the caller's
        `ai.language` preference.
      responses:
        '200':
          description: Up to four insights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiInsightsResult' }
        '402': { $ref: '#/components/responses/AiCreditsExhausted' }
        '403': { $ref: '#/components/responses/AiNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: No paper has been handed in, so there is nothing to explain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /teacher/ai/bank/cleanup:
    post:
      operationId: cleanUpQuestionBank
      x-resource-list: question
      x-permission: ai.use
      tags: [teacher-ai]
      summary: Find near-duplicates and untagged questions in your bank
      description: |
        Reads the prompts, types and tags of the caller's own questions only,
        newest first, at most 2,000 of them, even for a caller who holds
        `scope.all`; shared questions are skipped. One request is one bounded
        pass of at most five calls to the provider at the same time, inside
        about a minute, that reserves its credits once and is charged once.
        Tags are suggested for the first 200 questions that have none, 50 to a
        call. Duplicates are looked for among all the questions read by
        comparing every pair by its words, and one call judges the closest
        pairs, at most 20 of them are returned; a rewording that shares few
        words with the original is not found. `truncated` is true when the
        pass left something undone: the bank held more than it reads or more
        untagged questions than it tags, or part of the pass failed or ran out
        of time. Apply the suggestions and run it again. Nothing changes until
        the caller confirms through the existing writes. Limited to three calls
        an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCleanupRequest' }
      responses:
        '200':
          description: The suggestions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCleanupResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/AiCreditsExhausted' }
        '403': { $ref: '#/components/responses/AiNotAllowed' }
        '422':
          description: The caller owns no question to look at.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /teacher/ai/usage:
    get:
      operationId: getAiUsage
      x-permission: ai.use
      tags: [teacher-ai]
      summary: Your AI credits this month
      description: |
        What the caller has used, their allowance, what is left of it and of the
        centre's pool, whether they are paused, whether the centre takes
        requests for more, their undecided request and the five category sums
        the Settings card draws. Reads only: a teacher who has not used AI gets
        the allowance a first use would give.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiMonthUsage' }
        '501': { $ref: '#/components/responses/AiOff' }

  /teacher/ai/credit-requests:
    post:
      operationId: requestAiCredits
      x-permission: ai.use
      tags: [teacher-ai]
      summary: Ask for more credits this month
      description: |
        One undecided request per teacher per month. Every holder of
        `ai.credits.manage` is told. Limited to five calls an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCreditRequestInput' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCreditRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: |
            `AI_REQUESTS_OFF` — the centre's rule is to pause a teacher who runs
            out, so it takes no requests. `AI_REQUEST_PENDING` — the caller's
            request this month is undecided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }

  /app/classes:
    get:
      operationId: listMyClasses
      x-permission: learning.take_tests
      description: Classes the signed-in student belongs to. Backs §9 `/app/classes`.
      tags: [student]
      responses:
        '200':
          description: The student's own view of each class; never a join code.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyClass' } }

  /app/classes/join:
    post:
      operationId: joinClass
      x-permission: learning.take_tests
      tags: [student]
      summary: Enrol with a code, already signed in
      description: |
        The already-authenticated half of §6.2 — a student who hits `/join/:code`
        while logged in skips straight here. Idempotent when already a member.
        Every enrolment is audited with ip and user agent (§6.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinCode]
              additionalProperties: false
              properties:
                joinCode: { type: string, minLength: 8, maxLength: 9 }
      responses:
        '200':
          description: Enrolled, or already a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Invalid, expired, exhausted or revoked. Same leak rules as `/join/preview`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perCode: { perHour: 200 }

  /app/assignments:
    get:
      operationId: listMyAssignments
      x-permission: learning.take_tests
      tags: [student]
      description: The three §9 sections — **Đến hạn**, **Sắp tới**, **Đã hoàn thành**.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [dueNow, upcoming, completed]
                additionalProperties: false
                properties:
                  dueNow: { type: array, items: { $ref: '#/components/schemas/StudentAssignmentCard' } }
                  upcoming: { type: array, items: { $ref: '#/components/schemas/StudentAssignmentCard' } }
                  completed: { type: array, items: { $ref: '#/components/schemas/StudentAssignmentCard' } }

  /app/assignments/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getMyAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: learning.take_tests
      tags: [student]
      summary: Intro page
      description: |
        Everything the intro must state before the student starts: duration,
        attempts used and allowed, review policy, **the integrity rules in plain
        language**, and the audio rules if the test has listening questions
        ("Mỗi câu nghe được phát tối đa 2 lần") (§9, §10.2).

        Announced, visible, never silent — a student is never surprised by a rule
        mid-test.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentAssignmentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================= take-test

  /app/assignments/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: startOrResumeAttempt
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: body, name: /resume, kind: attempt }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Create or resume an attempt
      description: |
        Idempotent under a double tap: a partial unique index permits one live
        attempt per (assignment, student), so the second insert loses the race
        and the handler resumes instead of erroring.

        Resuming issues a **new** `sessionId` and records a `resume` event — and
        a `session_takeover` event if the previous session was still live. The
        superseded session finds out on its next write, via `SESSION_SUPERSEDED`
        (§10.1, E2E 7).

        `deadlineAt` is computed server-side as
        `min(now + durationMinutes, closesAt)` and is authoritative. The client
        derives remaining time from it plus the `serverTime` offset, never from
        the device clock.

        A caller that means to continue a known attempt sends `resume`; a
        Continue button must, so that an attempt whose time ran out while the
        page was open is not answered with a new one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resume:
                  $ref: '#/components/schemas/Uuid'
                  description: >-
                    The attempt the caller means to continue. With it the
                    operation never starts an attempt: when this attempt is no
                    longer the live one it answers `ATTEMPT_CLOSED`.
      responses:
        '200':
          description: Created, or resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `ATTEMPT_CLOSED` — `resume` named an attempt that is no longer live;
            nothing was started.

            `ASSIGNMENT_NOT_OPEN` or `ATTEMPT_LIMIT_REACHED`.

            `MAINTENANCE_SCHEDULED` — a new attempt would run into a maintenance
            window. `details.startsAt` and `details.endsAt` name it. Resuming an
            attempt never answers this.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: query, name: session, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: The take-test payload
      description: |
        **In the student flow, test content is fetched only through here** (§7).

        The response contains no `isCorrect`, no `sampleAnswer`, no
        `acceptedAnswers` and no `transcript` — at any depth. This is asserted by
        a contract test over this file, a Go unit test that walks the live JSON,
        and E2E 9 (§13.5, §14). None of those three may be weakened.

        A tab that names a session the attempt no longer has is answered with
        the paper and `superseded: true`: it may read and may not write, until
        the student continues the attempt there (`startOrResumeAttempt`). That
        answer replaces no beacon token and records nothing. A tab that names
        the attempt's session, or none, is answered as the tab that holds it.
      parameters:
        - name: session
          in: query
          required: false
          description: |
            The session this tab holds for the attempt: the `sessionId` of the
            last answer it was given by this operation or by
            `startOrResumeAttempt`. A tab that holds none sends none.
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /app/attempts/{id}/answers:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      operationId: saveAnswers
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /sessionId, kind: none }
        - { in: body, name: /answers/+, kind: version-question }
        - { in: body, name: /answers/*/optionIds/-, kind: none }
        - { in: body, name: /events/-/questionId, kind: version-question }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Autosave answers and flush buffered events
      description: |
        Answers and events land in **one transaction**, so a partial flush cannot
        record an event for an answer that was not saved.

        Events are inserted `ON CONFLICT DO NOTHING` on
        `(attempt, session, clientSeq)`, so a retried batch is a no-op rather
        than a failure (D-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              additionalProperties: false
              properties:
                sessionId: { $ref: '#/components/schemas/Uuid' }
                answers:
                  type: object
                  description: Keyed by the version question's id.
                  propertyNames: { $ref: '#/components/schemas/Uuid' }
                  additionalProperties: { $ref: '#/components/schemas/Answer' }
                events:
                  type: array
                  items: { $ref: '#/components/schemas/IntegrityEventInput' }
                  maxItems: 500
      responses:
        '200':
          description: |
            Saved. `serverTime` is returned every time so the client's clock
            offset self-corrects, and `deadlineAt` is the attempt's deadline as
            it stands now, so a teacher's extension or a maintenance window
            reaches an open attempt on its next autosave.
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, savedAt, deadlineAt]
                additionalProperties: false
                properties:
                  serverTime: { $ref: '#/components/schemas/Timestamp' }
                  savedAt: { $ref: '#/components/schemas/Timestamp' }
                  deadlineAt: { $ref: '#/components/schemas/Timestamp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `SESSION_SUPERSEDED` — opened elsewhere; the client goes read-only
            with a plain explanation rather than throwing.
            `DEADLINE_PASSED` — the client should submit.
            `ATTEMPT_CLOSED` — already submitted or voided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /app/attempts/{id}/events:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: flushEvents
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /sessionId, kind: none }
        - { in: body, name: /events/-/questionId, kind: version-question }
      tags: [take-test]
      summary: Standalone event flush, including the sendBeacon path
      description: |
        Two content types, because `navigator.sendBeacon` cannot set request
        headers:

        - `application/json` with a normal `Authorization` header, for ordinary flushes.
        - `text/plain` carrying `beaconToken` in the body, for the `pagehide`
          flush. `text/plain` is CORS-safelisted, so the request skips preflight —
          necessary, because a preflight on unload is not reliably delivered.

        The beacon token grants **append-only event access** and nothing else, so
        the weaker credential buys no additional authority.

        Fire-and-forget: this is best-effort by design and a failure here must
        never block answering or submitting (§10.6).

        `sessionId` must be the attempt's current session or one the attempt
        has already recorded events under: a tab that another device took over
        may still flush what it holds, and a session id that was never part of
        the attempt answers 403 and writes nothing (D-004).
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, events]
              additionalProperties: false
              properties:
                sessionId: { $ref: '#/components/schemas/Uuid' }
                events: { type: array, items: { $ref: '#/components/schemas/IntegrityEventInput' }, maxItems: 500 }
          text/plain:
            schema:
              type: string
              description: |
                JSON encoded as text: `{ beaconToken, sessionId, events }`. Sent
                as a `Blob` with type `text/plain` from `navigator.sendBeacon`.
      responses:
        '202':
          description: Accepted. Always 202 — the client cannot act on the outcome anyway.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /app/attempts/{id}/audio-play:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: recordAudioPlay
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /questionId, kind: version-question }
        - { in: body, name: /sessionId, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Increment the server-authoritative play counter
      description: |
        The obvious client-side counter resets on reload, which makes `maxPlays`
        meaningless — so the count lives here (§11.4).

        **Never gates playback.** Playback is optimistic: a failed POST does not
        block audio, and a student who goes offline to farm replays leaves a gap
        in the event log, which is what the integrity timeline is for. Blocking
        on a round trip would punish bad wifi far more often than it would catch
        anyone. A play is only *counted* while the attempt can still be written:
        like the shared recording's, it answers `409` once the attempt is
        submitted or voided (`ATTEMPT_CLOSED`), past its deadline
        (`DEADLINE_PASSED`), or, when `sessionId` is sent, when that session is
        no longer the attempt's (`SESSION_SUPERSEDED`), and then counts nowhere
        (D-005). `sessionId` is optional for one release so that a web build
        older than this server keeps counting; it becomes required after.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId]
              additionalProperties: false
              properties:
                questionId: { $ref: '#/components/schemas/Uuid' }
                sessionId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: '`plays` may exceed `maxPlays`. That is reported to the teacher, not enforced.'
          content:
            application/json:
              schema:
                type: object
                required: [plays, maxPlays]
                additionalProperties: false
                properties:
                  plays: { type: integer, minimum: 1 }
                  maxPlays: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `SESSION_SUPERSEDED`, `ATTEMPT_CLOSED` or `DEADLINE_PASSED`: the
            play was not counted. The client neither counts it nor retries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}/group-audio-play:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: recordGroupAudioPlay
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /recordingId, kind: version-recording }
        - { in: body, name: /playId, kind: none }
        - { in: body, name: /sessionId, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Record one shared listening gesture, deduplicating retries
      description: |
        Counts a frozen recording bound to this attempt's version. Every distinct
        playId increments its shared counter and appends one server audio_play
        event in the same transaction. Retrying the same playId and recording
        returns the current count without another increment/event. Reusing a
        playId for another recording is PLAY_ID_CONFLICT.

        Requires the current writable session, like answer autosave. Playback
        remains synchronous and optimistic; no network round trip gates audio.
        Counts may exceed maxPlays and never block playback or submission.
        Legacy per-question playback uses the existing audio-play endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAudioPlayInput' }
      responses:
        '200':
          description: Current server count, including any plays beyond the configured allowance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAudioPlayResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SESSION_SUPERSEDED, ATTEMPT_CLOSED, DEADLINE_PASSED or PLAY_ID_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: submitAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /sessionId, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      description: |
        **Idempotent.** A second call on an already-closed attempt is `409
        ATTEMPT_CLOSED`, and a race between a manual tap and an auto-submit
        yields one submission.

        Objective types are graded immediately; `short_answer` is marked
        `requiresManual`. Nothing is rejected based on audio play count (§11.4).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sessionId: { $ref: '#/components/schemas/Uuid' }
                reason:
                  type: string
                  enum: [manual, timer_expired, auto_submit]
                  default: manual
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `ATTEMPT_CLOSED`.

            `DEADLINE_NOT_REACHED` — `reason` was `timer_expired` while the
            attempt's deadline is still more than five seconds away, which
            happens when the deadline moved after the client last saved.
            `details.deadlineAt` is the deadline to wait for; nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}/result:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAttemptResult
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Post-submission review
      description: |
        Honours the assignment's review policy. Suppressed fields are **absent**,
        not nulled-and-hidden, so no client fallback can surface them.

        Question `transcript` and shared-context transcripts appear here only
        after submission, gated by each question/recording's own
        `showTranscriptAfterSubmit` (§11.3, §13.5). `sampleAnswer` never appears
        at all. Material and shared play counts do not depend on score/key flags.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [attempt, review, testTitle, maxAttempts, sections, questions]
                additionalProperties: false
                properties:
                  attempt: { $ref: '#/components/schemas/Attempt' }
                  review: { $ref: '#/components/schemas/ReviewPolicy' }
                  releasesAt:
                    $ref: '#/components/schemas/Timestamp'
                    description: |
                      Present only while an `after_close` release is withheld: when
                      it ends for this student, their effective close. Absent
                      otherwise.
                  classAverage:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 100
                    description: |
                      The class average as a percent: the mean, over the students
                      who qualify, of each one's best graded attempt as earned over
                      total. Present only when `review.showClassAverage` is on, this
                      result is released, the assignment has closed, and at least 3
                      students qualify: a targeted active account with a graded
                      attempt. Voided, ungraded and unstarted work counts for
                      nothing. It is an aggregate: no student is named.
                  testTitle: { type: string }
                  maxAttempts: { type: integer, minimum: 1, description: For "Lượt 1/2" under the score (S-09). }
                  sections:
                    type: array
                    items: { $ref: '#/components/schemas/StudentSection' }
                    description: >-
                      The paper's parts in test order, as the attempt showed
                      them. The page sums each part's `earned` from the
                      questions whose `sectionId` names it; no review policy
                      hides a part's title or membership.
                  questions: { type: array, items: { $ref: '#/components/schemas/ResultQuestion' } }
                  sharedContext: { $ref: '#/components/schemas/SharedReviewContext' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`ATTEMPT_IN_PROGRESS` — not yet submitted; `ATTEMPT_VOIDED` — nothing to show.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/media/{assetId}/url:
    parameters:
      - { name: assetId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      operationId: getMediaUrl
      x-resource:
        - { in: path, name: assetId, kind: media }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Mint a short-lived signed URL
      description: |
        10-minute signature, minted per request (§11.2). A student may only mint
        a URL for an asset reachable from an attempt they own — checked against
        the version questions, not by asset id alone.

        The client fetches this **before** enabling the play button, never inside
        the click handler: iOS Safari requires `.play()` to run synchronously in
        the gesture, so awaiting anything first would break playback (§11.3).
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: |
                `private, max-age=600` (§11.2) — long enough to survive a replay,
                short enough that the cache entry cannot outlive the signature it
                holds. The TTL and this max-age are the same number on purpose;
                they are set from one constant server-side.
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                additionalProperties: false
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { $ref: '#/components/schemas/Timestamp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ======================================================================== me

  /me/notifications:
    get:
      operationId: listNotifications
      x-resource:
        - { in: query, name: before, kind: none }
      x-permission: self
      tags: [me]
      summary: The caller's notifications, newest first
      description: |
        The caller's own notifications and nobody else's, read or unread,
        newest first. A notification first written more than 180 days ago is
        deleted, once a day.

        Before it reads, the server writes the notifications the passing of
        time has earned the caller, at most once in five minutes: an
        assignment that opened, a close a day or an hour away, an assignment
        about to close with students still to hand in, and a result an
        after-close release has made ready. A moment older than seven days is
        not made up, and one the caller already holds is left as it is.

        Paged by a cursor, not by a page number: ask again with `before` set
        to `nextBefore` for the next older page. Ids are time-ordered, so a
        notification written while the caller pages never moves a row from one
        page to the next.
      parameters:
        - name: audience
          in: query
          required: false
          description: |
            Only the kinds this console reads (`NotificationAudience`). The
            page, `limit` and `nextBefore` count the narrowed list, so a page
            is never empty because the other console's rows filled it. Left
            out, every kind.
          schema: { $ref: '#/components/schemas/NotificationAudience' }
        - name: before
          in: query
          required: false
          description: |
            A notification id, as `nextBefore` gave it: the page holds the
            caller's notifications older than it. It is a position in the
            caller's own list and never a lookup: an id the caller does not
            hold, another user's or nobody's, only bounds the page, which
            still holds the caller's rows alone.
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page. An empty `items` when the caller has none, or none older than `before`.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextBefore]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Notification' }
                  nextBefore:
                    type: [string, 'null']
                    format: uuid
                    description: The id of the last item when older notifications exist, else null.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      x-resource:
        - { in: body, name: /ids/-, kind: notification }
      x-permission: self
      tags: [me]
      summary: Mark the caller's notifications read
      description: |
        With `ids`, marks those of the caller's notifications that are unread;
        without it, every unread one. A notification already read keeps the
        time it was first read.

        It marks the caller's own notifications only. An id that is another
        user's, already read or not a notification at all is skipped, and the
        answer is the same 204 whatever matched, so it tells the caller
        nothing about an id that is not theirs.

        With `audience`, only that console's kinds are marked, with `ids` or
        without: an id of the other console's kind is skipped like any other
        id that does not match, and "every unread one" becomes every unread
        one of that console. Left out, every kind, as before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Uuid' }
                  description: Absent means every unread notification the caller has (of `audience`, when it is given).
                audience: { $ref: '#/components/schemas/NotificationAudience' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/preferences:
    patch:
      operationId: updatePreferences
      x-permission: self
      tags: [auth]
      summary: Update your stored preferences
      description: |
        Merges supplied top-level keys into the caller's stored preferences;
        assignmentDefaults replaces that whole nested object. False is a
        supplied value and an empty object is a no-op. Null and unknown keys
        are refused. Raw request bytes and the normalized merged JSONB object
        each have an inclusive 8192-byte cap; exceeding either answers
        400 VALIDATION_FAILED after the existing authentication gates.
      x-max-body-bytes: 8192
      x-body-limit-status: 400
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferences' }
      responses:
        '200':
          description: The merged persisted preferences, without materialized defaults.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '400':
          description: '`VALIDATION_FAILED` — the shape or either byte cap is invalid.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /me/avatar:
    put:
      operationId: setAvatar
      x-permission: self
      tags: [me]
      summary: Set your profile photo
      description: |
        Replaces the caller's photo. The file is a PNG or a JPEG of at most
        2 MiB, and each side is between 200 and 2048 pixels. The server stores
        a 256 x 256 PNG made from the centred square of the upload, so the
        original file, its metadata (EXIF, ICC, comments) and its name are
        never kept. The response is the whole `CurrentUser`, whose `avatarUrl`
        names the new photo; the previous one is deleted.

        Checked in this order, each before the next costs anything: the size,
        the type from the first bytes (the part's `Content-Type` and the file's
        extension are never read), the image header, the dimensions and the
        memory the image would need, and only then the decode. At most two
        images are decoded at a time across the server. The caller may set a
        photo ten times an hour.

        The file may be exactly 2 MiB; the request may carry 16 KiB more than
        that for the multipart framing, so a file of 2 MiB and one byte is
        refused by the size check with `MEDIA_TOO_LARGE`, and a request far
        beyond it is cut off before the handler with the same answer.
      x-max-body-bytes: 2113536
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
            # Deliberately no `encoding.file.contentType`: the type is decided
            # by sniffing the bytes, as for `uploadMedia`.
      responses:
        '200':
          description: Stored. The whole persisted caller, with the new `avatarUrl`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: '`MEDIA_TOO_LARGE` — the upload is over 2 MiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: |
            `MEDIA_TYPE_UNSUPPORTED` (not a PNG or a JPEG), `MEDIA_UNREADABLE`
            (sniffed correctly but the header or the pixels cannot be read) or
            `IMAGE_DIMENSIONS` (a side under 200 or over 2048 pixels, an
            image that would need more memory to decode than the server
            allows, or a JPEG of more than 32 scans, which a decoder that
            cannot be cancelled would spend minutes on). Nothing was stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501':
          description: Object storage is not configured, so no photo can be kept.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Maintenance' }
    delete:
      operationId: deleteAvatar
      x-permission: self
      tags: [me]
      summary: Remove your profile photo
      description: |
        Clears the caller's photo and deletes its object, best effort. A caller
        with no photo gets the same answer. The response is the whole
        `CurrentUser`, without `avatarUrl`.
      responses:
        '200':
          description: Cleared. The whole persisted caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /me/summary:
    get:
      operationId: getMySummary
      x-permission: self
      tags: [me]
      summary: The counts the caller's shell shows
      description: |
        How many of the caller's notifications are unread: the dot on the
        bell. One count over the caller's own rows, cheap enough to poll. It
        writes the caller's due-time notifications first, exactly as
        `listNotifications` does, so the count includes them.

        `audience` counts one console's kinds only (`NotificationAudience`),
        so the student's bell does not light for a teacher kind the same
        account holds, nor the reverse. Left out, every kind.
      parameters:
        - name: audience
          in: query
          required: false
          schema: { $ref: '#/components/schemas/NotificationAudience' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      x-permission: self
      tags: [me]
      summary: The caller's notification switches
      description: |
        All five switches, whatever the caller's role. One the caller never
        saved answers its default: `inApp` true and `email` false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateNotificationPreferences
      x-permission: self
      tags: [me]
      summary: Replace the caller's notification switches
      description: |
        Takes all five switches at once, each event exactly once and in any
        order, and stores them for the caller. A client that draws only some
        of them sends the others back as it read them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Saved. The five switches as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400':
          description: '`VALIDATION_FAILED`: an event is unknown, repeated or missing, or the body is not the five switches.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
