        '422':
          description: VALIDATION_FAILED — the draft is structurally invalid (unknown IDs, duplicate IDs, invalid content).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /teacher/imports/{id}/review/adopt:
