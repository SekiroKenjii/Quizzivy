      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiVariantRequest' }
      responses:
        '200':
          description: The proposed changes, in paper order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiVariantResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/AiCreditsExhausted' }
        '403': { $ref: '#/components/responses/AiNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The draft has no question to vary, or holds more than one call reads.
