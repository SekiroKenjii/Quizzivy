                description: { type: [string, 'null'] }
      responses:
        '201':
          description: Created as a draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teacher/tests/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      operationId: deleteTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.write
      tags: [teacher-tests]
      description: Permanently deletes an archived test and its unused versions. Assignments or attempts referencing the test block deletion.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The resource is still referenced or has not reached its required inactive state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: getTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: workspace.teacher
      description: Full test including the draft outline. Published content lives in versions, not here.
      tags: [teacher-tests]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTest
      x-resource:
        - { in: path, name: id, kind: test }
        - { in: body, name: /sections/-/id, kind: section }
        - { in: body, name: /sections/-/questionIds/-, kind: question }
        - { in: body, name: /sections/-/units/-/id, kind: question }
      x-permission: content.tests.write
      tags: [teacher-tests]
      summary: Update metadata and the draft outline
      description: |
        Backs the builder's 1.5s-debounced autosave (§8). The whole outline —
        sections and question ordering — is written in one transaction.

        `expectedUpdatedAt` is a version guard. §1.3 rules out real-time
        collaborative authoring; this makes a stale second tab fail loudly with
        `STALE_WRITE` instead of silently reverting the outline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt]
              additionalProperties: false
              properties:
                expectedUpdatedAt: { $ref: '#/components/schemas/Timestamp' }
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: [string, 'null'] }
                status: { $ref: '#/components/schemas/TestStatus' }
                outlineFormat:
                  type: string
                  enum: [group_v1]
                  description: Complete mixed-unit outline. Every section must include units and every existing owned group exactly once. Group deletion uses its dedicated revision-checked endpoint.
                sections:
                  type: array
                  items:
                    type: object
                    required: [title, questionIds]
                    additionalProperties: false
                    properties:
                      id: { type: [string, 'null'], format: uuid, description: Omit to create. }
                      title: { type: string, minLength: 1 }
                      instructions: { type: [string, 'null'] }
                      questionIds:
                        type: array
                        items: { $ref: '#/components/schemas/Uuid' }
                        description: Standalone question projection, in the same order as question units when outlineFormat is group_v1.
                      units:
                        type: array
                        maxItems: 32768
                        items: { $ref: '#/components/schemas/DraftSectionUnit' }
                        description: Required in every section with group_v1. Moves complete groups only within this test; cross-test reuse requires an independent copy.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`STALE_WRITE` — edited elsewhere since `expectedUpdatedAt`; `GROUP_OUTLINE_REQUIRED` — a legacy question-only outline cannot replace a draft containing shared groups. Metadata-only updates remain supported. `TEST_ARCHIVED` — restore the test before a mixed-outline edit.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: publishTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.publish
      tags: [teacher-tests]
      summary: Validate and snapshot a new version
      description: |
        Validates, snapshots resolved content into the version tables, bumps
        `currentVersion` and writes an audit row — all in one transaction.

        Snapshotting is what makes editing a published test safe: in-flight and
        historical attempts keep rendering the version they started with (§7).
        `mediaAssetId` points at the same immutable asset; the file is never
        copied (§11.1).

        Republishing an unchanged test still creates a version — this is an
        append-only history, not a diff.
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `PUBLISH_VALIDATION_FAILED`. **Every** problem is returned at once,
            each anchored to a question, so the builder marks them inline rather
            than surfacing one per attempt (§8).

            A question whose media file has been deleted from the library (rule
            `audio_question_has_asset` for audio, `question_valid` for any other
            file), or a group whose material names one (`group_valid`), is
            reported the same way, but only once the draft passes every other
            rule: the files are checked when the version is frozen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishConflict' }

  /teacher/tests/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: duplicateTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.write
      tags: [teacher-tests]
      description: Copies the draft structure only — never the versions. The copy starts as a draft.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/tests/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: listTestVersions
      x-resource:
        - { in: path, name: id, kind: test }
      x-resource-list: test-version
      x-permission: workspace.teacher
      tags: [teacher-tests]
      summary: Version history
      description: Backs §8's test-detail version history. Spec §15 has no endpoint for this.
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TestVersion' } }

  /teacher/tests/{id}/versions/{version}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteTestVersion
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.publish
      tags: [teacher-tests]
      description: Deletes an unused, non-current version. Existing assignments and attempts prevent deletion.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version is referenced or current. Archiving does not prevent deletion of an unused, non-current version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/versions/{version}/current:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: setCurrentTestVersion
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.publish
      tags: [teacher-tests]
      description: Selects the default published version for future assignments. Existing assignments and snapshots are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt]
              additionalProperties: false
              properties:
                expectedUpdatedAt: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Updated test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The test is archived (`TEST_ARCHIVED`) or the expected update time is stale (`STALE_WRITE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/versions/{version}/draft:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: createDraftFromTestVersion
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.write
      tags: [teacher-tests]
      description: Replaces the draft outline with independent bank-question copies of this snapshot. Published content and existing assignments are unchanged. The caller confirms replacement of any existing draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt]
              additionalProperties: false
              properties:
                expectedUpdatedAt: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Updated test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The test is archived (`TEST_ARCHIVED`), the expected update time is
            stale (`STALE_WRITE`), or a question of one of the draft's groups is
            still used elsewhere (`RESOURCE_REFERENCED`): the draft is left as
            it was.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/preview:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: previewTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: workspace.teacher
      tags: [teacher-tests]
      summary: Student-eye preview of a published version
      description: |
        Renders from the **published version**, not the draft, so what the teacher
        checks is what a student would actually receive (§8).
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1 }, description: Defaults to current. }
      responses:
        '200':
          description: OK
          content:
