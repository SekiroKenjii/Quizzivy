  /teacher/tests/{id}/questions/move:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: moveTestQuestion
      x-resource:
        - { in: path, name: id, kind: test }
        - { in: body, name: /questionId, kind: question }
        - { in: body, name: /to/sectionId, kind: section }
        - { in: body, name: /to/groupId, kind: question-group }
        - { in: body, name: /expectedGroupRevisions/-/groupId, kind: question-group }
      x-permission: content.tests.write
      x-max-body-bytes: 4096
      tags: [teacher-tests]
      summary: Move a question across a shared-context group's boundary, or within it
      description: |
        Backs the builder's drag of a question into a shared-context group,
        out of one, between two groups of the same test, and within one group.
        It acts on this test's draft only: the question is a standalone unit
        of a section of this test or a member of a group a section of this
        test owns, and the destination is a section or a group that section
        owns. A bank group is neither. Moving a standalone question to a
        standalone place is the outline writer's job (`updateTest`), not this
        operation's.

        - **Into a group** (a standalone question, `to.groupId` set): the
          group gets a **copy** of the question, with fresh question, option
          and blank ids; the section's reference to the bank question is
          removed and the bank question itself is not touched. The copy
          remembers that bank question, which is what lets it go back as the
          original when it is dragged out unedited. The result's `questionId`
          is the copy's id and `copied` is true.
        - **Out of a group** (a member, `to.groupId` null): a member that was
          copied into the group from a bank question, has not been edited
          since, and whose original is still in the bank, in the caller's
          reach and not already in this test, goes back as that original: the
          copy is removed, the original becomes a standalone unit of
          `to.sectionId` at `to.index`, no bank question is added, and
          `restored` is true with `questionId` the original's id. Any other
          member keeps its id and becomes an ordinary question of the bank, a
          standalone unit of `to.sectionId` at `to.index`; `editedCopy` is true
          when it had been copied from a bank question that is still there and
          was edited since. `copied` is false either way. A member that a gap
          of the group's shared material is bound to cannot leave (`422`,
          `details.rule` `group_gap_bound`).
        - **Between groups of this test, or within one group** (a member,
          `to.groupId` set): the member moves in place, keeping its id and
          the link to the bank question it was copied from, if any. `copied`,
          `restored` and `editedCopy` are false.

        `to.index` is the position among the section's units when
        `to.groupId` is null, and among the group's members otherwise, counted
        once the question has left its old place. A position past the end is
        clamped to the end.

        The move is guarded exactly as `updateQuestionGroup` guards a save:
        `expectedUpdatedAt` is the test revision, and
        `expectedGroupRevisions` names the revision of every group the move
        touches, the source and the destination, once each, and no other. A
        touched group missing from the list is `STALE_WRITE`; a group the move
        does not touch, or one named twice, is a `400`. The answer carries the new
        test revision and every touched group at its new revision, so the
        builder goes on from them. Nothing is written when the move is
        refused. No published version is touched; the next publish freezes
        the new structure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveTestQuestionInput' }
      responses:
        '200':
          description: Moved. The saved draft and every touched group, at their new revisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveTestQuestionResult' }
        '400':
          description: |
            The body fails its schema (`to.index` below zero, more than two
            group revisions, an unknown field); or the move itself is not one
            this operation makes. `details.rule` names the case:
            `move_outline_only` — a move between two standalone places, which
            `updateTest` writes; `move_group_section` — `to.groupId` is a
            group that `to.sectionId` does not own; `move_revisions` —
            `expectedGroupRevisions` names a group twice, or names a group the
            move does not touch; `move_source_ambiguous` — the question is a
            standalone unit of more than one section of the test, which the
            request cannot tell apart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The test, the question, the section or a group is outside the caller's reach, or is not of this test. Another teacher's id answers exactly as a missing one does. An entry of `expectedGroupRevisions` is a group like any other, so one the caller cannot reach answers 404 before any revision is compared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: '`STALE_WRITE` — the test was edited elsewhere since `expectedUpdatedAt`, or a touched group is past its expected revision or missing from `expectedGroupRevisions`; `TEST_ARCHIVED` — restore the test before moving a question; `GROUP_CONFLICT` — a uniqueness constraint refused the write because another writer got there first, and nothing is written.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: The body is over 4 KiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            Validation failed and nothing was written. `details.rule` names
            the rule: `group_gap_bound` — the member a gap of the group's
            shared material is bound to cannot leave its group, and
            `details` also carries `stimulusId`, `gapId` and `questionId`;
            or any rule the destination group fails once the question is in
            it (`group_limits` at 200 members or the 4 MiB budget,
            `group_audio_scope` when the copied question uses the group's own
            shared recording, `group_asset`); or `group_reference` — a
            database reference or check refused the write, as it does an
            `updateQuestionGroup` that drops a member something still uses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: publishTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.publish
      tags: [teacher-tests]
      summary: Validate and snapshot a new version
      description: |
        Validates, snapshots resolved content into the version tables, bumps
        `currentVersion` and writes an audit row — all in one transaction.

        Snapshotting is what makes editing a published test safe: in-flight and
        historical attempts keep rendering the version they started with (§7).
        `mediaAssetId` points at the same immutable asset; the file is never
        copied (§11.1).

        Republishing an unchanged test still creates a version — this is an
        append-only history, not a diff.

        The body is optional. `changeNote` is kept with the version and is
        trimmed first; a note that is empty after trimming is no note.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                changeNote:
                  type: [string, 'null']
                  maxLength: 200
                  description: >-
                    What changed in this version, in the teacher's words. Shown
                    in the version history. The 200-character limit applies to
                    the text as sent, before it is trimmed.
      responses:
        '201':
          description: Published. `testUpdatedAt` is present.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `PUBLISH_VALIDATION_FAILED`. **Every** problem is returned at once,
            each anchored to a question, so the builder marks them inline rather
            than surfacing one per attempt (§8).

            A question whose media file has been deleted from the library (rule
            `audio_question_has_asset` for audio, `question_valid` for any other
            file), or a group whose material names one (`group_valid`), is
            reported the same way, but only once the draft passes every other
            rule: the files are checked when the version is frozen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishConflict' }

  /teacher/tests/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: duplicateTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.write
      tags: [teacher-tests]
      description: Copies the draft structure only — never the versions. The copy starts as a draft.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/tests/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: listTestVersions
      x-resource:
        - { in: path, name: id, kind: test }
      x-resource-list: test-version
      x-permission: workspace.teacher
      tags: [teacher-tests]
      summary: Version history
      description: |
        Backs §8's test-detail version history. Spec §15 has no endpoint for
        this. A test that was never published lists no versions; a missing
        test, or another teacher's, answers 404.
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TestVersion' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/tests/{id}/versions/{version}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteTestVersion
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.publish
      tags: [teacher-tests]
      description: Deletes an unused, non-current version. Existing assignments and attempts prevent deletion.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version is referenced or current. Archiving does not prevent deletion of an unused, non-current version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/versions/{version}/diff:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getTestVersionDiff
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: workspace.teacher
      tags: [teacher-tests]
      summary: What changed between a version and another paper
      description: |
        Compares the version in the path with another paper of the same test
        and lists what a teacher would call a change. The older paper is
        `from` and the newer `to`; the draft is always the newer. Reads only:
        nothing is written, and no row is locked.

        Questions are matched by the bank question they were frozen from, and
        the ones left over by identical content, because restoring a version as
        a draft copies its questions. So a question that was restored and then
        edited reads as `removed` and `added`, not as `changed`. Order alone is
        never a change.
      parameters:
        - name: against
          in: query
          required: true
          schema: { type: string, pattern: '^(previous|draft|[1-9][0-9]*)$' }
          description: |
            `previous` is the highest version below the path version, so the
            path version is `to`; on the first version there is none, `from` is
            null and every question is `added`. `draft` is the test's draft, so
            the path version is `from`. A number is another version of the test:
            the lower of the two is `from`. The path version itself is refused
            with 400, and a version that does not exist is 404.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestVersionDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: A group of one of the two papers cannot be read, so there is no paper to compare. For the draft (`against=draft`) the builder reports the cause when the teacher publishes; for a version it is stored data that no longer reads back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/versions/{version}/current:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: setCurrentTestVersion
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.publish
      tags: [teacher-tests]
      description: Selects the default published version for future assignments. Existing assignments and snapshots are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt]
              additionalProperties: false
              properties:
                expectedUpdatedAt: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Updated test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The test is archived (`TEST_ARCHIVED`) or the expected update time is stale (`STALE_WRITE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/versions/{version}/draft:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: createDraftFromTestVersion
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: content.tests.write
      tags: [teacher-tests]
      description: Replaces the draft outline with independent bank-question copies of this snapshot. Published content and existing assignments are unchanged. The caller confirms replacement of any existing draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt]
              additionalProperties: false
              properties:
                expectedUpdatedAt: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Updated test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The test is archived (`TEST_ARCHIVED`), the expected update time is
            stale (`STALE_WRITE`), or a question of one of the draft's groups is
            still used elsewhere (`RESOURCE_REFERENCED`): the draft is left as
            it was.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/tests/{id}/preview:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: previewTest
      x-resource:
        - { in: path, name: id, kind: test }
      x-permission: workspace.teacher
      tags: [teacher-tests]
      summary: Student-eye preview of a published version
      description: |
        Renders from the **published version**, not the draft, so what the teacher
        checks is what a student would actually receive (§8). A missing test, or
        another teacher's, answers 404; a test without the version asked for, or
        with no current version, answers 409.
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1 }, description: Defaults to current. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, questions]
                additionalProperties: false
                properties:
                  version: { type: integer }
                  questions: { type: array, items: { $ref: '#/components/schemas/StudentQuestion' } }
                  sections: { type: array, items: { $ref: '#/components/schemas/StudentSection' } }
                  groups: { type: array, items: { $ref: '#/components/schemas/StudentGroup' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TEST_NOT_PUBLISHED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================================================== teacher/questions

  /teacher/questions:
    get:
      operationId: listQuestions
      x-resource-list: question
      x-permission: workspace.teacher
      description: The §8 question bank, with type and tag filters plus search.
      tags: [teacher-questions]
      parameters:
        # Repeatable, because A-06's rail is checkboxes and tag chips, not a
        # radio group. Within a group the values are OR-ed; the groups are
        # AND-ed with each other and with `q` -- the ordinary faceted-search
        # reading, and the only one where ticking a second type can never
        # shrink the result set.
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/QuestionType' }
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: level
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/QuestionLevel' }
        - name: skill
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/QuestionSkill' }
        - name: tagMatch
          in: query
          schema: { type: string, enum: [any, all], default: any }
        - name: hasAudio
          in: query
          description: A-06's "Chỉ câu có audio".
          schema: { type: boolean }
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: |
            `q` searches the prompt. Matching is **accent-insensitive**: `phat am`
            finds `phát âm`, `duong` finds `Đường` (D-11). Soft-deleted questions
            are excluded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets, tags, bankTotal]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminQuestion' } }
                      facets: { $ref: '#/components/schemas/QuestionTypeFacets' }
                      tags:
                        type: array
                        items: { type: string }
                        description: |
                          Every tag reachable through the CURRENT type, audio and
                          search filters, sorted and distinct. Server-derived, not
                          collected from the returned page: a rail built from one
                          page can only offer the tags that page happens to carry,
                          which makes a second chip unselectable and the filter
                          look broken.

                          The tag filter itself is not applied, for the same
                          reason the type facets ignore the type filter — picking
                          one chip must not empty the rail.
                      bankTotal:
                        type: integer
                        minimum: 0
                        description: |
                          Live questions in the bank, before any filter — A-06's
                          "180 câu". The envelope's `total` is the other number
                          on that line, "đang lọc 41": rows matching ALL current
                          filters, which is also what the page count is drawn
                          from. Distinct from `facets.all`, which ignores the
                          type filter so the "Tất cả" row can show a total.
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createQuestion
      x-resource:
        - { in: body, name: /mediaAssetId, kind: media }
        - { in: body, name: /options/-/id, kind: none }
        - { in: body, name: /blanks/-/id, kind: none }
      x-permission: [content.questions.write, content.tests.write]
      description: Adds a question to the bank. Options and blanks are written in the same transaction, with ordinals normalized dense.
      tags: [teacher-questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /teacher/questions/tags:
    post:
      operationId: tagQuestions
      x-resource:
        - { in: body, name: /questionIds/-, kind: question }
      x-permission: content.questions.write
      tags: [teacher-questions]
      summary: Add tags to several questions at once
      description: |
        A-06's "Gắn thẻ". Tagging is the one bank edit that is worth doing to
        forty questions at a time, and doing it one at a time is what the
        selection bar exists to avoid.

        Additive and idempotent: a tag a question already carries is a no-op, so
        a retry after a dropped connection cannot duplicate anything. Removing
        tags in bulk is deliberately not offered — it is the destructive
        direction, and A-06 does not draw it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionIds, tags]
              additionalProperties: false
              properties:
                questionIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/Uuid' }
                tags:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                additionalProperties: false
                properties:
                  updated:
                    type: integer
                    minimum: 0
                    description: |
                      Questions actually changed. Lower than `questionIds` when
                      some already carried every tag, which is not an error.
        '400': { $ref: '#/components/responses/BadRequest' }

  /teacher/questions/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getQuestion
      x-resource:
        - { in: path, name: id, kind: question }
      x-permission: workspace.teacher
      description: A single bank question, including its grading key. Teacher-only by construction.
      tags: [teacher-questions]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateQuestion
      x-resource:
        - { in: path, name: id, kind: question }
        - { in: body, name: /mediaAssetId, kind: media }
        - { in: body, name: /options/-/id, kind: none }
        - { in: body, name: /blanks/-/id, kind: none }
      x-permission: [content.questions.write, content.tests.write]
      description: Edits the bank copy only. Published versions hold their own snapshot and are unaffected (§7).
      tags: [teacher-questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '200':
          description: Saved. Published versions are unaffected — they hold their own snapshot (§7).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteQuestion
      x-resource:
        - { in: path, name: id, kind: question }
      x-permission: content.questions.write
      tags: [teacher-questions]
      description: Soft delete (§13.2). Version snapshots that reference it keep working.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `QUESTION_REFERENCED` — still referenced by a draft test outline.
            `details.tests` names those drafts as `ReferencingTest[]`, sorted
            by title, so the dialog can link to them (A-06a).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/questions/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: duplicateQuestion
      x-resource:
        - { in: path, name: id, kind: question }
      x-permission: [content.questions.write, content.tests.write]
      tags: [teacher-questions]
      description: |
        A-06a's "Nhân bản": copies the question, its options, blanks and
        tags into a new bank row that no test references yet. A source whose
        media asset has been deleted, or that no longer validates, answers
        `VALIDATION_FAILED` as a create would; nothing is copied.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== teacher/media

  /teacher/imports:
    post:
      operationId: createWordImport
      x-resource:
        - { in: body, name: /requestId, kind: none }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Create an empty private import idempotently
      description: Creates a persistent intake identity without uploading files or starting recognition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWordImport' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: IMPORT_CONFLICT — request identity already used with different input.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            VALIDATION_FAILED with `details.readWithAi` — the import asked to be read
            with AI, but the AI assistant is not enabled on this server or the caller
            does not hold `ai.use`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: IMPORT_QUOTA_EXCEEDED — configured actor or installation quota reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listWordImports
      x-resource-list: import
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Search private import history
      description: Paginated history of the imports the caller created, for every caller (`scope.all` does not widen it), with accent-insensitive title and current filename search.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Query'
        - name: status
          in: query
          style: form
          explode: true
          description: Repeated statuses are OR-ed; a single status remains valid.
          schema:
            type: array
            items: { $ref: '#/components/schemas/ImportStatus' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Newest imports first, stable ID tie-breaker.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WordImportHistoryItem' }
                      facets: { $ref: '#/components/schemas/ImportStatusFacets' }
  /teacher/imports/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getWordImport
      x-resource:
        - { in: path, name: id, kind: import }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Read an import and its current completed sources
      description: Returns a consistent source-set snapshot and the number of incomplete upload reservations.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordImport' }
        '404':
          description: Import not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /teacher/imports/{id}/sources:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: uploadImportSource
      x-resource:
        - { in: path, name: id, kind: import }
        - { in: query, name: uploadId, kind: none }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Upload a private Word or PDF source and create an immutable source set
      description: |
        One multipart file part named file, at most 25 MiB. The filename ends in
        .docx or .pdf, or in .doc when legacy conversion is enabled (see limits), and
        the detected content must agree with it. A PDF is read from its text layer;
        a scanned PDF fails processing with PDF_NO_TEXT, unless the import was
        created with readWithAi, in which case its pages are read by the AI
        assistant (at most 40 pages, else PDF_TOO_LONG_FOR_AI).
        The body Content-Type is not evidence of the detected document type.
        Retry with identical uploadId, role, expectedRevision, filename and bytes.
        A changed replay conflicts. Completion creates exactly one source revision;
        replay returns its receipt even when later uploads advanced the import.
        Uploads are accepted while the import awaits sources, has failed or is under
        review; a new source set returns it to awaiting_sources, and processing again
        keeps teacher edits. Every storage write first has a durable reservation;
        interruptions remain inspectable and quota-counted.
        Source bytes and storage keys never enter ordinary logs or student payloads.
      x-max-body-bytes: 26345472
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: '#/components/schemas/ImportSourceRole' } }
        - { name: uploadId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: expectedRevision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored and associated with one source revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportUploadReceipt' }
        '400':
          description: Malformed upload; exactly one file part is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Import not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: IMPORT_CONFLICT — stale revision, invalid lifecycle or conflicting upload identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: IMPORT_SOURCE_TOO_LARGE — compressed, expanded or XML resource limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: IMPORT_SOURCE_UNSUPPORTED or IMPORT_SOURCE_INVALID — unsupported, active, encrypted or invalid source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: IMPORT_QUOTA_EXCEEDED or IMPORT_BUSY — retry after capacity is available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /teacher/imports/{id}/sources/text:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: pasteImportSource
      x-resource:
        - { in: path, name: id, kind: import }
        - { in: body, name: /uploadId, kind: none }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Store a private pasted-text exam source
      description: |
        Plain text only, normalized to NFC and stored as pasted-text.txt with role exam.
        At most 100000 Unicode code points and 20000 nonblank lines; no NUL.
        The default raw JSON body limit applies independently of text length.
        Identical normalized text with the same uploadId and expectedRevision replays
        the original immutable receipt; changed content conflicts. Quotas, intake
        capacity, ownership and retention are shared with file uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasteImportSource' }
      responses:
        '201':
