                      items: { type: array, items: { $ref: '#/components/schemas/QuestionGroupSummary' } }
    post:
      operationId: createQuestionGroup
      x-resource:
        - { in: body, name: /bundle/group/id, kind: none }
        - { in: body, name: /bundle/group/members/-/questionId, kind: none }
        - { in: body, name: /bundle/group/stimuli/-/id, kind: none }
