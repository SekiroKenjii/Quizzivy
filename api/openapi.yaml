      summary: Look for mistakes in a test's draft
      description: |
        Reads the draft's prompts, options, keys, explanations and shared
        passages, and answers what is worth a look, hardest first. Nothing is
        changed: a one-click `fix` is written by the caller through
        `updateQuestion`. No student data and no assignment is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCheckRequest' }
      responses:
        '200':
          description: The findings; empty when nothing is left to look at.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/AiCreditsExhausted' }
        '403': { $ref: '#/components/responses/AiNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The draft has no question to check, or holds more than one call reads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /teacher/ai/tests/{id}/variant:
