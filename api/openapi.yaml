      parameters:
        - { name: expectedRevision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: expectedTestUpdatedAt, in: query, schema: { type: string, format: date-time } }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'Stale revision, archived enclosing test, bank group not archived, or `RESOURCE_REFERENCED`: the group or one of its questions is still referenced elsewhere and nothing is deleted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

