openapi: 3.1.0

info:
  title: Quizzivy API
  version: 0.1.0
  contact:
    name: Thuong
    url: https://github.com/SekiroKenjii/Quizzivy
  description: |
    The contract both the React SPA and the Go backend implement.

    **This file supersedes spec §15**, which documented an assumed surface.
    Where they differ, this file wins and the spec gets corrected (§18).

    Everything else is generated from here: `oapi-codegen` produces the Go
    server interfaces, `openapi-typescript` produces the TS types, and MSW
    fixtures are validated against these schemas. CI regenerates and fails on
    drift. Change the contract here first, then `make gen`.

    Non-upload request bodies are capped at 1 MiB before schema validation;
    oversized bodies receive HTTP 413 with the standard validation-error envelope.
    A body the server could not finish reading receives HTTP 408 with
    `REQUEST_INCOMPLETE`.
    Multipart media uploads retain their separate upload limits.

    ## Reading this file

    - Operations with `security: []` are **public**. Spec §6.5 requires every
      one of them to be rate-limited; the server asserts this at startup by
      cross-referencing this file, so adding a public operation without a
      limiter fails the process rather than shipping.
    - Paths are split by audience: `/teacher/*` is the teaching workspace,
      `/admin/*` the Admin console, `/app/*` the student app, and `/auth/*`
      the caller's own session. `/public/*` and `/join/*` hold open operations
      only, and `/me/*` holds the caller's own notifications and settings,
      whatever their role. Each
      tree accepts only the permissions that belong to it, and the server
      refuses to start when an operation's `x-permission` does not fit its
      tree.
    - Every operation that requires a bearer token declares the permission it
      needs in `x-permission`, in one of three forms:
      - a `PermissionKey`;
      - a pseudo-key: `self` (any signed-in user), `workspace.teacher` (any
        `content.*`, `teaching.*` or `people.students.*` key) or
        `workspace.admin` (`people.users.manage`, `people.roles.manage`,
        `system.audit.read`, `system.settings.write`, `ai.credits.manage` or
        `scope.all`);
      - a list, met by any one of its keys. A list is used only where one
        operation serves two matrix rows, and the server narrows the check
        when the body decides which row applies.

      An operation that does not require the bearer token (the nine open
      operations) declares none. The server refuses to start when an
      operation breaks this, and a hidden key (`scope.all`,
      `system.api_reference`, `system.data_export`, `system.leads`) may appear
      only under `/admin/`.
    - Every uuid-typed path, query or body field under `/teacher/*`, `/app/*`
      and `/me/*`, and every key of a body map whose `propertyNames` is
      `Uuid`, is named in its operation's `x-resource` list as
      `{in, name, kind}`. For a body field `name` is a JSON pointer, where `-`
      stands for every item of an array, `*` for every value of a map and `+`
      for every key of a map.
      `kind` is the owned resource the id names: `test`, `test-version`,
      `section`, `question`, `version-question`, `version-recording`,
      `question-group`, `media`, `import`, `import-source`, `class`,
      `assignment`, `attempt`, `student`, `notification` or `override`. The two `version-` kinds are a
      question and a group recording of a published version, as grading and
      the student's autosave, events and plays name them. A section unit's
      `id` names a question or a group, as its `kind` says, and is declared
      as a question; the suite checks the group branch separately.
      `kind` is `none` for an id that names no owned resource: an option, a
      gap, a session, an idempotency key, a fresh identity the caller
      supplies, a cursor that only marks a position in the caller's own list
      (`before` on `listNotifications`), or an id the operation resolves only
      inside the resource its path names, such as a group's own members on
      `updateQuestionGroup`.
      An `override` is named by the id of the student it is on, beside the
      assignment in the same path: `DELETE /teacher/assignments/{id}/student-overrides/{studentId}`.
      Every `/teacher/*` list names the kind it lists in `x-resource-list`.
      The two-teacher isolation suite reads both: another owner's id answers
      exactly as a missing id does.
    - Student-facing schemas are deliberately separate components from teacher
      ones. See `StudentQuestion` for why.
    - All timestamps are RFC 3339 UTC. Rendering in `Asia/Ho_Chi_Minh` is the
      client's job (§13.2).
    - During a maintenance window every operation except `GET /livez`,
      `GET /healthz` and `GET /public/status` answers `503 MAINTENANCE`
      (`components/responses/Maintenance`). The operations the client branches
      on declare it; every other one may answer it all the same.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.quizzivy.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: public
    description: |
      Unauthenticated. Rate-limited per §6.5, and every response is leak-reviewed:
      no class, student or test is enumerable through them.
  - name: auth
    description: Sign-in, Google sign-in with PKCE, the rotating refresh token, password change and the caller's own sessions.
  - name: teacher-tests
    description: Tests, their drafts and sections, shared-context groups, publishing, versions and the preview.
  - name: teacher-questions
    description: The question bank, with its tags, its search and the question groups it holds.
  - name: teacher-imports
    description: Private Word source intake and durable import review.
  - name: teacher-media
    description: The media library, its images and audio, their names and where they are used.
  - name: teacher-assignments
    description: Giving a published version to classes and students, its schedule and rules, overrides and results.
  - name: teacher-attempts
    description: The attempts a teacher reviews, with the monitor, grading, scores, comments and integrity events.
  - name: teacher-students
    description: The students a teacher reaches, with their accounts, passwords and classes.
  - name: teacher-classes
    description: Classes, their members and their join codes.
  - name: teacher-ai
    description: |
      The AI assistant's suggestions and the teacher's own credits. Every
      operation answers a suggestion or a figure and never writes a grade, a
      question or a comment: a teacher accepts a suggestion through the
      existing write. With no provider configured every one answers
      `501 AI_OFF`.
  - name: admin-users
    description: The Admin console's people operations. In R2 only the deletion of a student account lives here.
  - name: admin-roles
    description: |
      Roles and the permission matrix. A role is created and edited, never
      deleted (DG-52). Every write is held to the subset rule: a caller acts
      only on a role whose permissions, except `learning.take_tests`, are their
      own, and grants only keys they hold. The built-in roles keep their key.
  - name: admin-classes
    description: |
      Every teacher's classes in one list, creating a class for a teacher and
      changing a class's teacher. Editing, rotating the code, archiving,
      restoring and adding members are the teacher workspace's operations,
      which `scope.all` opens on any class.
  - name: admin-ai
    description: |
      The AI credits console: the pool, the teachers' allowances, their
      requests for more and the centre's rules. With no provider configured
      every operation answers `501 AI_OFF`.
  - name: admin-docs
    description: Admin access to the API reference served beside the API.
  - name: admin-audit
    description: |
      The Admin console's audit log: a read-only history of the sensitive
      changes the server recorded, filterable by category, search and date, and
      downloadable. Nothing here can change or remove an entry.
  - name: admin-exports
    description: |
      The full data export. The worker builds one ZIP of CSV files, the
      requester is told by email, and the file is fetched from an app page up
      to three times: the email links to that page and never to the file. Without
      object storage and the worker every operation answers `501 EXPORT_OFF`.
  - name: admin-overview
    description: |
      The Admin console's Overview, its sidebar badge and the Plan & usage
      figures: read models over what the other parts of the system hold. Each
      section a caller's keys do not open is `null`, so a custom role reads
      only what it may.
  - name: admin-settings
    description: |
      The centre's own settings: who it is and how it is reached, its logos,
      how people sign in, and how long it keeps answers, focus events and
      disabled accounts. One document for the whole installation.
  - name: student
    description: The student console, with its classes, assigned tests, results and settings.
  - name: take-test
    description: Taking a test, from starting or resuming an attempt to saving answers, submitting and the integrity beacon.
  - name: me
    description: |
      The caller's own notifications and notification switches, for any
      signed-in user. Every operation reads and writes the caller's rows only:
      none takes a user id, and none answers 403 or 404 for an id.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ~15 minute access token, held in memory only — never `localStorage`,
        never `sessionStorage` (§5.2). On 401 the client calls `/auth/refresh`
        once and retries; a second 401 logs out.

        While the account's `mustChangePassword` is set, every operation that
        needs this token answers `403 PASSWORD_CHANGE_REQUIRED`, except
        `getCurrentUser` and `changePassword`; `logout` and `refreshSession`
        need no token. The client sends the person to the change-password page.
    refreshCookie:
      type: apiKey
      in: cookie
      name: quizzivy_refresh
      description: |
        Opaque, rotating, `httpOnly; Secure; SameSite=Lax; Path=/auth`, and
        host-only — no `Domain` attribute, so only the API host receives it.
        `SameSite=Lax` is sufficient because the SPA and the API are subdomains
        of one registrable domain and are therefore same-site.

        Presenting an already-rotated token revokes the whole family (§5.2).

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: |
        1-based page number. Lists are OFFSET-paginated so a client can draw
        numbered pages (O-20 overrides §13.8's keyset rule for the teacher's
        lists: at this scale the teacher wants "trang 3 / 26" more than
        stability under concurrent inserts). A page past the end is an empty
        `items` with the same `total`.

        Page size is `limit`, declared per operation with its own default -- a
        media grid wants a different page from a table of tests. The response
        echoes the size actually used as `pageSize`; compute page counts from
        that and `total`, never from an assumed size.
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    Query:
      name: q
      in: query
      required: false
      description: Free-text search. Accent-insensitive (D-11) — `phat am` matches `phát âm`.
      schema: { type: string, maxLength: 200 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

  responses:
    BadRequest:
      description: |
        Request validation answers this on every operation that takes a JSON body,
        before the operation runs: a body that fails its schema, that cannot be
        decoded, or that is not JSON.
        Malformed or failing validation. A JSON body in which an object repeats
        a member name is refused here too, at any depth, unless the server
        filled a default into that body: it is then read with the last
        occurrence of each repeated name.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid or expired access token. Client refreshes once, then logs out.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: |
        Authenticated but not permitted: the caller's role lacks the operation's
        `x-permission`, as a `student` reaching a `/teacher/*` route does. It
        gets this, and the client renders a 403 page rather than redirecting —
        a redirect hides the misconfiguration (§5.4).

        `PASSWORD_CHANGE_REQUIRED` is a 403 of its own kind: the permission is
        held, but the account is on a temporary password and must change it
        first (see `bearerAuth`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such resource, or the caller may not know it exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded (§6.5).
      headers:
        Retry-After:
          required: true
          description: Seconds until the caller may retry.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UserImportRefused:
      description: |
        The file or the request cannot be imported, and the message says which.
        `USER_IMPORT_FILE_UNREADABLE` — not a table this reader opens: damaged,
        not a workbook, a first sheet that is a chart, a workbook that keeps its
        parts elsewhere than Excel does, or one too large once unpacked.
        `USER_IMPORT_FILE_EMPTY` — no header row.
        `USER_IMPORT_TOO_MANY_ROWS` — more than 2,000 data rows.
        `USER_IMPORT_COLUMNS` — the header lacks `full_name` or `email`, or names
        a column twice.
        `CSV_NOT_UTF8` — a CSV file in another encoding; save it as CSV UTF-8.
        `XLSX_MACROS` — a workbook with macros.
        `XLSX_ENCRYPTED` — a workbook with a password.
        `PASSWORD_SIGN_IN_DISABLED` — `sheet` while the centre has turned
        password sign-in off.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UserImportUnavailable:
      description: |
        This server cannot do it: `delivery: email_link` needs the key that seals
        a link (`SECRETS_KEY`), and `delivery: sheet` needs the same key to keep
        the passwords it hands out.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Maintenance:
      description: |
        `MAINTENANCE` — a maintenance window is under way. `details.startsAt` and
        `details.endsAt` name it, and `Retry-After` is the seconds until it ends.
        Any operation except `GET /livez`, `GET /healthz` and `GET /public/status`
        may answer this, whatever its authentication.
      headers:
        Retry-After:
          required: true
          description: Seconds until the window ends.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoContent:
      description: Success, no body.
    AiOff:
      description: |
        `AI_OFF` — the AI assistant is not configured on this server (no provider
        key). Nothing was reserved or metered. `GET /public/status` says `ai: false`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ExportOff:
      description: |
        `EXPORT_OFF` — this server has no object storage or no worker, so it
        builds no export. Nothing was queued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AiNotAllowed:
      description: |
        `AI_PAUSED` — an Admin paused AI for this teacher; nothing was reserved.
        `AI_READ_OFF` — the teacher's `ai.readStudentAnswers` preference is off,
        and the operation would send a student's answer (`suggestAiScore`,
        `explainAssignmentResults`). `FORBIDDEN` — `suggestAiScore` and
        `explainAssignmentResults` also need `teaching.grading`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AiCreditsExhausted:
      description: |
        `AI_CREDITS_EXHAUSTED` — the teacher's allowance or the centre's pool
        cannot cover the call. `details.scope` is `teacher` or `pool`. Nothing
        was written, and no call was made to the provider.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AiUnavailable:
      description: |
        `AI_UNAVAILABLE` — the provider timed out, was overloaded, refused, or
        answered something the server could not use. The reservation was
        settled for what the provider billed, if anything, and released
        otherwise. A later attempt may succeed.
      headers:
        Retry-After:
          required: true
          description: Seconds until the caller may try again.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ContentDocument:
      description: |
        Versioned learner content, independent of editor JSON. This additive contract
        is not yet accepted by question writes. Validate with the content domain
        validator as well as JSON Schema: unique gaps, rectangular non-overlapping
        table spans, no nested tables, list-leading paragraphs, unordered start=1,
        no simultaneous super/subscript, consistent asset kinds, Unicode scalar strings
        without NUL, and aggregate budgets. Unknown fields are errors, never silently stripped.
        Asset IDs are references only; authorization, existence, kind and deletion
        locks belong to the enclosing write. This schema grants no asset access.
      x-content-limits:
        bytes: 1048576
        nodes: 2048
        depth: 16
        values: 24576
        strings: 200000
        text: 100000
        url: 2000
        rows: 50
        columns: 12
      oneOf:
        - $ref: '#/components/schemas/LegacyMarkdownContent'
        - $ref: '#/components/schemas/SemanticContent'
      discriminator:
        propertyName: format
        mapping:
          legacy_markdown_v1: '#/components/schemas/LegacyMarkdownContent'
          semantic_v1: '#/components/schemas/SemanticContent'
    LegacyMarkdownContent:
      type: object
      additionalProperties: false
      required: [format, markdown]
      properties:
        format: { type: string, enum: [legacy_markdown_v1] }
        markdown: { type: string, maxLength: 100000 }
    SemanticContent:
      type: object
      additionalProperties: false
      required: [format, blocks]
      properties:
        format: { type: string, enum: [semantic_v1] }
        blocks: { $ref: '#/components/schemas/ContentBlocks' }
    ContentBlocks:
      type: array
      minItems: 1
      maxItems: 2048
      items: { $ref: '#/components/schemas/ContentBlock' }
    ContentBlock:
      oneOf:
        - $ref: '#/components/schemas/ContentParagraph'
        - $ref: '#/components/schemas/ContentHeading'
        - $ref: '#/components/schemas/ContentList'
        - $ref: '#/components/schemas/ContentTable'
        - $ref: '#/components/schemas/ContentImage'
        - $ref: '#/components/schemas/ContentAudio'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/ContentParagraph'
          heading: '#/components/schemas/ContentHeading'
          list: '#/components/schemas/ContentList'
          table: '#/components/schemas/ContentTable'
          image: '#/components/schemas/ContentImage'
          audio: '#/components/schemas/ContentAudio'
    ContentInlines:
      type: array
      maxItems: 2048
      items: { $ref: '#/components/schemas/ContentInline' }
    ContentInline:
      oneOf:
        - $ref: '#/components/schemas/ContentText'
        - $ref: '#/components/schemas/ContentBreak'
        - $ref: '#/components/schemas/ContentGap'
        - $ref: '#/components/schemas/ContentLink'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/ContentText'
          break: '#/components/schemas/ContentBreak'
          gap: '#/components/schemas/ContentGap'
          link: '#/components/schemas/ContentLink'
    ContentMark:
      type: string
      enum: [bold, italic, underline, strike, superscript, subscript]
    ContentText:
      type: object
      additionalProperties: false
      required: [type, text, marks]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string, minLength: 1, maxLength: 100000 }
        marks:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { $ref: '#/components/schemas/ContentMark' }
    ContentBreak:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [break] }
    ContentGap:
      type: object
      additionalProperties: false
      required: [type, id, label]
      properties:
        type: { type: string, enum: [gap] }
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 32 }
    ContentLink:
      type: object
      additionalProperties: false
      required: [type, href, content]
      properties:
        type: { type: string, enum: [link] }
        href:
          type: string
          maxLength: 2000
          description: Explicit HTTPS navigation with ASCII DNS-style host labels and optional port 1–65535. International hosts must be punycoded; IPv6 literals are not supported in this version. No credentials, whitespace, controls, backslashes or malformed percent escapes. Never fetched during parsing or rendering.
        content:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/ContentText' }
    ContentParagraph:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [paragraph] }
        content: { $ref: '#/components/schemas/ContentInlines' }
    ContentHeading:
      type: object
      additionalProperties: false
      required: [type, level, content]
      properties:
        type: { type: string, enum: [heading] }
        level: { type: integer, enum: [1, 2, 3] }
        content: { $ref: '#/components/schemas/ContentInlines' }
    ContentList:
      type: object
      additionalProperties: false
      required: [type, ordered, start, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean }
        start: { type: integer, minimum: 1, maximum: 9999 }
        items:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/ContentBlocks' }
    ContentTable:
      type: object
      additionalProperties: false
      required: [type, rows]
      properties:
        type: { type: string, enum: [table] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            maxItems: 12
            items: { $ref: '#/components/schemas/ContentCell' }
    ContentCell:
      type: object
      additionalProperties: false
      required: [header, rowSpan, colSpan, content]
      properties:
        header: { type: boolean }
        rowSpan: { type: integer, minimum: 1, maximum: 50 }
        colSpan: { type: integer, minimum: 1, maximum: 12 }
        content: { $ref: '#/components/schemas/ContentBlocks' }
    ContentImage:
      type: object
      additionalProperties: false
      required: [type, assetId, alt]
      properties:
        type: { type: string, enum: [image] }
        assetId: { type: string, format: uuid }
        alt: { type: string, minLength: 1, maxLength: 1000 }
    ContentAudio:
      type: object
      additionalProperties: false
      required: [type, assetId, label]
      properties:
        type: { type: string, enum: [audio] }
        assetId: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }

    # ------------------------------------------------------------------ core

    Uuid:
      type: string
      format: uuid
      description: uuidv7 — time-ordered, so `id DESC` is a valid recency sort (§13.2).
      examples: ['019535d9-3df7-79fb-b466-fa907fa17f9e']

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC. Rendered in `Asia/Ho_Chi_Minh` by the client.

    Points:
      type: number
      format: double
      description: |
        numeric(8,2) — never a float (§13.2). Stored and compared as an exact
        decimal server-side; this is the wire representation.

        `format: double` is load-bearing rather than decoration. Without it
        oapi-codegen generates `float32`, which holds about 7 significant
        decimal digits — and the maximum below needs 8. `999999.99` round-trips
        through a float32 as `1000000`, a value this very schema rejects, and
        `12345.67` becomes `12345.669921875`. Points are summed to produce a
        test's total, so that error accumulates across a paper. `double` gives
        Go a float64 and leaves TypeScript's `number` unchanged, since a JS
        number is already a float64.
      minimum: 0
      maximum: 999999.99

    PublicStatus:
      type: object
      description: What `GET /public/status` answers.
      required: [maintenance, ai]
      additionalProperties: false
      properties:
        maintenance:
          description: The next maintenance window that has not ended, or `null`.
          oneOf: [{ $ref: '#/components/schemas/MaintenanceWindow' }, { type: 'null' }]
        ai:
          type: boolean
          description: |
            Whether the AI assistant is configured. It reads the server's
            configuration and never asks the provider, so it says nothing about
            the provider being reachable. When false every `/teacher/ai/*` and
            `/admin/ai/*` operation answers `501 AI_OFF`, and the web draws no
            AI entry point.

    PublicOrganization:
      type: object
      description: |
        What `GET /public/organization` answers: the lines the front door prints
        about the centre, its logos and the ways in it offers. A line the centre
        has not filled is `null`, and the front door then prints its build value.
      required: [name, shortName, website, contactEmail, frontDeskPhone, frontDeskHours, address, logo, signIn, joinCodes]
      additionalProperties: false
      properties:
        name: { type: string }
        shortName: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        contactEmail: { type: [string, 'null'] }
        frontDeskPhone: { type: [string, 'null'] }
        frontDeskHours: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        logo:
          type: object
          required: [lightUrl, darkUrl]
          additionalProperties: false
          properties:
            lightUrl:
              type: [string, 'null']
              description: |
                The light logo's path on the API's origin, carrying its content
                hash as `v`, so a new logo is a new URL and the bytes behind one
                never change; `null` when the centre has none.
              examples: ['/public/organization/logo?variant=light&v=5e88…']
            darkUrl:
              type: [string, 'null']
              description: The dark logo's path, as `lightUrl`; `null` when the centre has none.
        signIn:
          type: object
          required: [google, password]
          additionalProperties: false
          properties:
            google: { type: boolean, description: Whether Google sign-in is offered. }
            password: { type: boolean, description: Whether email and password sign-in is offered. }
        joinCodes:
          type: boolean
          description: Whether students can join a class with a code.

    OrganizationLogo:
      type: object
      description: A stored logo, named by the SHA-256 of its bytes.
      required: [sha256, type]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        type: { type: string, enum: [image/png] }

    OrganizationProfile:
      type: object
      description: |
        Who the centre is and how it is reached. Every text is trimmed; an
        optional one that is empty after trimming is stored as `null`.
      required: [name, shortName, website, contactEmail, frontDeskPhone, frontDeskHours, address, logo]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 480, description: At most 120 characters after Unicode NFC. }
        shortName: { type: [string, 'null'], maxLength: 160, description: At most 40 characters after Unicode NFC. }
        website:
          type: [string, 'null']
          maxLength: 200
          description: A domain or an `https` address, without spaces or credentials, as `quizzivy.com` or `https://quizzivy.com/lien-he`. `http` and other schemes are refused.
        contactEmail:
          type: [string, 'null']
          maxLength: 254
          description: An address of a local part and a domain with a dot, as `hello@quizzivy.com`.
        frontDeskPhone:
          type: [string, 'null']
          maxLength: 30
          description: Digits, spaces and `+ ( ) . -`, 6 to 30 characters.
        frontDeskHours: { type: [string, 'null'], maxLength: 120 }
        address: { type: [string, 'null'], maxLength: 300 }
        logo:
          type: object
          required: [light, dark]
          additionalProperties: false
          properties:
            light:
              description: The logo on a light background, or `null` for none.
              oneOf: [{ $ref: '#/components/schemas/OrganizationLogo' }, { type: 'null' }]
            dark:
              description: The logo on a dark background, or `null` for none.
              oneOf: [{ $ref: '#/components/schemas/OrganizationLogo' }, { type: 'null' }]

    SignInPolicy:
      type: object
      description: |
        How people sign in. At least one of `google` and `password` is on.
      required: [google, password, forcePasswordChange, joinCodes, allowedGoogleDomains]
      additionalProperties: false
      properties:
        google: { type: boolean }
        password: { type: boolean }
        forcePasswordChange:
          type: boolean
          description: Whether a temporary password issued from now on must be changed at the first sign-in. Passwords issued before keep what they had.
        joinCodes:
          type: boolean
          description: Whether students can join a class with a code.
        allowedGoogleDomains:
          type: array
          maxItems: 50
          uniqueItems: true
          description: |
            The email domains a Google account must be in to sign in, link or
            join; empty allows every domain. Stored lower-case.
          items:
            type: string
            minLength: 3
            maxLength: 253
            pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'

    RetentionPolicy:
      type: object
      description: |
        How long the centre keeps what it collects. The nightly sweep applies
        it once enabled (T-R5.17a); `null` means for ever, or never.
      required: [keepAnswersMonths, keepFocusEventsMonths, anonymiseDisabledAfterMonths]
      additionalProperties: false
      properties:
        keepAnswersMonths:
          description: Months an answer is kept after its attempt ends, or `null` for ever.
          oneOf: [{ type: integer, enum: [12, 24] }, { type: 'null' }]
        keepFocusEventsMonths: { type: integer, enum: [6, 12, 13, 24] }
        anonymiseDisabledAfterMonths:
          description: Months after which a disabled account is anonymised, or `null` for never.
          oneOf: [{ type: integer, enum: [12, 24] }, { type: 'null' }]

    UsageLimits:
      type: object
      description: |
        The usage limits an Admin set (CR-002, D-060). `null` takes the
        default `limitDefaults` names: the deploy's variable when one is set,
        else the hosting plan's figure, and for `seats` and `teachers` no limit.
        A limit below what is in use can be saved; it refuses what would add to
        the use and disables nothing.

        `seats` bounds the enabled accounts and `teachers` the enabled accounts
        whose role opens the teacher workspace; both refuse a new, re-enabled
        or re-roled account past them (`SEAT_LIMIT`, `TEACHER_LIMIT`).
        `storageBytes` bounds every file the centre keeps in its buckets
        (media, import documents and their read pages, exports ready to
        download) and refuses an upload past it. `mediaPerTeacherBytes` bounds
        one teacher's media library; `importBytes` and `importPerTeacherBytes`
        the documents of the imports still open, for the centre and for one
        teacher. `emailsPerDay` and `emailsPerMonth` hold mail past them until
        the next local day or month. `databaseBytes` only warns.
        `warnAtPercent` is the share of a limit at which the Overview warns.
      required: [seats, teachers, storageBytes, mediaPerTeacherBytes, importBytes, importPerTeacherBytes, emailsPerDay, emailsPerMonth, databaseBytes, warnAtPercent]
      additionalProperties: false
      properties:
        seats: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        teachers: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        storageBytes: { type: [integer, 'null'], format: int64, minimum: 1048576, maximum: 1125899906842624 }
        mediaPerTeacherBytes: { type: [integer, 'null'], format: int64, minimum: 1048576, maximum: 1125899906842624 }
        importBytes: { type: [integer, 'null'], format: int64, minimum: 1048576, maximum: 1125899906842624 }
        importPerTeacherBytes: { type: [integer, 'null'], format: int64, minimum: 1048576, maximum: 1125899906842624 }
        emailsPerDay: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        emailsPerMonth: { type: [integer, 'null'], minimum: 1, maximum: 10000000 }
        databaseBytes: { type: [integer, 'null'], format: int64, minimum: 1048576, maximum: 1125899906842624 }
        warnAtPercent: { type: [integer, 'null'], minimum: 50, maximum: 100 }

    UsageLimitDefault:
      type: object
      description: |
        What a limit is when nothing is stored. `value` is `null` for no limit.
        `source` says where it comes from: `r2_free` (Cloudflare R2's free tier,
        10 GB), `neon_launch` (the warning line chosen for Neon's Launch plan,
        which has no cap), `resend_free` (Resend's free plan, 100 a day and
        3,000 a month), `deploy` (a deploy variable that overrides the plan),
        `app` (the app's own figure) or `none`.
      required: [value, source]
      additionalProperties: false
      properties:
        value: { type: [integer, 'null'], format: int64, minimum: 1 }
        source: { type: string, enum: [none, app, deploy, r2_free, neon_launch, resend_free] }

    UsageLimitDefaults:
      type: object
      description: Each limit's default, under the same names as `UsageLimits`.
      required: [seats, teachers, storageBytes, mediaPerTeacherBytes, importBytes, importPerTeacherBytes, emailsPerDay, emailsPerMonth, databaseBytes, warnAtPercent]
      additionalProperties: false
      properties:
        seats: { $ref: '#/components/schemas/UsageLimitDefault' }
        teachers: { $ref: '#/components/schemas/UsageLimitDefault' }
        storageBytes: { $ref: '#/components/schemas/UsageLimitDefault' }
        mediaPerTeacherBytes: { $ref: '#/components/schemas/UsageLimitDefault' }
        importBytes: { $ref: '#/components/schemas/UsageLimitDefault' }
        importPerTeacherBytes: { $ref: '#/components/schemas/UsageLimitDefault' }
        emailsPerDay: { $ref: '#/components/schemas/UsageLimitDefault' }
        emailsPerMonth: { $ref: '#/components/schemas/UsageLimitDefault' }
        databaseBytes: { $ref: '#/components/schemas/UsageLimitDefault' }
        warnAtPercent: { $ref: '#/components/schemas/UsageLimitDefault' }

    OrganizationSettings:
      type: object
      description: The whole settings document, as stored, and each usage limit's default.
      required: [organization, signIn, retention, limits, limitDefaults, revision, updatedAt, updatedBy]
      additionalProperties: false
      properties:
        organization: { $ref: '#/components/schemas/OrganizationProfile' }
        signIn: { $ref: '#/components/schemas/SignInPolicy' }
        retention: { $ref: '#/components/schemas/RetentionPolicy' }
        limits: { $ref: '#/components/schemas/UsageLimits' }
        limitDefaults: { $ref: '#/components/schemas/UsageLimitDefaults' }
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Grows by one with every save; a save names the revision it was read at.
        updatedAt: { type: string, format: date-time }
        updatedBy:
          description: Who saved last, or `null` before the first save and once that account is gone.
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]

    OrganizationSettingsInput:
      type: object
      description: |
        The whole document to store, and the revision it was read at. Without
        `limits` the stored limits are kept, so a client that predates them
        changes none.
      required: [organization, signIn, retention, expectedRevision]
      additionalProperties: false
      properties:
        organization: { $ref: '#/components/schemas/OrganizationProfile' }
        signIn: { $ref: '#/components/schemas/SignInPolicy' }
        retention: { $ref: '#/components/schemas/RetentionPolicy' }
        limits: { $ref: '#/components/schemas/UsageLimits' }
        expectedRevision: { type: integer, format: int64, minimum: 1 }

    SignInImpact:
      type: object
      description: |
        What a proposed policy would do to the active accounts. A method counts
        for an account when the policy allows it: a password when the account
        has one, Google when a linked Google account's email is in an allowed
        domain (any domain when the list is empty).
      required: [affectedUsers, affectedAdmins, actorLocked, lockout]
      additionalProperties: false
      properties:
        affectedUsers:
          type: integer
          minimum: 0
          description: Active accounts left with no method that counts.
        affectedAdmins:
          type: integer
          minimum: 0
          description: Of those, the accounts of the built-in Admin role.
        actorLocked:
          type: boolean
          description: Whether the caller is among them.
        lockout:
          type: boolean
          description: Whether a save would be refused with `SIGN_IN_POLICY_LOCKOUT`; the caller is locked out, or no active built-in Admin keeps a method.

    RetentionImpact:
      type: object
      description: |
        What the nightly sweep would do today under a proposed retention
        policy. `answers` and `accounts` are `null` when the policy keeps
        answers for ever or never anonymises.
      required: [answers, focusEvents, accounts]
      additionalProperties: false
      properties:
        answers:
          oneOf:
            - type: object
              required: [attempts, answers]
              additionalProperties: false
              properties:
                attempts: { type: integer, format: int64, minimum: 0, description: Ended attempts that hold an answer to remove. }
                answers: { type: integer, format: int64, minimum: 0, description: Answers that would be removed. }
            - { type: 'null' }
        focusEvents: { type: integer, format: int64, minimum: 0, description: Focus-loss events that would be deleted. }
        accounts:
          oneOf:
            - type: object
              required: [anonymise, skippedOwners]
              additionalProperties: false
              properties:
                anonymise: { type: integer, format: int64, minimum: 0, description: Disabled accounts that would be anonymised. }
                skippedOwners: { type: integer, format: int64, minimum: 0, description: Disabled accounts left because they own classes or content. }
            - { type: 'null' }

    OrganizationLogoUpload:
      type: object
      description: A logo stored and ready to be named in a save.
      required: [sha256, type, width, height]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        type: { type: string, enum: [image/png] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    MaintenanceWindow:
      type: object
      required: [startsAt, endsAt, active]
      additionalProperties: false
      properties:
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { $ref: '#/components/schemas/Timestamp' }
        active: { type: boolean, description: True while the window is under way. }

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable. **The only thing clients branch on.** Copy is
        driven by `message`, never reconstructed from this, with two exceptions
        the web app words itself, as the design deck draws them:
        `INVALID_CREDENTIALS` on the sign-in page and `PASSWORD_UNCHANGED` on
        the change-password forms. The server still sends a localised `message`
        for both, for any other client.

        Two codes answer requests this contract does not describe, with this
        envelope: `NOT_FOUND` (404) for a path outside it, and
        `METHOD_NOT_ALLOWED` (405, with an `Allow` header) for a path of it
        under a method the path does not serve. `HEAD` is served as `GET`
        without a body on the operations that need no token.

        `REQUEST_INCOMPLETE` (408) answers a request whose body the server
        could not finish reading, on any operation that takes a body other than
        a streamed upload. It says nothing about the body: the same request may
        be sent again.
      enum:
        # auth
        - INVALID_CREDENTIALS
        - ACCOUNT_NOT_PROVISIONED
        - ACCOUNT_DISABLED
        - EMAIL_NOT_VERIFIED
        - PASSWORD_REQUIRED
        - PASSWORD_UNCHANGED
        - IDENTITY_ALREADY_LINKED
        - LAST_LOGIN_METHOD
        - SET_PASSWORD_LINK_INVALID
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - SESSION_IS_CURRENT
        # join codes — distinct, but see JoinPreviewResponse on what they may not carry
        - JOIN_CODE_INVALID
        - JOIN_CODE_EXPIRED
        - JOIN_CODE_EXHAUSTED
        - JOIN_CODE_REVOKED
        # classes
        - CLASS_ARCHIVED
        # students
        - EMAIL_TAKEN
        - STUDENT_SHARED
        # roles
        - ROLE_NAME_TAKEN
        - ROLE_LIMIT_REACHED
        - ROLE_NOT_ASSIGNABLE
        # usage limits
        - SEAT_LIMIT
        - TEACHER_LIMIT
        - STORAGE_LIMIT
        - ROLE_LOCKED
        - STUDENT_NEEDS_TAKE_TESTS
        - KEY_NOT_GRANTABLE
        - CANNOT_ACT_ON_SELF
        - TARGET_ROLE_NOT_ALLOWED
        - LAST_ADMIN
        - USER_OWNS_CONTENT
        - USER_NOT_DISABLED
        - INVALID_RECIPIENT
        # authoring
        - RESOURCE_REFERENCED
        - RESOURCE_NOT_ARCHIVED
        - VERSION_IS_CURRENT
        - TEST_NOT_PUBLISHED
        - TEST_ARCHIVED
        - GROUP_OUTLINE_REQUIRED
        - GROUP_CONFLICT
        - PUBLISH_VALIDATION_FAILED
        - STALE_WRITE
        - PLAY_ID_CONFLICT
        - QUESTION_REFERENCED
        - MEDIA_REFERENCED
        - MEDIA_TYPE_UNSUPPORTED
        - MEDIA_TOO_LARGE
        - MEDIA_TOO_LONG
        - MEDIA_UNREADABLE
        - MEDIA_KIND_MISMATCH
        - MEDIA_QUOTA_EXCEEDED
        - IMAGE_DIMENSIONS
        # Word imports
        - IMPORT_CONFLICT
        - IMPORT_QUOTA_EXCEEDED
        - IMPORT_BUSY
        - IMPORT_SOURCE_INVALID
        - IMPORT_SOURCE_TOO_LARGE
        - IMPORT_SOURCE_UNSUPPORTED
        - IMPORT_NOT_READY
        - IMPORT_NOT_PROCESSED
        - IMPORT_PROCESSING_UNAVAILABLE
        - IMPORT_FILES_REMOVED
        # attempts
        - ASSIGNMENT_NOT_OPEN
        - ASSIGNMENT_NOT_CLOSED
        - ASSIGNMENT_CLOSED
        - ATTEMPT_LIMIT_REACHED
        - ATTEMPT_CLOSED
        - ATTEMPT_IN_PROGRESS
        - ATTEMPT_VOIDED
        - SESSION_SUPERSEDED
        - DEADLINE_PASSED
        - DEADLINE_NOT_REACHED
        - GRADING_INCOMPLETE
        - ANSWER_REMOVED
        - VERSION_LOCKED
        - ASSIGNMENT_LOCKED
        # AI assistant
        - AI_OFF
        - AI_PAUSED
        - AI_READ_OFF
        - AI_CREDITS_EXHAUSTED
        - AI_UNAVAILABLE
        - AI_REQUESTS_OFF
        - AI_REQUEST_PENDING
        - AI_REQUEST_DECIDED
        - AI_REQUEST_EXPIRED
        - AI_ALLOWANCE_BELOW_USE
        # exports
        - EXPORT_TOO_LARGE
        - EXPORT_IN_PROGRESS
        - EXPORT_UNAVAILABLE
        - EXPORT_OFF
        # user imports
        - USER_IMPORT_FILE_TOO_LARGE
        - USER_IMPORT_FILE_UNREADABLE
        - USER_IMPORT_FILE_EMPTY
        - USER_IMPORT_TOO_MANY_ROWS
        - USER_IMPORT_COLUMNS
        - USER_IMPORT_NOTHING_TO_CREATE
        - SHEET_UNAVAILABLE
        - CSV_NOT_UTF8
        - XLSX_MACROS
        - XLSX_ENCRYPTED
        # organization
        - SIGN_IN_POLICY_LOCKOUT
        - PASSWORD_SIGN_IN_DISABLED
        - GOOGLE_SIGN_IN_DISABLED
        - GOOGLE_DOMAIN_NOT_ALLOWED
        # availability
        - MAINTENANCE
        - MAINTENANCE_SCHEDULED
        # generic
        - VALIDATION_FAILED
        - REQUEST_INCOMPLETE
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - UNAUTHORIZED
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - RATE_LIMITED
        - INTERNAL

    ErrorDetail:
      type: object
      description: |
        Extracted so a response carrying the envelope AND something else can
        reference it without composing over a closed schema (issue #41).
      required: [code, message, requestId]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: |
            Copy for the user, written by the server in the language
            `Accept-Language` prefers: Vietnamese by default, including when
            the header is absent or names neither language, and English when
            it prefers English. Display it; do not build copy from `code`,
            except for the two codes the `ErrorCode` description names.
          examples: ['Mã lớp không hợp lệ.']
        details:
          type: object
          additionalProperties: true
          description: |
            Shape depends on `code`. Field-level validation errors land here
            as `{ field: message }` for react-hook-form.

            The per-field sentences the rules word for a refused question,
            test or assignment, and the `message` of each publish violation
            they produce (every one but that of a test with no part at all),
            are Vietnamese whatever the header says (issue 284). A per-field
            sentence the operation words itself follows the header, as
            `message` does.
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: The copyable error ID shown by the global error boundary (§9).

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    PageInfo:
      type: object
      description: |
        The paging half of every list envelope. `total` counts the rows that
        match the CURRENT filters -- the number the page count is drawn from
        -- and is present even on an empty page past the end.
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    ImportStatus:
      type: string
      enum: [awaiting_sources, queued, processing, needs_review, committing, committed, failed, cancelled]
    ImportSourceRole:
      type: string
      enum: [exam, answer_key]
    ImportSource:
      type: object
      additionalProperties: false
      required: [id, role, filename, format, bytes, sha256, uploadedBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ImportSourceRole' }
        filename: { type: string, minLength: 1, maxLength: 255 }
        format: { type: string, enum: [docx, doc, pdf, text] }
        characters: { type: integer, minimum: 1, maximum: 100000 }
        bytes: { type: integer, format: int64, minimum: 1, maximum: 26214400 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uploadedBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
      oneOf:
        - properties:
            format: { enum: [text] }
          required: [characters]
        - properties:
            format: { enum: [docx, doc, pdf] }
          not: { required: [characters] }
    PasteImportSource:
      type: object
      additionalProperties: false
      required: [uploadId, expectedRevision, text]
      properties:
        uploadId: { $ref: '#/components/schemas/Uuid' }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 100000, pattern: '\S' }
    WordImport:
      type: object
      additionalProperties: false
      required: [id, title, status, revision, sourceRevision, sources, pendingUploads, createdBy, createdAt, updatedAt]
      description: |
        Belongs to the teacher who created it (`createdBy`). `scope.all` reaches
        any import by id; the history (`listWordImports`) holds only the
        caller's own.
        Sources are private originals, never learner media. Source revision zero
        means no completed source set. Upload completion does not mean recognition.
        Pending uploads are durable reservations and cannot be downloaded or processed.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/ImportStatus' }
        revision: { type: integer, format: int64, minimum: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        sources:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/ImportSource' }
        pendingUploads: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        run: { $ref: '#/components/schemas/ImportRun' }
        draftRevision:
          type: integer
          format: int64
          minimum: 0
          description: Zero until processing has produced a reviewable draft.
        testId:
          $ref: '#/components/schemas/Uuid'
          description: The draft test created by commit.
        filesRemovedAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When retention removed this import's original files and review draft.
            Set only on committed or cancelled imports. Afterwards the history row
            and source metadata remain, but downloads, the source view and the
            review answer 410 IMPORT_FILES_REMOVED.
        closedIdle:
          type: boolean
          description: |
            Present and true when retention closed this import because nobody
            touched it for the idle period, rather than a teacher cancelling it.
        readWithAi:
          type: boolean
          description: Whether the files are read with the AI assistant. Absent means false.
    WordImportHistoryItem:
      type: object
      additionalProperties: false
      required: [id, title, status, revision, sourceRevision, sources, pendingUploads, createdBy, createdAt, updatedAt, reviewCounts]
      description: |
        History-only current draft counts; unknown for a draft untouched since deploy.
        Belongs to the teacher who created it (`createdBy`). `scope.all` reaches
        any import by id; the history (`listWordImports`) holds only the
        caller's own.
        Sources are private originals, never learner media. Source revision zero
        means no completed source set. Upload completion does not mean recognition.
        Pending uploads are durable reservations and cannot be downloaded or processed.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/ImportStatus' }
        revision: { type: integer, format: int64, minimum: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        sources:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/ImportSource' }
        pendingUploads: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        run: { $ref: '#/components/schemas/ImportRun' }
        draftRevision:
          type: integer
          format: int64
          minimum: 0
          description: Zero until processing has produced a reviewable draft.
        testId:
          $ref: '#/components/schemas/Uuid'
          description: The draft test created by commit.
        filesRemovedAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When retention removed this import's original files and review draft.
            Set only on committed or cancelled imports. Afterwards the history row
            and source metadata remain, but downloads, the source view and the
            review answer 410 IMPORT_FILES_REMOVED.
        closedIdle:
          type: boolean
          description: |
            Present and true when retention closed this import because nobody
            touched it for the idle period, rather than a teacher cancelling it.
        readWithAi:
          type: boolean
          description: Whether the files are read with the AI assistant. Absent means false.
        reviewCounts:
          oneOf: [{ $ref: '#/components/schemas/ImportReviewCounts' }, { type: 'null' }]
    ImportReviewCounts:
      type: object
      additionalProperties: false
      required: [needsAction, toConfirm]
      description: Findings from the current review body, never a pending reprocessing candidate.
      properties:
        needsAction: { type: integer, minimum: 0 }
        toConfirm: { type: integer, minimum: 0 }
    ImportStatusFacets:
      type: object
      additionalProperties: false
      required: [all, processing, needsReview, failed, committed, cancelled]
      description: Counts under the same search and caller-owned scope, ignoring the status filter.
      properties:
        all: { type: integer, minimum: 0 }
        processing:
          type: integer
          minimum: 0
          description: awaiting_sources, queued, processing and committing together.
        needsReview: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        committed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    ImportRun:
      type: object
      additionalProperties: false
      required: [id, status, stage, attempt, maxAttempts, createdAt, updatedAt]
      description: The latest processing run. errorCode names why a failed run stopped; keyPaper is the answer-key paper the teacher chose for it, absent when recognition picked one.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        stage: { type: string, enum: [queued, source_validation, normalization, extraction, recognition, validation, ready] }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        errorCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,99}$' }
        keyPaper: { type: integer, minimum: 1, maximum: 999 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CreateWordImport:
      type: object
      additionalProperties: false
      required: [requestId, title]
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: Scoped to the actor; replay with the same title returns the same import, changed title conflicts.
        title: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
        readWithAi:
          type: boolean
          description: |
            Read the files with the AI assistant, so a scanned or photographed
            PDF is read instead of refused. Absent means false. When it is true
            the pages of the files are sent to an AI service outside Quizzivy.
    ImportUploadReceipt:
      type: object
      additionalProperties: false
      required: [import, source, sourceRevision]
      properties:
        import: { $ref: '#/components/schemas/WordImport' }
        source: { $ref: '#/components/schemas/ImportSource' }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
    ImportSourceDownload:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }

    DataExportRequest:
      type: object
      additionalProperties: false
      required: [includeAnswers]
      properties:
        includeAnswers:
          type: boolean
          description: Whether the ZIP also holds `answers.csv`, every answer of every attempt.

    DataExport:
      type: object
      description: |
        One data export. `status` is `queued` until the worker claims it,
        `running` while it builds the file, `ready` once the file is stored and
        the requester has been told, `failed` when it could not be built (the
        requester may ask again), and `expired` once the 24 hours of a `ready`
        export have passed. `downloadedAt` is the first time the file was
        fetched, and `downloads` counts how many times a URL was handed out (0
        to 3): the third fetch is the last. `bytes`, `completedAt` and
        `expiresAt` are `null` until the export is ready.
      additionalProperties: false
      required: [id, status, includeAnswers, bytes, createdAt, completedAt, expiresAt, downloadedAt, downloads]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, ready, failed, expired] }
        includeAnswers: { type: boolean }
        bytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        downloadedAt: { type: [string, 'null'], format: date-time }
        downloads: { type: integer, minimum: 0, maximum: 3 }

    DataExportDownload:
      type: object
      additionalProperties: false
      required: [url, expiresInSeconds]
      properties:
        url: { type: string, format: uri }
        expiresInSeconds: { type: integer, const: 60 }

    ImportCapabilities:
      type: object
      additionalProperties: false
      required: [intakeEnabled, processingEnabled, retention]
      properties:
        retention: { $ref: '#/components/schemas/ImportRetention' }
        intakeEnabled:
          type: boolean
          description: |
            Private import storage is configured, so imports can be created,
            listed, reviewed and committed. When false, every other
            /teacher/imports operation answers 501.
        processingEnabled:
          type: boolean
          description: |
            A worker is deployed to process the queue, so processWordImport
            accepts work. When false it answers 503
            IMPORT_PROCESSING_UNAVAILABLE instead of queueing a run nothing will
            claim. Never true while intakeEnabled is false.
    ImportRetention:
      type: object
      additionalProperties: false
      required: [afterCommitDays, afterCancelDays, idleDays]
      description: |
        How long an import keeps its original files and review draft. After
        the test is created, after cancellation, and an import untouched for
        idleDays is closed and its files removed. History rows are kept.
      properties:
        afterCommitDays: { type: integer, minimum: 1 }
        afterCancelDays: { type: integer, minimum: 1 }
        idleDays: { type: integer, minimum: 1 }
    ImportLimits:
      type: object
      additionalProperties: false
      required: [maxBytes, formats, pasteMaxCharacters]
      properties:
        pasteMaxCharacters: { type: integer, minimum: 1, maximum: 100000 }
        maxBytes: { type: integer, format: int64, minimum: 1 }
        formats:
          type: array
          description: Accepted file extensions; doc appears only when legacy conversion is enabled.
          items: { type: string, enum: [docx, doc, pdf] }
    ProcessWordImport:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: Replaying the same request returns the same run.
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        keyPaper:
          type: integer
          minimum: 1
          maximum: 999
          description: Paper number to read from an answer-key file that holds several papers.
    CancelWordImport:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    CommitWordImport:
      type: object
      additionalProperties: false
      required: [requestId, draftRevision]
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: Replaying a committed request returns the same test.
        draftRevision: { type: integer, format: int64, minimum: 1 }
    ImportCommitResult:
      type: object
      additionalProperties: false
      required: [testId, import]
      properties:
        testId: { $ref: '#/components/schemas/Uuid' }
        import: { $ref: '#/components/schemas/WordImport' }
    ImportSourceRef:
      type: object
      additionalProperties: false
      required: [sourceId, blockId, start, end]
      description: Unicode code point range of one extracted source block.
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 128 }
        blockId: { type: string, minLength: 1, maxLength: 200 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        generatedLabel: { type: boolean }
    ImportOrigin:
      type: string
      enum: [source_explicit, inferred_structure, defaulted, teacher_entered]
    ImportFinding:
      type: object
      additionalProperties: false
      required: [id, code, severity, count, evidence]
      description: |
        One actionable observation. blocking must be fixed by an edit;
        review_required needs a teacher decision (an edit or an acknowledgement);
        informational needs nothing.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,99}$' }
        severity: { type: string, enum: [blocking, review_required, informational] }
        target: { type: string, maxLength: 128 }
        field: { type: string, maxLength: 200 }
        count: { type: integer, minimum: 1 }
        acknowledged: { type: boolean }
        evidence:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportKeyValue:
      type: object
      additionalProperties: false
      required: [value, evidence]
      properties:
        value: { type: string, maxLength: 10000 }
        evidence:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportDraftAnswer:
      type: object
      additionalProperties: false
      required: [state, optionIds, evidence]
      description: |
        unknown means the source has no key; it is never a set of false options.
        Choice keys are optionIds, a short answer's sample is text, fill-blank
        keys live on blanks. conflict keeps every source value in candidates.
      properties:
        state: { type: string, enum: [known, unknown, conflict] }
        optionIds:
          type: array
          maxItems: 26
          items: { type: string, maxLength: 64 }
        text: { type: string, maxLength: 10000 }
        evidence:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportSourceRef' }
        candidates:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ImportKeyValue' }
    ImportDraftOption:
      type: object
      additionalProperties: false
      required: [id, label, content]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 8 }
        content: { $ref: '#/components/schemas/ContentDocument' }
    ImportDraftBlank:
      type: object
      additionalProperties: false
      required: [gapId, accepted, caseSensitive]
      properties:
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        label: { type: string, maxLength: 32 }
        accepted:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        caseSensitive: { type: boolean }
    ImportFieldOrigins:
      type: object
      additionalProperties: false
      required: [type, prompt, options, answer, points]
      properties:
        type: { $ref: '#/components/schemas/ImportOrigin' }
        prompt: { $ref: '#/components/schemas/ImportOrigin' }
        options: { $ref: '#/components/schemas/ImportOrigin' }
        answer: { $ref: '#/components/schemas/ImportOrigin' }
        points: { $ref: '#/components/schemas/ImportOrigin' }
    ImportDraftQuestion:
      type: object
      additionalProperties: false
      required: [id, label, type, prompt, options, blanks, answer, points, origins, source]
      description: unsupported marks content no interaction can represent; it must be retyped or excluded.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, maxLength: 32 }
        task: { type: string, maxLength: 32 }
        type: { type: string, enum: [single_choice, multiple_choice, true_false, fill_blank, short_answer, unsupported] }
        prompt: { $ref: '#/components/schemas/ContentDocument' }
        options:
          type: array
          maxItems: 26
          items: { $ref: '#/components/schemas/ImportDraftOption' }
        blanks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ImportDraftBlank' }
        answer: { $ref: '#/components/schemas/ImportDraftAnswer' }
        points: { type: string, pattern: '^\d{1,6}(\.\d{1,2})?$' }
        excluded:
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
        origins: { $ref: '#/components/schemas/ImportFieldOrigins' }
        source:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportGapLink:
      type: object
      additionalProperties: false
      required: [gapId, questionId]
      description: Binds a passage gap to a choice question, or to one blank of a fill-blank question.
      properties:
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        questionId: { type: string, minLength: 1, maxLength: 64 }
        blankGapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
    ImportDraftGroup:
      type: object
      additionalProperties: false
      required: [id, gaps, questions, source]
      description: Questions sharing one passage; the passage gaps bind to members by stable IDs.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, maxLength: 32 }
        instructions: { type: string, maxLength: 2000 }
        stimulus: { $ref: '#/components/schemas/ContentDocument' }
        gaps:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportGapLink' }
        questions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportDraftQuestion' }
        source:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportDraftItem:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: Exactly one of question or group.
      properties:
        question: { $ref: '#/components/schemas/ImportDraftQuestion' }
        group: { $ref: '#/components/schemas/ImportDraftGroup' }
    ImportDraftSection:
      type: object
      additionalProperties: false
      required: [id, title, origin, items, source]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, maxLength: 2000 }
        origin: { $ref: '#/components/schemas/ImportOrigin' }
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ImportDraftItem' }
        source:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportDraft:
      type: object
      additionalProperties: false
      required: [version, title, sections, notices, acknowledged]
      description: The reviewable exam. Notices are source observations and are kept by the server; edits never change them.
      properties:
        version: { type: string, enum: [word-draft-v1] }
        title: { type: string, maxLength: 200 }
        sections:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ImportDraftSection' }
        notices:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/ImportFinding' }
        acknowledged:
          type: array
          maxItems: 2000
          items: { type: string, minLength: 1, maxLength: 64 }
    ImportReviewSummary:
      type: object
      additionalProperties: false
      required: [sections, groups, questions, included, excluded, totalPoints, answersKnown, answersMissing, answersConflicting, blocking, needsDecision]
      properties:
        sections: { type: integer, minimum: 0 }
        groups: { type: integer, minimum: 0 }
        questions: { type: integer, minimum: 0 }
        included: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
        totalPoints: { type: string }
        answersKnown: { type: integer, minimum: 0 }
        answersMissing: { type: integer, minimum: 0 }
        answersConflicting: { type: integer, minimum: 0 }
        blocking: { type: integer, minimum: 0 }
        needsDecision: { type: integer, minimum: 0 }
    ImportReview:
      type: object
      additionalProperties: false
      required: [importId, revision, draft, findings, summary, ready, reprocessed, updatedAt]
      description: |
        The draft with every current finding. ready is true only when nothing blocks
        and every review_required finding has a decision. reprocessed means a newer
        machine draft exists that has not replaced the teacher's edits.
      properties:
        importId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, format: int64, minimum: 1 }
        draft: { $ref: '#/components/schemas/ImportDraft' }
        findings:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/ImportFinding' }
        summary: { $ref: '#/components/schemas/ImportReviewSummary' }
        ready: { type: boolean }
        reprocessed: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SaveImportReview:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, sections, acknowledged]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        title: { type: string, maxLength: 200 }
        sections:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ImportDraftSection' }
        acknowledged:
          type: array
          maxItems: 2000
          items: { type: string, minLength: 1, maxLength: 64 }
    ImportSourceSpan:
      type: object
      additionalProperties: false
      required: [start, end, marks]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        marks:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ContentMark' }
        colored: { type: boolean }
    ImportSourceBlock:
      type: object
      additionalProperties: false
      required: [id, text, spans]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, maxLength: 400000 }
        spans:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/ImportSourceSpan' }
        tableId: { type: string, maxLength: 200 }
        row: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }
    ImportSourceView:
      type: object
      additionalProperties: false
      required: [sourceId, role, filename, blocks]
      description: The extracted main-body text of one source, in document order, for side-by-side review.
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 128 }
        role: { $ref: '#/components/schemas/ImportSourceRole' }
        filename: { type: string, minLength: 1, maxLength: 255 }
        blocks:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/ImportSourceBlock' }

    # ------------------------------------------------------------------ auth

    PermissionKey:
      type: string
      enum:
        - content.tests.write
        - content.tests.publish
        - content.questions.write
        - content.media.write
        - content.share
        - ai.use
        - teaching.classes.write
        - teaching.assignments.write
        - teaching.grading
        - teaching.attempts.intervene
        - teaching.attendance
        - people.students.read
        - people.students.create
        - people.students.reset_password
        - people.users.manage
        - people.roles.manage
        - system.audit.read
        - system.settings.write
        - learning.take_tests
        - ai.credits.manage
        - scope.all
        - system.api_reference
        - system.data_export
        - system.leads
      description: |
        The permission catalogue, in the order of the Roles & permissions
        matrix, and equal to the rows of `app.permissions`. Each key and the
        matrix row it is:

        - `content.tests.write`: Create and edit tests
        - `content.tests.publish`: Publish tests
        - `content.questions.write`: Manage question bank
        - `content.media.write`: Upload and delete media
        - `content.share`: Share own content with other teachers
        - `ai.use`: Use AI features
        - `teaching.classes.write`: Create classes
        - `teaching.assignments.write`: Assign tests to classes
        - `teaching.grading`: Grade answers
        - `teaching.attempts.intervene`: Reset, void or extend attempts
        - `teaching.attendance`: Take attendance
        - `people.students.read`: See students in own classes
        - `people.students.create`: Create student accounts
        - `people.students.reset_password`: Reset student passwords
        - `people.users.manage`: Add and disable users
        - `people.roles.manage`: Change roles
        - `system.audit.read`: View audit log
        - `system.settings.write`: Change system settings
        - `learning.take_tests`: Take tests and view own results
        - `ai.credits.manage`: Manage AI credits

        `ai.use` gates every `/teacher/ai/*` operation and the import's "Read
        with AI"; `ai.credits.manage` gates every `/admin/ai/*` operation. The
        Admin holds both, the built-in Teacher holds `ai.use`, and a custom role
        may hold either alone. `ai.credits.manage` opens the Admin console by
        itself (`workspace.admin`); `ai.use` opens no workspace.

        The last four keys in the enum are hidden: no matrix row shows them,
        no role is granted them, and only the Admin holds them. The Admin
        holds every key, and `learning.take_tests` only when that cell is
        turned on. `scope.all` reads and edits any teacher's content, classes
        and people by id, and widens the lists of classes, students and
        attempts and the dashboard's figures to every teacher's. It does not
        widen the teaching workspace's six content lists: `listTests`,
        `listQuestions`, `listQuestionGroups`, `listMedia`, `listWordImports`
        and `listAssignments`, with their facets, tags and counts, hold the
        caller's own rows for every caller (for assignments, those the caller
        created and those that target a class the caller teaches).

    RoleIcon:
      type: string
      enum: [shield, graduation-cap, hand-helping, user, key-round, crown, briefcase, book-open, users, clipboard-check, headset, star]
      description: The Edit role dialog's twelve icons; the same set `app.roles.icon` checks.

    RoleColor:
      type: string
      enum: [dark, lime, blue, green, amber, rose, gray]
      description: The Edit role dialog's seven card colours; the same set `app.roles.color` checks.

    BuiltinRoleKey:
      type: string
      enum: [admin, teacher, assistant, student]
      description: The immutable key of a built-in role. A custom role has none.

    RoleSummary:
      type: object
      required: [id, builtinKey, name, description, icon, color, custom, userCount, permissions, revision, editable, inProgressAttempts]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        builtinKey:
          oneOf:
            - { $ref: '#/components/schemas/BuiltinRoleKey' }
            - { type: 'null' }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        icon: { $ref: '#/components/schemas/RoleIcon' }
        color: { $ref: '#/components/schemas/RoleColor' }
        custom:
          type: boolean
          description: True when the role is not built in.
        userCount:
          type: integer
          minimum: 0
          description: Accounts that hold the role, disabled ones included.
        permissions:
          type: array
          uniqueItems: true
          maxItems: 64
          items: { $ref: '#/components/schemas/PermissionKey' }
          description: |
            What the role's users may do, in catalogue order, without the
            hidden keys: the matrix column. The Admin's is every matrix key
            except `learning.take_tests`, which it holds only when that cell
            is turned on.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Moves with every change to the role. Sent back as `expectedRevision` so a stale save is refused.
        editable:
          type: boolean
          description: |
            False where the subset rule stops the caller from acting on the
            role: it holds a permission the caller lacks, `learning.take_tests`
            apart. The caller's own role is editable here, but its permissions
            are never changed by its holder (`CANNOT_ACT_ON_SELF`).
        inProgressAttempts:
          type: integer
          minimum: 0
          description: Attempts in progress right now by users who hold the role.

    PermissionCatalogueEntry:
      type: object
      required: [key, group, adminLocked]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/PermissionKey' }
        group: { type: string, enum: [content, teaching, people, system] }
        adminLocked:
          type: boolean
          description: "True where the Admin's cell cannot be changed, which is every key but `learning.take_tests`."

    RoleList:
      type: object
      required: [roles, catalogue]
      additionalProperties: false
      properties:
        roles:
          type: array
          maxItems: 200
          description: Every role, in the order Admin, Teacher, Assistant, Student, then custom roles oldest first.
          items: { $ref: '#/components/schemas/RoleSummary' }
        catalogue:
          type: array
          maxItems: 64
          description: The matrix rows in order. The hidden keys are left out.
          items: { $ref: '#/components/schemas/PermissionCatalogueEntry' }

    AssignableRole:
      type: object
      required: [id, builtinKey, name, icon, color, studentTarget]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        builtinKey:
          oneOf:
            - { $ref: '#/components/schemas/BuiltinRoleKey' }
            - { type: 'null' }
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { $ref: '#/components/schemas/RoleIcon' }
        color: { $ref: '#/components/schemas/RoleColor' }
        studentTarget:
          type: boolean
          description: True for the built-in Student and any custom role whose permissions are a subset of `learning.take_tests`, so a custom role with no permission at all is a student target.

    RoleInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 240, description: At most 60 characters after Unicode NFC. }
        description: { type: string, maxLength: 1200, description: At most 300 characters after Unicode NFC. }
        copyFromRoleId:
          $ref: '#/components/schemas/Uuid'
          description: The role whose permissions the new role starts with. Omitted, it starts with none.

    RoleUpdate:
      type: object
      required: [expectedRevision]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 240, description: At most 60 characters after Unicode NFC. }
        description: { type: string, maxLength: 1200, description: At most 300 characters after Unicode NFC. }
        icon: { $ref: '#/components/schemas/RoleIcon' }
        color: { $ref: '#/components/schemas/RoleColor' }
        expectedRevision: { type: integer, format: int64, minimum: 1 }

    RolePermissionChange:
      type: object
      required: [roleId, key, granted]
      additionalProperties: false
      properties:
        roleId: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/PermissionKey' }
        granted: { type: boolean }

    RoleRevision:
      type: object
      required: [roleId, revision]
      additionalProperties: false
      properties:
        roleId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, format: int64, minimum: 1 }

    RolePermissionsInput:
      type: object
      required: [changes, expectedRevisions]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/RolePermissionChange' }
        expectedRevisions:
          type: array
          maxItems: 200
          description: The revision of every role a change touches, as the matrix last read it.
          items: { $ref: '#/components/schemas/RoleRevision' }

    RolePermissionsResult:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          maxItems: 200
          description: The roles the save touched, as they stand after it.
          items: { $ref: '#/components/schemas/RoleSummary' }

    AccountStatus:
      type: string
      enum: [disabled, must_change_password, never_signed_in, active]
      description: |
        The one state an account is listed under (DG-54), in this order of
        precedence: `disabled`, then `must_change_password` (a temporary
        password is still in use), then `never_signed_in` (`last_sign_in_at` is
        null), then `active`.

    User:
      type: object
      required: [id, email, fullName, hasPassword, linkedProviders, mustChangePassword, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri, maxLength: 2048 }
        hasPassword:
          type: boolean
          description: false for Google-only accounts. Gates the unlink affordance.
        linkedProviders:
          type: array
          items: { type: string, enum: [google] }
          maxItems: 1
        mustChangePassword:
          type: boolean
          description: Forces `/change-password`. Always false for Google-only users (§5.4).
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    UserPreferences:
      type: object
      description: Stored account preferences; omitted keys use client defaults without materializing them.
      additionalProperties: false
      properties:
        theme: { type: string, enum: [light, dark, system] }
        compactTables: { type: boolean }
        largerTestText: { type: boolean }
        workspace:
          type: string
          enum: [teacher, admin]
          description: |
            The console the user last switched to. A built-in Admin, who holds
            both, opens it after sign-in; omitted, the Admin console.
        assignmentDefaults:
          type: object
          additionalProperties: false
          properties:
            durationMinutes: { type: integer, minimum: 1, maximum: 600 }
            shuffleQuestions: { type: boolean }
            showScore: { type: boolean }
            blockCopyPaste: { type: boolean }
            requireFullscreen: { type: boolean }
        ai:
          type: object
          description: |
            The AI assistant's preferences. Like `assignmentDefaults`, the object
            is replaced whole by a merge, and an omitted key uses the client's
            default: the language of the interface, tags on, reading student
            answers on, reading imports off. The server reads
            `readStudentAnswers` before an operation sends a student's answer.
          additionalProperties: false
          properties:
            language: { $ref: '#/components/schemas/AiLanguage' }
            tagDrafts:
              type: boolean
              description: Tag what the assistant writes as an AI draft until a teacher edits or approves it.
            readStudentAnswers:
              type: boolean
              description: Let the assistant read student answers, for grading suggestions and results insights. Never a name.
            readImports:
              type: boolean
              description: Read scanned and unusual imports with the assistant.

    Workspace:
      type: string
      enum: [teacher, admin, app]
      description: |
        A console the signed-in user may enter: `teacher` for any `content.*`,
        `teaching.*` or `people.students.*` permission; `admin` for
        `people.users.manage`, `people.roles.manage`, `system.audit.read`,
        `system.settings.write` or `scope.all`; `app` for
        `learning.take_tests`.

    CurrentUserRole:
      type: object
      description: |
        The role the caller holds, on the caller's own document and nowhere
        else, so no payload about another person names a role. `name` is the
        stored name. A client shows a built-in role (`builtinKey` set) by its
        localised name while the stored name is still the seeded one, and the
        stored name otherwise, as the Roles screen does. Always sent by the
        server, and optional in the schema as `preferences` is. It is not the
        legacy `role` string of v0.9.x, which `User` still does not carry.
      required: [id, builtinKey, name]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        builtinKey:
          oneOf:
            - { $ref: '#/components/schemas/BuiltinRoleKey' }
            - { type: 'null' }
        name: { type: string, minLength: 1, maxLength: 60 }

    CurrentUser:
      type: object
      description: |
        The signed-in user, as only the user sees it: `User`'s properties plus
        the user's own role, the permissions it holds, in catalogue order, and
        the workspaces they open. Written flat, because a closed schema cannot be
        extended with `allOf` (issue #41). `User` stays where a response
        describes someone else, so a student's permissions never reach a
        teacher's payload.
      required: [id, email, fullName, hasPassword, linkedProviders, mustChangePassword, createdAt, permissions, workspaces]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The caller's profile photo as a presigned `GET`, valid 24 hours and
            minted again on every response that carries it. Absent when the
            caller has no photo. Set and cleared by `setAvatar` and
            `deleteAvatar`.
        phone: { type: string, pattern: '^[0-9+ ]{6,20}$' }
        locale: { type: string, enum: [vi, en] }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        preferences: { $ref: '#/components/schemas/UserPreferences' }
        hasPassword:
          type: boolean
          description: false for Google-only accounts. Gates the unlink affordance.
        linkedProviders:
          type: array
          items: { type: string, enum: [google] }
          maxItems: 1
        mustChangePassword:
          type: boolean
          description: Forces `/change-password`. Always false for Google-only users (§5.4).
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        passwordChangedAt:
          type: string
          format: date-time
          description: |
            When the caller last changed their own password. Absent for an
            account that never has, including one still on a temporary password
            and one whose password is older than R5. Self only: it is on
            `CurrentUser` and not on `User` or `StudentRow`.
        role: { $ref: '#/components/schemas/CurrentUserRole' }
        permissions:
          type: array
          uniqueItems: true
          maxItems: 64
          items: { $ref: '#/components/schemas/PermissionKey' }
        workspaces:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { $ref: '#/components/schemas/Workspace' }



    GoogleSignInSuccess:
      type: object
      description: |
        AuthSuccess plus the class a join code enrolled the student in.

        Flat rather than `allOf: [AuthSuccess, ...]`: AuthSuccess is
        `additionalProperties: false`, and in JSON Schema 2020-12 that keyword
        cannot see a sibling allOf branch, so the composed form rejects the very
        body it documents (issue #41).
      required: [accessToken, expiresIn, user]
      additionalProperties: false
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds. }
        user: { $ref: '#/components/schemas/CurrentUser' }
        enrolledClass:
          description: Present only when a `joinCode` produced an enrolment.
          oneOf: [{ $ref: '#/components/schemas/Class' }, { type: 'null' }]

    PublishConflict:
      type: object
      description: |
        The publish 409: the error envelope plus every blocking violation, so the
        builder marks them all inline rather than surfacing one per attempt (§8).
        Flat for the same reason as GoogleSignInSuccess.
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
        violations:
          type: array
          items: { $ref: '#/components/schemas/PublishValidationError' }

    GradingQueue:
      type: object
      additionalProperties: false
      required: [groups, items, answersRemaining, studentsWaiting]
      description: Complete filtered pending counts with a deterministic prefix of at most 200 saved answers.
      properties:
        groups:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GradingQueueGroup' }
          description: Only groups represented in items, in queue order; remaining counts each group's complete filtered work.
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GradingQueueItem' }
        answersRemaining: { type: integer, minimum: 0 }
        studentsWaiting: { type: integer, minimum: 0, description: Distinct student UUIDs across all filtered eligible answers. }

    GradingQueueGroup:
      type: object
      additionalProperties: false
      required: [key, kind, label, sub, remaining]
      properties:
        key:
          type: string
          minLength: 36
          maxLength: 73
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$'
          description: Canonical lowercase student UUID, or assignmentUUID:versionQuestionUUID in question mode.
        kind: { type: string, enum: [student, question] }
        label: { type: string, description: Raw current student full name or decimal paper question number for client localization. }
        sub: { type: string, description: Live assignment title of this group's first returned item. }
        remaining: { type: integer, minimum: 1, description: Complete filtered eligible answer count; may exceed the returned prefix for this group. }

    GradingQueueItem:
      type: object
      additionalProperties: false
      required: [attemptId, questionId, assignmentId, assignmentTitle, studentId, studentName, questionNumber, type, prompt, answer, points, score, comment]
      description: One saved pending-manual answer and its frozen teacher question; identity is attemptId plus questionId.
      properties:
        attemptId: { $ref: '#/components/schemas/Uuid' }
        questionId: { $ref: '#/components/schemas/Uuid' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        assignmentTitle: { type: string }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string, description: "Raw current full name, without private account fields." }
        questionNumber: { type: integer, minimum: 1, description: "One-based section/question paper order, independent of the student's shuffle." }
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string, minLength: 1 }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        answer: { $ref: '#/components/schemas/Answer' }
        points: { $ref: '#/components/schemas/Points' }
        score: { type: [number, 'null'], format: double, minimum: 0, description: Manual score; null while this answer remains in the pending queue. }
        comment: { type: [string, 'null'] }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
        transcript: { type: [string, 'null'] }
        options: { type: array, items: { $ref: '#/components/schemas/AdminQuestionOption' } }
        blanks: { type: array, items: { $ref: '#/components/schemas/AdminQuestionBlank' } }
        explanation: { type: [string, 'null'] }
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        sampleAnswer: { type: [string, 'null'] }
        sharedContext: { $ref: '#/components/schemas/SharedReviewContext' }

    QuestionAnswerRow:
      type: object
      description: One paper's answer to the question G-04 is grading.
      required: [attemptId, studentId, studentName, attemptNo, answer, manualScore, graderComment]
      additionalProperties: false
      properties:
        attemptId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        attemptNo: { type: integer, minimum: 1 }
        answer:
          oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }]
          description: Null when the student left it blank, or when it was removed under the retention policy; neither can be marked.
        answerRemoved:
          type: boolean
          description: Present and true when the answer was removed under the retention policy.
        manualScore: { oneOf: [{ $ref: '#/components/schemas/Points' }, { type: 'null' }] }
        graderComment: { type: [string, 'null'] }

    ReferencingTest:
      type: object
      description: |
        A test that holds a reference the caller asked to remove, named so a
        blocked delete can say where to look instead of only that it is
        blocked (A-06a, A-07).
      required: [id, title]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        version:
          type: integer
          minimum: 1
          description: |
            The published version holding the reference. Absent when the
            reference is a draft outline, which has no version yet.

    ReferencingGroup:
      type: object
      description: Teacher-only shared context that protects an immutable media asset, including archived bank groups.
      additionalProperties: false
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        testId:
          type: [string, 'null']
          format: uuid
          description: Owning test, absent for an independent bank group.

    ReferencedBy:
      type: string
      description: |
        What still references a row whose permanent delete answered
        `RESOURCE_REFERENCED`, carried as `details.referencedBy` by
        `deleteClass` and `deleteUser`. `other` is a reference the server does
        not name. Later releases add values; a client treats an unknown one as
        `other`.
      enum: [assignments, attempts, audit, members, owned_content, other]

    MediaReplacementCounts:
      type: object
      additionalProperties: false
      required: [questions, groups]
      properties:
        questions: { type: integer, minimum: 0 }
        groups: { type: integer, minimum: 0 }
    MediaReplacement:
      type: object
      additionalProperties: false
      required: [asset, repointed, left]
      properties:
        asset: { $ref: '#/components/schemas/LibraryAsset' }
        previous:
          $ref: '#/components/schemas/MediaRetirement'
          description: |
            The old file, which has left the library, and what keeps it in
            storage. A server always sends it; a client reads its absence as a
            server from before files were kept for the tests that use them.
        repointed:
          $ref: '#/components/schemas/MediaReplacementCounts'
          description: Distinct live question rows and groups actually changed; question rows differ from LibraryAsset.questionCount's derived usage.
        left:
          $ref: '#/components/schemas/MediaReplacementCounts'
          description: Other owners' live question rows and groups still using the old asset; excludes versions, import reviews and late same-owner bindings.
    MediaRetirement:
      type: object
      description: |
        A file that has left the library, because `replaceMedia` replaced it or
        `deleteMedia` deleted it, and what keeps it in storage. The file stays
        readable for as long as anything uses it, and in its owner's quota
        (`MediaUsage.heldBytes`). Seven days after nothing uses it, it is
        removed from storage for good and cannot be restored, so `url` is the
        teacher's chance to download it.
      additionalProperties: false
      required: [id, bytes, url, usedIn, deleteAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        bytes: { type: integer, format: int64, minimum: 1 }
        url: { type: string, description: Short-lived signed URL of the old file (§11.2). }
        usedIn:
          type: array
          items: { $ref: '#/components/schemas/ReferencingTest' }
          description: |
            The published test versions that still use the file, one entry per
            version, as `LibraryAsset.usedIn` lists them; a client counts the
            distinct test `id`s for "used by N published tests". Always empty
            after `deleteMedia`, which refuses a file a version uses.
        deleteAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the file is removed from storage, if nothing uses it now: seven
            days from now. `null` while a published version, or content of
            another owner, still uses it; the removal is then seven days after
            the last of them stops, and that time is not known yet.
    LibraryAsset:
      type: object
      description: |
        A MediaAsset as the teacher's media library lists it: with the name the
        library shows, its default play limit, an image's size in pixels, how
        many questions use the file and how many published versions reference
        it. Flat for the same reason (issue #41) -- this is
        the site that was actually shipping a body its own contract rejected.
      required:
        [id, kind, url, mimeType, bytes, originalFilename, createdAt,
         displayName, defaultMaxPlays, width, height, questionCount]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [image, audio] }
        url: { type: string, description: Short-lived signed URL (§11.2). }
        # The same closed set as MediaAsset: flattening must not quietly widen
        # what the server may claim it stored.
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/aac, image/png, image/jpeg, image/webp]
        bytes: { type: integer, minimum: 0 }
        durationMs: { type: [integer, 'null'], description: Audio only. }
        originalFilename: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The name the library shows: the one `updateMedia` stored, or
            `originalFilename` while none was set.
        defaultMaxPlays:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
          description: |
            The default play limit stored with this audio, for a client to
            start a question's own limit from when it attaches the file; the
            server applies it to nothing. `0` is unlimited and `null` is not
            set. Always `null` for an image.
        width:
          type: [integer, 'null']
          minimum: 1
          description: |
            An image's width in pixels. `null` for audio, and for an image
            whose header could not be read; `width` and `height` are `null`
            together.
        height:
          type: [integer, 'null']
          minimum: 1
          description: An image's height in pixels; `null` exactly when `width` is.
        questionCount:
          type: integer
          minimum: 0
          description: |
            How many questions use the file, each counted once: a question
            that is not deleted and attaches it, and every member that is not
            deleted of a question group whose recordings or materials hold it.
            Any owner's questions count. A published version, and a group with
            no member, add nothing here; `usageCount` counts versions.
        usageCount:
          type: integer
          description: Published-version references. Non-zero blocks delete (§8).
        usedIn:
          type: array
          items: { $ref: '#/components/schemas/ReferencingTest' }
          description: |
            The published tests behind `usageCount`, one entry per version,
            so the blocked-delete dialog can name them (A-07).

    MediaFacets:
      type: object
      description: |
        How many files of the caller's library each tab holds for the CURRENT
        search, ignoring the `kind` and `unused` filters themselves, so that
        choosing a tab does not zero the others. `unused` counts the files
        whose `questionCount` is zero.
      required: [all, audio, image, unused]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        audio: { type: integer, minimum: 0 }
        image: { type: integer, minimum: 0 }
        unused: { type: integer, minimum: 0 }

    MediaUsage:
      type: object
      description: |
        What the caller's library holds, beside the quota an upload is
        measured against. `audioBytes` and `imageBytes` are the files in the
        library, whatever the search and the filters.

        A file that was replaced or deleted leaves those two figures but not
        the quota while anything still uses it: a published test version, or
        content of another owner. `heldBytes` is those files, and the quota
        check counts `audioBytes + imageBytes + heldBytes`.

        Seven days after nothing uses a replaced or deleted file it is removed
        from storage for good. `pendingBytes` is the files waiting for that and
        `pendingDeleteAt` the earliest time one of them goes. They count toward
        neither the quota nor the figures above; they are for information.

        A server always sends `heldBytes`, `pendingBytes` and `pendingDeleteAt`.
        They are not required so that a client built for this contract still
        reads a server from before files were kept for the tests that use them,
        where a missing figure means none held and none pending.
      required: [audioBytes, imageBytes, quotaBytes]
      additionalProperties: false
      properties:
        audioBytes: { type: integer, format: int64, minimum: 0 }
        imageBytes: { type: integer, format: int64, minimum: 0 }
        quotaBytes:
          type: integer
          format: int64
          minimum: 1
          description: The most one owner's library may hold, as the deployment sets it.
        heldBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Replaced or deleted files that published test versions, or content
            of another owner, still use. They count toward the quota until
            nothing uses them.
        pendingBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Replaced or deleted files that nothing uses any more and that wait
            seven days for removal. They do not count toward the quota.
        pendingDeleteAt:
          type: [string, 'null']
          format: date-time
          description: |
            The earliest time one of the files in `pendingBytes` is removed
            from storage; `null` or absent when none waits.

    MediaUpdate:
      type: object
      description: |
        What `updateMedia` changes. A property left out keeps its stored
        value.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed by the server; a name that is blank once trimmed is refused.
        defaultMaxPlays:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
          description: |
            `0` is unlimited and `null` clears the limit. A number is refused
            for an image.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true

    StudentAssignmentDetail:
      type: object
      description: |
        The intro screen's card: what StudentAssignmentCard carries, without
        `classId`, `classIds` and `liveAnsweredCount`, plus the policies §10.2 states in
        plain Vietnamese before the student starts. The window it states is the
        student's own, as in StudentAssignmentCard.
      required:
        [id, testTitle, status, opensAt, closesAt, durationMinutes,
         attemptsUsed, maxAttempts, questionCount, totalPoints, review,
         integrity, hasAudio, showsTranscript]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testTitle: { type: string }
        className: { type: [string, 'null'], description: See StudentAssignmentCard. }
        teacherName:
          type: [string, 'null']
          description: The assignment's author.
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        opensAt: { $ref: '#/components/schemas/Timestamp' }
        closesAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer, minimum: 1 }
        questionCount: { type: integer, minimum: 0 }
        totalPoints: { $ref: '#/components/schemas/Points' }
        attemptsUsed: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        hasLiveAttempt: { type: boolean }
        liveDeadlineAt: { type: [string, 'null'], format: date-time }
        lastAttemptId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lastSubmittedAt: { type: [string, 'null'], format: date-time }
        score: { oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }] }
        review:
          $ref: '#/components/schemas/ReviewPolicy'
          description: |
            On the intro's detail these are the stored flags, and `release` says
            when they apply; they become effective only on the student's result.
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }
        studentNote:
          type: [string, 'null']
          description: The teacher's note for the students, plain text. Null or absent when there is none.
        hasAudio:
          type: boolean
          description: Any question audio or shared recording on the assigned frozen version.
        hasSharedAudio:
          type: boolean
          description: A shared recording has one allowance across its group's questions; absent means false for legacy readers.
        showsTranscript:
          type: boolean
          description: True when any question audio or shared recording releases its transcript after submitting.
        audioMaxPlays:
          type: [integer, 'null']
          description: The strictest finite `maxPlays` across question audio and shared recordings on the assigned version; null when all are unlimited. Individual recordings can have higher limits.

    StudentClass:
      type: object
      description: A class the student is in, with how they got there (§6.4's D-10).
      required: [id, name, joinedVia, joinedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        joinedVia:
          type: string
          enum: [admin, join_code]
        joinedAt: { $ref: '#/components/schemas/Timestamp' }

    StudentActivity:
      type: object
      description: |
        Backs G-07's "Hoạt động" column, which has three renderings and needs
        two facts to pick between them: "đang làm bài" while an attempt is live,
        a relative time when there is a last one, and an em dash when the student
        has never started anything.

        `live` is not `lastAttemptAt is recent`. Nothing in this system flips an
        attempt when its deadline passes -- assignment status is derived for
        exactly that reason (D-18) -- so a stale in-progress row would read as
        "đang làm bài" forever. The server ANDs the status with `deadline_at`.
      required: [live]
      additionalProperties: false
      properties:
        live: { type: boolean, description: An attempt is in progress and inside its deadline. }
        lastAttemptAt: { type: [string, 'null'], format: date-time }

    StudentStats:
      type: object
      description: |
        Per-student teaching figures for §8's students table (G-07) and the class
        roster (G-06), over only the assignments the caller reaches: those they
        created and those targeting a class they teach, or every one with
        `scope.all`.

        Deliberately NOT on `User`. `User` is the `/auth/me`, `/auth/login` and
        `/auth/refresh` payload, so a field added there is shipped to the student
        about themselves on every cold load and every token refresh. §13.5's
        student-projection guard would not catch it either -- it sweeps `/app/*`
        and `/auth/me` is not one.
      required: [submittedCount, flaggedCount, activity]
      additionalProperties: false
      properties:
        submittedCount:
          type: integer
          minimum: 0
          description: |
            Distinct ASSIGNMENTS with at least one attempt that reached the
            teacher, not attempts. With `maxAttempts > 1` the two differ, and
            counting attempts would print "14" beside an average taken over 7
            things.
        score:
          description: |
            Weighted: the sum of earned points over the sum of available points,
            across each assignment's best graded attempt. Sent as the pair rather
            than a percentage because every other score in this contract is an
            (earned, total) pair, and the client can render either reading.

            Null when nothing is graded yet, which is G-07's "—". An unsubmitted
            assignment is never a zero: "chưa nộp" and "—" are different facts,
            and collapsing them is how a gradebook lies.
          oneOf:
            - $ref: '#/components/schemas/AttemptScore'
            - type: 'null'
        flaggedCount: { type: integer, minimum: 0 }
        activity: { $ref: '#/components/schemas/StudentActivity' }

    StudentRow:
      type: object
      description: |
        One row of §8's students table. Flat rather than `allOf: [User, ...]`:
        `User` is `additionalProperties: false`, and in JSON Schema 2020-12 that
        keyword cannot see a sibling `allOf` branch, so the composed form
        rejects the very body it documents (see issue #41).
      required:
        [id, email, fullName, hasPassword, linkedProviders, mustChangePassword,
         createdAt, disabledAt, lastActiveAt, accountStatus, classes, stats]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        hasPassword: { type: boolean }
        linkedProviders:
          type: array
          items: { type: string, enum: [google] }
          maxItems: 1
        mustChangePassword: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        disabledAt:
          type: [string, 'null']
          format: date-time
          description: |
            Set means the account cannot sign in. Present on the row because
            `updateStudent` accepts `disabled: false` in both directions, and a
            state that can be written but never read is a one-way door: the
            student would vanish from every listing with nothing able to name
            them again.
        lastActiveAt:
          type: [string, 'null']
          format: date-time
          description: |
            The student's latest authenticated request, which the server records
            at most once every five minutes per instance (DG-54). Null before
            the student has ever been active. Not the same as
            `stats.activity.lastAttemptAt`, the last time they started a test.
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/StudentClass' }
          description: Memberships in classes the caller teaches, or every one with `scope.all`. The table truncates; the drawer lists them.
        stats: { $ref: '#/components/schemas/StudentStats' }

    AdminUserRole:
      type: object
      description: The role an account holds, as the Users table draws it.
      required: [id, name, builtinKey, icon, color]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 60 }
        builtinKey:
          oneOf:
            - { $ref: '#/components/schemas/BuiltinRoleKey' }
            - { type: 'null' }
        icon: { $ref: '#/components/schemas/RoleIcon' }
        color: { $ref: '#/components/schemas/RoleColor' }

    AdminUserRow:
      type: object
      description: |
        One account as the Admin console's Users table lists it, whatever its
        role. Flat, as `StudentRow` is, for the same reason (issue #41).
      required: [id, fullName, email, avatarUrl, role, signIn, classes, lastActiveAt, status, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        avatarUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: A signed link to the account's photo, null when it has none or this server stores none.
        role: { $ref: '#/components/schemas/AdminUserRole' }
        signIn:
          type: object
          description: The ways the account can sign in with, as it stands; the centre's policy may have turned one off.
          required: [password, google]
          additionalProperties: false
          properties:
            password: { type: boolean, description: True when the account has a password. }
            google: { type: boolean, description: True when a Google identity is linked. }
        classes:
          type: object
          description: |
            The classes that are not archived: for a student target, those the
            account is a member of; for any other account, those it teaches.
          required: [count, firstName]
          additionalProperties: false
          properties:
            count: { type: integer, minimum: 0 }
            firstName:
              type: [string, 'null']
              maxLength: 120
              description: The name of the class the account joined first (a student target) or was given first (anyone else), null when `count` is 0.
        lastActiveAt:
          type: [string, 'null']
          format: date-time
          description: The account's latest authenticated request (DG-54), null before it has ever been active.
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    AdminUserTab:
      type: string
      enum: [all, teachers, students, admins, disabled]
      description: |
        The Users table's tabs. `admins` are the built-in Admin role; `students`
        are the student targets (a role holding at most `learning.take_tests`,
        so an Admin who also takes tests is never one); `teachers` are everyone
        else, the Assistant and every custom role with a permission included.
        These three include disabled accounts, as the tabs' counts do;
        `disabled` is every disabled account, whatever its role.

    AdminUserFacets:
      type: object
      description: |
        The tabs' counts. They follow `q`, `email` and `status` but not `tab`,
        so each tab shows what it would list.
      required: [all, teachers, students, admins, disabled]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        teachers: { type: integer, minimum: 0 }
        students: { type: integer, minimum: 0 }
        admins: { type: integer, minimum: 0 }
        disabled: { type: integer, minimum: 0 }

    AdminUserClass:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 120 }

    AdminUserActivity:
      type: object
      description: |
        One line of the sheet's recent activity. `detail` is the sign-in method
        (`password`, `google` or `set_password_link`) for `sign_in`; the audit
        action key (`audit.action.*`) for `audit`; the test's title for
        `submission`; the class's name for `class_joined`. It is null when the
        subject has since been removed.
      required: [kind, at, detail]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [sign_in, audit, submission, class_joined] }
        at: { $ref: '#/components/schemas/Timestamp' }
        detail: { type: [string, 'null'], maxLength: 200 }

    AdminUserCan:
      type: object
      description: |
        What the caller may do to this account, each answer the server's own
        guards give: the subset rule (`TARGET_ROLE_NOT_ALLOWED`), not oneself,
        and the last active Admin. A `false` here is what the operation would
        refuse, so the sheet hides the action rather than offer a button that
        fails.
      required: [changeRole, resetPassword, disable, enable, signOut, transfer]
      additionalProperties: false
      properties:
        changeRole: { type: boolean, description: "Needs `people.roles.manage`; not oneself; not the last active Admin." }
        resetPassword: { type: boolean, description: "Not oneself, and the account is not disabled." }
        disable: { type: boolean, description: "Not oneself, not the last active Admin, and not already disabled." }
        enable: { type: boolean, description: The account is disabled. }
        signOut: { type: boolean, description: Signing oneself out everywhere is allowed. }
        transfer: { type: boolean, description: "Needs `scope.all`, and the account must be disabled." }

    AdminUserDetail:
      type: object
      description: One account for the Users sheet.
      required: [user, createdBy, classes, ownedContent, inProgressAttempts, activity, can]
      additionalProperties: false
      properties:
        user: { $ref: '#/components/schemas/AdminUserRow' }
        createdBy:
          description: Who created the account, null for one that signed itself up or whose creator is gone.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, fullName]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                fullName: { type: string, maxLength: 200 }
        classes:
          type: array
          maxItems: 20
          description: The first 20 of `user.classes.count`, in the order `firstName` is drawn from.
          items: { $ref: '#/components/schemas/AdminUserClass' }
        ownedContent:
          type: object
          description: |
            What `transferUserContent` would move: every class the account
            teaches (archived ones too) and every test, question, media asset
            and assignment it owns that has not been deleted.
          required: [classes, tests, questions, media, assignments]
          additionalProperties: false
          properties:
            classes: { type: integer, minimum: 0 }
            tests: { type: integer, minimum: 0 }
            questions: { type: integer, minimum: 0 }
            media: { type: integer, minimum: 0 }
            assignments: { type: integer, minimum: 0 }
        inProgressAttempts: { type: integer, minimum: 0, description: Tests the account is taking right now. }
        activity:
          type: array
          maxItems: 8
          description: Newest first.
          items: { $ref: '#/components/schemas/AdminUserActivity' }
        can: { $ref: '#/components/schemas/AdminUserCan' }

    UserCreate:
      type: object
      required: [fullName, email, roleId, delivery]
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        roleId:
          $ref: '#/components/schemas/Uuid'
          description: A role from `listAssignableRoles`.
        classId:
          $ref: '#/components/schemas/Uuid'
          description: A class to add the account to. Allowed only for a student-target role and only to a caller holding `scope.all`.
        delivery:
          type: string
          enum: [email_link, temporary_password]
          description: |
            `email_link` creates the account without a password and emails it a
            link to choose one (24 hours, once). `temporary_password` returns a
            temporary password once, for the admin to hand over.

    UserResetDelivery:
      type: string
      enum: [email_link, temporary_password]
      description: |
        `email_link` clears the password and emails a link to choose a new one
        (24 hours, once). `temporary_password` sets a temporary password and
        returns it once, for the admin to hand over.

    UserPasswordReset:
      type: object
      description: One account `resetUsersPasswords` reset. A temporary password is shown once.
      required: [userId, fullName, email]
      additionalProperties: false
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        temporaryPassword:
          type: string
          description: "Present only for `delivery: temporary_password`."

    UserActionFailure:
      type: object
      description: One account a bulk action did not reach, and why.
      required: [userId, code]
      additionalProperties: false
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: One of `NOT_FOUND`, `TARGET_ROLE_NOT_ALLOWED`, `CANNOT_ACT_ON_SELF`, `LAST_ADMIN`, `ACCOUNT_DISABLED`, `STALE_WRITE` or `INTERNAL`.

    UserContentTransfer:
      type: object
      required: [toUserId]
      additionalProperties: false
      properties:
        toUserId: { $ref: '#/components/schemas/Uuid' }
        notify:
          type: boolean
          default: false
          description: Tell the recipient in their bell.

    UserContentTransferResult:
      type: object
      required: [moved, leftBehind]
      additionalProperties: false
      properties:
        moved:
          type: object
          description: |
            What changed owner, counted as `ownedContent` counts it: every
            class, and every test, question, question group and media asset
            not deleted, and every assignment. Deleted rows move too, uncounted.
          required: [classes, tests, questions, questionGroups, media, assignments]
          additionalProperties: false
          properties:
            classes: { type: integer, minimum: 0 }
            tests: { type: integer, minimum: 0 }
            questions: { type: integer, minimum: 0 }
            questionGroups: { type: integer, minimum: 0 }
            media: { type: integer, minimum: 0 }
            assignments: { type: integer, minimum: 0 }
        leftBehind:
          type: object
          required: [imports, students]
          additionalProperties: false
          properties:
            imports: { type: integer, minimum: 0, description: "The account's Word imports that are not finished, which stay with it." }
            students:
              type: integer
              minimum: 0
              description: |
                Student accounts the account created that the recipient still
                does not reach after the move: in none of the moved classes and
                on none of the moved assignments, disabled and anonymised ones
                included, counted as the transfer commits. Who created an account
                does not change, so only an Admin reaches them until one adds them
                to a class.

    UserImportDefaultRole:
      type: string
      enum: [student, teacher]
      description: The role of a row whose file names none.

    UserImportDelivery:
      type: string
      enum: [email_link, sheet]
      description: |
        `email_link` emails each new account a link to choose a password (24
        hours, once). `sheet` gives each a temporary password and collects them
        in a sheet the importer downloads once.

    UserImportField:
      type: string
      enum: [full_name, email, role, class]

    UserImportIssue:
      type: object
      description: |
        One cell the import refused. `row` is the line of the file the row sits
        on, counting the header as line 1, which is the number a spreadsheet
        shows beside it. `code` says why: `REQUIRED` (empty), `TOO_LONG`,
        `INVALID` (not an address, or a name with control characters),
        `FORMULA_LIKE` (an address that starts with a character a spreadsheet
        reads as a formula, such as `+` or `=`, which the hand-out sheet could not
        carry as the address that signs in),
        `DUPLICATE_IN_FILE` (an address an earlier row has), `UNKNOWN_ROLE` and
        `AMBIGUOUS_ROLE` (no role, or more than one, answers to the name),
        `ROLE_NOT_ALLOWED` (the role holds a permission the importer lacks),
        `ROLE_NOT_GIVABLE` (the Assistant, which no one is given), `UNKNOWN_CLASS` and
        `AMBIGUOUS_CLASS` (no active class, or more than one, has the name), and
        `CLASS_NOT_ALLOWED` (a class for a role that is not a student target, or
        by an importer without `scope.all`), and `OVER_SEAT_LIMIT` (on `email`) and
        `OVER_TEACHER_LIMIT` (on `role`): a new account past a limit an Admin set on
        Plan & usage, counted in the file's order. A refusal carries no text of the file.
      additionalProperties: false
      required: [row, field, code]
      properties:
        row: { type: integer, minimum: 1 }
        field: { $ref: '#/components/schemas/UserImportField' }
        code:
          type: string
          enum:
            - REQUIRED
            - TOO_LONG
            - INVALID
            - FORMULA_LIKE
            - DUPLICATE_IN_FILE
            - UNKNOWN_ROLE
            - AMBIGUOUS_ROLE
            - ROLE_NOT_ALLOWED
            - ROLE_NOT_GIVABLE
            - UNKNOWN_CLASS
            - AMBIGUOUS_CLASS
            - CLASS_NOT_ALLOWED
            - OVER_SEAT_LIMIT
            - OVER_TEACHER_LIMIT

    UserImportPreview:
      type: object
      description: |
        What a file would come to. `rows` are the data rows it holds;
        `newAccounts` would be created and `existingEmails.count` already
        belong to an account and would be skipped, never changed (`sample` names
        up to five of them). `invalid` lists up to 50 refused cells and
        `invalidCount` counts every refused row. `classes` are the classes the
        accepted rows would join. `emailBudget` is `null` unless `delivery` is
        `email_link`: `remainingToday` is what the centre can still send today,
        counting what already waits, and `limit` its daily maximum; the rest of
        the links go out on the following days.
      additionalProperties: false
      required: [rows, newAccounts, existingEmails, invalid, invalidCount, classes, emailBudget]
      properties:
        rows: { type: integer, minimum: 0, maximum: 2000 }
        newAccounts: { type: integer, minimum: 0, maximum: 2000 }
        existingEmails:
          type: object
          additionalProperties: false
          required: [count, sample]
          properties:
            count: { type: integer, minimum: 0, maximum: 2000 }
            sample:
              type: array
              maxItems: 5
              items: { type: string, format: email }
        invalid:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/UserImportIssue' }
        invalidCount: { type: integer, minimum: 0, maximum: 2000 }
        classes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
        emailBudget:
          type: [object, 'null']
          additionalProperties: false
          required: [remainingToday, limit]
          properties:
            remainingToday: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1 }

    UserImportJob:
      type: object
      description: |
        One import. `status` is `queued` until the worker claims it, `running`
        while it creates the accounts, `done` once every stored row is settled,
        and `failed` when it gave up (`errorCode` says why, a short code that
        never carries the file). `total` is the rows stored, those that passed
        every rule; `processed` is those settled so far, `created` + `skipped` +
        `overLimit`; `skipped` are the addresses that already belonged to an
        account, and `overLimit` the new accounts not created because the
        centre reached a seat or teacher limit while the job ran.
        `invalid` counts the rows refused, which are not stored. `sheet` is `null`
        unless `delivery` is `sheet`: `available` is true from `done` until the
        sheet is downloaded or 24 hours have passed, whichever comes first.
      additionalProperties: false
      required: [id, status, total, processed, created, skipped, overLimit, invalid, delivery, sheet, errorCode, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, done, failed] }
        total: { type: integer, minimum: 1, maximum: 2000 }
        processed: { type: integer, minimum: 0, maximum: 2000 }
        created: { type: integer, minimum: 0, maximum: 2000 }
        skipped: { type: integer, minimum: 0, maximum: 2000 }
        overLimit: { type: integer, minimum: 0, maximum: 2000 }
        invalid: { type: integer, minimum: 0, maximum: 2000 }
        delivery: { $ref: '#/components/schemas/UserImportDelivery' }
        sheet:
          type: [object, 'null']
          additionalProperties: false
          required: [available, expiresAt, downloadedAt]
          properties:
            available: { type: boolean }
            expiresAt: { type: [string, 'null'], format: date-time }
            downloadedAt: { type: [string, 'null'], format: date-time }
        errorCode:
          type: [string, 'null']
          maxLength: 64
          description: |
            Why a `failed` job gave up, and `null` otherwise: `IMPORTER_NOT_ALLOWED`
            (the importer's account is disabled, or lost the permission or a role
            the file names), `DELIVERY_UNAVAILABLE` (password sign-in was turned
            off, or the server can no longer seal, before a sheet job finished)
            or `WORKER_INTERRUPTED` (the worker claimed the job three times and
            none finished it). The accounts created before the job failed stay.
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    StudentPasswordReset:
      type: object
      description: One student `resetStudentsPasswords` reset. The password is shown once.
      required: [studentId, fullName, email, temporaryPassword]
      additionalProperties: false
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        temporaryPassword: { type: string }

    StudentResetFailure:
      type: object
      description: One student `resetStudentsPasswords` did not reset, and why.
      required: [studentId, code]
      additionalProperties: false
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: One of `NOT_FOUND`, `FORBIDDEN`, `STUDENT_SHARED` or `INTERNAL`.

    StudentFacets:
      type: object
      description: |
        G-07's "31 học viên · 23 hoạt động 7 ngày qua". Counts a page
        cannot express, in the same shape as TestStatusFacets. Both count only
        the students the caller reaches, and `activeLast7Days` only work on
        assignments the caller reaches.

        `active` reuses the dashboard's window verbatim rather than defining a
        second meaning of active on a second screen.
      required: [total, activeLast7Days]
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 0 }
        activeLast7Days: { type: integer, minimum: 0 }

    AuthSuccess:
      type: object
      required: [accessToken, expiresIn, user]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: Held in memory only (§5.2). The refresh token is set as a cookie, not returned here.
        expiresIn: { type: integer, description: Seconds. }
        user: { $ref: '#/components/schemas/CurrentUser' }

    SetPasswordLinkInfo:
      type: object
      description: |
        What a valid set-password link is for: the account it controls, which
        the page names so a person can tell the link is theirs, and when it
        stops working. The email and the name are the account's own, given to
        whoever already holds the secret that controls it.
      required: [email, fullName, purpose, expiresAt]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        fullName: { type: string }
        purpose:
          type: string
          enum: [invite, reset]
          description: '`invite` for a new account''s first password, `reset` for a new one.'
        expiresAt: { type: string, format: date-time }

    Session:
      type: object
      description: |
        One sign-in of the caller that is still live: a refresh-token family
        that is neither revoked nor expired (§5.2). It is the caller's own and
        nobody else's. It carries no IP address, no raw user agent and nothing
        that could be presented as a credential.

        `device` is computed from the user agent when the list is read and is
        made only of names from a closed list, "Mac · Chrome", "Mac" or
        "Chrome", never of any part of the header itself. It is null, and
        `deviceKind` is `unknown`, when neither the system nor the browser is
        recognised; the client words that case in the reader's language.
        `deviceKind` picks the icon. An iPad that asks for desktop sites sends
        a Mac user agent and reads as one.

        `location` is "City, CC", the place of the request that last signed in
        or refreshed this session, taken from the edge's location headers and
        only where the server trusts them. It is null otherwise. `lastUsedAt`
        is that same moment, so it is at most one access-token lifetime old.
      required: [familyId, device, deviceKind, location, lastUsedAt, current]
      additionalProperties: false
      properties:
        familyId:
          $ref: '#/components/schemas/Uuid'
        device: { type: [string, 'null'], maxLength: 40 }
        deviceKind: { type: string, enum: [computer, phone, tablet, unknown] }
        location: { type: [string, 'null'], maxLength: 80 }
        lastUsedAt: { $ref: '#/components/schemas/Timestamp' }
        current:
          type: boolean
          description: |
            True for the session the request's refresh cookie belongs to. False
            for every session when the request carries no cookie that names a
            live session of the caller.

    # ---------------------------------------------------------------- classes

    Class:
      type: object
      required: [id, name, studentCount, openAssignmentCount, selfJoinEnabled, archivedAt, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'] }
        scheduleLabel:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: When the class meets, as its teacher worded it ("Thứ 3, 5 · 18:00"). Plain text, trimmed; `null` for none.
        room:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
          description: Where the class meets. Plain text, trimmed; `null` for none.
        studentCount: { type: integer, minimum: 0 }
        openAssignmentCount:
          type: integer
          minimum: 0
          description: Assignments whose derived status is `open` and that target this class (G-08).
        selfJoinEnabled: { type: boolean }
        archivedAt:
          description: Set once archived. An archived class leaves every picker and keeps its record (G-08).
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        joinCode:
          description: Teacher responses only. Never present on a `/app/*` response.
          oneOf:
            - $ref: '#/components/schemas/JoinCodeInfo'
            - type: 'null'
        averageScore:
          description: |
            Teacher responses only. Never present on a `/app/*` response: a student
            does not see how the class did. The sum of earned points over the sum of
            total points of the best graded attempt (the highest score, the later
            attempt on a tie) of each **current member** on each assignment that
            targets the class, with the manual answers still unmarked in those
            attempts as `pendingManual`. A student who has left the class counts for
            nothing. Voided attempts and attempts not yet graded are ignored. `null`
            when nothing is graded yet.
          oneOf:
            - $ref: '#/components/schemas/AttemptScore'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    ClassListItem:
      type: object
      description: |
        A row of `listClasses`: every property of `Class`, with `joinCode` read in
        full. It repeats `Class` rather than extending it so that no other
        operation's response carries a readable code; a test holds the two property
        lists together. `joinCode.code` is the code when the request asked for codes
        with `withCodes`, the caller holds `teaching.classes.write`, and
        `getJoinCode` would read that class's code for that caller; otherwise it is
        `null`.
      required: [id, name, studentCount, openAssignmentCount, selfJoinEnabled, archivedAt, createdAt, averageScore]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'] }
        scheduleLabel:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: When the class meets, as its teacher worded it ("Thứ 3, 5 · 18:00"). Plain text, trimmed; `null` for none.
        room:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
          description: Where the class meets. Plain text, trimmed; `null` for none.
        studentCount: { type: integer, minimum: 0 }
        openAssignmentCount:
          type: integer
          minimum: 0
          description: Assignments whose derived status is `open` and that target this class (G-08).
        selfJoinEnabled: { type: boolean }
        archivedAt:
          description: Set once archived. An archived class leaves every picker and keeps its record (G-08).
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        joinCode:
          description: The active code with its metadata, or `null` for a class with none. Teacher responses only.
          oneOf:
            - $ref: '#/components/schemas/JoinCode'
            - type: 'null'
        averageScore:
          description: As `Class.averageScore`; `null` when nothing is graded yet.
          oneOf:
            - $ref: '#/components/schemas/AttemptScore'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    JoinCodeInfo:
      type: object
      description: |
        Metadata about the active code — **not the code itself**, which
        `getJoinCode` reads for its teacher. A code issued from v0.8.0 on
        is stored encrypted under a key the database does not hold and found
        by a keyed hash (§13.3), so a database dump does not hand it over.
      required: [hint, expiresAt, maxUses, usesCount]
      additionalProperties: false
      properties:
        hint: { type: string, minLength: 4, maxLength: 4, examples: ['7K3M'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        usesCount: { type: integer, minimum: 0 }

    JoinCode:
      type: object
      description: |
        A class's active join code, read back for its teacher (D5), with the
        metadata `JoinCodeInfo` carries.
      required: [code, hint, legacy, expiresAt, maxUses, usesCount]
      additionalProperties: false
      properties:
        code:
          type: [string, 'null']
          description: Grouped `XXXX-XXXX`, or `null` when the code cannot be read back.
          examples: ['K7M3-P9QR']
        hint: { type: string, minLength: 4, maxLength: 4, examples: ['7K3M'] }
        legacy:
          type: boolean
          description: Always false. It was true for a code issued before v0.8.0, held only as a hash, which can no longer be active.
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        usesCount: { type: integer, minimum: 0 }

    ClassFacets:
      type: object
      description: G-08's tab counts for the current search, ignoring the status filter; `students` are distinct live members.
      required: [all, joinable, archived, students]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        joinable: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }
        students: { type: integer, minimum: 0 }

    AdminClassTeacher:
      type: object
      description: The teacher of a class in the Admin console. `name` is the display name, or the full name when there is none.
      required: [id, name, avatarUrl, disabled]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 200 }
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: A signed URL of the teacher's profile photo, or `null` when there is none.
        disabled: { type: boolean, description: The teacher's account is disabled. }

    AdminClassJoinCode:
      type: object
      description: |
        A class's active join code, read in full for the Admin console (D5),
        with what tells whether it still works: an expired or used-up code is
        returned as it is.
      required: [code, expiresAt, maxUses, usesCount]
      additionalProperties: false
      properties:
        code: { type: string, description: 'Grouped `XXXX-XXXX`.', examples: ['K7M3-P9QR'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        usesCount: { type: integer, minimum: 0 }

    AdminClassRow:
      type: object
      description: A row of `listAllClasses`.
      required: [id, name, scheduleLabel, room, teacher, studentCount, joinCode, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        scheduleLabel: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        room: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        teacher: { $ref: '#/components/schemas/AdminClassTeacher' }
        studentCount: { type: integer, minimum: 0, description: "Live members, as `Class.studentCount` counts them." }
        joinCode:
          description: |
            The active code, or `null` when the class has none or its code
            cannot be read back (a code issued before v0.8.0, or one sealed
            under a key this server no longer holds).
          oneOf:
            - $ref: '#/components/schemas/AdminClassJoinCode'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    AdminClassFacets:
      type: object
      description: The tab counts for the current search and teacher filter, ignoring the tab.
      required: [active, archived]
      additionalProperties: false
      properties:
        active: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }

    AdminClassCreate:
      type: object
      required: [name, teacherId]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        teacherId: { $ref: '#/components/schemas/Uuid' }
        scheduleLabel:
          type: [string, 'null']
          maxLength: 120
          description: As in `createClass`.
        room:
          type: [string, 'null']
          maxLength: 60
          description: As in `createClass`.

    ClassTeacherChange:
      type: object
      required: [teacherId]
      additionalProperties: false
      properties:
        teacherId: { $ref: '#/components/schemas/Uuid' }
        notify:
          type: boolean
          default: false
          description: Tell both teachers in their bells.

    ClassMember:
      type: object
      required: [userId, fullName, email, joinedVia, joinedAt, stats]
      additionalProperties: false
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        stats:
          $ref: '#/components/schemas/StudentStats'
          description: The same figures G-07 shows, so G-06's roster carries "Bài đã nộp" and "Điểm TB".
        fullName: { type: string }
        email: { type: string, format: email }
        joinedVia:
          type: string
          enum: [admin, join_code]
          description: Lets the teacher spot unexpected enrolments (§6.4).
        joinedAt: { $ref: '#/components/schemas/Timestamp' }
        joinCodeHint:
          type: [string, 'null']
          description: |
            Which code this member used, if any. After a rotation this
            distinguishes "joined via the code that leaked" from "joined via the
            current one" (D-10).

    MyClass:
      type: object
      description: |
        A class as its student sees it (S-10): the name, who teaches it, when
        and where it meets, and when they joined. Never the join code, a count,
        the roster or an average.
      required: [id, name, description, teacherName, teacherAvatarUrl, scheduleLabel, room, joinedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        teacherName:
          type: [string, 'null']
          description: The display name of the class's own teacher.
        teacherAvatarUrl:
          type: [string, 'null']
          description: The teacher's profile photo, a presigned GET valid 24 hours; `null` when the teacher has none or no store is configured.
        scheduleLabel:
          type: [string, 'null']
          description: When the class meets, as its teacher worded it.
        room:
          type: [string, 'null']
          description: Where the class meets.
        joinedAt: { $ref: '#/components/schemas/Timestamp' }

    # ------------------------------------------------------------------ media

    MediaKind:
      type: string
      enum: [image, audio]

    MediaAsset:
      type: object
      description: |
        A stored file as a question, a preview and a student's paper carry it.
        `x-media-limits` is what an upload may be (§11.1): audio of at most
        `audioBytes` and `durationMs`, an image of at most `imageBytes`. The
        server's constants and the web's pre-check are tested against it.
      required: [id, kind, url, mimeType, bytes, originalFilename, createdAt]
      additionalProperties: false
      x-media-limits:
        audioBytes: 52428800
        imageBytes: 10485760
        durationMs: 300000
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        url:
          type: string
          format: uri
          description: |
            Short-lived signed URL, 10 minutes (§11.2). Treat as expiring: on a
            403, refetch rather than failing. Hiding this URL is not protection
            and no further investment is planned.
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/aac, image/png, image/jpeg, image/webp]
        bytes:
          type: integer
          minimum: 1
          maximum: 52428800
          description: At most `audioBytes` for audio, and `imageBytes` for an image.
        durationMs:
          type: [integer, 'null']
          minimum: 1
          maximum: 300000
          description: Audio only, and always present for audio. Probed server-side (§11.1).
        originalFilename: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    # --------------------------------------------------------------- questions
    #
    # THE SECURITY BOUNDARY OF THIS API.
    #
    # There are three question shapes, and they are separate components on
    # purpose — not one schema with optional fields:
    #
    #   AdminQuestion    everything, including the grading key
    #   StudentQuestion  what a student sees WHILE TAKING a test
    #   ResultQuestion   what a student sees AFTERWARDS, gated by review policy
    #
    # §13.5 requires that `sampleAnswer`, `transcript`, `isCorrect` and
    # `acceptedAnswers` never reach a student. One schema with `nullable: true`
    # fields would make that a runtime discipline; three schemas make it a type
    # error. The Go side mirrors this with separate structs in separate
    # packages, so a forgotten field is a compile failure rather than a leak.
    #
    # Note what the review-policy fields on ResultQuestion are NOT called. When
    # `showCorrectAnswers` is on, a choice question returns `correctOptionIds`
    # and a fill-blank returns `correctAnswer` (singular, one canonical value
    # per blank) — never `isCorrect` per option and never the full
    # `acceptedAnswers` list. Two reasons: handing over every accepted spelling
    # is handing over the grading key, and keeping the four forbidden key names
    # absent from every `/app/*` schema lets the contract test be a literal
    # string search rather than a judgement call.

    QuestionType:
      type: string
      enum: [single_choice, multiple_choice, true_false, fill_blank, short_answer]

    QuestionLevel:
      type: string
      enum: [pre_a1, a1, a2, b1, b2, c1, c2]

    QuestionSkill:
      type: string
      enum: [grammar, vocabulary, reading, listening, writing, speaking]

    AudioPolicy:
      type: object
      description: |
        Present if and only if the attached asset is audio (§7). This is the
        authoring shape, read and written by teachers; a student receives
        `StudentAudioPolicy`.
      required: [maxPlays, allowSeek, showTranscriptAfterSubmit]
      additionalProperties: false
      properties:
        maxPlays:
          type: [integer, 'null']
          minimum: 1
          description: |
            `null` is unlimited. Enforcement is server-side and advisory: over-limit
            plays are reported to the teacher, never blocked or retroactively
            penalised (§11.4).
        allowSeek: { type: boolean, description: Defaults to false for listening (§11.1). }
        showTranscriptAfterSubmit: { type: boolean }
        allowPause:
          type: boolean
          description: |
            Whether a student may pause the recording once it is playing (§11.1);
            `true` when none was ever set. The server always sends it. In a request
            an absent field means "do not change it": a create stores `true`, and an
            update keeps the value already stored for the same question (by its id),
            for the same member question of a group (by its id in the bundle) and for
            the same recording (by its id). An audio policy or a recording that is new
            in the request is a create. A client that does not know the field therefore
            can never switch pausing back on by saving.

    StudentAudioPolicy:
      type: object
      description: |
        The audio rules a student's engine reads, for a question's audio and for a
        group's recording. The shape of `AudioPolicy` with every field required,
        because the engine never guesses a rule the server did not send. These are
        rules the student is meant to read; nothing here is an answer key.
      required: [maxPlays, allowSeek, showTranscriptAfterSubmit, allowPause]
      additionalProperties: false
      properties:
        maxPlays:
          type: [integer, 'null']
          minimum: 1
          description: '`null` is unlimited. Advisory, as on `AudioPolicy` (§11.4).'
        allowSeek: { type: boolean }
        showTranscriptAfterSubmit: { type: boolean }
        allowPause: { type: boolean, description: Whether the student may pause the recording once it is playing (§11.1). }

    QuestionContent:
      type: object
      description: |
        Bounded semantic prose for prompts and explanations: paragraphs, headings,
        lists and tables with marked text, breaks and safe links. No media, gaps,
        source metadata or answer-key properties. ContentDocument aggregate budgets
        and cross-node validation apply to original raw JSON. The companion string
        must equal the exact plain projection. Explanations never contain gaps.
        On question updates, omitting a rich field preserves its stored document
        only if the companion string is unchanged; otherwise the whole write is
        rejected. Explicit null removes the document.
      x-go-type: json.RawMessage
      additionalProperties: false
      required: [format, blocks]
      properties:
        format: { type: string, const: semantic_v1 }
        blocks: { $ref: '#/components/schemas/QuestionContentBlocks' }
    QuestionContentBlocks:
      type: array
      minItems: 1
      maxItems: 2048
      items: { $ref: '#/components/schemas/QuestionContentBlock' }
    QuestionContentBlock:
      oneOf:
        - $ref: '#/components/schemas/QuestionContentParagraph'
        - $ref: '#/components/schemas/QuestionContentHeading'
        - $ref: '#/components/schemas/QuestionContentList'
        - $ref: '#/components/schemas/QuestionContentTable'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/QuestionContentParagraph'
          heading: '#/components/schemas/QuestionContentHeading'
          list: '#/components/schemas/QuestionContentList'
          table: '#/components/schemas/QuestionContentTable'
    QuestionContentInlines:
      type: array
      maxItems: 2048
      items:
        oneOf:
          - { $ref: '#/components/schemas/ContentText' }
          - { $ref: '#/components/schemas/ContentBreak' }
          - { $ref: '#/components/schemas/ContentLink' }
    QuestionContentParagraph:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [paragraph] }
        content: { $ref: '#/components/schemas/QuestionContentInlines' }
    QuestionContentHeading:
      type: object
      additionalProperties: false
      required: [type, level, content]
      properties:
        type: { type: string, enum: [heading] }
        level: { type: integer, enum: [1, 2, 3] }
        content: { $ref: '#/components/schemas/QuestionContentInlines' }
    QuestionContentList:
      type: object
      additionalProperties: false
      required: [type, ordered, start, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean }
        start: { type: integer, minimum: 1, maximum: 9999 }
        items:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/QuestionContentBlocks' }
    QuestionContentTable:
      type: object
      additionalProperties: false
      required: [type, rows]
      properties:
        type: { type: string, enum: [table] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            maxItems: 12
            items: { $ref: '#/components/schemas/QuestionContentCell' }
    QuestionContentCell:
      type: object
      additionalProperties: false
      required: [header, rowSpan, colSpan, content]
      properties:
        header: { type: boolean }
        rowSpan: { type: integer, minimum: 1, maximum: 50 }
        colSpan: { type: integer, minimum: 1, maximum: 12 }
        content: { $ref: '#/components/schemas/QuestionContentBlocks' }

    QuestionPromptContent:
      type: object
      description: |
        Bounded semantic question prompt without media or answer keys. Gaps are
        supported only for fill_blank and must match blank gapId values exactly.
        Gap identity is stable within this question; labels never select answers.
        The companion prompt equals the exact plain projection. Omitted content
        on update preserves the stored document only when prompt is unchanged.
      x-go-type: json.RawMessage
      additionalProperties: false
      required: [format, blocks]
      properties:
        format: { type: string, const: semantic_v1 }
        blocks: { $ref: '#/components/schemas/QuestionPromptContentBlocks' }
    QuestionPromptContentBlocks:
      type: array
      minItems: 1
      maxItems: 2048
      items: { $ref: '#/components/schemas/QuestionPromptContentBlock' }
    QuestionPromptContentBlock:
      oneOf:
        - $ref: '#/components/schemas/QuestionPromptContentParagraph'
        - $ref: '#/components/schemas/QuestionPromptContentHeading'
        - $ref: '#/components/schemas/QuestionPromptContentList'
        - $ref: '#/components/schemas/QuestionPromptContentTable'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/QuestionPromptContentParagraph'
          heading: '#/components/schemas/QuestionPromptContentHeading'
          list: '#/components/schemas/QuestionPromptContentList'
          table: '#/components/schemas/QuestionPromptContentTable'
    QuestionPromptContentInlines:
      type: array
      maxItems: 2048
      items:
        oneOf:
          - { $ref: '#/components/schemas/ContentText' }
          - { $ref: '#/components/schemas/ContentBreak' }
          - { $ref: '#/components/schemas/ContentLink' }
          - { $ref: '#/components/schemas/ContentGap' }
    QuestionPromptContentParagraph:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [paragraph] }
        content: { $ref: '#/components/schemas/QuestionPromptContentInlines' }
    QuestionPromptContentHeading:
      type: object
      additionalProperties: false
      required: [type, level, content]
      properties:
        type: { type: string, enum: [heading] }
        level: { type: integer, enum: [1, 2, 3] }
        content: { $ref: '#/components/schemas/QuestionPromptContentInlines' }
    QuestionPromptContentList:
      type: object
      additionalProperties: false
      required: [type, ordered, start, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean }
        start: { type: integer, minimum: 1, maximum: 9999 }
        items:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/QuestionPromptContentBlocks' }
    QuestionPromptContentTable:
      type: object
      additionalProperties: false
      required: [type, rows]
      properties:
        type: { type: string, enum: [table] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            maxItems: 12
            items: { $ref: '#/components/schemas/QuestionPromptContentCell' }
    QuestionPromptContentCell:
      type: object
      additionalProperties: false
      required: [header, rowSpan, colSpan, content]
      properties:
        header: { type: boolean }
        rowSpan: { type: integer, minimum: 1, maximum: 50 }
        colSpan: { type: integer, minimum: 1, maximum: 12 }
        content: { $ref: '#/components/schemas/QuestionPromptContentBlocks' }

    OptionContent:
      type: object
      description: |
        Versioned inline option text: one paragraph of marked text and line breaks.
        No links, gaps, media, tables, source metadata or answer keys. The server
        validates the original JSON and requires text to equal its plain projection.
        Omitted content preserves rich formatting only when the current option id and
        text match; stale or changed legacy writes are rejected. Explicit null
        removes formatting. Options without rich content remain plain text.
      x-go-type: json.RawMessage
      required: [format, blocks]
      additionalProperties: false
      properties:
        format: { type: string, const: semantic_v1 }
        blocks:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
              type: { type: string, const: paragraph }
              content:
                type: array
                maxItems: 2048
                items:
                  oneOf:
                    - { $ref: '#/components/schemas/ContentText' }
                    - { $ref: '#/components/schemas/ContentBreak' }

    AdminQuestionOption:
      type: object
      required: [id, ordinal, text, isCorrect]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal: { type: integer, minimum: 0 }
        content:
          oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        text: { type: string, minLength: 1 }
        isCorrect: { type: boolean }

    AdminQuestionBlank:
      type: object
      required: [id, ordinal, acceptedAnswers, caseSensitive]
      additionalProperties: false
      properties:
        gapId:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          description: Stable identity of the rich prompt gap; null for legacy Markdown.
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal:
          type: integer
          minimum: 1
          maximum: 32767
          description: Stable 1-indexed answer label; matches `{{1}}` only for legacy Markdown.
        acceptedAnswers:
          type: array
          items: { type: string, minLength: 1 }
          minItems: 1
        caseSensitive: { type: boolean }

    AuditCategory:
      type: string
      description: |
        The six families of the audit log's tabs. An entry about the
        organization, an export, maintenance, retention or the AI credits is in
        none of them.
      enum: [accounts, classes, attempts, tests, media, imports]

    AuditCategoryFacets:
      type: object
      description: |
        How many entries each category holds for the CURRENT search and range,
        ignoring the category filter itself, in the shape of `TestStatusFacets`.
        `all` counts every such entry, including those in no category.
      required: [all, accounts, classes, attempts, tests, media, imports]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        accounts: { type: integer, minimum: 0 }
        classes: { type: integer, minimum: 0 }
        attempts: { type: integer, minimum: 0 }
        tests: { type: integer, minimum: 0 }
        media: { type: integer, minimum: 0 }
        imports: { type: integer, minimum: 0 }

    AuditActor:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl:
          type: string
          description: A signed address for the actor's photo. Absent when they have none.

    AuditEntity:
      type: object
      description: What an entry is about.
      required: [type, id, label]
      additionalProperties: false
      properties:
        type:
          type: string
          description: The kind of thing, as the server stores it (`class`, `test`, `media_asset`, `word_import`, ...).
        id:
          type: [string, 'null']
          format: uuid
          description: '`null` for an entry about no single row.'
        label:
          type: [string, 'null']
          description: |
            The name of the user, class, test, assignment, attempt (its
            student), media file, import or question group, read when the page
            is read. `null` when the row is gone or has no name.

    AuditChange:
      type: object
      required: [field, from, to]
      additionalProperties: false
      properties:
        field: { type: string }
        from:
          description: The value before the change. Any JSON value, `null` included.
        to:
          description: The value after the change. Any JSON value, `null` included.

    AuditEntry:
      type: object
      required: [id, occurredAt, actor, action, category, entity, ip, device, changes, details]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        actor:
          description: Who did it; `null` is the system itself, or an account since removed.
          oneOf: [{ $ref: '#/components/schemas/AuditActor' }, { type: 'null' }]
        action:
          type: string
          description: |
            A stable key such as `class.created`. The sentence that words it is
            the client's, from `audit.action.<action>`; an action a client has
            no sentence for is shown humanised.
        category:
          description: '`null` for an entry only the unfiltered list holds.'
          oneOf: [{ $ref: '#/components/schemas/AuditCategory' }, { type: 'null' }]
        entity: { $ref: '#/components/schemas/AuditEntity' }
        ip:
          type: [string, 'null']
          description: The address the request came from. `null` for the system.
        device:
          type: [string, 'null']
          description: A label such as `Mac · Chrome`, classified from the user agent; `null` when none was recorded or none is recognised.
        changes:
          type: array
          items: { $ref: '#/components/schemas/AuditChange' }
        details:
          type: [object, 'null']
          additionalProperties: true
          description: Whatever the entry recorded beyond `changes`; `null` when nothing.

    ApiReferenceSummary:
      type: object
      description: |
        What `getApiReferenceSummary` reports about the embedded contract.
        `endpointCount` is the number of operations, and a group's `count` the
        number of operations that carry its tag.
      required: [openapi, version, endpointCount, groups]
      additionalProperties: false
      properties:
        openapi: { type: string, description: The OpenAPI version the contract is written in. }
        version: { type: string, description: The contract's own `info.version`. }
        endpointCount: { type: integer, minimum: 0 }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ApiReferenceGroup' }

    ApiReferenceGroup:
      type: object
      required: [tag, count]
      additionalProperties: false
      properties:
        tag: { type: string }
        count: { type: integer, minimum: 0 }

    AdminOverview:
      type: object
      description: |
        The Admin console's Overview. A section the caller's keys do not open
        is `null`; `attention` is then shorter, never an error.
      required: [organizationName, people, classes, dailyActive, attention, recentChanges, storage]
      additionalProperties: false
      properties:
        organizationName:
          type: string
          description: The centre's name, from its organization settings.
        people:
          description: Needs `people.users.manage`.
          oneOf: [{ $ref: '#/components/schemas/AdminOverviewPeople' }, { type: 'null' }]
        classes:
          description: Needs `scope.all`.
          oneOf: [{ $ref: '#/components/schemas/AdminOverviewClasses' }, { type: 'null' }]
        dailyActive:
          description: Needs `people.users.manage`.
          oneOf: [{ $ref: '#/components/schemas/AdminDailyActive' }, { type: 'null' }]
        attention:
          type: array
          description: What needs doing, most urgent first. Empty when nothing does.
          items: { $ref: '#/components/schemas/AdminAttention' }
        recentChanges:
          type: [array, 'null']
          maxItems: 5
          description: The five newest audit entries of any category, newest first. Needs `system.audit.read`.
          items: { $ref: '#/components/schemas/AuditEntry' }
        storage:
          description: Needs `system.settings.write`.
          oneOf: [{ $ref: '#/components/schemas/Usage' }, { type: 'null' }]

    AdminOverviewPeople:
      type: object
      description: |
        The accounts of the centre. A student is a student target of R2's
        student-like roles and a teacher is every other account, an Admin and
        a custom role included. `teachers` are the enabled ones and
        `teachersDisabled` the disabled ones, so the two never overlap. `total`
        and `students` count disabled accounts, as the Users tabs count them.
      required: [total, activeThisWeek, teachers, teachersDisabled, students, studentsNewThisMonth]
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 0 }
        activeThisWeek:
          type: integer
          minimum: 0
          description: Accounts with an authenticated request on any of the last seven local days, today included, whether they have been disabled since or not.
        teachers: { type: integer, minimum: 0 }
        teachersDisabled:
          type: integer
          minimum: 0
          description: Disabled accounts that are not a student target; none of them is in `teachers`.
        students: { type: integer, minimum: 0 }
        studentsNewThisMonth:
          type: integer
          minimum: 0
          description: Students whose account was created since the first of this local month.

    AdminOverviewClasses:
      type: object
      required: [active, archived]
      additionalProperties: false
      properties:
        active: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }

    AdminDailyActive:
      type: object
      description: |
        Who made an authenticated request on each of the last fourteen local
        days. Staff is every account that is not a student target, which the
        chart labels Teachers. A day counts the accounts that were active on it,
        whether they have been disabled since or not.
      required: [days, average]
      additionalProperties: false
      properties:
        days:
          type: array
          minItems: 14
          maxItems: 14
          description: One entry per day, oldest first and today last, zero days included.
          items: { $ref: '#/components/schemas/AdminDailyActiveDay' }
        average:
          type: integer
          minimum: 0
          description: The mean of students plus staff over the fourteen days, rounded half up.

    AdminDailyActiveDay:
      type: object
      required: [date, students, staff]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        students: { type: integer, minimum: 0 }
        staff: { type: integer, minimum: 0 }

    AdminAttentionKind:
      type: string
      enum: [must_change_password, never_signed_in, disabled_teacher_classes, storage, email_held, ai_credit_requests]

    AdminAttention:
      type: object
      description: |
        One thing that needs doing. `count` is at least 1: a row with nothing
        to do is not sent.
      required: [kind, count, detail]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/AdminAttentionKind' }
        count:
          type: integer
          minimum: 1
          description: |
            `must_change_password`: enabled accounts on a temporary password.
            `never_signed_in`: enabled accounts that have never signed in and
            are not on a temporary password. `disabled_teacher_classes`: classes,
            archived ones too, whose teacher is disabled. `storage`: how many of
            the file storage, largest media library, open imports and database
            readings are at `Usage.warnAtPercent` of their limit or more, as
            `detail` quotes them (rounded half up). `email_held`: messages an
            email cap holds for a later day or month. `ai_credit_requests`: the
            teachers waiting for more credits this month.
        detail:
          description: What the row's line quotes. `null` for `must_change_password`.
          oneOf: [{ $ref: '#/components/schemas/AdminAttentionDetail' }, { type: 'null' }]

    AdminAttentionDetail:
      type: object
      description: |
        The facts a row quotes, by kind; a field its kind does not use is
        absent. `never_signed_in`: `oldestCreatedAt`.
        `disabled_teacher_classes`: `className` and `teacherName` of the newest
        such class. `storage`: `mediaPercent` and `importsPercent`, each absent
        when that meter has no limit, and `storagePercent` and
        `databasePercent`. `email_held`: `heldUntil`, when the first held
        message may go. `ai_credit_requests`: `teacherName`,
        `used` and `allowance` of the request waiting longest.
      additionalProperties: false
      properties:
        oldestCreatedAt: { type: string, format: date-time }
        className: { type: string }
        teacherName: { type: string }
        mediaPercent: { type: integer, minimum: 0 }
        importsPercent: { type: integer, minimum: 0 }
        storagePercent: { type: integer, minimum: 0 }
        databasePercent: { type: integer, minimum: 0 }
        heldUntil: { type: string, format: date-time }
        used: { type: integer, minimum: 0 }
        allowance: { type: integer, minimum: 0 }

    AdminSummary:
      type: object
      required: [mustChangePassword]
      additionalProperties: false
      properties:
        mustChangePassword:
          type: [integer, 'null']
          minimum: 0
          description: Enabled accounts on a temporary password; `null` without `people.users.manage`.

    Usage:
      type: object
      description: |
        What the centre uses against its limits (CR-002, D-060), each limit
        resolved as `UsageLimits` says, `null` where there is none.

        `seats` counts the enabled accounts and `teachers` the enabled accounts
        whose role opens the teacher workspace. `storage` is every file the
        centre keeps in its buckets, the sum `storageBytes` bounds: `media`,
        `imports` and the exports ready to download. `media.largestLibrary` is
        the fullest teacher's library against `mediaPerTeacherBytes`.
        `imports.bytes` and `imports.count` are the kept documents and their
        imports; `imports.openBytes` the documents of the imports still open,
        which `importBytes` bounds. `email` counts what was sent today and this
        month in `APP_TIMEZONE`, and `held` the messages a cap moved to a
        later day or month. `database.bytes` is PostgreSQL's
        `pg_database_size`, which approximates and is not what Neon bills.
        `attemptsKept` has no limit.
      required: [seats, teachers, storage, media, imports, email, database, attemptsKept, aiCredits, warnAtPercent]
      additionalProperties: false
      properties:
        seats: { $ref: '#/components/schemas/UsageCount' }
        teachers: { $ref: '#/components/schemas/UsageCount' }
        storage: { $ref: '#/components/schemas/UsageBytes' }
        media: { $ref: '#/components/schemas/UsageMedia' }
        imports: { $ref: '#/components/schemas/UsageImports' }
        email: { $ref: '#/components/schemas/UsageEmail' }
        database: { $ref: '#/components/schemas/UsageBytes' }
        attemptsKept: { $ref: '#/components/schemas/UsageAttempts' }
        aiCredits:
          description: The month's credits. `null` without `ai.credits.manage`, and while the AI assistant is off.
          oneOf: [{ $ref: '#/components/schemas/UsageCredits' }, { type: 'null' }]
        warnAtPercent: { type: integer, minimum: 50, maximum: 100 }

    UsageCount:
      type: object
      required: [used, limit]
      additionalProperties: false
      properties:
        used: { type: integer, minimum: 0 }
        limit: { type: [integer, 'null'], minimum: 1 }

    UsageBytes:
      type: object
      required: [bytes, limit]
      additionalProperties: false
      properties:
        bytes: { type: integer, format: int64, minimum: 0 }
        limit: { type: [integer, 'null'], format: int64, minimum: 1 }

    UsageMedia:
      type: object
      required: [bytes, largestLibrary, perTeacherLimit]
      additionalProperties: false
      properties:
        bytes: { type: integer, format: int64, minimum: 0 }
        largestLibrary: { type: integer, format: int64, minimum: 0 }
        perTeacherLimit: { type: [integer, 'null'], format: int64, minimum: 1 }

    UsageImports:
      type: object
      required: [bytes, count, openBytes, limit, perTeacherLimit]
      additionalProperties: false
      properties:
        bytes: { type: integer, format: int64, minimum: 0 }
        count: { type: integer, minimum: 0 }
        openBytes: { type: integer, format: int64, minimum: 0 }
        limit: { type: [integer, 'null'], format: int64, minimum: 1 }
        perTeacherLimit: { type: [integer, 'null'], format: int64, minimum: 1 }

    UsageEmail:
      type: object
      required: [today, month, held, dailyLimit, monthlyLimit]
      additionalProperties: false
      properties:
        today: { type: integer, minimum: 0 }
        month: { type: integer, minimum: 0 }
        held: { type: integer, minimum: 0 }
        dailyLimit: { type: [integer, 'null'], minimum: 1 }
        monthlyLimit: { type: [integer, 'null'], minimum: 1 }

    UsageAttempts:
      type: object
      required: [count]
      additionalProperties: false
      properties:
        count: { type: integer, format: int64, minimum: 0 }

    UsageCredits:
      type: object
      required: [used, pool]
      additionalProperties: false
      properties:
        used: { type: integer, format: int64, minimum: 0 }
        pool: { type: integer, format: int64, minimum: 0 }

    TestStatusFacets:
      type: object
      description: |
        How many tests each status holds for the CURRENT search, ignoring the
        status filter itself — selecting one tab must not zero the others.
        Backs A-03's "Tất cả 12 · Bản nháp 3 · Đã phát hành 8".
      required: [all, draft, published, archived]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }

    AssignmentStatusFacets:
      type: object
      description: |
        How many assignments each derived status holds right now, ignoring
        the status filter itself, so the list's tabs carry counts the way
        A-03's do.
      required: [all, draft, scheduled, open, closed]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        scheduled: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }

    QuestionTypeFacets:
      type: object
      description: |
        How many questions each type holds for the CURRENT tag and search,
        ignoring the type filter itself. Backs A-06's rail counts.
      required: [all, single_choice, multiple_choice, true_false, fill_blank, short_answer, levels, skills]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        single_choice: { type: integer, minimum: 0 }
        multiple_choice: { type: integer, minimum: 0 }
        true_false: { type: integer, minimum: 0 }
        fill_blank: { type: integer, minimum: 0 }
        short_answer: { type: integer, minimum: 0 }
        levels:
          type: object
          additionalProperties: false
          required: [pre_a1, a1, a2, b1, b2, c1, c2]
          properties:
            pre_a1: { type: integer, minimum: 0 }
            a1: { type: integer, minimum: 0 }
            a2: { type: integer, minimum: 0 }
            b1: { type: integer, minimum: 0 }
            b2: { type: integer, minimum: 0 }
            c1: { type: integer, minimum: 0 }
            c2: { type: integer, minimum: 0 }
        skills:
          type: object
          additionalProperties: false
          required: [grammar, vocabulary, reading, listening, writing, speaking]
          properties:
            grammar: { type: integer, minimum: 0 }
            vocabulary: { type: integer, minimum: 0 }
            reading: { type: integer, minimum: 0 }
            listening: { type: integer, minimum: 0 }
            writing: { type: integer, minimum: 0 }
            speaking: { type: integer, minimum: 0 }

    AdminQuestion:
      type: object
      required: [id, type, prompt, points, tags, level, skill, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/QuestionType' }
        level:
          oneOf: [{ $ref: '#/components/schemas/QuestionLevel' }, { type: 'null' }]
        skill:
          oneOf: [{ $ref: '#/components/schemas/QuestionSkill' }, { type: 'null' }]
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt:
          type: string
          minLength: 1
          description: |
            Legacy Markdown, or exact plain projection when promptContent is present. Markdown is rendered with rehype-sanitize — never
            `dangerouslySetInnerHTML` (§2). For `fill_blank`, blanks are marked
            `{{1}}`, `{{2}}`, 1-indexed, matching `blanks[].ordinal`.
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        mediaAlt:
          type: [string, 'null']
          description: |
            The alt text a teacher wrote for the question's image; absent or null when there is none, and always when `media` is not an image.
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
        transcript: { type: [string, 'null'] }
        options:
          type: array
          items: { $ref: '#/components/schemas/AdminQuestionOption' }
        blanks:
          type: array
          items: { $ref: '#/components/schemas/AdminQuestionBlank' }
        points: { $ref: '#/components/schemas/Points' }
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        explanation: { type: [string, 'null'] }
        sampleAnswer:
          type: [string, 'null']
          description: |
            `short_answer` only. **Teacher-only, shown during grading.** Never
            appears in any `/app/*` schema, including the result endpoint.
        tags: { type: array, items: { type: string } }
        usedInTests:
          type: integer
          minimum: 0
          description: |
            How many DRAFT test outlines reference this question. Editing the
            bank copy changes every one of them, which is a versioning event the
            teacher deserves to know about before they type (A-06). Published
            versions are deliberately not counted: they hold their own snapshot
            and a bank edit cannot reach them (§7).
        usedIn:
          type: array
          items: { $ref: '#/components/schemas/ReferencingTest' }
          description: Current test outlines using the question, sorted by title. Included on individual question responses; loaded on demand for the bank's nested usage table. Published snapshots are excluded.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    StudentOption:
      type: object
      description: No `isCorrect`. Deliberately not a subset-by-omission of AdminQuestionOption.
      required: [id, text]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        content:
          oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        text: { type: string }

    StudentBlank:
      type: object
      description: |
        No `acceptedAnswers` — that is the grading key. `caseSensitive` is a
        rule, not a key: the engine states it under the blanks (S-05, "Không
        phân biệt hoa thường"), and a rule the student cannot read is one they
        are graded on blind.
      required: [id, ordinal, caseSensitive]
      additionalProperties: false
      properties:
        gapId:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          description: Stable identity of the rich prompt gap; null for legacy Markdown.
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal: { type: integer, minimum: 1, maximum: 32767 }
        caseSensitive: { type: boolean }

    StudentSection:
      type: object
      description: |
        One part of the paper, in test order. `instructions` is the teacher's
        text to the student for this part; the engine shows it above each of the
        section's questions and the navigator groups the numbers under
        `title` (S-05, S-06, S-08).
      required: [id, title, instructions]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        instructions: { type: [string, 'null'] }

    StudentQuestion:
      type: object
      description: |
        What a student receives while taking a test. Contains none of
        `isCorrect`, `sampleAnswer`, `acceptedAnswers`, `transcript` — asserted
        by a contract test over this file and by an E2E test over a live
        response (§14 E2E 9).

        Options arrive in the order the student must see them, already shuffled
        server-side from the attempt's `shuffleSeed` so a reload cannot reorder
        them (D-02).
      required: [id, sectionId, type, prompt, points]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: A `test_version_questions` id — never a bank question id (§7).
        sectionId:
          $ref: '#/components/schemas/Uuid'
          description: The `AttemptSession.sections` entry this question belongs to.
        type: { $ref: '#/components/schemas/QuestionType' }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt: { type: string }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        mediaAlt:
          type: [string, 'null']
          description: |
            The alt text frozen with the version for the question's image, for a screen reader. Absent when the question has none or its media is not an image. It is a description, not an answer key.
        audio:
          oneOf: [{ $ref: '#/components/schemas/StudentAudioPolicy' }, { type: 'null' }]
        options: { type: array, items: { $ref: '#/components/schemas/StudentOption' } }
        blanks: { type: array, items: { $ref: '#/components/schemas/StudentBlank' } }
        points: { $ref: '#/components/schemas/Points' }

    StudentGroup:
      type: object
      description: |
        Frozen shared context with ordered version-question identities. Contains
        no answer keys or transcripts. Assets are explicitly authorized by the
        containing preview/session, never by an arbitrary content assetId.
      additionalProperties: false
      required: [id, sectionId, title, questionIds, stimuli, recordings, assets]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sectionId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        instructions:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        questionIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        stimuli: { type: array, items: { $ref: '#/components/schemas/GroupStimulus' } }
        recordings: { type: array, items: { $ref: '#/components/schemas/StudentGroupRecording' } }
        assets: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }

    StudentGroupRecording:
      type: object
      description: One versioned group playback scope, independent of other groups using the same file.
      additionalProperties: false
      required: [id, assetId, policy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assetId: { $ref: '#/components/schemas/Uuid' }
        policy: { $ref: '#/components/schemas/StudentAudioPolicy' }

    SharedReviewContext:
      type: object
      required: [groups, transcripts]
      additionalProperties: false
      description: |
        Frozen material for completed-attempt results and teacher grading.
        Learner transcripts contain only recordings whose own policy releases
        them after submission; teacher grading includes all available transcripts.
        No grading key is added to groups. Listening here never consumes a play.
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/StudentGroup' } }
        transcripts:
          type: object
          additionalProperties: { type: string }
          description: Released transcript text keyed by frozen recording ID; suppressed entries are absent.
        audioPlays:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Used plays by recording for a single attempt; omitted when grading across attempts.

    ResultQuestion:
      type: object
      description: |
        The post-submission view. Every revealing field is gated by the
        assignment's review policy and simply absent when the policy is off —
        the client has no fallback that could surface a suppressed value.
      required: [id, sectionId, type, prompt, points, answer]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sectionId:
          $ref: '#/components/schemas/Uuid'
          description: >-
            The part of the paper this question belongs to, one of the result's
            `sections`. Present under every review policy: the paper already
            showed the student which part a question was in.
        type: { $ref: '#/components/schemas/QuestionType' }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt: { type: string }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        mediaAlt:
          type: [string, 'null']
          description: |
            The alt text frozen with the version for the question's image, as on `StudentQuestion`. Present under every review policy: the picture was already on the paper.
        options: { type: array, items: { $ref: '#/components/schemas/StudentOption' } }
        blanks: { type: array, items: { $ref: '#/components/schemas/StudentBlank' } }
        points: { $ref: '#/components/schemas/Points' }
        answer:
          oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }]
          description: What the student submitted. `null` if unanswered, or removed under the retention policy.
        answerRemoved:
          type: boolean
          description: |
            Present and true when the answer was removed under the centre's
            retention policy (T-R5.17a): `answer` is then `null` and no response
            content is sent. Scores and the grader's comment are unchanged.
        earned:
          oneOf: [{ $ref: '#/components/schemas/Points' }, { type: 'null' }]
          description: Present only when `review.showScore`. `null` while awaiting manual grading.
        pendingManual: { type: boolean }
        graderComment: { type: [string, 'null'] }
        correctOptionIds:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Uuid' }
          description: |
            Only when `review.showCorrectAnswers`. Replaces per-option
            `isCorrect` so that key name never appears under `/app/*`.
        correctAnswers:
          type: [array, 'null']
          items:
            type: object
            required: [blankId, answer]
            additionalProperties: false
            properties:
              blankId: { $ref: '#/components/schemas/Uuid' }
              answer:
                type: string
                description: |
                  **One canonical accepted answer**, not the full accepted list.
                  Showing every accepted spelling would hand over the grading key.
          description: Only when `review.showCorrectAnswers`, for `fill_blank`.
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          description: Absent unless review.showExplanations permits the frozen explanation.
        explanation:
          type: [string, 'null']
          description: Only when `review.showExplanations`.
        transcript:
          type: [string, 'null']
          description: |
            Only when the question's `showTranscriptAfterSubmit` is on, and only
            on this endpoint — never on `GET /app/attempts/{id}` (§13.5). Also
            serves as the accessibility fallback for hard-of-hearing students (§11.3).
        audioPlaysUsed: { type: [integer, 'null'], minimum: 0 }

    # ------------------------------------------------------------------ tests

    TestStatus:
      type: string
      enum: [draft, published, archived]

    QuestionGroup:
      type: object
      description: |
        Independent shared-context draft graph, written through the group endpoints.
        Array order defines member/material order. Empty draft groups are allowed;
        publication requires a member. Members belong to one group in one section.
        Copy with context creates fresh group, member, material, gap and recording
        identities. Immutable asset bytes may be reused through protected bindings.
        Validate graph references and aggregate limits in addition to JSON Schema.
        The byte budget includes resolved question content/keys; a transport must
        also bound original input before decoding. This is a teacher authoring
        shape, never a learner payload or an asset access grant.
      additionalProperties: false
      required: [id, title, members, stimuli, recordings]
      x-group-limits:
        bytes: 4194304
        members: 200
        stimuli: 16
        recordings: 16
        title: 200
        transcript: 100000
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        members:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GroupMember' }
        stimuli:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/GroupStimulus' }
        recordings:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/GroupRecording' }

    GroupMember:
      type: object
      additionalProperties: false
      required: [questionId, optionOrder]
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        optionOrder:
          type: string
          enum: [shuffle, fixed]
          description: Fixed is for choice members whose text depends on authored option labels and forbids option shuffling; other members use shuffle. Neither changes member order.

    GroupStimulus:
      type: object
      additionalProperties: false
      required: [id, title, content, gaps]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        content:
          $ref: '#/components/schemas/ContentDocument'
          x-go-type: json.RawMessage
        gaps:
          type: array
          maxItems: 2048
          items: { $ref: '#/components/schemas/GroupGapBinding' }
          description: Exactly one binding per material gap; targets must be distinct within the group and refer to its members.

    GroupGapBinding:
      oneOf:
        - $ref: '#/components/schemas/GroupQuestionGap'
        - $ref: '#/components/schemas/GroupBlankGap'
      discriminator:
        propertyName: kind
        mapping:
          question: '#/components/schemas/GroupQuestionGap'
          blank: '#/components/schemas/GroupBlankGap'

    GroupQuestionGap:
      type: object
      additionalProperties: false
      required: [kind, gapId, questionId]
      properties:
        kind: { type: string, enum: [question] }
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        questionId: { $ref: '#/components/schemas/Uuid' }
      description: A material gap targets a choice member; display labels never determine identity.

    GroupBlankGap:
      type: object
      additionalProperties: false
      required: [kind, gapId, questionId, blankGapId]
      properties:
        kind: { type: string, enum: [blank] }
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        questionId: { $ref: '#/components/schemas/Uuid' }
        blankGapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
      description: A material gap targets the stable prompt gap of a rich fill-blank member, never a mutable answer-row ID.

    GroupRecording:
      type: object
      description: |
        Teacher-only authoring shape. One explicit playback binding per audio asset
        used in the group's materials. All member questions share its allowance;
        another group using the same asset has a different binding. Transcripts
        require a separate policy-gated review projection, never a learner cast.
      additionalProperties: false
      required: [id, assetId, policy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assetId: { $ref: '#/components/schemas/Uuid' }
        policy: { $ref: '#/components/schemas/AudioPolicy' }
        transcript: { type: [string, 'null'], maxLength: 100000 }

    QuestionGroupBundle:
      type: object
      additionalProperties: false
      required: [group, questions]
      properties:
        group: { $ref: '#/components/schemas/QuestionGroup' }
        questions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GroupQuestionInput' }

    StoredQuestionGroupBundle:
      type: object
      additionalProperties: false
      required: [group, questions]
      properties:
        group: { $ref: '#/components/schemas/QuestionGroup' }
        questions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/StoredGroupQuestionInput' }

    GroupQuestionInput:
      type: object
      additionalProperties: false
      required: [id, input]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        input: { $ref: '#/components/schemas/QuestionInput' }

    StoredGroupQuestionInput:
      type: object
      additionalProperties: false
      required: [id, input]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        input: { $ref: '#/components/schemas/StoredQuestionInput' }

    StoredQuestionGroup:
      type: object
      additionalProperties: false
      required: [bundle, ownerSectionId, revision, archivedAt, createdAt, updatedAt, assets, unavailableAssetIds]
      properties:
        bundle: { $ref: '#/components/schemas/StoredQuestionGroupBundle' }
        ownerSectionId: { type: [string, 'null'], format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        testUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Enclosing test revision for section-owned groups; absent for bank groups.
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/MediaAsset' }
          description: Authorized media referenced by members or shared materials.
        unavailableAssetIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: Bound assets whose metadata or signed link could not be loaded. A media outage does not turn a committed edit into an ambiguous save failure; clients show a retryable material state.

    QuestionGroupSummary:
      type: object
      additionalProperties: false
      required: [id, title, revision, questionCount, recordingCount, totalPoints, tags, archivedAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        questionCount: { type: integer, minimum: 0 }
        recordingCount: { type: integer, minimum: 0 }
        totalPoints: { $ref: '#/components/schemas/Points' }
        tags: { type: array, items: { type: string } }
        archivedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    GroupCreateInput:
      type: object
      additionalProperties: false
      required: [bundle]
      properties:
        bundle: { $ref: '#/components/schemas/QuestionGroupBundle' }
        ownerSectionId: { type: [string, 'null'], format: uuid }
        expectedTestUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Required when ownerSectionId identifies a section; no ownerSectionId means an independent bank group.

    GroupUpdateInput:
      type: object
      additionalProperties: false
      required: [bundle, expectedRevision]
      properties:
        bundle: { $ref: '#/components/schemas/QuestionGroupBundle' }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        expectedTestUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Required for a section-owned group; owner cannot change through this operation.

    GroupCopyInput:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        ownerSectionId: { type: [string, 'null'], format: uuid }
        expectedTestUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Required when copying into a section; omitted destination creates an independent bank group.

    MoveTestQuestionInput:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, questionId, to, expectedGroupRevisions]
      properties:
        expectedUpdatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: The test revision the move was drawn from, as `updateTest` takes it.
        questionId:
          $ref: '#/components/schemas/Uuid'
          description: A standalone unit's question or a member of a group a section of this test owns.
        to: { $ref: '#/components/schemas/MoveTestQuestionTarget' }
        expectedGroupRevisions:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/MoveTestQuestionGroupRevision' }
          description: |
            The revision of every group the move touches, once each: the
            question's group when it is a member, the destination group when
            `to.groupId` is set, and one entry when both are the same group.
            A move always touches at least one group.

    MoveTestQuestionTarget:
      type: object
      additionalProperties: false
      required: [sectionId, groupId, index]
      properties:
        sectionId:
          $ref: '#/components/schemas/Uuid'
          description: A section of this test.
        groupId:
          type: [string, 'null']
          format: uuid
          description: Null places the question as a unit of the section; set places it as a member of that group, which the section must own.
        index:
          type: integer
          minimum: 0
          maximum: 32768
          description: Position the question takes among the section's units when `groupId` is null, among the group's members otherwise, counted once it has left its old place, so the same value places it whether it moves up or down. Past the end is clamped to the end.

    MoveTestQuestionGroupRevision:
      type: object
      additionalProperties: false
      required: [groupId, revision]
      properties:
        groupId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, format: int64, minimum: 1 }

    MoveTestQuestionResult:
      type: object
      additionalProperties: false
      required: [test, questionId, copied, restored, editedCopy, groups]
      properties:
        test:
          $ref: '#/components/schemas/Test'
          description: The saved draft, with its new `updatedAt` and the sections' units.
        questionId:
          $ref: '#/components/schemas/Uuid'
          description: The id the question has now. A new id after a copy into a group; the original bank question's id when `restored` is true; the request's otherwise.
        copied:
          type: boolean
          description: True when the question was copied into a group and the bank question stays where it was. The builder says so after the drop.
        restored:
          type: boolean
          description: True when a member that was an unedited copy of a bank question left its group and the original bank question took its place in the section, the copy being removed. `questionId` is then the original's id.
        editedCopy:
          type: boolean
          description: True when a member that was a copy of a bank question which is still in the bank left its group edited, and so stayed a new bank question of its own. False for every other move out of a group, including a member that was never a copy or whose original is gone. The builder says so after the drop.
        groups:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/StoredQuestionGroup' }
          description: Every touched group at its new revision, built as `getQuestionGroup` builds one.

    DraftSectionUnit:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [question, group] }
        id:
          $ref: '#/components/schemas/Uuid'
          description: Standalone question ID or owned group ID, according to kind.

    TestSection:
      type: object
      required: [id, ordinal, title, questionIds]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1 }
        instructions: { type: [string, 'null'] }
        questionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: Legacy standalone references; group members belong to their group and are excluded here.
        units:
          type: array
          items: { $ref: '#/components/schemas/DraftSectionUnit' }
          description: Complete mixed order when the section has shared groups; absent on historical standalone outlines.

    TestAssignmentCounts:
      type: object
      description: |
        The assignments that name any version of a test, by derived status
        (`AssignmentStatus`), whoever created them. `live` counts the `open`
        ones. Drafts are not counted. Backs the tests card's "2 live".
      required: [live, scheduled, closed]
      additionalProperties: false
      properties:
        live: { type: integer, minimum: 0 }
        scheduled: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }

    Test:
      type: object
      required: [id, title, status, currentVersion, nextVersion, totalPoints, questionCount, audioCount, skills, assignments, unpublishedChanges, sections, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TestStatus' }
        currentVersion:
          type: integer
          minimum: 0
          description: 0 while never published. A `published` test always has ≥ 1.
        nextVersion:
          type: integer
          minimum: 1
          description: |
            Read-only: the server computes it and a client never sends it. The
            number the next publish of this test will take: one more than
            the highest version ever published, whether or not that version
            still exists, so it is 1 for a test never published. Deleting the
            newest version does not lower it, and the publish and this field
            read the same count. It is not `currentVersion + 1` and not the
            highest listed version + 1, and a client that names the version
            about to be published reads it from here.
        totalPoints: { $ref: '#/components/schemas/Points' }
        questionCount: { type: integer, minimum: 0 }
        audioCount:
          type: integer
          minimum: 0
          description: Draft questions with their own audio or a shared group recording, counted once per question. Backs A-03's headphone badge.
        skills:
          type: array
          items: { $ref: '#/components/schemas/QuestionSkill' }
          description: Sorted distinct non-null skills of the current draft, including grouped members.
        assignments: { $ref: '#/components/schemas/TestAssignmentCounts' }
        unpublishedChanges:
          type: [integer, 'null']
          minimum: 0
          description: |
            How many changes the draft holds against the test's latest version:
            the length of `getTestVersionDiff`'s `changes` for that version
            against `draft`, so 0 means the draft is the latest version. It is
            what the unpublished-changes banner reads.

            Only `getTest` computes it. It is null for a test with no version,
            in every row of `listTests`, in the answer of a write, and when a
            group of the draft or of the latest version cannot be read; the
            page then shows no banner. A
            bank edit to a question the draft uses counts, though it never
            moves `updatedAt`.
        sections:
          type: array
          items: { $ref: '#/components/schemas/TestSection' }
          description: The **draft** outline. Published content lives in versions.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt: { type: [string, 'null'], format: date-time }

    TestVersion:
      type: object
      description: Immutable. Editing a published test creates a new one; in-flight attempts keep theirs (§7).
      required:
        [id, version, totalPoints, questionCount, audioCount, manualCount,
         skills, publishedAt, publishedBy, assignmentCount, changeNote]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        totalPoints: { $ref: '#/components/schemas/Points' }
        questionCount: { type: integer, minimum: 0 }
        skills:
          type: array
          items: { $ref: '#/components/schemas/QuestionSkill' }
          description: |
            Sorted distinct non-null skills of the questions this version froze,
            grouped members included: the version's counterpart of `Test.skills`.
            It is read from the version's own questions, so editing the draft or
            the bank after the publish does not change it.
        audioCount:
          type: integer
          minimum: 0
          description: Questions with their own audio or a shared group recording, counted once per question; shown when picking a version to assign (G-01).
        manualCount:
          type: integer
          minimum: 0
          description: |
            Questions needing manual grading. G-01 multiplies it by the roster to
            show the teacher what they are committing to marking before they
            commit to it.
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedBy: { type: string, description: Display name. }
        assignmentCount:
          type: integer
          minimum: 0
          description: |
            Every assignment that names this version, drafts included, whoever
            created it. A version with one cannot be deleted, so this is what
            "In use · {n} assignments" and the disabled Delete read.
        changeNote:
          type: [string, 'null']
          maxLength: 200
          description: The note the teacher left when publishing. Null for a version published without one.
        testUpdatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            `publishTest` only: the test's `updatedAt` after the publish, which
            the publish itself moves. A caller that goes on saving the draft
            sends it as `expectedUpdatedAt`, or its next save answers
            `STALE_WRITE`. Absent from every other answer.

    DiffSide:
      type: object
      description: One of the two papers a diff compares.
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [draft, version]
        version:
          type: integer
          minimum: 1
          description: The server sends it exactly when `kind` is `version`. The schema does not tie the two together.
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
          description: The server sends it exactly when `kind` is `version`. The schema does not tie the two together.

    DiffChangeKind:
      type: string
      description: |
        What one change reports. A question is never reported twice under one
        kind. An edit to the shared material of a group, or to a section,
        reaches each of its questions as one `changed` entry (field `context`
        or `section`), so `Test.unpublishedChanges` counts it once per
        question.

        | Kind | The question | `params` |
        |---|---|---|
        | `added` | in `to` only; `questionNumber` and `questionId` are its place in `to` | `prompt` |
        | `removed` | in `from` only; `questionNumber` and `questionId` are its place in `from` | `prompt` |
        | `changed` | in both; `questionNumber` and `questionId` are its place in `to` | `fields` |
        | `answer` | in both, with a different answer key; its place in `to` | `answerFrom`, `answerTo` for a choice question; none otherwise |
        | `points` | none: the test's total changed; no `questionNumber`, no `questionId` | `pointsFrom`, `pointsTo` |

        A question that changed in its words and in its key is reported twice,
        once as `changed` and once as `answer`. Moving a question to another
        place in the paper is not a change.
      enum: [added, removed, changed, answer, points]

    DiffField:
      type: string
      description: |
        The part of a question that differs, for a `changed` entry.
        `prompt` and `explanation` cover the text and the rich content;
        `options` the text and content of the choices in their order, `blanks`
        the gaps and their case rule, and `media` the attachment with its audio
        policy and transcript. `context` is the shared material of the group
        the question belongs to, or its being in a group at all, and `section`
        the part of the paper it sits in. The correct options and the accepted
        answers are not here: they are `answer` entries.
      enum: [type, prompt, options, blanks, media, points, explanation, context, section]

    DiffChangeParams:
      type: object
      description: |
        One closed set of fields for every kind; `DiffChangeKind` says which of
        them a kind carries. Plain values only.
      additionalProperties: false
      properties:
        prompt:
          type: string
          maxLength: 200
          description: The question's prompt as plain text, cut to 200 characters with `…` in place of the rest.
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DiffField' }
        answerFrom:
          type: array
          items: { type: string, minLength: 1, maxLength: 3 }
          description: The labels (`A`, `B`, …) of the correct options in `from`, in order.
        answerTo:
          type: array
          items: { type: string, minLength: 1, maxLength: 3 }
          description: The labels of the correct options in `to`, in order.
        pointsFrom: { $ref: '#/components/schemas/Points' }
        pointsTo: { $ref: '#/components/schemas/Points' }

    DiffChange:
      type: object
      required: [kind, params]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/DiffChangeKind' }
        questionNumber:
          type: integer
          minimum: 1
          description: The question's number in its paper, counting across sections.
        questionId:
          $ref: '#/components/schemas/Uuid'
          description: |
            The question's id in the paper `questionNumber` counts in: the
            frozen question of a version, the bank question of the draft. It is
            the id the preview of that version carries.
        params: { $ref: '#/components/schemas/DiffChangeParams' }

    TestVersionDiff:
      type: object
      description: What differs between two papers of one test.
      required: [from, to, changes]
      additionalProperties: false
      properties:
        from:
          description: |
            The older paper. Null only for `against=previous` on the first
            version, which has nothing before it: every question is then an
            `added` one.
          oneOf: [{ $ref: '#/components/schemas/DiffSide' }, { type: 'null' }]
        to: { $ref: '#/components/schemas/DiffSide' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/DiffChange' }
          description: |
            Ordered by kind (`added`, `removed`, `changed`, `answer`, `points`)
            and then by question number.

    PublishValidationError:
      type: object
      description: |
        Publish returns **every** problem at once, each anchored to a question,
        so the builder can mark them inline rather than surfacing one per attempt.
      required: [rule, message]
      additionalProperties: false
      properties:
        rule:
          type: string
          enum:
            - points_positive
            - choice_has_correct_option
            - option_content_valid
            - question_content_valid
            - question_valid
            - group_valid
            - total_points_valid
            - blank_has_accepted_answer
            - blank_placeholders_match
            - audio_question_has_asset
            - section_not_empty
        message: { type: string }
        sectionId: { type: [string, 'null'], format: uuid }
        questionId: { type: [string, 'null'], format: uuid }
        groupId: { type: [string, 'null'], format: uuid }

    # ------------------------------------------------------------- assignments

    AssignmentStatus:
      type: string
      enum: [draft, scheduled, open, closed]
      description: |
        **Derived**, never stored (D-18). A pure function of `publishedAt`,
        `opensAt`, `closesAt` and an optional early `closedAt`, so it cannot go
        stale and needs no scheduler.

        `draft` is what an unpublished assignment reads as. It does not weaken
        D-18: publishing is an explicit act by the teacher, not a timestamp
        arriving, so nothing has to flip a row on a schedule. A draft is
        invisible to students and counts towards nothing.

    ReviewRelease:
      type: string
      enum: [on_submit, after_close]
      description: |
        When a student's result is released. `on_submit` is as soon as they
        hand in. `after_close` is once the assignment has closed for them, at
        its effective close: until then the result withholds the score, the
        marks, the answer key and the explanations through the same path a
        policy that hides them takes, and carries `releasesAt`.

    ReviewPolicy:
      type: object
      description: |
        What the assignment lets a student see, as the server reads it. On the
        student's result the three flags are the **effective** ones: all three
        read false while an `after_close` release has not come, whatever the
        teacher chose.
      required: [showScore, showCorrectAnswers, showExplanations, release, showClassAverage]
      additionalProperties: false
      properties:
        showScore: { type: boolean, default: true }
        showCorrectAnswers: { type: boolean, default: false }
        showExplanations: { type: boolean, default: false }
        release: { $ref: '#/components/schemas/ReviewRelease' }
        showClassAverage:
          type: boolean
          description: |
            Whether the result may carry `classAverage`. It says what the
            teacher chose; whether the average is there is `classAverage`.

    ReviewPolicyInput:
      type: object
      description: |
        The review policy a teacher writes. `release` and `showClassAverage`
        are optional: a create without them gets `on_submit` and false, and a
        PATCH without them keeps what is stored.
      required: [showScore, showCorrectAnswers, showExplanations]
      additionalProperties: false
      properties:
        showScore: { type: boolean, default: true }
        showCorrectAnswers: { type: boolean, default: false }
        showExplanations: { type: boolean, default: false }
        release: { $ref: '#/components/schemas/ReviewRelease' }
        showClassAverage: { type: boolean }

    IntegrityPolicy:
      type: object
      description: |
        Defaults are §10.3's, conservative on purpose — the teacher opts into
        stricter modes per test. Whatever is enabled is stated in plain
        Vietnamese on the intro page before the student starts (§10.2).
      required: [requireFullscreen, blockCopyPaste, maxFocusLoss, onLimitExceeded, minAwayMs]
      additionalProperties: false
      properties:
        requireFullscreen: { type: boolean, default: false }
        blockCopyPaste: { type: boolean, default: true }
        maxFocusLoss: { type: integer, minimum: -1, default: 0, description: '-1 = no away episodes allowed; 0 = unlimited; positive values = allowed counted episodes.' }
        onLimitExceeded:
          type: string
          enum: [warn, flag, auto_submit]
          default: flag
          description: '`auto_submit` immediately submits after the allowed number of counted away episodes is exceeded, preserving answers and recording the violation.'
        minAwayMs:
          type: integer
          minimum: 0
          default: 3000
          description: |
            An away episode shorter than this is not a strike. A 2-second blur is
            a notification; a 90-second blur is a search (§10.1).

    Assignment:
      type: object
      required:
        [id, testId, testVersionId, testVersion, testTitle, targets, window,
         publishedAt, updatedAt, durationMinutes, maxAttempts, shuffleQuestions,
         shuffleOptions, review, integrity, studentNote, status]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testId: { $ref: '#/components/schemas/Uuid' }
        testVersionId: { $ref: '#/components/schemas/Uuid' }
        testVersion: { type: integer, minimum: 1 }
        testTitle: { type: string }
        targets:
          type: object
          required: [classes, students]
          additionalProperties: false
          properties:
            classes:
              type: array
              description: The classes this assignment targets, with their names and live member counts.
              items:
                type: object
                required: [id, name, studentCount]
                additionalProperties: false
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  studentCount: { type: integer, minimum: 0 }
            students:
              type: array
              description: The students targeted by name, with their names (G-09's chips).
              items:
                type: object
                required: [id, name]
                additionalProperties: false
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
        publishedAt:
          type: [string, 'null']
          format: date-time
          description: Null while the assignment is a draft.
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        window:
          type: object
          required: [opensAt, closesAt]
          additionalProperties: false
          properties:
            opensAt: { $ref: '#/components/schemas/Timestamp' }
            closesAt: { $ref: '#/components/schemas/Timestamp' }
            closedAt: { type: [string, 'null'], format: date-time, description: Set when closed early by the teacher. }
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 600
          description: |
            Server-enforced. An attempt's deadline is
            `min(startedAt + duration, closesAt)`, so starting late does not buy
            a full duration and does not cut the student off mid-window (O-05).
        maxAttempts: { type: integer, minimum: 1 }
        shuffleQuestions: { type: boolean }
        shuffleOptions: { type: boolean }
        review: { $ref: '#/components/schemas/ReviewPolicy' }
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }
        studentNote:
          type: [string, 'null']
          description: The note for the students, as stored. Null when there is none.
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        submittedCount: { type: integer, minimum: 0, description: Distinct enabled students with at least one handed-in non-voided attempt. }
        targetCount: { type: integer, minimum: 0 }
        questionCount:
          type: integer
          minimum: 0
          description: Questions on the pinned version, counted as `TestVersion.questionCount` counts them.
        flaggedCount: { type: integer, minimum: 0 }
        pendingManualCount:
          type: integer
          minimum: 0
          description: Outstanding manual answers across handed-in attempts, including partially graded papers.
        pendingGradingCount:
          type: integer
          minimum: 0
          description: Handed-in attempts with a manual answer still unmarked (G-09's "Chờ chấm").

    DuplicateAssignmentInput:
      type: object
      required: [classIds]
      additionalProperties: false
      properties:
        classIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
          description: The classes the copy is assigned to. May be empty, since the copy is a draft and is given its targets later.

    ItemAnalysis:
      type: object
      required: [handedIn, items]
      additionalProperties: false
      properties:
        handedIn:
          type: integer
          minimum: 0
          description: |
            The papers the figures range over: for each student the caller
            reaches, their latest handed-in attempt that is not voided.
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemAnalysisItem' }
          description: Sorted by `correctRate` ascending, a question with none last, then by `number`.

    ItemAnalysisItem:
      type: object
      required: [questionId, number, type, promptExcerpt, answered, correctRate]
      additionalProperties: false
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, minimum: 1, description: "The question's place on the paper, counted across sections." }
        type: { $ref: '#/components/schemas/QuestionType' }
        promptExcerpt: { type: string, maxLength: 140, description: "The prompt as plain text with its whitespace collapsed, cut at 140 characters." }
        answered:
          type: integer
          minimum: 0
          description: Papers with an answer that says something to this question.
        correctRate:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: |
            Papers that earned the question's full points, over the papers that
            have a mark for it. A question left unanswered counts against it; a
            manually marked answer the teacher has not marked yet counts for
            neither side. Null when no paper has a mark for it.

    # ---------------------------------------------------------------- attempts

    AttemptStatus:
      type: string
      enum: [in_progress, submitted, timed_out, graded, voided]

    Answer:
      description: Discriminated by `type` (§7).
      oneOf:
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/TrueFalseAnswer'
        - $ref: '#/components/schemas/FillBlankAnswer'
        - $ref: '#/components/schemas/TextAnswer'
      discriminator:
        propertyName: type
        mapping:
          choice: '#/components/schemas/ChoiceAnswer'
          true_false: '#/components/schemas/TrueFalseAnswer'
          fill_blank: '#/components/schemas/FillBlankAnswer'
          text: '#/components/schemas/TextAnswer'

    ChoiceAnswer:
      type: object
      required: [type, optionIds]
      additionalProperties: false
      properties:
        type: { type: string, const: choice }
        optionIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    TrueFalseAnswer:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, const: true_false }
        value: { type: boolean }

    FillBlankAnswer:
      type: object
      required: [type, values]
      additionalProperties: false
      properties:
        type: { type: string, const: fill_blank }
        values:
          type: object
          additionalProperties: { type: string }
          description: Keyed by blank id.

    TextAnswer:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, const: text }
        value: { type: string }

    AttemptScore:
      type: object
      required: [earned, total, pendingManual]
      additionalProperties: false
      properties:
        earned: { $ref: '#/components/schemas/Points' }
        total: { $ref: '#/components/schemas/Points' }
        pendingManual: { type: integer, minimum: 0, description: Questions still awaiting manual grading. }

    Attempt:
      type: object
      required: [id, assignmentId, studentId, testVersionId, attemptNo, status, startedAt, deadlineAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        testVersionId: { $ref: '#/components/schemas/Uuid' }
        attemptNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        deadlineAt:
          $ref: '#/components/schemas/Timestamp'
        submittedAt: { type: [string, 'null'], format: date-time }
        gradedAt: { type: [string, 'null'], format: date-time }
        score:
          oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }]
        integrity:
          type: [object, 'null']
          required: [focusLossCount, flagged]
          additionalProperties: false
          properties:
            focusLossCount: { type: integer, minimum: 0 }
            flagged: { type: boolean }

    AttemptSession:
      type: object
      description: |
        Returned when an attempt is created, resumed or read. Everything the
        engine needs to run authoritatively.
      required: [attempt, testTitle, sections, questions, sessionId, beaconToken, serverTime, audioPlays, answers, integrity]
      additionalProperties: false
      properties:
        remainingAttempts: { type: integer, minimum: 0, description: "Additional attempts available after this one, excluding voided attempts." }
        attempt: { $ref: '#/components/schemas/Attempt' }
        testTitle:
          type: string
          description: The engine's header names the paper from 1024px up (S-08).
        sections:
          type: array
          items: { $ref: '#/components/schemas/StudentSection' }
          description: In test order. `questions` never interleaves two sections, whatever the shuffle.
        questions:
          type: array
          items: { $ref: '#/components/schemas/StudentQuestion' }
          description: |
            Already in presentation order, shuffled server-side and stable
            across reloads (D-02). Shuffling happens inside each section, so
            the order of sections is the order of `sections`.
        groups:
          type: array
          items: { $ref: '#/components/schemas/StudentGroup' }
          description: |
            Frozen shared context for this attempt's version. Member IDs name
            questions in this session; presentation order comes from questions.
            No answer keys or recording transcripts. Only version-bound assets
            reachable through this student's own attempt receive signed URLs.
            Empty for historical standalone papers; optional for compatibility.
        sessionId:
          $ref: '#/components/schemas/Uuid'
          description: |
            Identifies this device/tab. Every write carries it; a superseded
            session gets `SESSION_SUPERSEDED`, which is how the first tab learns
            it lost (§10.1, E2E 7).
        beaconToken:
          type: string
          description: |
            Opaque, valid until `deadlineAt`, **append-only event access**.
            `navigator.sendBeacon` cannot set an `Authorization` header and the
            15-minute access token has usually expired by `pagehide`, so the
            beacon carries this in its body instead. Grants no read access.
        superseded:
          type: boolean
          description: |
            Present and true only in an answer of `getAttempt` to a tab that
            named a session the attempt no longer has. `sessionId` is then the
            session that tab named, `beaconToken` is empty, and every write
            under that session answers `SESSION_SUPERSEDED`.
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        audioPlays:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: |
            Keyed by question id. **Server-authoritative** — the client renders
            remaining plays from this, decrements optimistically, and reconciles
            on the next fetch. A client-side counter would reset on reload and
            make the limit meaningless (§11.4).
        groupAudioPlays:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: |
            Server counts keyed by frozen group recording ID, shared across all
            members and sessions of this attempt. Different groups using the same
            file have independent counts. Optional for historical clients.
        answers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Answer' }
          description: Keyed by question id. The base for the resume merge.
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }

    GroupAudioPlayInput:
      type: object
      additionalProperties: false
      required: [recordingId, playId, sessionId]
      properties:
        recordingId: { $ref: '#/components/schemas/Uuid' }
        playId:
          $ref: '#/components/schemas/Uuid'
          description: Stable random ID for one gesture, reused unchanged by retries; unique within the attempt.
        sessionId: { $ref: '#/components/schemas/Uuid' }

    GroupAudioPlayResult:
      type: object
      additionalProperties: false
      required: [playId, plays, maxPlays]
      properties:
        playId: { $ref: '#/components/schemas/Uuid' }
        plays: { type: integer, minimum: 1 }
        maxPlays: { type: [integer, 'null'], minimum: 1 }

    IntegrityEventInput:
      type: object
      required: [kind, occurredAt, clientSeq]
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            Not an enum: an append-only telemetry log reliably gains kinds, and a
            newer client must not fail against an older server. Unknown kinds are
            stored, not rejected. Known set is §10.1.
          examples: [tab_hidden, window_blur, paste, audio_play, network_offline]
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        clientSeq:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: |
            The event's offset in milliseconds from the attempt's start, as the
            tab that recorded it measured it against the server's clock, and
            never below the number after that tab's last one: it increases
            **within a tab**. Uniqueness is `(attempt, session, clientSeq)`: an
            event that repeats a number its session has used is taken for a
            retry and is not stored. A new session may use any number again
            (D-01). A client that sends a plain counter is accepted. The column
            is a 32-bit integer, so a larger number answers 400 on every path
            that takes events.
        questionId: { type: [string, 'null'], format: uuid }
        meta: { type: [object, 'null'], additionalProperties: true }

    IntegrityEvent:
      type: object
      required: [id, kind, occurredAt, offsetMs, clientSeq]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        offsetMs: { type: integer, description: Milliseconds since the attempt started. }
        durationMs:
          type: [integer, 'null']
          description: |
            For paired events (hidden/visible, blur/focus, fullscreen in/out),
            computed server-side. `null` on an unpaired trailing event — the
            student never came back — which renders open-ended rather than being
            dropped (§10.4).
        clientSeq: { type: integer }
        sessionId: { $ref: '#/components/schemas/Uuid' }
        questionId: { type: [string, 'null'], format: uuid }
        meta: { type: [object, 'null'], additionalProperties: true }

    IntegritySummary:
      type: object
      description: The §10.4 summary strip. Neutral by construction — counts, not verdicts.
      required: [totalAwayMs, awayEpisodes, pasteCount, resumeCount, audioReplays, offlineEpisodes]
      additionalProperties: false
      properties:
        totalAwayMs: { type: integer, minimum: 0 }
        awayEpisodes: { type: integer, minimum: 0, description: Episodes exceeding `minAwayMs`. }
        pasteCount: { type: integer, minimum: 0 }
        resumeCount: { type: integer, minimum: 0 }
        audioReplays: { type: integer, minimum: 0 }
        offlineEpisodes:
          type: integer
          minimum: 0
          description: Shown distinctly from focus loss — distinguishing bad wifi from cheating matters for fairness (§10.1).

    MonitorRow:
      type: object
      description: One row per **targeted student**, including those who never started.
      required: [studentId, fullName, state]
      additionalProperties: false
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
        state: { type: string, enum: [not_started, in_progress, submitted, timed_out, graded, voided] }
        attemptId: { type: [string, 'null'], format: uuid }
        attemptNo: { type: [integer, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        deadlineAt: { type: [string, 'null'], format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        answeredCount:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Questions whose saved answer says something, by the rule of
            `StudentAssignmentCard.liveAnsweredCount`, against the response's
            `questionCount` (G-02's progress column).
        score: { oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }] }
        focusLossCount: { type: [integer, 'null'] }
        flagged: { type: boolean }
        audioOverLimit: { type: boolean, description: "Reported, never enforced (§11.4)." }
        extendedTo:
          type: [string, 'null']
          format: date-time
          description: >-
            This student's own close, when an override of theirs reaches past the
            assignment's own: "Extended to …". Absent or null when they have none,
            or theirs is no later. While it is ahead of `serverTime` the student
            can still start or carry on, even if the assignment has closed early
            or its window has ended.

    AttemptListRow:
      type: object
      required: [id, studentId, studentName, assignmentId, testTitle, status, flagged]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        testTitle: { type: string }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        pendingManual: { type: integer, minimum: 0 }
        flagged: { type: boolean }

    Dashboard:
      type: object
      description: |
        The Teacher dashboard covers the caller's own teaching, including an Admin:
        assignments they created or targeting classes they teach, reachable papers on
        them, and their classes. Its repository supports scope.all for a future Admin
        console, but this operation never requests it. Range affects submissions only.
      required: [awaitingGrading, flaggedAttempts, newestFlaggedAttempt, takingNow, submissions, today, recentActivity]
      additionalProperties: false
      properties:
        closingSoon: { type: integer, minimum: 0, description: Open assignments closing within the next 24 hours. }
        waitingStudents: { type: integer, minimum: 0, description: Distinct students with unmarked manual answers in handed-in papers. }
        oldestWaitingAt: { type: [string, 'null'], format: date-time }
        nextClosing:
          oneOf: [{ $ref: '#/components/schemas/ClosingAssignment' }, { type: 'null' }]
        awaitingGrading: { type: integer, minimum: 0 }
        flaggedAttempts: { type: integer, minimum: 0 }
        newestFlaggedAttempt:
          oneOf: [{ $ref: '#/components/schemas/DashboardFlaggedAttempt' }, { type: 'null' }]
          description: Newest started currently flagged reachable paper, ordered by started_at then id descending, from the flagged count statement snapshot; null without grading or intervention permission or a matching paper. Historical, voided and former-roster papers remain eligible.
        takingNow: { $ref: '#/components/schemas/DashboardTakingNow' }
        submissions: { $ref: '#/components/schemas/DashboardSubmissions' }
        today:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DashboardToday' }
        recentActivity:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/DashboardActivity' }

    DashboardFlaggedAttempt:
      type: object
      additionalProperties: false
      required: [assignmentId, attemptId]
      properties:
        assignmentId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }

    DashboardTakingNow:
      type: object
      additionalProperties: false
      required: [students, assignments, assignmentId]
      description: Distinct students and assignments with reachable in-progress attempts before their deadline.
      properties:
        students: { type: integer, minimum: 0 }
        assignments: { type: integer, minimum: 0 }
        assignmentId:
          type: [string, 'null']
          format: uuid
          description: Assignment of the newest started reachable in-progress paper strictly before its deadline at the supplied application clock, ordered by started_at then id descending, from the taking count statement snapshot; null when none qualifies.

    DashboardSubmissions:
      type: object
      additionalProperties: false
      required: [days, total, averagePercent]
      description: Handed-in papers within the chosen calendar range in the actor's zone, including graded papers.
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 30
          description: One entry per day, oldest first and today last, including zero days.
          items: { $ref: '#/components/schemas/DashboardDay' }
        total: { type: integer, minimum: 0 }
        averagePercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Mean graded paper percentage, rounded half up; null when no graded paper has a score.

    DashboardDay:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }

    DashboardToday:
      type: object
      additionalProperties: false
      required: [kind, at, assignmentId, title, notSubmitted]
      description: Published assignment openings and effective closings today in the actor's zone, oldest first.
      properties:
        kind: { type: string, enum: [opens, closes] }
        at: { $ref: '#/components/schemas/Timestamp' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        notSubmitted:
          type: integer
          minimum: 0
          description: Distinct enabled reached targets without a submitted, timed-out or graded attempt on this assignment.

    DashboardActivity:
      type: object
      additionalProperties: false
      required: [kind, at, studentName, subject, flagged]
      description: Latest ten activities, newest first; one row per non-voided attempt, plus student-like joins by code into taught classes.
      properties:
        kind: { type: string, enum: [submitted, started, joined] }
        at: { $ref: '#/components/schemas/Timestamp' }
        studentName: { type: string }
        subject: { type: string }
        flagged: { type: boolean }

    TeacherSummary:
      type: object
      additionalProperties: false
      required: [liveAssignments, answersToGrade, unreadNotifications]
      description: Cheap nav counts in the caller's own teaching scope, for an Admin too.
      properties:
        liveAssignments:
          type: [integer, 'null']
          minimum: 0
          description: Rows the caller's Assignments list shows as open; always a number under the current workspace.teacher gate.
        answersToGrade:
          type: [integer, 'null']
          minimum: 0
          description: Unmarked manual answers in reachable handed-in papers; null without teaching.grading, when the count is not run.
        unreadNotifications:
          type: integer
          minimum: 0
          description: The caller's own unread notifications.

    ClosingAssignment:
      type: object
      required: [id, title, closesAt, submittedCount, targetCount]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        closesAt: { type: string, format: date-time }
        submittedCount: { type: integer, minimum: 0, description: Distinct enabled students who have handed in at least one non-voided attempt. }
        targetCount: { type: integer, minimum: 0, description: 'Enabled students in the union of class and individual targets, counting only the classes the caller teaches and the students they reach.' }

    StudentAssignmentCard:
      type: object
      description: |
        `status`, `closesAt`, `durationMinutes` and `maxAttempts` are the
        signed-in student's own: when a teacher has given this student an
        override, they are the later close, the longer time limit and the added
        attempts (T-R4.12), and an assignment that closed for everyone else
        reads `open` here while the student's close is still ahead. Nothing in
        the card says an override exists or why.
      required:
        [id, testTitle, status, opensAt, closesAt, durationMinutes,
         attemptsUsed, maxAttempts, questionCount, totalPoints]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testTitle: { type: string }
        className:
          type: [string, 'null']
          description: >-
            The class this assignment reached the student through. Null unless
            exactly one targeted class that is not archived contains them.
        classId:
          type: [string, 'null']
          format: uuid
          description: The id behind `className`, so S-17 can count a class's papers. Null when `className` is.
        classIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: >-
            Every class this assignment targets that contains the student and is
            not archived, so each class card can name its next paper. Empty for
            a student targeted only by name.
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        opensAt: { $ref: '#/components/schemas/Timestamp' }
        closesAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer }
        questionCount:
          type: integer
          minimum: 0
          description: Questions on the pinned version.
        totalPoints:
          $ref: '#/components/schemas/Points'
          description: What the paper is out of.
        attemptsUsed: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        lastAttemptId: { type: [string, 'null'], format: uuid }
        lastSubmittedAt:
          type: [string, 'null']
          format: date-time
          description: When the last attempt was handed in. Null while it is in progress.
        hasLiveAttempt: { type: boolean, description: Drives Start vs Resume (§9). }
        liveDeadlineAt:
          type: [string, 'null']
          format: date-time
          description: The live attempt's deadline. Absent exactly when `hasLiveAttempt` is false.
        liveAnsweredCount:
          type: [integer, 'null']
          minimum: 0
          description: >-
            How many of the live attempt's saved answers say something, by the
            rule the engine's navigator uses: a choice with an option picked, a
            true/false with a value, a text that is not blank, a fill-in with
            every blank filled. An answer that exists only in the browser's
            draft is not counted. Absent exactly when `hasLiveAttempt` is false.
        score:
          oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }]
          description: Only when the assignment's `review.showScore` is on.

    # ------------------------------------------------------------------ ai

    AiLanguage:
      type: string
      enum: [vi, en]
      description: |
        The language the text a suggestion writes for a person is written in.
        The assistant keeps the language of the material it was given for the
        content of a question.

    AiUsage:
      type: object
      description: |
        What a call cost and what remains, for the panel's footer. `credits` is
        what the provider's usage came to, never more than the call's ceiling.
      required: [credits, left]
      additionalProperties: false
      properties:
        credits: { type: integer, minimum: 0, description: Credits the call was charged. }
        left: { type: integer, minimum: 0, description: "The least of what remains of the teacher's allowance and of the centre's pool, after the call." }

    AiGenerateRequest:
      type: object
      description: |
        One of four shapes. From a passage: `source` (text the teacher pasted,
        40 characters or more), or `testId` with `stimulusId` (a shared-content
        passage of the test's draft). Standalone (`standalone: true`), where
        every question carries all it needs and refers to no passage: `source`
        (a topic or notes, 3 characters or more), or `testId` with `sectionId`
        (a section of the test's draft, whose title, instructions and the
        prompts and types of the questions already in it, group members
        included, are sent so the drafts fit it and do not repeat it), with
        `source` as an optional topic beside it. The first 8,000 characters of
        a source are sent. Nothing about a student is ever sent.
      required: [types, count, level, explanations, language]
      additionalProperties: false
      properties:
        source: { type: string, minLength: 3, maxLength: 20000 }
        testId: { $ref: '#/components/schemas/Uuid' }
        stimulusId: { $ref: '#/components/schemas/Uuid' }
        standalone: { type: boolean, description: "Write questions that each stand alone, about a topic rather than answered from a text. Off when absent." }
        sectionId: { $ref: '#/components/schemas/Uuid' }
        types:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/QuestionType' }
        count: { type: integer, minimum: 1, maximum: 8, description: "How many questions to write, 1 to 8." }
        level: { type: string, enum: [b1, b2, c1] }
        explanations: { type: boolean, description: Write an explanation for each question. }
        language: { $ref: '#/components/schemas/AiLanguage' }

    AiGeneratedQuestion:
      type: object
      description: |
        A draft question. For a choice type `options` holds the options in order
        and `answerKey` the text of each correct one, exactly as written in
        `options`; a true/false question has the options `True` and `False`. For
        `fill_blank` the prompt holds `___` for the gap and `answerKey` the
        accepted answers; for `short_answer` it holds the sample answer.
      required: [type, prompt, answerKey, explanation]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        options:
          type: array
          minItems: 2
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 500 }
        answerKey:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 500 }
        explanation: { type: string, maxLength: 2000, description: Empty when the request did not ask for explanations. }

    AiGenerateResult:
      type: object
      required: [items, usage]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AiGeneratedQuestion' }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiCheckKind:
      type: string
      enum: [key, clarity, giveaway, language]
      description: Wrong or doubtful answers, unclear wording, answers given away, spelling and grammar.

    AiCheckRequest:
      type: object
      required: [checks]
      additionalProperties: false
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/AiCheckKind' }
        language: { $ref: '#/components/schemas/AiLanguage' }

    AiFixPayload:
      type: object
      description: |
        What a one-click fix writes, through `updateQuestion`, into the question
        it names: `text` replaces the option `optionId` (`option_text`), is added
        as an accepted answer of the blank `blankId` (`accepted_answer`), or
        becomes the explanation (`explanation`).
      required: [text]
      additionalProperties: false
      properties:
        optionId: { $ref: '#/components/schemas/Uuid' }
        blankId: { $ref: '#/components/schemas/Uuid' }
        text: { type: string, minLength: 1, maxLength: 2000 }

    AiFix:
      type: object
      description: |
        `kind` is `none` when the fix is advice only; `payload` is then absent.
        Otherwise `payload` is present, and names an option or a blank of the
        question when the kind needs one.
      required: [kind, description]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [option_text, accepted_answer, explanation, none] }
        description: { type: string, minLength: 1, maxLength: 500, description: The fix in a sentence. }
        label: { type: string, minLength: 1, maxLength: 80, description: The one-click button's label. Absent when `kind` is `none`. }
        payload: { $ref: '#/components/schemas/AiFixPayload' }

    AiFinding:
      type: object
      required: [severity, questionId, number, type, title, issue, fix]
      additionalProperties: false
      properties:
        severity: { type: string, enum: [likely_error, worth_a_look, minor] }
        questionId: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, minimum: 1, description: The question's 1-based place in the draft. }
        type: { $ref: '#/components/schemas/QuestionType' }
        title: { type: string, minLength: 1, maxLength: 300, description: "The question's prompt, shortened." }
        issue: { type: string, minLength: 1, maxLength: 1000 }
        fix: { $ref: '#/components/schemas/AiFix' }

    AiCheckResult:
      type: object
      required: [findings, usage]
      additionalProperties: false
      properties:
        findings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AiFinding' }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiVariantKind:
      type: string
      enum: [reword, reorder, distract]
      description: Reword questions, reorder options, write new wrong options.

    AiVariantRequest:
      type: object
      required: [changes, difficulty]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/AiVariantKind' }
        difficulty: { type: string, enum: [same, easier, harder] }

    AiVariantPayload:
      type: object
      description: |
        What a change writes, through `updateQuestion`, into the same question
        of the copy: `prompt` replaces the prompt (`reword`); `optionOrder`
        lists every option of the question in its new order (`reorder`);
        `optionId` and `text` replace the text of one wrong option (`distract`).
      additionalProperties: false
      properties:
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        optionOrder:
          type: array
          minItems: 2
          maxItems: 8
          items: { $ref: '#/components/schemas/Uuid' }
        optionId: { $ref: '#/components/schemas/Uuid' }
        text: { type: string, minLength: 1, maxLength: 500 }

    AiVariantChange:
      type: object
      required: [questionId, number, kind, title, before, after, payload]
      additionalProperties: false
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        number: { type: integer, minimum: 1, description: "The question's 1-based place in the draft, which the copy keeps." }
        kind: { $ref: '#/components/schemas/AiVariantKind' }
        title: { type: string, minLength: 1, maxLength: 300 }
        before: { type: string, maxLength: 2000 }
        after: { type: string, maxLength: 2000 }
        payload: { $ref: '#/components/schemas/AiVariantPayload' }

    AiVariantResult:
      type: object
      required: [changes, usage]
      additionalProperties: false
      properties:
        changes:
          type: array
          maxItems: 300
          items: { $ref: '#/components/schemas/AiVariantChange' }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiExplanationRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language: { $ref: '#/components/schemas/AiLanguage' }
        length: { type: string, enum: [short, normal], description: Absent means normal. }

    AiExplanationResult:
      type: object
      required: [text, usage]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiDistractor:
      type: object
      required: [text, why]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        why: { type: string, minLength: 1, maxLength: 200, description: Why a learner might pick it. }

    AiDistractorsResult:
      type: object
      required: [items, usage]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/AiDistractor' }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiScoreSuggestion:
      type: object
      description: |
        `score` is one of the multiples of 0.5 from 0 to the question's points:
        what the model proposed is moved to the nearest one. Nothing is saved;
        a teacher marks the answer with `gradeAttempt`.
      required: [score, confidence, reasons, comment, usage]
      additionalProperties: false
      properties:
        score: { $ref: '#/components/schemas/Points' }
        confidence: { type: string, enum: [high, medium, low] }
        reasons:
          type: array
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 300 }
        comment: { type: string, maxLength: 1000, description: "A comment to the student, for the teacher to keep, change or drop." }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiInsight:
      type: object
      description: |
        `questionNumbers` are the questions the insight is about, by their
        place on the paper, and `types` the distinct types of those questions,
        for a practice set. A pattern in answers; never a judgement of a student.
      required: [kind, title, body, action, questionNumbers, types]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [key, problem, strength] }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 1000 }
        action: { type: string, enum: [review, practice, none] }
        questionNumbers:
          type: array
          maxItems: 20
          items: { type: integer, minimum: 1 }
        types:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/QuestionType' }

    AiInsightsResult:
      type: object
      required: [basis, items, usage]
      additionalProperties: false
      properties:
        basis: { type: integer, minimum: 0, description: How many handed-in papers the insights are based on. }
        items:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/AiInsight' }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiCleanupCheck:
      type: string
      enum: [duplicates, tags]
      description: Near-duplicate questions, and questions with no tags.

    AiCleanupRequest:
      type: object
      required: [checks]
      additionalProperties: false
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/AiCleanupCheck' }
        language: { $ref: '#/components/schemas/AiLanguage' }

    AiQuestionRef:
      type: object
      required: [questionId, prompt, usedInTests]
      additionalProperties: false
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        prompt: { type: string, minLength: 1, maxLength: 300 }
        usedInTests: { type: integer, minimum: 0, description: Draft outlines that use the question. }

    AiDuplicate:
      type: object
      required: [a, b, why]
      additionalProperties: false
      properties:
        a: { $ref: '#/components/schemas/AiQuestionRef' }
        b: { $ref: '#/components/schemas/AiQuestionRef' }
        why: { type: string, minLength: 1, maxLength: 300 }

    AiTagSuggestion:
      type: object
      required: [questionId, prompt, tags]
      additionalProperties: false
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        prompt: { type: string, minLength: 1, maxLength: 300 }
        level: { $ref: '#/components/schemas/QuestionLevel' }
        tags:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 40 }

    AiCleanupResult:
      type: object
      description: |
        Over the caller's own questions only, newest first, at most 2,000 of
        them: `scanned` is how many were read, and `truncated` says the bank
        held more than that, or more untagged questions than the 200 one
        request suggests tags for, or that part of the pass failed or ran out
        of time.
      required: [scanned, truncated, duplicates, tags, usage]
      additionalProperties: false
      properties:
        scanned: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        duplicates:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AiDuplicate' }
        tags:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AiTagSuggestion' }
        usage: { $ref: '#/components/schemas/AiUsage' }

    AiCreditCategory:
      type: string
      enum: [generation, grading, explanations, imports, checks]
      description: |
        The Settings card's rows: generating questions and variants, grading
        suggestions, explanations and wrong options, reading imports, and
        checks, word lists and insights.

    AiCategorySum:
      type: object
      required: [category, credits]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/AiCreditCategory' }
        credits: { type: integer, minimum: 0 }

    AiRequestStatus:
      type: string
      enum: [pending, approved, declined]

    AiCreditRequest:
      type: object
      required: [id, userId, month, amount, reason, status, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        month: { type: string, format: date, description: The first day of the month the request is for. }
        amount: { type: integer, minimum: 1000, maximum: 100000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        status: { $ref: '#/components/schemas/AiRequestStatus' }
        decidedAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    AiMonthUsage:
      type: object
      description: |
        One teacher's month. `left` is the least of what remains of the
        allowance and of the pool, never below zero. `requests` says whether the
        centre takes requests for more credits (its rule is to ask, not to
        pause); `pending` is the teacher's undecided request this month.
      required: [month, used, allowance, left, paused, requests, pending, categories]
      additionalProperties: false
      properties:
        month: { type: string, format: date, description: "The first day of the month, counted in the centre's time zone." }
        used: { type: integer, minimum: 0 }
        allowance: { type: integer, minimum: 0 }
        left: { type: integer, minimum: 0 }
        paused: { type: boolean }
        requests: { type: boolean }
        pending:
          oneOf: [{ $ref: '#/components/schemas/AiCreditRequest' }, { type: 'null' }]
        categories:
          type: array
          minItems: 5
          maxItems: 5
          description: The five rows of the usage card, in the order it draws them.
          items: { $ref: '#/components/schemas/AiCategorySum' }

    AiCreditRequestInput:
      type: object
      required: [amount, reason]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 1000, maximum: 100000 }
        reason: { type: string, minLength: 1, maxLength: 500 }

    AiRules:
      type: object
      required: [poolCredits, defaultAllowance, warnPercent, onTeacherLimit]
      additionalProperties: false
      properties:
        poolCredits: { type: integer, minimum: 0, description: The plan for a month that has not begun. }
        defaultAllowance: { type: integer, minimum: 1000, maximum: 10000000, description: What a teacher without a custom allowance may use in a month. }
        warnPercent: { type: integer, minimum: 50, maximum: 99, description: The share of the allowance at which the teacher is told. }
        onTeacherLimit: { type: string, enum: [pause, request], description: "Pause a teacher who runs out, or let them ask for more." }

    AiRulesInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        defaultAllowance: { type: integer, minimum: 1000, maximum: 10000000 }
        warnPercent: { type: integer, minimum: 50, maximum: 99 }
        onTeacherLimit: { type: string, enum: [pause, request] }

    AiRulesChange:
      type: object
      required: [rules, rewritten]
      additionalProperties: false
      properties:
        rules: { $ref: '#/components/schemas/AiRules' }
        rewritten: { type: integer, minimum: 0, description: How many of this month's allowances the new default rewrote. }

    AiPool:
      type: object
      description: The centre's month. `total` is `plan` plus `added`; `left` counts calls in flight as spent.
      required: [plan, added, used, reserved, total, left]
      additionalProperties: false
      properties:
        plan: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        left: { type: integer, minimum: 0 }

    AiCreditsAddition:
      type: object
      required: [credits]
      additionalProperties: false
      properties:
        credits: { type: integer, minimum: 1, maximum: 10000000 }

    AiTeacherStatus:
      type: string
      enum: [on_track, near_limit, at_limit, paused]

    AiTeacherMonth:
      type: object
      description: |
        One teacher's month on the Admin page. `allowance` includes `granted`,
        the credits approved requests added; `custom` says the allowance was set
        for this teacher and a change of the default leaves it.
      required: [userId, name, email, allowance, granted, used, reserved, custom, paused, status]
      additionalProperties: false
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        email: { type: string, format: email }
        allowance: { type: integer, minimum: 0 }
        granted: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        custom: { type: boolean }
        paused: { type: boolean }
        status: { $ref: '#/components/schemas/AiTeacherStatus' }

    AiAllowanceInput:
      type: object
      description: |
        Changes how much one teacher may use this month, or pauses or resumes
        them. `custom: true` sets the teacher's own allowance to `credits`;
        `custom: false` returns them to the default and takes no `credits`.
        An omitted field keeps what is stored.
      minProperties: 1
      additionalProperties: false
      properties:
        custom: { type: boolean }
        credits: { type: integer, minimum: 1000, maximum: 10000000 }
        paused: { type: boolean }

    AiPendingRequest:
      type: object
      description: A request waiting for an Admin, with the standing of the teacher who made it.
      required: [id, userId, teacherName, month, amount, reason, createdAt, used, allowance]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        teacherName: { type: string }
        month: { type: string, format: date }
        amount: { type: integer, minimum: 1000, maximum: 100000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        used: { type: integer, minimum: 0 }
        allowance: { type: integer, minimum: 0 }

    AiAdminCredits:
      type: object
      description: |
        The Admin's view of the current month. `onPace` is the credits the month
        is on course to use, `used` over the days elapsed times the days in the
        month, and `withinPool` says it fits the pool. `allowances` is the sum
        of the teachers' allowances, which may exceed the pool. `active` counts
        teachers who used AI this month and `idle` those who hold `ai.use` and
        have not.
      required: [month, pool, daysToGo, onPace, withinPool, allowances, active, idle, teachers, requests, rules]
      additionalProperties: false
      properties:
        month: { type: string, format: date }
        pool: { $ref: '#/components/schemas/AiPool' }
        daysToGo: { type: integer, minimum: 0 }
        onPace: { type: integer, minimum: 0 }
        withinPool: { type: boolean }
        allowances: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        idle: { type: integer, minimum: 0 }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/AiTeacherMonth' }
        requests:
          type: array
          items: { $ref: '#/components/schemas/AiPendingRequest' }
        rules: { $ref: '#/components/schemas/AiRules' }

    AiCreditDecision:
      type: object
      description: |
        A request after a decision. `allowance` is the teacher's allowance for
        the month after an approval, and zero after a decline.
      required: [request, allowance]
      additionalProperties: false
      properties:
        request: { $ref: '#/components/schemas/AiCreditRequest' }
        allowance: { type: integer, minimum: 0 }

    # ----------------------------------------------------------- notifications

    NotificationKind:
      type: string
      description: |
        What a notification is about. The server sends no sentence: the client
        words the item from `kind` and `params` in the reader's language.

        Each kind carries exactly these `params`:

        | Kind | For | Params |
        |---|---|---|
        | `attempt.submitted` | a teacher | `title`, `count`, `toGrade` |
        | `attempt.flagged` | a teacher | `studentName`, `title`, `focusLost` |
        | `assignment.closing` | a teacher | `title`, `notSubmitted` |
        | `class.joined` | a teacher | `studentName`, `className` |
        | `join_codes.rotated` | a teacher | `count`, `classNames` |
        | `assignment.opened` | a student | `title`, `closesAt` |
        | `assignment.due_soon` | a student | `title`, `closesAt` |
        | `assignment.extended` | a student | `title`, `closesAt` |
        | `result.ready` | a student | `title` |
        | `ai.allowance_warning` | a teacher | `used`, `allowance` |
        | `ai.credit_request` | a teacher | `teacherName`, `credits` |
        | `ai.credit_request.decided` | a teacher | `credits`, `decision` |
        | `content.transferred` | a teacher | `teacherName`, `count` |
        | `class.teacher_changed` | a teacher | `className`, and `teacherName` for the class's previous teacher |

        The three `ai.*` kinds are for the teacher's bell. `ai.credit_request`
        is written for every holder of `ai.credits.manage`, who reads it in the
        teacher workspace until the Admin console has a bell of its own.
      enum:
        - attempt.submitted
        - attempt.flagged
        - assignment.closing
        - class.joined
        - join_codes.rotated
        - assignment.opened
        - assignment.due_soon
        - assignment.extended
        - result.ready
        - ai.allowance_warning
        - ai.credit_request
        - ai.credit_request.decided
        - content.transferred
        - class.teacher_changed

    NotificationAudience:
      type: string
      enum: [teacher, student]
      description: |
        The console that reads a notification, and so which of the caller's
        notifications a bell counts, lists and clears. Which kinds each one
        reads is the "For" column of the table in `NotificationKind`, and every
        kind belongs to exactly one.

        Where an operation takes it, it is optional, and leaving it out keeps
        the behaviour from before it existed: every kind. An Admin who takes
        tests holds rows of both, and each of their two bells passes its own.
        It only narrows: the rows are still the caller's own and nobody else's.

    NotificationEvent:
      type: string
      description: |
        One switch of the notification settings. `attempt.submitted`,
        `attempt.flagged` and `assignment.closing` are the teacher's;
        `assignment.due_soon` and `result.ready` the student's. A switch
        governs the kind of the same name, and `assignment.due_soon` also
        governs `assignment.opened` and `assignment.extended`. `class.joined`
        `join_codes.rotated` and `class.teacher_changed` have no switch.
      enum:
        - attempt.submitted
        - attempt.flagged
        - assignment.closing
        - assignment.due_soon
        - result.ready

    NotificationParams:
      type: object
      description: |
        What the client builds a notification's sentence from. One closed set
        of fields for every kind; `NotificationKind` says which of them a kind
        carries. Plain values only: never markup, never a score, a band or an
        answer. A name is a copy taken when the notification was written.
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300, description: The title of the test the assignment gives. }
        count:
          type: integer
          minimum: 0
          description: Papers handed in (`attempt.submitted`), classes whose join code was replaced (`join_codes.rotated`), or classes, tests, questions, question groups, media and assignments given to the reader (`content.transferred`).
        toGrade: { type: integer, minimum: 0, description: 'Of the papers handed in, those with an answer waiting for a mark.' }
        focusLost: { type: integer, minimum: 0, description: Times the student left the test. }
        notSubmitted: { type: integer, minimum: 0, description: Students who have not handed in. }
        studentName: { type: string, minLength: 1, maxLength: 200 }
        className: { type: string, minLength: 1, maxLength: 200 }
        classNames:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 200 }
          description: At most five names; `count` holds how many classes there are.
        closesAt: { $ref: '#/components/schemas/Timestamp' }
        used: { type: integer, minimum: 0, description: AI credits the teacher has used this month. }
        allowance: { type: integer, minimum: 0, description: "The teacher's AI allowance this month, in credits." }
        credits: { type: integer, minimum: 0, description: AI credits a request asks for. }
        teacherName: { type: string, minLength: 1, maxLength: 200, description: 'The teacher who asked for credits (`ai.credit_request`), whose content was given to the reader (`content.transferred`), or who now teaches a class the reader taught (`class.teacher_changed`, on the previous teacher''s item only: the new teacher''s item has no `teacherName`).' }
        decision: { type: string, enum: [approved, declined], description: How an Admin decided a request for credits. }

    NotificationTarget:
      type: object
      description: |
        Where a click on the notification goes: a page the client resolves from
        `route`, never a URL. `assignmentId` is present for `assignment` and
        `studentAssignment`, and `attemptId` for `attempt` and `result`; either
        may accompany any other route.
      required: [route]
      additionalProperties: false
      properties:
        route:
          type: string
          description: |
            `assignment`, `attempt`, `grading` and `classes` are pages of the
            teaching workspace; `result` and `studentAssignment` are the
            student's result and the student's page of an assignment.
          enum: [assignment, attempt, grading, classes, result, studentAssignment]
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        attemptId: { $ref: '#/components/schemas/Uuid' }

    Notification:
      type: object
      required: [id, kind, params, target, createdAt, readAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        params: { $ref: '#/components/schemas/NotificationParams' }
        target:
          description: Null when the notification leads nowhere.
          oneOf: [{ $ref: '#/components/schemas/NotificationTarget' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        readAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the caller marked it read; null while it is unread. A
            notification that is written again after it was read, as a count
            that grew is, is unread again.

    NotificationPreference:
      type: object
      required: [event, inApp, email]
      additionalProperties: false
      properties:
        event: { $ref: '#/components/schemas/NotificationEvent' }
        inApp: { type: boolean, description: 'While false, no notification this switch governs is written for the caller.' }
        email: { type: boolean, description: Stored and returned. Nothing is sent by email yet. }

    NotificationPreferences:
      type: array
      description: Every `NotificationEvent` once. The server answers them in the enum's order.
      minItems: 5
      maxItems: 5
      items: { $ref: '#/components/schemas/NotificationPreference' }

    MySummary:
      type: object
      description: What the caller's shell shows before any page is open.
      required: [unreadNotifications]
      additionalProperties: false
      properties:
        unreadNotifications: { type: integer, minimum: 0 }

    # ----------------------------------------------------------- write shapes

    QuestionInput:
      type: object
      description: |
        Create/update body for a bank question. Cross-field rules that a single
        schema cannot express — single_choice and true_false need exactly one correct
        option (true_false has exactly two options), multiple_choice needs at least one correct
        option, a `fill_blank` needs exact gapId bindings for rich prompts or matching
        `{{n}}` ordinals for legacy Markdown, an audio policy requires an audio asset and alt text an image — are validated by the
        server and again at publish (§8). Failing them returns
        `VALIDATION_FAILED` with per-field `details`.
      required: [type, prompt, points]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        level:
          oneOf: [{ $ref: '#/components/schemas/QuestionLevel' }, { type: 'null' }]
        skill:
          oneOf: [{ $ref: '#/components/schemas/QuestionSkill' }, { type: 'null' }]
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt:
          type: string
          minLength: 1
          description: Legacy Markdown, or exact plain projection when promptContent is present. `fill_blank` uses stable gapId bindings in rich content and `{{n}}` placeholders in legacy Markdown.
        mediaAssetId: { type: [string, 'null'], format: uuid }
        mediaAlt:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          description: |
            Alt text for the question's image, for screen readers (1 to 1000 characters). Refused with a field error on `mediaAlt` unless `mediaAssetId` names an image; send null, or omit it, to clear it. A write replaces the stored value, as it does for `level` and `skill`, so an update that leaves it out clears it.
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
          description: Required if and only if the asset is audio (§7).
        transcript:
          type: [string, 'null']
          description: Audio questions only. Teacher-authored; the student sees it only per policy.
        options:
          type: array
          maxItems: 8
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              id: { type: [string, 'null'], format: uuid, description: Omit to create. }
              content:
                oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
                x-go-type: json.RawMessage
                x-go-type-skip-optional-pointer: true
              text: { type: string, minLength: 1 }
              isCorrect: { type: boolean }
          description: Order in the array is the stored ordinal.
        blanks:
          type: array
          items:
            type: object
            required: [ordinal, acceptedAnswers]
            additionalProperties: false
            properties:
              id: { type: [string, 'null'], format: uuid, description: Omit to create. }
              gapId: { type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
              ordinal: { type: integer, minimum: 1, maximum: 32767 }
              acceptedAnswers:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
              caseSensitive: { type: boolean, default: false }
        points:
          allOf: [{ $ref: '#/components/schemas/Points' }]
          exclusiveMinimum: 0
          multipleOf: 0.01
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        explanation: { type: [string, 'null'] }
        sampleAnswer:
          type: [string, 'null']
          description: '`short_answer` only. Rejected on any other type.'
        tags: { type: array, items: { type: string, minLength: 1 } }

    StoredQuestionInput:
      type: object
      description: |
        Stored editable content used by teacher reads, bodyless copies and version
        restoration. Existing choice arrays retain their length; the eight-option
        limit applies to authoring requests. Cross-field rules that a single
        schema cannot express — single_choice and true_false need exactly one correct
        option (true_false has exactly two options), multiple_choice needs at least one correct
        option, a `fill_blank` needs exact gapId bindings for rich prompts or matching
        `{{n}}` ordinals for legacy Markdown, an audio policy requires an audio asset and alt text an image — are validated by the
        server and again at publish (§8). Failing them returns
        `VALIDATION_FAILED` with per-field `details`.
      required: [type, prompt, points, level, skill]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        level:
          oneOf: [{ $ref: '#/components/schemas/QuestionLevel' }, { type: 'null' }]
        skill:
          oneOf: [{ $ref: '#/components/schemas/QuestionSkill' }, { type: 'null' }]
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt:
          type: string
          minLength: 1
          description: Legacy Markdown, or exact plain projection when promptContent is present. `fill_blank` uses stable gapId bindings in rich content and `{{n}}` placeholders in legacy Markdown.
        mediaAssetId: { type: [string, 'null'], format: uuid }
        mediaAlt:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          description: |
            Alt text for the question's image, as stored. Absent or null when there is none.
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
          description: Required if and only if the asset is audio (§7).
        transcript:
          type: [string, 'null']
          description: Audio questions only. Teacher-authored; the student sees it only per policy.
        options:
          type: array
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              id: { type: [string, 'null'], format: uuid, description: Omit to create. }
              content:
                oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
                x-go-type: json.RawMessage
                x-go-type-skip-optional-pointer: true
              text: { type: string, minLength: 1 }
              isCorrect: { type: boolean }
          description: Order in the array is the stored ordinal.
        blanks:
          type: array
          items:
            type: object
            required: [ordinal, acceptedAnswers]
            additionalProperties: false
            properties:
              id: { type: [string, 'null'], format: uuid, description: Omit to create. }
              gapId: { type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
              ordinal: { type: integer, minimum: 1, maximum: 32767 }
              acceptedAnswers:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
              caseSensitive: { type: boolean, default: false }
        points:
          allOf: [{ $ref: '#/components/schemas/Points' }]
          exclusiveMinimum: 0
          multipleOf: 0.01
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        explanation: { type: [string, 'null'] }
        sampleAnswer:
          type: [string, 'null']
          description: '`short_answer` only. Rejected on any other type.'
        tags: { type: array, items: { type: string, minLength: 1 } }



    StudentOverride:
      type: object
      description: |
        What one teacher changed about one student's turn at an assignment.
        Teacher-only: nothing here, the reason least of all, reaches the
        student's payloads.
      required: [studentId, studentName, closesAt, durationMinutes, extraAttempts, reason, createdAt, updatedAt]
      additionalProperties: false
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        closesAt:
          type: [string, 'null']
          format: date-time
          description: The student's own close. Null when the override leaves the close alone. It never closes the student sooner than the assignment does.
        durationMinutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 600
          description: The student's time limit. Null when the assignment's applies.
        extraAttempts: { type: integer, minimum: 0, maximum: 10, description: Attempts added to the assignment's `maxAttempts`. }
        reason: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    StudentOverrideInput:
      type: object
      required: [studentIds, reason]
      additionalProperties: false
      properties:
        studentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        extendBy:
          type: integer
          minimum: 1
          maximum: 10080
          description: Minutes added to each student's current close. Not with `closesAt`.
        closesAt:
          $ref: '#/components/schemas/Timestamp'
          description: Must be ahead. Not with `extendBy`.
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        extraAttempts: { type: integer, minimum: 0, maximum: 10 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        notify: { type: boolean, description: Absent means false. }

    AssignmentInput:
      type: object
      required: [testVersionId, targets, window, durationMinutes, maxAttempts, review, integrity]
      additionalProperties: false
      properties:
        testVersionId:
          $ref: '#/components/schemas/Uuid'
          description: Must be a published version. Immutable once any attempt exists.
        targets:
          type: object
          required: [classIds, studentIds]
          additionalProperties: false
          properties:
            classIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            studentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        window:
          type: object
          required: [opensAt, closesAt]
          additionalProperties: false
          properties:
            opensAt: { $ref: '#/components/schemas/Timestamp' }
            closesAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        maxAttempts: { type: integer, minimum: 1, maximum: 99, default: 1 }
        shuffleQuestions:
          type: boolean
          default: false
          description: Shuffle standalone questions and complete groups as units inside each section; preserve member order.
        shuffleOptions:
          type: boolean
          default: false
          description: Rejected with VALIDATION_FAILED on shuffleOptions when the selected version contains a group member with fixed option-label dependencies.
        review: { $ref: '#/components/schemas/ReviewPolicyInput' }
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }
        studentNote:
          type: [string, 'null']
          maxLength: 500
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          description: |
            A note for the students, drawn on the Test intro. Plain text,
            trimmed by the server; an empty one, or one that is blank once
            trimmed, is the same as none. The 500 characters are counted before trimming. Omitted,
            a create has none and a PATCH keeps the stored note; `null` clears
            it.
        draft:
          type: boolean
          default: false
          description: |
            Save without giving it out — G-01's "Lưu nháp". Saving again with
            `false` publishes it, which is what the "Giao bài" button sends.

            A draft is the only assignment allowed to have no targets: the point
            of saving one is to come back to it.
        closeNow:
          type: boolean
          description: |
            PATCH only; a create ignores it. Sets `closedAt`, closing the
            assignment before `closesAt`. It is refused with `400
            VALIDATION_FAILED` naming `closeNow` while `window.opensAt` is
            still ahead, because an assignment cannot close before it opens,
            whatever its status.

paths:

  # ======================================================================
  # PUBLIC — unauthenticated.
  #
  # Every operation below has `security: []` and the `public` tag. The server
  # cross-references this file at startup and refuses to boot if any of them
  # lacks a registered rate limiter, so §14's "public endpoint is rate-limited"
  # checkbox is structural rather than procedural.
  # ======================================================================

  /join/preview:
    post:
      operationId: previewJoinCode
      tags: [public]
      security: []
      summary: Look up a class by join code
      description: |
        Backs the inline preview on `/join` and `/join/:code`, which exists so
        the student sees **which class they are joining** before authenticating.
        Never create an account and enrol in one blind tap (§6.2).

        Lookup is by a keyed hash of the normalized code, compared in constant
        time. The plaintext is never stored; the code is stored encrypted
        (§6.5). A code issued before v0.8.0, held only as its SHA-256, answers
        as an unknown code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinCode]
              additionalProperties: false
              properties:
                joinCode:
                  type: string
                  minLength: 8
                  maxLength: 9
                  description: |
                    Accepted with or without the dash and in any case; normalized
                    before lookup. The alphabet excludes `0`, `O`, `1` and `I` (§6.1).
                  examples: ['K7M3-P9QR', 'k7m3p9qr']
      responses:
        '200':
          description: |
            **Leak review (§6.5).** Exactly three fields. No student names, no
            counts, no member list, no assignment titles. `classId` is included
            because the confirm step needs an idempotency key for the subsequent
            enrolment; it is a uuidv7 that reveals only the class's creation time
            and grants nothing on its own.
          content:
            application/json:
              schema:
                type: object
                required: [classId, className, teacherName]
                additionalProperties: false
                properties:
                  classId: { $ref: '#/components/schemas/Uuid' }
                  className: { type: string }
                  teacherName: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: |
            Invalid, expired, exhausted, revoked, or self-join disabled.

            **Leak review.** These return distinct `code` values so the client can
            show an accurate message, but identical `details` — empty — and no
            class-identifying text. A disabled-self-join class is indistinguishable
            from a nonexistent one. Nothing here lets a caller enumerate classes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perCode: { perHour: 200 }

  /public/status:
    get:
      operationId: getPublicStatus
      tags: [public]
      security: []
      summary: Whether the API is down for maintenance, or soon will be
      description: |
        The earliest maintenance window that was not cancelled and has not
        ended, or `null`. `active` is true while it is under way. During an
        active window every other operation answers `503 MAINTENANCE`, and this
        one keeps answering, so the client can tell the student when to come
        back.

        **Leak review (§6.5).** The answer is identical for every caller and
        never depends on a token: two timestamps and a flag. No id, no creator,
        no count, no free text. It is served from a snapshot the server
        refreshes at most every 30 s, so neither its content nor its timing
        says anything about the database.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              required: true
              description: '`public, max-age=30`, the snapshot''s own refresh interval.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStatus' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 2000 }

  /public/organization:
    get:
      operationId: getPublicOrganization
      tags: [public]
      security: []
      summary: The centre as the front door shows it
      description: |
        The centre's name and contact lines, its logos and the ways in the
        sign-in page offers, so the front door can print them before anyone
        signs in. Served from a snapshot the server refreshes at most every
        30 seconds.

        **Leak review (§6.5).** The answer is identical for every caller and
        never depends on a token. It carries only what the front door already
        prints: the centre's own name and contact lines, two logo paths, and
        three switches the sign-in and join pages act on. No plan, usage or
        count, no person or id, no allowed-domain list, no retention value,
        and nothing about when or by whom the settings were saved.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              required: true
              description: '`public, max-age=300`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicOrganization' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 2000 }

  /public/organization/logo:
    get:
      operationId: getOrganizationLogo
      tags: [public]
      security: []
      summary: The centre's logo
      description: |
        The PNG bytes of the light or the dark logo, served as a download and
        never read as another type. A `v` equal to the current logo's hash makes
        the answer immutable for a year; any other `v`, or none, is cached for
        five minutes. No logo of that variant: 404.

        **Leak review (§6.5).** Public bytes the centre chose to show on its
        front door, the same for every caller. Nothing names the bucket, the
        object key or who uploaded them.
      parameters:
        - name: variant
          in: query
          required: true
          schema: { type: string, enum: [light, dark] }
        - name: v
          in: query
          required: false
          schema: { type: string, maxLength: 64, pattern: '^[0-9a-f]+$' }
      responses:
        '200':
          description: The logo.
          headers:
            Cache-Control:
              required: true
              description: '`public, max-age=31536000, immutable` when `v` is the current hash, else `public, max-age=300`.'
              schema: { type: string }
            Content-Disposition:
              required: true
              description: '`attachment; filename="logo.png"`.'
              schema: { type: string }
            X-Content-Type-Options:
              required: true
              description: '`nosniff`.'
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-rate-limit:
        perIp: { perMinute: 300 }

  /auth/login:
    post:
      operationId: login
      tags: [public, auth]
      security: []
      summary: Email and password sign-in
      description: |
        Teacher-created accounts and staff sign-in (§5.1). Self-signup
        requires Google (§6.3); there is no password registration endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 512 }
      responses:
        '200':
          description: Signed in. Sets the rotating refresh cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_refresh=…; HttpOnly; Secure; SameSite=Lax; Path=/auth`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            **Leak review.** `INVALID_CREDENTIALS` for both an unknown email and
            a wrong password, with the same message and comparable timing, so the
            endpoint is not a user-enumeration oracle. A disabled account returns
            the same thing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `PASSWORD_SIGN_IN_DISABLED` — the centre has turned password
            sign-in off. It is decided before the email or the password is
            looked at, so every password sign-in gets it alike and it says
            nothing about any account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Maintenance' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perAddressAndEmail: { perMinute: 10 }
        perEmail: { perHour: 20 }

  /auth/google:
    post:
      operationId: googleAuth
      tags: [public, auth]
      security: []
      summary: Google sign-in, and the only self-signup path
      description: |
        The frontend obtains an **authorization code with PKCE** — not an
        implicit ID token — and this endpoint exchanges it server-side. The
        client secret never leaves the backend (§5.3).

        Resolution order (§5.3 step 4), in full:

        1. identity exists → log in
        2. verified email matches a user → link identity, log in
        3. no match **and** a valid `joinCode` → create account + enrol (§6.3)
        4. no match, no join code → `403 ACCOUNT_NOT_PROVISIONED`

        An ID token with `email_verified: false` is **rejected outright** — no
        link, no create, regardless of `joinCode`. This closes an
        account-takeover path and is not negotiable (§5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, redirectUri]
              additionalProperties: false
              properties:
                code: { type: string }
                codeVerifier: { type: string, minLength: 43, maxLength: 128 }
                redirectUri: { type: string, format: uri }
                joinCode:
                  type: string
                  minLength: 8
                  maxLength: 9
                  description: Present only when signing in to join a class, after the class preview on `/join` or `/join/:code`. Turns this into a signup.
      responses:
        '200':
          description: Signed in, or signed up and enrolled.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_refresh=…; HttpOnly; Secure; SameSite=Lax; Path=/auth` — §5.3 step 5. Without it the sign-in has no session.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleSignInSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Code exchange failed, or `email_verified` was false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ACCOUNT_NOT_PROVISIONED` — a valid Google identity with no matching
            account and no join code. The client explains that a class code is
            needed rather than offering a signup form (§5.3).

            `ACCOUNT_DISABLED` — the matched account is suspended. Named
            explicitly here, unlike at password login: the caller has just
            proved to Google that they control this address, so the fact
            discloses nothing they could not confirm themselves, and an
            unexplained failure would send them to support instead of to the
            teacher.

            `IDENTITY_ALREADY_LINKED` — the verified email matches an account
            that is already linked to a DIFFERENT Google `sub`. Linking a second
            one would make "unlink Google" ambiguous, so it is refused (D-08).

            `GOOGLE_SIGN_IN_DISABLED` — the centre has turned Google sign-in
            off. `GOOGLE_DOMAIN_NOT_ALLOWED` — the verified address is outside
            the centre's allowed domains. Both are decided for a code that
            joins a class as well.

            `SEAT_LIMIT` — a code would create the account, and the centre has
            used every seat an Admin allowed. The message names no figure; no
            account is created and the code is not used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The supplied `joinCode` was invalid, expired, exhausted or revoked. **No account is created.**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perCode: { perHour: 200 }

  /auth/set-password/check:
    post:
      operationId: checkSetPasswordLink
      tags: [public, auth]
      security: []
      summary: Read what a set-password link is for
      description: |
        The set-password page calls this with the token it read from the link's
        fragment, before it shows the form, so it can say whose password it is
        about to set. Nothing is consumed: the same token can be checked again
        until it is used, replaced or expired.

        A link is a one-time secret an Admin or the account's owner had emailed
        (D15). It works once, for 24 hours, and a newer link for the same
        account replaces it.

        **Leak review (§6.5).** An unknown, used, expired or revoked token, and
        the token of a disabled account, all answer the same `410
        SET_PASSWORD_LINK_INVALID`, with the same message, from the same single
        indexed lookup, so the answer says nothing about which of them it was.
        The lookup is an equality on the SHA-256 of a 256-bit token, which is
        all the database keeps, so its timing reveals nothing usable. A valid
        token is answered with the account's own email and name: the caller
        already holds the secret that controls that account. The token is never
        logged, is never in a query string and never reaches a `Referer`, since
        the page sends it in this body only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: The `token` the link carries after `#token=`.
      responses:
        '200':
          description: The link can still be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetPasswordLinkInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: |
            `SET_PASSWORD_LINK_INVALID` — the link is unknown, used, expired or
            revoked, or its account is disabled. The client says the link has
            expired or was already used and asks the user to request a new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Maintenance' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 1000 }
        perToken: { perHour: 20 }

  /auth/set-password:
    post:
      operationId: setPasswordWithLink
      tags: [public, auth]
      security: []
      summary: Set a password from an emailed link, and sign in
      description: |
        Sets the account's password, clears `mustChangePassword`, signs the
        account in and answers as `login` does. The link has just proved
        control of the mailbox, so no other proof is asked for.

        One statement claims the token, so two submits at once set the password
        once and the second is answered `410`. Setting a password also ends the
        account's other sessions and links: it revokes every refresh family,
        moves `session_epoch`, and revokes the account's other unused links, all
        before the new session is issued. A Google-only account that sets a
        password this way keeps its Google link.

        **Leak review (§6.5).** The same single `410` as `checkSetPasswordLink`
        for every invalid state. `422 PASSWORD_SIGN_IN_DISABLED` is decided
        before the token is looked up, so it is the same for every caller and
        says nothing about any token or account. A token that is not valid is
        refused before any password is hashed, so the endpoint is no way to
        spend the server's hashing capacity. The token is never logged, is never
        in a query string and never reaches a `Referer`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: The `token` the link carries after `#token=`.
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 512
                  pattern: '[\p{N}\p{P}\p{S}]'
                  description: |
                    The same rule as `changePassword`: at least 8 characters,
                    at least one of which is a digit, a punctuation mark or a
                    symbol, in any script.
      responses:
        '200':
          description: The password is set and the account is signed in. Sets the rotating refresh cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_refresh=…; HttpOnly; Secure; SameSite=Lax; Path=/auth`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: '`SET_PASSWORD_LINK_INVALID` — as for `checkSetPasswordLink`. Nothing was changed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `PASSWORD_SIGN_IN_DISABLED` — the centre has turned password
            sign-in off, so there is no password to set. The client sends the
            person to sign in with Google.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Maintenance' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 60, perHour: 600 }
        perToken: { perHour: 10 }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [public, auth]
      security:
        - refreshCookie: []
      summary: Rotate the refresh token
      description: |
        Reads the opaque token from the cookie and rotates it. Presenting an
        already-rotated token revokes the **whole family** and forces re-login
        (§5.2).

        The client must call this **single-flight** — one shared in-flight
        promise. Parallel calls on a cold page load would each present the same
        token, trip reuse detection, and log the user out on every load.
      responses:
        '200':
          description: Rotated. Sets the replacement cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                The REPLACEMENT `quizzivy_refresh` cookie. Rotation is only
                half-done without it: the predecessor is revoked server-side, so
                a client that kept the old value is logged out on its next call.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                additionalProperties: false
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
        '401':
          description: |
            Absent, expired, revoked, or reused. Client clears state and goes to `/login`.

            **Leak review.** `REFRESH_TOKEN_REUSED` when §5.2 reuse detection
            fires, `REFRESH_TOKEN_INVALID` otherwise — including for a suspended
            account, which is not disclosed here any more than it is at login.

            Distinguishing reuse does tell whoever presented the token that the
            replay was noticed. That is accepted: by then the family is revoked,
            so the information arrives with no access attached. The reason to
            separate them is the victim, not the attacker — "someone else used
            your session" is a message a student can act on, and "your session
            expired" is not. The revocation is also written to `audit_log`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Maintenance' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 1200 }

  # ====================================================================== auth

  /auth/me:
    get:
      operationId: getCurrentUser
      x-permission: self
      x-allows-temporary-password: true
      tags: [auth]
      summary: Current session
      description: Called on app load. A 401 sends the client to `/login` (§5.4).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Maintenance' }
    patch:
      operationId: updateCurrentUser
      x-permission: self
      tags: [auth]
      summary: Update your profile
      description: |
        Updates only supplied profile fields. Omission preserves a field;
        null clears displayName or phone. Names are trimmed, while phone
        keeps the literal accepted pattern. timeZone must be a valid stable
        IANA zone or UTC; blank and Local are refused. Email, role, password,
        provider links and photo changes use their separate operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                displayName:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 80
                  x-go-type: json.RawMessage
                  x-go-type-skip-optional-pointer: true
                phone:
                  type: [string, 'null']
                  pattern: '^[0-9+ ]{6,20}$'
                  x-go-type: json.RawMessage
                  x-go-type-skip-optional-pointer: true
                locale: { type: string, enum: [vi, en] }
                timeZone: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: The whole persisted caller profile and permissions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400':
          description: '`VALIDATION_FAILED` — a supplied field is invalid.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      description: |
        Revokes the presented refresh token family. The client also clears its
        store and calls `queryClient.clear()` (§5.4).

        Authenticated by the refresh COOKIE, not the access token. An expired
        access token must not be able to strand a live refresh family: the one
        moment a user most wants to log out is the moment their session has
        gone strange.

        A logout that is refused or fails still clears the refresh and docs
        cookies when the request carried the refresh cookie: during a
        maintenance window (`503 MAINTENANCE`), over the rate limit
        (`429 RATE_LIMITED`) and when the revoke fails (`500 INTERNAL`). In
        none of the three is the family revoked: this device is signed out,
        but a copy of the token held elsewhere stays usable for as long as it
        is rotated, and only a password reset, a disable or a password change
        ends it. A request without the cookie gets nothing cleared.
      tags: [auth]
      summary: Revoke the refresh family and clear the cookie
      security:
        - refreshCookie: []
      responses:
        '204':
          description: |
            Revoked, and the cookie is cleared. Returned even for a token that
            was already expired or revoked — logging out is idempotent, and
            reporting "that token was not valid" would answer a question the
            caller has no business asking.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                Two headers. `quizzivy_refresh=; Max-Age=0` with the same Path and flags,
                or the browser keeps the old cookie; and `quizzivy_docs=; Path=/docs;
                Max-Age=0`, so signing out also ends an open API reference session (§5.5).
        '401':
          description: No refresh cookie was presented, so there is no session to end.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 1200 }

  /auth/change-password:
    post:
      operationId: changePassword
      x-permission: self
      x-allows-temporary-password: true
      tags: [auth]
      summary: Change own password
      description: |
        Clears `mustChangePassword` and revokes every **other** refresh family
        for this user, so a second device is signed out.

        The calling session is identified by the refresh cookie, which reaches
        this endpoint because it is scoped `Path=/auth`. Without it the server
        cannot tell the caller's family from a stranger's and revokes them all,
        signing the caller out too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                  description: |
                    Required, EXCEPT while `mustChangePassword` is true.

                    In that window the current password is one a teacher
                    generated and read aloud, so re-entering it proves nothing
                    the access token has not already proved — and demanding it
                    strands the case G-07 is drawn for: a student whose password
                    was reset, who then signs in with Google and is redirected
                    here without ever having held the temporary one.
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 512
                  pattern: '[\p{N}\p{P}\p{S}]'
                  description: |
                    At least 8 characters, at least one of which is a digit, a
                    punctuation mark or a symbol, in any script. It must also
                    differ from the password it replaces, which only the server
                    can check (`PASSWORD_UNCHANGED`). The rules apply to a new
                    password only: existing passwords are never re-checked and
                    sign-in does not change.
      responses:
        '204':
          description: Changed. The calling session survives; every other one is revoked.
        '400':
          description: |
            `INVALID_CREDENTIALS` — `currentPassword` is wrong.
            `PASSWORD_REQUIRED` — the account signs in with Google only and has
            no current password to verify; it needs a set-password flow, not this one.
            `PASSWORD_UNCHANGED` — `newPassword` is the password it would replace:
            the verified `currentPassword`, or, while `mustChangePassword` is set,
            the temporary password on the account.
            `VALIDATION_FAILED` — `newPassword` breaks a rule above.

            **A wrong current password is deliberately 400, not 401.** The SPA
            treats 401 as "the session died": it refreshes once and retries, and
            a second 401 signs the user out (§5.2, `client.ts`). Returning 401
            here would mean mistyping your own password rotates your refresh
            token and then logs you out — with no hint that the typo was the
            cause. 401 on this endpoint means the SESSION is invalid, nothing else.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/set-password/request:
    post:
      operationId: requestSetPasswordLink
      x-permission: self
      tags: [auth]
      summary: Email the caller a link to set a password
      description: |
        For an account that signs in with Google and has no password: emails
        the account's own address a link, valid once for 24 hours, that opens
        the set-password page. A newer link replaces an earlier unused one. The
        caller stays signed in; using the link later ends the other sessions,
        as setting a password does.

        The answer is `204` once the message is queued; delivery is by the
        outbox and may follow a moment later. Nothing in the answer says
        whether the address received it.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            `PASSWORD_SIGN_IN_DISABLED` — the centre has turned password
            sign-in off, so a password would be of no use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501':
          description: This server has no key to seal a link with (`SECRETS_KEY`), so it cannot send one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/google/link:
    post:
      operationId: linkGoogle
      x-permission: self
      tags: [auth]
      summary: Link Google to the current account
      description: |
        Same `email_verified` rule as sign-in (§5.1), and the same sign-in
        policy: with Google sign-in off, or an address outside the allowed
        domains, nothing is linked (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, redirectUri]
              additionalProperties: false
              properties:
                code: { type: string }
                codeVerifier: { type: string }
                redirectUri: { type: string, format: uri }
      responses:
        '200':
          description: |
            Linked, or already linked to this same Google account — re-linking
            is a no-op success rather than a conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            The session is invalid, or the exchange failed, or `email_verified`
            was false — the same §5.1 rule sign-in applies, for the same reason:
            an unverified address is not evidence of anything, and binding one
            to an existing account is the takeover path with the account
            already chosen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `IDENTITY_ALREADY_LINKED` covers three cases, all of which mean
            "this link cannot be made":

            - that Google account is already bound to another user;
            - this account already has a *different* Google account linked
              (D-08 allows one, so that "unlink" is unambiguous);
            - the Google address is already some other account's email.

            The third is refused for where it leads rather than where it starts.
            Linking binds the Google `sub` to this account, and §5.3's first
            branch matches on `sub` before email — so the owner of that address
            signing in with their own Google would land in someone else's
            account. Silent, and very hard to diagnose from the inside.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `GOOGLE_SIGN_IN_DISABLED` — the centre has turned Google sign-in
            off. `GOOGLE_DOMAIN_NOT_ALLOWED` — the verified address is outside
            the centre's allowed domains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: unlinkGoogle
      x-permission: self
      tags: [auth]
      summary: Unlink Google
      description: |
        **Rejected if it would leave no login method** (§15). A Google-only
        account cannot unlink, and neither can an account whose password
        cannot be used because the centre has turned password sign-in off; the
        client disables the control and explains why.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`LAST_LOGIN_METHOD` — the account has no password to fall back to, or the centre has turned password sign-in off.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/sessions:
    get:
      operationId: listSessions
      x-permission: self
      tags: [auth]
      summary: The caller's signed-in devices
      description: |
        Every live session of the caller, one row per sign-in, and no one
        else's. The session of the request's refresh cookie comes first with
        `current: true`; the others follow by `lastUsedAt`, newest first, then
        by `familyId`. At most 100 rows: a caller with more sees the newest
        ones, and "sign out the others" still ends them all.

        The calling session is identified by the refresh cookie, which reaches
        this endpoint because it is scoped `Path=/auth`. Without a cookie that
        names a live session of the caller, the list is still returned and no
        row is current.

        **Leak review.** Each row holds a handle, a label built from a closed
        list of names, a city and a country code, and a time, all of the
        caller's own session. A row holds no IP address, no raw user agent, no
        token or hash and no expiry. The location is the approximate place of
        the last sign-in or refresh, which the caller can already see on their
        own device. Responses are `no-store`.
      responses:
        '200':
          description: The live sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      x-permission: self
      tags: [auth]
      summary: Sign out every other device
      description: |
        Revokes every live session of the caller except the calling one, and
        only when there is one to revoke also moves the caller's session epoch
        and forgets the cached principal, so the access tokens of the sessions
        that ended stop working at once on the server that took the request
        and within 10 seconds on any other (§5). The epoch is the caller's,
        so the caller's own access token is refused on its next request as
        well; the client's single-flight refresh replaces it and the calling
        session keeps its place. With nothing to revoke nothing is written, the
        epoch does not move and `revoked` is 0.

        The calling session is identified by the refresh cookie. When the
        request carries none that names a live session of the caller, the
        answer is `401 UNAUTHORIZED` and nothing is written: the server cannot
        tell the caller's session from the others, and a holder of an access
        token alone is not enough to sign an account out everywhere.

        Limited to 5 a minute and 30 an hour per signed-in user.
      responses:
        '200':
          description: The other sessions are revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                additionalProperties: false
                properties:
                  revoked:
                    type: integer
                    minimum: 0
                    description: How many sessions this call ended.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/sessions/{familyId}:
    delete:
      operationId: revokeSession
      x-permission: self
      tags: [auth]
      summary: Sign out one device
      description: |
        Revokes one live session of the caller, moves the caller's session
        epoch and forgets the cached principal in the same command, so the
        access tokens of every session of the caller are refused on their next
        request, at once on the server that took the request and within 10
        seconds on any other (§5). The sessions that were not revoked refresh
        and carry on; the revoked one cannot refresh.

        The id of another user's session, of one that is revoked or expired and
        of one that never existed answer alike: `404 NOT_FOUND`. The calling
        session is refused with `409 SESSION_IS_CURRENT`; signing out of it is
        `POST /auth/logout`.

        The calling session is identified by the refresh cookie. When the
        request carries none that names a live session of the caller, the
        answer is `401 UNAUTHORIZED` and nothing is written.

        Limited to 10 a minute and 60 an hour per signed-in user.
      parameters:
        - name: familyId
          in: path
          required: true
          description: The `familyId` of a session `listSessions` returned.
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_IS_CURRENT` — the session is the one making the request.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

