        '409':
          description: '`TEST_NOT_PUBLISHED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================================================== teacher/questions

  /teacher/questions:
    get:
      operationId: listQuestions
      x-resource-list: question
      x-permission: workspace.teacher
      description: The §8 question bank, with type and tag filters plus search.
      tags: [teacher-questions]
      parameters:
        # Repeatable, because A-06's rail is checkboxes and tag chips, not a
        # radio group. Within a group the values are OR-ed; the groups are
        # AND-ed with each other and with `q` -- the ordinary faceted-search
        # reading, and the only one where ticking a second type can never
        # shrink the result set.
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/QuestionType' }
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: hasAudio
          in: query
          description: A-06's "Chỉ câu có audio".
          schema: { type: boolean }
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: |
            `q` searches the prompt. Matching is **accent-insensitive**: `phat am`
            finds `phát âm`, `duong` finds `Đường` (D-11). Soft-deleted questions
            are excluded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets, tags, bankTotal]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminQuestion' } }
                      facets: { $ref: '#/components/schemas/QuestionTypeFacets' }
                      tags:
                        type: array
                        items: { type: string }
                        description: |
                          Every tag reachable through the CURRENT type, audio and
                          search filters, sorted and distinct. Server-derived, not
                          collected from the returned page: a rail built from one
                          page can only offer the tags that page happens to carry,
                          which makes a second chip unselectable and the filter
                          look broken.

                          The tag filter itself is not applied, for the same
                          reason the type facets ignore the type filter — picking
                          one chip must not empty the rail.
                      bankTotal:
                        type: integer
                        minimum: 0
                        description: |
                          Live questions in the bank, before any filter — A-06's
                          "180 câu". The envelope's `total` is the other number
                          on that line, "đang lọc 41": rows matching ALL current
                          filters, which is also what the page count is drawn
                          from. Distinct from `facets.all`, which ignores the
                          type filter so the "Tất cả" row can show a total.
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createQuestion
      x-resource:
        - { in: body, name: /mediaAssetId, kind: media }
        - { in: body, name: /options/-/id, kind: none }
        - { in: body, name: /blanks/-/id, kind: none }
      x-permission: [content.questions.write, content.tests.write]
      description: Adds a question to the bank. Options and blanks are written in the same transaction, with ordinals normalized dense.
      tags: [teacher-questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /teacher/questions/tags:
    post:
      operationId: tagQuestions
      x-resource:
        - { in: body, name: /questionIds/-, kind: question }
      x-permission: content.questions.write
      tags: [teacher-questions]
      summary: Add tags to several questions at once
      description: |
        A-06's "Gắn thẻ". Tagging is the one bank edit that is worth doing to
        forty questions at a time, and doing it one at a time is what the
        selection bar exists to avoid.

        Additive and idempotent: a tag a question already carries is a no-op, so
        a retry after a dropped connection cannot duplicate anything. Removing
        tags in bulk is deliberately not offered — it is the destructive
        direction, and A-06 does not draw it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionIds, tags]
              additionalProperties: false
              properties:
                questionIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/Uuid' }
                tags:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                additionalProperties: false
                properties:
                  updated:
                    type: integer
                    minimum: 0
                    description: |
                      Questions actually changed. Lower than `questionIds` when
                      some already carried every tag, which is not an error.
        '400': { $ref: '#/components/responses/BadRequest' }

  /teacher/questions/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getQuestion
      x-resource:
        - { in: path, name: id, kind: question }
      x-permission: workspace.teacher
      description: A single bank question, including its grading key. Teacher-only by construction.
      tags: [teacher-questions]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateQuestion
      x-resource:
        - { in: path, name: id, kind: question }
        - { in: body, name: /mediaAssetId, kind: media }
        - { in: body, name: /options/-/id, kind: none }
        - { in: body, name: /blanks/-/id, kind: none }
      x-permission: [content.questions.write, content.tests.write]
      description: Edits the bank copy only. Published versions hold their own snapshot and are unaffected (§7).
      tags: [teacher-questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '200':
          description: Saved. Published versions are unaffected — they hold their own snapshot (§7).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteQuestion
      x-resource:
        - { in: path, name: id, kind: question }
      x-permission: content.questions.write
      tags: [teacher-questions]
      description: Soft delete (§13.2). Version snapshots that reference it keep working.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `QUESTION_REFERENCED` — still referenced by a draft test outline.
            `details.tests` names those drafts as `ReferencingTest[]`, sorted
            by title, so the dialog can link to them (A-06a).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/questions/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: duplicateQuestion
      x-resource:
        - { in: path, name: id, kind: question }
      x-permission: [content.questions.write, content.tests.write]
      tags: [teacher-questions]
      description: |
        A-06a's "Nhân bản": copies the question, its options, blanks and
        tags into a new bank row that no test references yet. A source whose
        media asset has been deleted, or that no longer validates, answers
        `VALIDATION_FAILED` as a create would; nothing is copied.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== teacher/media

  /teacher/imports:
    post:
      operationId: createWordImport
      x-resource:
        - { in: body, name: /requestId, kind: none }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Create an empty private import idempotently
      description: Creates a persistent intake identity without uploading files or starting recognition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWordImport' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: IMPORT_CONFLICT — request identity already used with different input.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: IMPORT_QUOTA_EXCEEDED — configured actor or installation quota reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listWordImports
      x-resource-list: import
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Search private import history
      description: Paginated history of the imports the caller created, for every caller (`scope.all` does not widen it), with accent-insensitive title and current filename search.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Query'
        - name: status
          in: query
          style: form
          explode: true
          description: Repeated statuses are OR-ed; a single status remains valid.
          schema:
            type: array
            items: { $ref: '#/components/schemas/ImportStatus' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Newest imports first, stable ID tie-breaker.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WordImportHistoryItem' }
                      facets: { $ref: '#/components/schemas/ImportStatusFacets' }
  /teacher/imports/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getWordImport
      x-resource:
        - { in: path, name: id, kind: import }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Read an import and its current completed sources
      description: Returns a consistent source-set snapshot and the number of incomplete upload reservations.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordImport' }
        '404':
          description: Import not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /teacher/imports/{id}/sources:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: uploadImportSource
      x-resource:
        - { in: path, name: id, kind: import }
        - { in: query, name: uploadId, kind: none }
      x-permission: content.tests.write
      tags: [teacher-imports]
      summary: Upload a private Word or PDF source and create an immutable source set
      description: |
        One multipart file part named file, at most 25 MiB. The filename ends in
        .docx or .pdf, or in .doc when legacy conversion is enabled (see limits), and
        the detected content must agree with it. A PDF is read from its text layer
        only; a scanned PDF fails processing with PDF_NO_TEXT.
        The body Content-Type is not evidence of the detected document type.
        Retry with identical uploadId, role, expectedRevision, filename and bytes.
        A changed replay conflicts. Completion creates exactly one source revision;
        replay returns its receipt even when later uploads advanced the import.
        Uploads are accepted while the import awaits sources, has failed or is under
        review; a new source set returns it to awaiting_sources, and processing again
        keeps teacher edits. Every storage write first has a durable reservation;
        interruptions remain inspectable and quota-counted.
        Source bytes and storage keys never enter ordinary logs or student payloads.
      x-max-body-bytes: 26345472
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: '#/components/schemas/ImportSourceRole' } }
        - { name: uploadId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: expectedRevision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored and associated with one source revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportUploadReceipt' }
        '400':
          description: Malformed upload; exactly one file part is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Import not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: IMPORT_CONFLICT — stale revision, invalid lifecycle or conflicting upload identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
