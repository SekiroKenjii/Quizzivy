  /teacher/summary:
    get:
      operationId: getTeacherSummary
      x-permission: workspace.teacher
      tags: [teacher-attempts]
      description: Three nav counts in the caller's own teaching scope, Admin included; answersToGrade is null without teaching.grading.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherSummary' }

  # ==================================================== teacher/students+classes

  /teacher/students:
    get:
      operationId: listStudents
      x-resource:
        - { in: query, name: classId, kind: class }
      x-resource-list: student
      x-permission: people.students.read
      description: Backs the §8 students table. CSV import is P1 and deliberately not built (§16).
      tags: [teacher-students]
      parameters:
        - $ref: '#/components/parameters/Query'
        - { name: classId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - name: status
          in: query
          description: |
            Defaults to `active`. Without `disabled` there is no request that can
            return a suspended account, so `updateStudent`'s `disabled: false`
            would be unreachable.
          schema:
            type: string
            enum: [active, disabled, all]
            default: active
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/StudentRow' } }
                      facets: { $ref: '#/components/schemas/StudentFacets' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createStudent
      x-resource:
        - { in: body, name: /classIds/-, kind: class }
      x-permission: people.students.create
      tags: [teacher-students]
      description: |
        Teacher-created accounts get a temporary password and
        `mustChangePassword: true`. Self-signup requires Google (§6.3).

        Every `classIds` entry must be a class the caller teaches, or any class
        with `scope.all`. Anything else answers 404, exactly as a missing class
        does, and nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                fullName: { type: string, minLength: 1, maxLength: 200 }
                classIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '201':
          description: Created. The temporary password is returned **once**.
          content:
            application/json:
              schema:
                type: object
                required: [user, temporaryPassword]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/StudentRow' }
                  temporaryPassword: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EMAIL_TAKEN` — already in use, compared case-insensitively.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/students/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getStudent
      x-resource:
        - { in: path, name: id, kind: student }
      x-permission: people.students.read
      description: A student with their class memberships, linked providers and `joinedVia` (§8).
      tags: [teacher-students]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentRow' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateStudent
      x-resource:
        - { in: path, name: id, kind: student }
      x-permission: people.students.create
      description: |
        Edits profile fields, or disables the account. Disabling blocks login
        without deleting any attempt history. `disabled`, either value, also
        needs `people.users.manage`. A new `email` needs `people.users.manage`
        too unless no one else reaches the student, by the rule
        `resetStudentPassword` states, because a new address can take over the
        account through Google sign-in. Sending the address the student already
        has is not a change. The student's permissions, except
        `learning.take_tests`, must be a subset of the caller's.
      tags: [teacher-students]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                # Bounds match users_email_check and createStudent. Without them
                # a 260-character address passes validation, violates the column
                # CHECK, and surfaces as a 500 rather than a 400.
                email: { type: string, format: email, minLength: 3, maxLength: 254 }
                disabled: { type: boolean }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: |
            `FORBIDDEN` — `disabled` without `people.users.manage`, or a student
            whose permissions are not a subset of the caller's.
            `STUDENT_SHARED` — a new `email` for a student someone else also
            reaches, without `people.users.manage`. Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EMAIL_TAKEN` — another account already uses that address.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/students/{id}/reset-password:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: resetStudentPassword
      x-resource:
        - { in: path, name: id, kind: student }
      x-permission: people.students.reset_password
      tags: [teacher-students]
      description: |
        Sets a temporary password and `mustChangePassword`. There is no
        self-service email reset in v1 — that needs an email provider, which is
        the same dependency §6.3 declines (§5.4, §17.1). Only a student no one
        else reaches may be reset by a teacher: every class they are in,
        archived ones included, is the caller's; no other account created them;
        no other account's assignment targets them individually; and a student
        in no class must have been created by the caller. A holder of
        `people.users.manage` resets any student.
      responses:
        '200':
          description: Reset. Password returned **once**.
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                additionalProperties: false
                properties:
                  temporaryPassword: { type: string }
        '403':
          description: |
            `STUDENT_SHARED` — someone else also reaches the student, so only a
            holder of `people.users.manage` may reset them. `FORBIDDEN` — the
            student's permissions are not a subset of the caller's. Nothing is
            written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      operationId: deleteUser
      x-permission: people.users.manage
      tags: [admin-users]
      description: Permanently deletes a disabled student account only when no assignment, attempt, retained audit record or owned content references it, and only when the student's permissions, except `learning.take_tests`, are a subset of the caller's. Historical identities use the approved manual anonymization process instead.
      responses:
        '204': { description: Deleted. }
        '403':
          description: '`FORBIDDEN` — the student''s permissions are not a subset of the caller''s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `RESOURCE_NOT_ARCHIVED` — the account is not disabled.
            `RESOURCE_REFERENCED` — something still references it, and
            `details.referencedBy` (`ReferencedBy`) always names what:
            `assignments` (an individual assignment target, or an assignment it
            created), `attempts`, `audit` (audit history it acted in),
            `owned_content` (tests, questions, question groups, media, classes,
            join codes, published versions or Word imports it owns or created),
            or `other`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/docs-session:
    post:
      operationId: openDocsSession
      x-permission: system.api_reference
      tags: [admin-docs]
      summary: Open the API reference for fifteen minutes
      description: |
        Sets `quizzivy_docs`, a docs-only session cookie. `/docs` and
        `/docs/openapi.json` answer only to it: 401 without a valid one, 403 for
        a role without `system.api_reference`. The cookie carries a token for the `docs`
        audience signed with its own key, so it is never an access token and an
        access token never opens the docs. `Path=/docs` keeps it off every API
        request, and `SameSite=Strict` still travels on the SPA's same-site
        navigation to the API origin. Admin only, through `system.api_reference`, and
        rate-limited as an operation that mints a credential.
      responses:
        '204':
          description: The docs session is open for fifteen minutes.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_docs=<token>; Path=/docs; Max-Age=900; HttpOnly; Secure; SameSite=Strict`'

  /teacher/classes:
    get:
      operationId: listClasses
      x-resource-list: class
      x-permission: workspace.teacher
      description: |
        Classes, newest first. Paginated and searchable like every other list:
        §1.3 promised single-digit classes, and a development database already
        holds over a hundred, which is what broke the class pickers.
      tags: [teacher-classes]
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Defaults to `active`, so every picker drops archived classes without asking (G-08).
          schema:
            type: string
            enum: [active, joinable, archived, all]
            default: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Class' } }
                      facets: { $ref: '#/components/schemas/ClassFacets' }
    post:
      operationId: createClass
      x-permission: teaching.classes.write
      description: Creates a class. A join code is not issued automatically; rotate to get one (§6.4).
      tags: [teacher-classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'] }
                selfJoinEnabled: { type: boolean, default: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /teacher/classes/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      operationId: deleteClass
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      description: Permanently deletes an archived class and its owned memberships/join codes. Assignment references block deletion; student accounts and papers are retained.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `RESOURCE_NOT_ARCHIVED` — the class is not archived.
            `RESOURCE_REFERENCED` — something still references it, and
            `details.referencedBy` (`ReferencedBy`) always names what:
            `assignments` (an assignment targets the class), `members` (a
            membership in another class came through one of its join codes),
            or `other`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: getClass
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: workspace.teacher
      description: A single class, including its active join code metadata -- but never the code itself (§13.3).
      tags: [teacher-classes]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateClass
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      description: Edits name and description, toggles self-join, or archives and restores. Disabling self-join does not revoke the existing code; use the delete endpoint for that.
      tags: [teacher-classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'] }
                selfJoinEnabled: { type: boolean }
                archived: { type: boolean, description: 'true archives, false restores; either is idempotent.' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/classes/{id}/members:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: listClassMembers
      x-resource:
        - { in: path, name: id, kind: class }
      x-resource-list: student
      x-permission: people.students.read
      tags: [teacher-classes]
      description: |
        Shows `joinedVia` and `joinedAt` so the teacher can spot unexpected
        enrolments — the mitigation §6.5 relies on instead of an approval queue.
        Spec §15 has no endpoint for this. `q` searches name and email.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ClassMember' } }
    post:
      operationId: addClassMember
      x-resource:
        - { in: path, name: id, kind: class }
        - { in: body, name: /userId, kind: student }
      x-permission: teaching.classes.write
      description: |
        Enrols an existing user directly, bypassing the join code. Recorded as
        `joinedVia: admin` so the teacher can tell the two apart.

        `userId` must be an active student the caller reaches. Anything else
        answers 404, whatever the reason, so the answer reveals nothing about
        accounts beyond the caller's reach.
      tags: [teacher-classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201':
          description: 'Added with `joinedVia: admin`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/classes/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    delete:
      operationId: removeClassMember
      x-resource:
        - { in: path, name: id, kind: class }
        - { in: path, name: userId, kind: student }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      description: |
        Revokes access. **Attempts are retained, not deleted** (§6.4), and an
        in-flight attempt is not revoked — eligibility is evaluated at attempt
        creation.

        Idempotent for a user who is not a member: the class ends up in the
        requested state either way. A class that does not exist is still a 404,
        so a typo in the URL does not look like it worked.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/classes/{id}/join-code:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getJoinCode
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      summary: Read the class's active join code
      description: |
        The active code of a class the caller teaches, or of any class under
        `scope.all`, with its metadata (D5). The code is a bearer secret: the
        response is never cached, and the operation is rate-limited like every
        other that reveals one. It is not audited, because the teacher's
        screens show the code on every class card.

        `code` is `null` when the code cannot be read back. A code issued
        before v0.8.0 is held only as a hash (`legacy: true`), and R4 rotates
        those. A code sealed under a key this server no longer holds
        (`legacy: false`) can be neither read nor redeemed. Rotate either to
        get a readable code.

        404 when the class is not the caller's, exactly as a missing class
        answers, or when it has no active code.
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: rotateJoinCode
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      summary: Issue a new join code, revoking the old one
      description: |
        Revoke-and-issue happens in **one transaction**, so the one-active-code-
        per-class constraint cannot be violated. Previously enrolled students are
        unaffected (§6.1).

        The plaintext code is returned here, and `getJoinCode` reads it again.
        It is stored encrypted under a key the database does not hold, with a
        keyed hash to find it, so a database dump does not hand over class
        access (§13.3).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
                maxUses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 40
                  description: |
                    Defaults to 40 rather than spec §6.1's `null = unlimited`
                    (O-06). The realistic threat to a bearer code is being
                    *forwarded*, not guessed, and a use cap is the mitigation
                    that costs nothing.

                    **Not nullable on the way in, unlike the stored column.**
                    A nullable request field cannot express what it promises:
                    an omitted field and an explicit `null` both arrive as "no
                    value", so "unlimited" would have been indistinguishable
                    from "use the default" and one of the two would silently
                    never happen. A cap of 1000 covers every real cohort, and
                    the column stays nullable for codes issued before this.
      responses:
        '201':
          description: Issued.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, maxUses]
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Plaintext, grouped `XXXX-XXXX`. `getJoinCode` reads it again.
                    examples: ['K7M3-P9QR']
                  expiresAt: { $ref: '#/components/schemas/Timestamp' }
                  maxUses: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeJoinCode
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      description: |
        Revokes without issuing a replacement, and sets `selfJoinEnabled: false`
        (§6.4). Both, or neither: a revoked code with self-join still on
        advertises a flow that cannot succeed, and a cleared flag without the
        revocation leaves a live bearer secret the teacher believes is cancelled.

        Idempotent. A class with no active code still returns 204 — "there is no
        way in" is the requested state, and reporting failure would invite a
        retry that changes nothing.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =================================================================== student

  /app/classes:
    get:
      operationId: listMyClasses
      x-permission: learning.take_tests
      description: Classes the signed-in student belongs to. Backs §9 `/app/classes`.
      tags: [student]
      responses:
        '200':
          description: The student's own view of each class; never a join code.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyClass' } }

  /app/classes/join:
    post:
      operationId: joinClass
      x-permission: learning.take_tests
      tags: [student]
      summary: Enrol with a code, already signed in
      description: |
        The already-authenticated half of §6.2 — a student who hits `/join/:code`
        while logged in skips straight here. Idempotent when already a member.
        Every enrolment is audited with ip and user agent (§6.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinCode]
              additionalProperties: false
              properties:
                joinCode: { type: string, minLength: 8, maxLength: 9 }
      responses:
        '200':
          description: Enrolled, or already a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Invalid, expired, exhausted or revoked. Same leak rules as `/join/preview`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perCode: { perHour: 200 }

  /app/assignments:
    get:
      operationId: listMyAssignments
      x-permission: learning.take_tests
      tags: [student]
      description: The three §9 sections — **Đến hạn**, **Sắp tới**, **Đã hoàn thành**.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [dueNow, upcoming, completed]
                additionalProperties: false
                properties:
                  dueNow: { type: array, items: { $ref: '#/components/schemas/StudentAssignmentCard' } }
                  upcoming: { type: array, items: { $ref: '#/components/schemas/StudentAssignmentCard' } }
                  completed: { type: array, items: { $ref: '#/components/schemas/StudentAssignmentCard' } }

  /app/assignments/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getMyAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: learning.take_tests
      tags: [student]
      summary: Intro page
      description: |
        Everything the intro must state before the student starts: duration,
        attempts used and allowed, review policy, **the integrity rules in plain
        language**, and the audio rules if the test has listening questions
        ("Mỗi câu nghe được phát tối đa 2 lần") (§9, §10.2).

        Announced, visible, never silent — a student is never surprised by a rule
        mid-test.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentAssignmentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================= take-test

  /app/assignments/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: startOrResumeAttempt
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: body, name: /resume, kind: attempt }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Create or resume an attempt
      description: |
        Idempotent under a double tap: a partial unique index permits one live
        attempt per (assignment, student), so the second insert loses the race
        and the handler resumes instead of erroring.

        Resuming issues a **new** `sessionId` and records a `resume` event — and
        a `session_takeover` event if the previous session was still live. The
        superseded session finds out on its next write, via `SESSION_SUPERSEDED`
        (§10.1, E2E 7).

        `deadlineAt` is computed server-side as
        `min(now + durationMinutes, closesAt)` and is authoritative. The client
        derives remaining time from it plus the `serverTime` offset, never from
        the device clock.

        A caller that means to continue a known attempt sends `resume`; a
        Continue button must, so that an attempt whose time ran out while the
        page was open is not answered with a new one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resume:
                  $ref: '#/components/schemas/Uuid'
                  description: >-
                    The attempt the caller means to continue. With it the
                    operation never starts an attempt: when this attempt is no
                    longer the live one it answers `ATTEMPT_CLOSED`.
      responses:
        '200':
          description: Created, or resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `ATTEMPT_CLOSED` — `resume` named an attempt that is no longer live;
            nothing was started.

            `ASSIGNMENT_NOT_OPEN` or `ATTEMPT_LIMIT_REACHED`.

            `MAINTENANCE_SCHEDULED` — a new attempt would run into a maintenance
            window. `details.startsAt` and `details.endsAt` name it. Resuming an
            attempt never answers this.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: query, name: session, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: The take-test payload
      description: |
        **In the student flow, test content is fetched only through here** (§7).

        The response contains no `isCorrect`, no `sampleAnswer`, no
        `acceptedAnswers` and no `transcript` — at any depth. This is asserted by
        a contract test over this file, a Go unit test that walks the live JSON,
        and E2E 9 (§13.5, §14). None of those three may be weakened.

        A tab that names a session the attempt no longer has is answered with
        the paper and `superseded: true`: it may read and may not write, until
        the student continues the attempt there (`startOrResumeAttempt`). That
        answer replaces no beacon token and records nothing. A tab that names
        the attempt's session, or none, is answered as the tab that holds it.
      parameters:
        - name: session
          in: query
          required: false
          description: |
            The session this tab holds for the attempt: the `sessionId` of the
            last answer it was given by this operation or by
            `startOrResumeAttempt`. A tab that holds none sends none.
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /app/attempts/{id}/answers:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      operationId: saveAnswers
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /sessionId, kind: none }
        - { in: body, name: /answers/+, kind: version-question }
        - { in: body, name: /answers/*/optionIds/-, kind: none }
        - { in: body, name: /events/-/questionId, kind: version-question }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Autosave answers and flush buffered events
      description: |
        Answers and events land in **one transaction**, so a partial flush cannot
        record an event for an answer that was not saved.

        Events are inserted `ON CONFLICT DO NOTHING` on
        `(attempt, session, clientSeq)`, so a retried batch is a no-op rather
        than a failure (D-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              additionalProperties: false
              properties:
                sessionId: { $ref: '#/components/schemas/Uuid' }
                answers:
                  type: object
                  description: Keyed by the version question's id.
                  propertyNames: { $ref: '#/components/schemas/Uuid' }
                  additionalProperties: { $ref: '#/components/schemas/Answer' }
                events:
                  type: array
                  items: { $ref: '#/components/schemas/IntegrityEventInput' }
                  maxItems: 500
      responses:
        '200':
          description: |
            Saved. `serverTime` is returned every time so the client's clock
            offset self-corrects, and `deadlineAt` is the attempt's deadline as
            it stands now, so a teacher's extension or a maintenance window
            reaches an open attempt on its next autosave.
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, savedAt, deadlineAt]
                additionalProperties: false
                properties:
                  serverTime: { $ref: '#/components/schemas/Timestamp' }
                  savedAt: { $ref: '#/components/schemas/Timestamp' }
                  deadlineAt: { $ref: '#/components/schemas/Timestamp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `SESSION_SUPERSEDED` — opened elsewhere; the client goes read-only
            with a plain explanation rather than throwing.
            `DEADLINE_PASSED` — the client should submit.
            `ATTEMPT_CLOSED` — already submitted or voided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /app/attempts/{id}/events:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: flushEvents
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /sessionId, kind: none }
        - { in: body, name: /events/-/questionId, kind: version-question }
      tags: [take-test]
      summary: Standalone event flush, including the sendBeacon path
      description: |
        Two content types, because `navigator.sendBeacon` cannot set request
        headers:

        - `application/json` with a normal `Authorization` header, for ordinary flushes.
        - `text/plain` carrying `beaconToken` in the body, for the `pagehide`
          flush. `text/plain` is CORS-safelisted, so the request skips preflight —
          necessary, because a preflight on unload is not reliably delivered.

        The beacon token grants **append-only event access** and nothing else, so
        the weaker credential buys no additional authority.

        Fire-and-forget: this is best-effort by design and a failure here must
        never block answering or submitting (§10.6).
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, events]
              additionalProperties: false
              properties:
                sessionId: { $ref: '#/components/schemas/Uuid' }
                events: { type: array, items: { $ref: '#/components/schemas/IntegrityEventInput' }, maxItems: 500 }
          text/plain:
            schema:
              type: string
              description: |
                JSON encoded as text: `{ beaconToken, sessionId, events }`. Sent
                as a `Blob` with type `text/plain` from `navigator.sendBeacon`.
      responses:
        '202':
          description: Accepted. Always 202 — the client cannot act on the outcome anyway.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /app/attempts/{id}/audio-play:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: recordAudioPlay
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /questionId, kind: version-question }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Increment the server-authoritative play counter
      description: |
        The obvious client-side counter resets on reload, which makes `maxPlays`
        meaningless — so the count lives here (§11.4).

        **Never rejects a play.** Playback is optimistic: a failed POST does not
        block audio, and a student who goes offline to farm replays leaves a gap
        in the event log, which is what the integrity timeline is for. Blocking
        on a round trip would punish bad wifi far more often than it would catch
        anyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId]
              additionalProperties: false
              properties:
                questionId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: '`plays` may exceed `maxPlays`. That is reported to the teacher, not enforced.'
          content:
            application/json:
              schema:
                type: object
                required: [plays, maxPlays]
                additionalProperties: false
                properties:
                  plays: { type: integer, minimum: 1 }
                  maxPlays: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /app/attempts/{id}/group-audio-play:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: recordGroupAudioPlay
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /recordingId, kind: version-recording }
        - { in: body, name: /playId, kind: none }
        - { in: body, name: /sessionId, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Record one shared listening gesture, deduplicating retries
      description: |
        Counts a frozen recording bound to this attempt's version. Every distinct
        playId increments its shared counter and appends one server audio_play
        event in the same transaction. Retrying the same playId and recording
        returns the current count without another increment/event. Reusing a
        playId for another recording is PLAY_ID_CONFLICT.

        Requires the current writable session, like answer autosave. Playback
        remains synchronous and optimistic; no network round trip gates audio.
        Counts may exceed maxPlays and never block playback or submission.
        Legacy per-question playback uses the existing audio-play endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAudioPlayInput' }
      responses:
        '200':
          description: Current server count, including any plays beyond the configured allowance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAudioPlayResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SESSION_SUPERSEDED, ATTEMPT_CLOSED, DEADLINE_PASSED or PLAY_ID_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: submitAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /sessionId, kind: none }
      x-permission: learning.take_tests
      tags: [take-test]
      description: |
        **Idempotent.** A second call on an already-closed attempt is `409
        ATTEMPT_CLOSED`, and a race between a manual tap and an auto-submit
        yields one submission.

        Objective types are graded immediately; `short_answer` is marked
        `requiresManual`. Nothing is rejected based on audio play count (§11.4).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sessionId: { $ref: '#/components/schemas/Uuid' }
                reason:
                  type: string
                  enum: [manual, timer_expired, auto_submit]
                  default: manual
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `ATTEMPT_CLOSED`.

            `DEADLINE_NOT_REACHED` — `reason` was `timer_expired` while the
            attempt's deadline is still more than five seconds away, which
            happens when the deadline moved after the client last saved.
            `details.deadlineAt` is the deadline to wait for; nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/attempts/{id}/result:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAttemptResult
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Post-submission review
      description: |
        Honours the assignment's review policy. Suppressed fields are **absent**,
        not nulled-and-hidden, so no client fallback can surface them.

        Question `transcript` and shared-context transcripts appear here only
        after submission, gated by each question/recording's own
        `showTranscriptAfterSubmit` (§11.3, §13.5). `sampleAnswer` never appears
        at all. Material and shared play counts do not depend on score/key flags.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [attempt, review, testTitle, maxAttempts, sections, questions]
                additionalProperties: false
                properties:
                  attempt: { $ref: '#/components/schemas/Attempt' }
                  review: { $ref: '#/components/schemas/ReviewPolicy' }
                  testTitle: { type: string }
                  maxAttempts: { type: integer, minimum: 1, description: For "Lượt 1/2" under the score (S-09). }
                  sections:
                    type: array
                    items: { $ref: '#/components/schemas/StudentSection' }
                    description: >-
                      The paper's parts in test order, as the attempt showed
                      them. The page sums each part's `earned` from the
                      questions whose `sectionId` names it; no review policy
                      hides a part's title or membership.
                  questions: { type: array, items: { $ref: '#/components/schemas/ResultQuestion' } }
                  sharedContext: { $ref: '#/components/schemas/SharedReviewContext' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`ATTEMPT_IN_PROGRESS` — not yet submitted; `ATTEMPT_VOIDED` — nothing to show.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /app/media/{assetId}/url:
    parameters:
      - { name: assetId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      operationId: getMediaUrl
      x-resource:
        - { in: path, name: assetId, kind: media }
      x-permission: learning.take_tests
      tags: [take-test]
      summary: Mint a short-lived signed URL
      description: |
        10-minute signature, minted per request (§11.2). A student may only mint
        a URL for an asset reachable from an attempt they own — checked against
        the version questions, not by asset id alone.

        The client fetches this **before** enabling the play button, never inside
        the click handler: iOS Safari requires `.play()` to run synchronously in
        the gesture, so awaiting anything first would break playback (§11.3).
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: |
                `private, max-age=600` (§11.2) — long enough to survive a replay,
                short enough that the cache entry cannot outlive the signature it
                holds. The TTL and this max-age are the same number on purpose;
                they are set from one constant server-side.
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                additionalProperties: false
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { $ref: '#/components/schemas/Timestamp' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ======================================================================== me

  /me/notifications:
    get:
      operationId: listNotifications
      x-resource:
        - { in: query, name: before, kind: none }
      x-permission: self
      tags: [me]
      summary: The caller's notifications, newest first
      description: |
        The caller's own notifications and nobody else's, read or unread,
        newest first. A notification first written more than 180 days ago is
        deleted, once a day.

        Paged by a cursor, not by a page number: ask again with `before` set
        to `nextBefore` for the next older page. Ids are time-ordered, so a
        notification written while the caller pages never moves a row from one
        page to the next.
      parameters:
        - name: before
          in: query
          required: false
          description: |
            A notification id, as `nextBefore` gave it: the page holds the
            caller's notifications older than it. It is a position in the
            caller's own list and never a lookup: an id the caller does not
            hold, another user's or nobody's, only bounds the page, which
            still holds the caller's rows alone.
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page. An empty `items` when the caller has none, or none older than `before`.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextBefore]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Notification' }
                  nextBefore:
                    type: [string, 'null']
                    format: uuid
                    description: The id of the last item when older notifications exist, else null.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      x-resource:
        - { in: body, name: /ids/-, kind: notification }
      x-permission: self
      tags: [me]
      summary: Mark the caller's notifications read
      description: |
        With `ids`, marks those of the caller's notifications that are unread;
        without it, every unread one. A notification already read keeps the
        time it was first read.

        It marks the caller's own notifications only. An id that is another
        user's, already read or not a notification at all is skipped, and the
        answer is the same 204 whatever matched, so it tells the caller
        nothing about an id that is not theirs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Uuid' }
                  description: Absent means every unread notification the caller has.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/summary:
    get:
      operationId: getMySummary
      x-permission: self
      tags: [me]
      summary: The counts the caller's shell shows
      description: |
        How many of the caller's notifications are unread: the dot on the
        bell. One count over the caller's own rows, cheap enough to poll.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      x-permission: self
      tags: [me]
      summary: The caller's notification switches
      description: |
        All five switches, whatever the caller's role. One the caller never
        saved answers its default: `inApp` true and `email` false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateNotificationPreferences
      x-permission: self
      tags: [me]
      summary: Replace the caller's notification switches
      description: |
        Takes all five switches at once, each event exactly once and in any
        order, and stores them for the caller. A client that draws only some
        of them sends the others back as it read them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Saved. The five switches as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400':
          description: '`VALIDATION_FAILED`: an event is unknown, repeated or missing, or the body is not the five switches.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
