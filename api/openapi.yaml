openapi: 3.1.0

info:
  title: Quizzivy API
  version: 0.1.0
  contact:
    name: Thuong
    url: https://github.com/SekiroKenjii/Quizzivy
  description: |
    The contract both the React SPA and the Go backend implement.

    **This file supersedes spec §15**, which documented an assumed surface.
    Where they differ, this file wins and the spec gets corrected (§18).

    Everything else is generated from here: `oapi-codegen` produces the Go
    server interfaces, `openapi-typescript` produces the TS types, and MSW
    fixtures are validated against these schemas. CI regenerates and fails on
    drift. Change the contract here first, then `make gen`.

    Non-upload request bodies are capped at 1 MiB before schema validation;
    oversized bodies receive HTTP 413 with the standard validation-error envelope.
    A body the server could not finish reading receives HTTP 408 with
    `REQUEST_INCOMPLETE`.
    Multipart media uploads retain their separate upload limits.

    ## Reading this file

    - Operations with `security: []` are **public**. Spec §6.5 requires every
      one of them to be rate-limited; the server asserts this at startup by
      cross-referencing this file, so adding a public operation without a
      limiter fails the process rather than shipping.
    - Paths are split by audience: `/teacher/*` is the teaching workspace,
      `/admin/*` the Admin console, `/app/*` the student app, and `/auth/*`
      the caller's own session. `/public/*` and `/join/*` hold open operations
      only, and `/me/*` holds the caller's own notifications and settings,
      whatever their role. Each
      tree accepts only the permissions that belong to it, and the server
      refuses to start when an operation's `x-permission` does not fit its
      tree.
    - Every operation that requires a bearer token declares the permission it
      needs in `x-permission`, in one of three forms:
      - a `PermissionKey`;
      - a pseudo-key: `self` (any signed-in user), `workspace.teacher` (any
        `content.*`, `teaching.*` or `people.students.*` key) or
        `workspace.admin` (`people.users.manage`, `people.roles.manage`,
        `system.audit.read`, `system.settings.write` or `scope.all`);
      - a list, met by any one of its keys. A list is used only where one
        operation serves two matrix rows, and the server narrows the check
        when the body decides which row applies.

      An operation that does not require the bearer token (the seven open
      operations) declares none. The server refuses to start when an
      operation breaks this, and a hidden key (`scope.all`,
      `system.api_reference`, `system.data_export`, `system.leads`) may appear
      only under `/admin/`.
    - Every uuid-typed path, query or body field under `/teacher/*`, `/app/*`
      and `/me/*`, and every key of a body map whose `propertyNames` is
      `Uuid`, is named in its operation's `x-resource` list as
      `{in, name, kind}`. For a body field `name` is a JSON pointer, where `-`
      stands for every item of an array, `*` for every value of a map and `+`
      for every key of a map.
      `kind` is the owned resource the id names: `test`, `test-version`,
      `section`, `question`, `version-question`, `version-recording`,
      `question-group`, `media`, `import`, `import-source`, `class`,
      `assignment`, `attempt`, `student` or `notification`. The two `version-` kinds are a
      question and a group recording of a published version, as grading and
      the student's autosave, events and plays name them. A section unit's
      `id` names a question or a group, as its `kind` says, and is declared
      as a question; the suite checks the group branch separately.
      `kind` is `none` for an id that names no owned resource: an option, a
      gap, a session, an idempotency key, a fresh identity the caller
      supplies, a cursor that only marks a position in the caller's own list
      (`before` on `listNotifications`), or an id the operation resolves only
      inside the resource its path names, such as a group's own members on
      `updateQuestionGroup`.
      Every `/teacher/*` list names the kind it lists in `x-resource-list`.
      The two-teacher isolation suite reads both: another owner's id answers
      exactly as a missing id does.
    - Student-facing schemas are deliberately separate components from teacher
      ones. See `StudentQuestion` for why.
    - All timestamps are RFC 3339 UTC. Rendering in `Asia/Ho_Chi_Minh` is the
      client's job (§13.2).
    - During a maintenance window every operation except `GET /livez`,
      `GET /healthz` and `GET /public/status` answers `503 MAINTENANCE`
      (`components/responses/Maintenance`). The operations the client branches
      on declare it; every other one may answer it all the same.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.quizzivy.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: public
    description: |
      Unauthenticated. Rate-limited per §6.5, and every response is leak-reviewed:
      no class, student or test is enumerable through them.
  - name: auth
  - name: teacher-tests
  - name: teacher-questions
  - name: teacher-imports
    description: Private Word source intake and durable import review.
  - name: teacher-media
  - name: teacher-assignments
  - name: teacher-attempts
  - name: teacher-students
  - name: teacher-classes
  - name: admin-users
    description: The Admin console's people operations. In R2 only the deletion of a student account lives here.
  - name: admin-docs
    description: Admin access to the API reference served beside the API.
  - name: student
  - name: take-test
  - name: me
    description: |
      The caller's own notifications and notification switches, for any
      signed-in user. Every operation reads and writes the caller's rows only:
      none takes a user id, and none answers 403 or 404 for an id.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ~15 minute access token, held in memory only — never `localStorage`,
        never `sessionStorage` (§5.2). On 401 the client calls `/auth/refresh`
        once and retries; a second 401 logs out.
    refreshCookie:
      type: apiKey
      in: cookie
      name: quizzivy_refresh
      description: |
        Opaque, rotating, `httpOnly; Secure; SameSite=Lax; Path=/auth`, and
        host-only — no `Domain` attribute, so only the API host receives it.
        `SameSite=Lax` is sufficient because the SPA and the API are subdomains
        of one registrable domain and are therefore same-site.

        Presenting an already-rotated token revokes the whole family (§5.2).

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: |
        1-based page number. Lists are OFFSET-paginated so a client can draw
        numbered pages (O-20 overrides §13.8's keyset rule for the teacher's
        lists: at this scale the teacher wants "trang 3 / 26" more than
        stability under concurrent inserts). A page past the end is an empty
        `items` with the same `total`.

        Page size is `limit`, declared per operation with its own default -- a
        media grid wants a different page from a table of tests. The response
        echoes the size actually used as `pageSize`; compute page counts from
        that and `total`, never from an assumed size.
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    Query:
      name: q
      in: query
      required: false
      description: Free-text search. Accent-insensitive (D-11) — `phat am` matches `phát âm`.
      schema: { type: string, maxLength: 200 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

  responses:
    BadRequest:
      description: |
        Request validation answers this on every operation that takes a JSON body,
        before the operation runs: a body that fails its schema, that cannot be
        decoded, or that is not JSON.
        Malformed or failing validation. A JSON body in which an object repeats
        a member name is refused here too, at any depth, unless the server
        filled a default into that body: it is then read with the last
        occurrence of each repeated name.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid or expired access token. Client refreshes once, then logs out.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: |
        Authenticated but not permitted: the caller's role lacks the operation's
        `x-permission`, as a `student` reaching a `/teacher/*` route does. It
        gets this, and the client renders a 403 page rather than redirecting —
        a redirect hides the misconfiguration (§5.4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such resource, or the caller may not know it exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded (§6.5).
      headers:
        Retry-After:
          required: true
          description: Seconds until the caller may retry.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Maintenance:
      description: |
        `MAINTENANCE` — a maintenance window is under way. `details.startsAt` and
        `details.endsAt` name it, and `Retry-After` is the seconds until it ends.
        Any operation except `GET /livez`, `GET /healthz` and `GET /public/status`
        may answer this, whatever its authentication.
      headers:
        Retry-After:
          required: true
          description: Seconds until the window ends.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NoContent:
      description: Success, no body.

  schemas:
    ContentDocument:
      description: |
        Versioned learner content, independent of editor JSON. This additive contract
        is not yet accepted by question writes. Validate with the content domain
        validator as well as JSON Schema: unique gaps, rectangular non-overlapping
        table spans, no nested tables, list-leading paragraphs, unordered start=1,
        no simultaneous super/subscript, consistent asset kinds, Unicode scalar strings
        without NUL, and aggregate budgets. Unknown fields are errors, never silently stripped.
        Asset IDs are references only; authorization, existence, kind and deletion
        locks belong to the enclosing write. This schema grants no asset access.
      x-content-limits:
        bytes: 1048576
        nodes: 2048
        depth: 16
        values: 24576
        strings: 200000
        text: 100000
        url: 2000
        rows: 50
        columns: 12
      oneOf:
        - $ref: '#/components/schemas/LegacyMarkdownContent'
        - $ref: '#/components/schemas/SemanticContent'
      discriminator:
        propertyName: format
        mapping:
          legacy_markdown_v1: '#/components/schemas/LegacyMarkdownContent'
          semantic_v1: '#/components/schemas/SemanticContent'
    LegacyMarkdownContent:
      type: object
      additionalProperties: false
      required: [format, markdown]
      properties:
        format: { type: string, enum: [legacy_markdown_v1] }
        markdown: { type: string, maxLength: 100000 }
    SemanticContent:
      type: object
      additionalProperties: false
      required: [format, blocks]
      properties:
        format: { type: string, enum: [semantic_v1] }
        blocks: { $ref: '#/components/schemas/ContentBlocks' }
    ContentBlocks:
      type: array
      minItems: 1
      maxItems: 2048
      items: { $ref: '#/components/schemas/ContentBlock' }
    ContentBlock:
      oneOf:
        - $ref: '#/components/schemas/ContentParagraph'
        - $ref: '#/components/schemas/ContentHeading'
        - $ref: '#/components/schemas/ContentList'
        - $ref: '#/components/schemas/ContentTable'
        - $ref: '#/components/schemas/ContentImage'
        - $ref: '#/components/schemas/ContentAudio'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/ContentParagraph'
          heading: '#/components/schemas/ContentHeading'
          list: '#/components/schemas/ContentList'
          table: '#/components/schemas/ContentTable'
          image: '#/components/schemas/ContentImage'
          audio: '#/components/schemas/ContentAudio'
    ContentInlines:
      type: array
      maxItems: 2048
      items: { $ref: '#/components/schemas/ContentInline' }
    ContentInline:
      oneOf:
        - $ref: '#/components/schemas/ContentText'
        - $ref: '#/components/schemas/ContentBreak'
        - $ref: '#/components/schemas/ContentGap'
        - $ref: '#/components/schemas/ContentLink'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/ContentText'
          break: '#/components/schemas/ContentBreak'
          gap: '#/components/schemas/ContentGap'
          link: '#/components/schemas/ContentLink'
    ContentMark:
      type: string
      enum: [bold, italic, underline, strike, superscript, subscript]
    ContentText:
      type: object
      additionalProperties: false
      required: [type, text, marks]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string, minLength: 1, maxLength: 100000 }
        marks:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { $ref: '#/components/schemas/ContentMark' }
    ContentBreak:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [break] }
    ContentGap:
      type: object
      additionalProperties: false
      required: [type, id, label]
      properties:
        type: { type: string, enum: [gap] }
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 32 }
    ContentLink:
      type: object
      additionalProperties: false
      required: [type, href, content]
      properties:
        type: { type: string, enum: [link] }
        href:
          type: string
          maxLength: 2000
          description: Explicit HTTPS navigation with ASCII DNS-style host labels and optional port 1–65535. International hosts must be punycoded; IPv6 literals are not supported in this version. No credentials, whitespace, controls, backslashes or malformed percent escapes. Never fetched during parsing or rendering.
        content:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/ContentText' }
    ContentParagraph:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [paragraph] }
        content: { $ref: '#/components/schemas/ContentInlines' }
    ContentHeading:
      type: object
      additionalProperties: false
      required: [type, level, content]
      properties:
        type: { type: string, enum: [heading] }
        level: { type: integer, enum: [1, 2, 3] }
        content: { $ref: '#/components/schemas/ContentInlines' }
    ContentList:
      type: object
      additionalProperties: false
      required: [type, ordered, start, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean }
        start: { type: integer, minimum: 1, maximum: 9999 }
        items:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/ContentBlocks' }
    ContentTable:
      type: object
      additionalProperties: false
      required: [type, rows]
      properties:
        type: { type: string, enum: [table] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            maxItems: 12
            items: { $ref: '#/components/schemas/ContentCell' }
    ContentCell:
      type: object
      additionalProperties: false
      required: [header, rowSpan, colSpan, content]
      properties:
        header: { type: boolean }
        rowSpan: { type: integer, minimum: 1, maximum: 50 }
        colSpan: { type: integer, minimum: 1, maximum: 12 }
        content: { $ref: '#/components/schemas/ContentBlocks' }
    ContentImage:
      type: object
      additionalProperties: false
      required: [type, assetId, alt]
      properties:
        type: { type: string, enum: [image] }
        assetId: { type: string, format: uuid }
        alt: { type: string, minLength: 1, maxLength: 1000 }
    ContentAudio:
      type: object
      additionalProperties: false
      required: [type, assetId, label]
      properties:
        type: { type: string, enum: [audio] }
        assetId: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }

    # ------------------------------------------------------------------ core

    Uuid:
      type: string
      format: uuid
      description: uuidv7 — time-ordered, so `id DESC` is a valid recency sort (§13.2).
      examples: ['019535d9-3df7-79fb-b466-fa907fa17f9e']

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC. Rendered in `Asia/Ho_Chi_Minh` by the client.

    Points:
      type: number
      format: double
      description: |
        numeric(8,2) — never a float (§13.2). Stored and compared as an exact
        decimal server-side; this is the wire representation.

        `format: double` is load-bearing rather than decoration. Without it
        oapi-codegen generates `float32`, which holds about 7 significant
        decimal digits — and the maximum below needs 8. `999999.99` round-trips
        through a float32 as `1000000`, a value this very schema rejects, and
        `12345.67` becomes `12345.669921875`. Points are summed to produce a
        test's total, so that error accumulates across a paper. `double` gives
        Go a float64 and leaves TypeScript's `number` unchanged, since a JS
        number is already a float64.
      minimum: 0
      maximum: 999999.99

    PublicStatus:
      type: object
      description: What `GET /public/status` answers.
      required: [maintenance]
      additionalProperties: false
      properties:
        maintenance:
          description: The next maintenance window that has not ended, or `null`.
          oneOf: [{ $ref: '#/components/schemas/MaintenanceWindow' }, { type: 'null' }]

    MaintenanceWindow:
      type: object
      required: [startsAt, endsAt, active]
      additionalProperties: false
      properties:
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { $ref: '#/components/schemas/Timestamp' }
        active: { type: boolean, description: True while the window is under way. }

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable. **The only thing clients branch on.** Copy is
        driven by `message`, never reconstructed from this, with two exceptions
        the web app words itself, as the design deck draws them:
        `INVALID_CREDENTIALS` on the sign-in page and `PASSWORD_UNCHANGED` on
        the change-password forms. The server still sends a localised `message`
        for both, for any other client.

        Two codes answer requests this contract does not describe, with this
        envelope: `NOT_FOUND` (404) for a path outside it, and
        `METHOD_NOT_ALLOWED` (405, with an `Allow` header) for a path of it
        under a method the path does not serve. `HEAD` is served as `GET`
        without a body on the operations that need no token.

        `REQUEST_INCOMPLETE` (408) answers a request whose body the server
        could not finish reading, on any operation that takes a body other than
        a streamed upload. It says nothing about the body: the same request may
        be sent again.
      enum:
        # auth
        - INVALID_CREDENTIALS
        - ACCOUNT_NOT_PROVISIONED
        - ACCOUNT_DISABLED
        - EMAIL_NOT_VERIFIED
        - PASSWORD_REQUIRED
        - PASSWORD_UNCHANGED
        - IDENTITY_ALREADY_LINKED
        - LAST_LOGIN_METHOD
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        # join codes — distinct, but see JoinPreviewResponse on what they may not carry
        - JOIN_CODE_INVALID
        - JOIN_CODE_EXPIRED
        - JOIN_CODE_EXHAUSTED
        - JOIN_CODE_REVOKED
        # students
        - EMAIL_TAKEN
        - STUDENT_SHARED
        # authoring
        - RESOURCE_REFERENCED
        - RESOURCE_NOT_ARCHIVED
        - VERSION_IS_CURRENT
        - TEST_NOT_PUBLISHED
        - TEST_ARCHIVED
        - GROUP_OUTLINE_REQUIRED
        - GROUP_CONFLICT
        - PUBLISH_VALIDATION_FAILED
        - STALE_WRITE
        - PLAY_ID_CONFLICT
        - QUESTION_REFERENCED
        - MEDIA_REFERENCED
        - MEDIA_TYPE_UNSUPPORTED
        - MEDIA_TOO_LARGE
        - MEDIA_TOO_LONG
        - MEDIA_UNREADABLE
        - MEDIA_KIND_MISMATCH
        - MEDIA_QUOTA_EXCEEDED
        # Word imports
        - IMPORT_CONFLICT
        - IMPORT_QUOTA_EXCEEDED
        - IMPORT_BUSY
        - IMPORT_SOURCE_INVALID
        - IMPORT_SOURCE_TOO_LARGE
        - IMPORT_SOURCE_UNSUPPORTED
        - IMPORT_NOT_READY
        - IMPORT_NOT_PROCESSED
        - IMPORT_PROCESSING_UNAVAILABLE
        - IMPORT_FILES_REMOVED
        # attempts
        - ASSIGNMENT_NOT_OPEN
        - ASSIGNMENT_NOT_CLOSED
        - ATTEMPT_LIMIT_REACHED
        - ATTEMPT_CLOSED
        - ATTEMPT_IN_PROGRESS
        - ATTEMPT_VOIDED
        - SESSION_SUPERSEDED
        - DEADLINE_PASSED
        - DEADLINE_NOT_REACHED
        - GRADING_INCOMPLETE
        - VERSION_LOCKED
        # availability
        - MAINTENANCE
        - MAINTENANCE_SCHEDULED
        # generic
        - VALIDATION_FAILED
        - REQUEST_INCOMPLETE
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - UNAUTHORIZED
        - FORBIDDEN
        - RATE_LIMITED
        - INTERNAL

    ErrorDetail:
      type: object
      description: |
        Extracted so a response carrying the envelope AND something else can
        reference it without composing over a closed schema (issue #41).
      required: [code, message, requestId]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: |
            Copy for the user, written by the server in the language
            `Accept-Language` prefers: Vietnamese by default, including when
            the header is absent or names neither language, and English when
            it prefers English. Display it; do not build copy from `code`,
            except for the two codes the `ErrorCode` description names.
          examples: ['Mã lớp không hợp lệ.']
        details:
          type: object
          additionalProperties: true
          description: |
            Shape depends on `code`. Field-level validation errors land here
            as `{ field: message }` for react-hook-form.

            The per-field sentences the rules word for a refused question,
            test or assignment, and the `message` of each publish violation
            they produce (every one but that of a test with no part at all),
            are Vietnamese whatever the header says (issue 284). A per-field
            sentence the operation words itself follows the header, as
            `message` does.
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: The copyable error ID shown by the global error boundary (§9).

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    PageInfo:
      type: object
      description: |
        The paging half of every list envelope. `total` counts the rows that
        match the CURRENT filters -- the number the page count is drawn from
        -- and is present even on an empty page past the end.
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    ImportStatus:
      type: string
      enum: [awaiting_sources, queued, processing, needs_review, committing, committed, failed, cancelled]
    ImportSourceRole:
      type: string
      enum: [exam, answer_key]
    ImportSource:
      type: object
      additionalProperties: false
      required: [id, role, filename, format, bytes, sha256, uploadedBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ImportSourceRole' }
        filename: { type: string, minLength: 1, maxLength: 255 }
        format: { type: string, enum: [docx, doc, pdf, text] }
        characters: { type: integer, minimum: 1, maximum: 100000 }
        bytes: { type: integer, format: int64, minimum: 1, maximum: 26214400 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uploadedBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
      oneOf:
        - properties:
            format: { enum: [text] }
          required: [characters]
        - properties:
            format: { enum: [docx, doc, pdf] }
          not: { required: [characters] }
    PasteImportSource:
      type: object
      additionalProperties: false
      required: [uploadId, expectedRevision, text]
      properties:
        uploadId: { $ref: '#/components/schemas/Uuid' }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 100000, pattern: '\S' }
    WordImport:
      type: object
      additionalProperties: false
      required: [id, title, status, revision, sourceRevision, sources, pendingUploads, createdBy, createdAt, updatedAt]
      description: |
        Belongs to the teacher who created it (`createdBy`). `scope.all` reaches
        any import by id; the history (`listWordImports`) holds only the
        caller's own.
        Sources are private originals, never learner media. Source revision zero
        means no completed source set. Upload completion does not mean recognition.
        Pending uploads are durable reservations and cannot be downloaded or processed.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/ImportStatus' }
        revision: { type: integer, format: int64, minimum: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        sources:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/ImportSource' }
        pendingUploads: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        run: { $ref: '#/components/schemas/ImportRun' }
        draftRevision:
          type: integer
          format: int64
          minimum: 0
          description: Zero until processing has produced a reviewable draft.
        testId:
          $ref: '#/components/schemas/Uuid'
          description: The draft test created by commit.
        filesRemovedAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When retention removed this import's original files and review draft.
            Set only on committed or cancelled imports. Afterwards the history row
            and source metadata remain, but downloads, the source view and the
            review answer 410 IMPORT_FILES_REMOVED.
        closedIdle:
          type: boolean
          description: |
            Present and true when retention closed this import because nobody
            touched it for the idle period, rather than a teacher cancelling it.
    WordImportHistoryItem:
      type: object
      additionalProperties: false
      required: [id, title, status, revision, sourceRevision, sources, pendingUploads, createdBy, createdAt, updatedAt, reviewCounts]
      description: |
        History-only current draft counts; unknown for a draft untouched since deploy.
        Belongs to the teacher who created it (`createdBy`). `scope.all` reaches
        any import by id; the history (`listWordImports`) holds only the
        caller's own.
        Sources are private originals, never learner media. Source revision zero
        means no completed source set. Upload completion does not mean recognition.
        Pending uploads are durable reservations and cannot be downloaded or processed.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/ImportStatus' }
        revision: { type: integer, format: int64, minimum: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        sources:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/ImportSource' }
        pendingUploads: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        run: { $ref: '#/components/schemas/ImportRun' }
        draftRevision:
          type: integer
          format: int64
          minimum: 0
          description: Zero until processing has produced a reviewable draft.
        testId:
          $ref: '#/components/schemas/Uuid'
          description: The draft test created by commit.
        filesRemovedAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            When retention removed this import's original files and review draft.
            Set only on committed or cancelled imports. Afterwards the history row
            and source metadata remain, but downloads, the source view and the
            review answer 410 IMPORT_FILES_REMOVED.
        closedIdle:
          type: boolean
          description: |
            Present and true when retention closed this import because nobody
            touched it for the idle period, rather than a teacher cancelling it.
        reviewCounts:
          oneOf: [{ $ref: '#/components/schemas/ImportReviewCounts' }, { type: 'null' }]
    ImportReviewCounts:
      type: object
      additionalProperties: false
      required: [needsAction, toConfirm]
      description: Findings from the current review body, never a pending reprocessing candidate.
      properties:
        needsAction: { type: integer, minimum: 0 }
        toConfirm: { type: integer, minimum: 0 }
    ImportStatusFacets:
      type: object
      additionalProperties: false
      required: [all, processing, needsReview, failed, committed, cancelled]
      description: Counts under the same search and caller-owned scope, ignoring the status filter.
      properties:
        all: { type: integer, minimum: 0 }
        processing:
          type: integer
          minimum: 0
          description: awaiting_sources, queued, processing and committing together.
        needsReview: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        committed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    ImportRun:
      type: object
      additionalProperties: false
      required: [id, status, stage, attempt, maxAttempts, createdAt, updatedAt]
      description: The latest processing run. errorCode names why a failed run stopped; keyPaper is the answer-key paper the teacher chose for it, absent when recognition picked one.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        stage: { type: string, enum: [queued, source_validation, normalization, extraction, recognition, validation, ready] }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        errorCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,99}$' }
        keyPaper: { type: integer, minimum: 1, maximum: 999 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CreateWordImport:
      type: object
      additionalProperties: false
      required: [requestId, title]
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: Scoped to the actor; replay with the same title returns the same import, changed title conflicts.
        title: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
    ImportUploadReceipt:
      type: object
      additionalProperties: false
      required: [import, source, sourceRevision]
      properties:
        import: { $ref: '#/components/schemas/WordImport' }
        source: { $ref: '#/components/schemas/ImportSource' }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
    ImportSourceDownload:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }

    ImportCapabilities:
      type: object
      additionalProperties: false
      required: [intakeEnabled, processingEnabled, retention]
      properties:
        retention: { $ref: '#/components/schemas/ImportRetention' }
        intakeEnabled:
          type: boolean
          description: |
            Private import storage is configured, so imports can be created,
            listed, reviewed and committed. When false, every other
            /teacher/imports operation answers 501.
        processingEnabled:
          type: boolean
          description: |
            A worker is deployed to process the queue, so processWordImport
            accepts work. When false it answers 503
            IMPORT_PROCESSING_UNAVAILABLE instead of queueing a run nothing will
            claim. Never true while intakeEnabled is false.
    ImportRetention:
      type: object
      additionalProperties: false
      required: [afterCommitDays, afterCancelDays, idleDays]
      description: |
        How long an import keeps its original files and review draft. After
        the test is created, after cancellation, and an import untouched for
        idleDays is closed and its files removed. History rows are kept.
      properties:
        afterCommitDays: { type: integer, minimum: 1 }
        afterCancelDays: { type: integer, minimum: 1 }
        idleDays: { type: integer, minimum: 1 }
    ImportLimits:
      type: object
      additionalProperties: false
      required: [maxBytes, formats, pasteMaxCharacters]
      properties:
        pasteMaxCharacters: { type: integer, minimum: 1, maximum: 100000 }
        maxBytes: { type: integer, format: int64, minimum: 1 }
        formats:
          type: array
          description: Accepted file extensions; doc appears only when legacy conversion is enabled.
          items: { type: string, enum: [docx, doc, pdf] }
    ProcessWordImport:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: Replaying the same request returns the same run.
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        keyPaper:
          type: integer
          minimum: 1
          maximum: 999
          description: Paper number to read from an answer-key file that holds several papers.
    CancelWordImport:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    CommitWordImport:
      type: object
      additionalProperties: false
      required: [requestId, draftRevision]
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
          description: Replaying a committed request returns the same test.
        draftRevision: { type: integer, format: int64, minimum: 1 }
    ImportCommitResult:
      type: object
      additionalProperties: false
      required: [testId, import]
      properties:
        testId: { $ref: '#/components/schemas/Uuid' }
        import: { $ref: '#/components/schemas/WordImport' }
    ImportSourceRef:
      type: object
      additionalProperties: false
      required: [sourceId, blockId, start, end]
      description: Unicode code point range of one extracted source block.
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 128 }
        blockId: { type: string, minLength: 1, maxLength: 200 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        generatedLabel: { type: boolean }
    ImportOrigin:
      type: string
      enum: [source_explicit, inferred_structure, defaulted, teacher_entered]
    ImportFinding:
      type: object
      additionalProperties: false
      required: [id, code, severity, count, evidence]
      description: |
        One actionable observation. blocking must be fixed by an edit;
        review_required needs a teacher decision (an edit or an acknowledgement);
        informational needs nothing.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,99}$' }
        severity: { type: string, enum: [blocking, review_required, informational] }
        target: { type: string, maxLength: 128 }
        field: { type: string, maxLength: 200 }
        count: { type: integer, minimum: 1 }
        acknowledged: { type: boolean }
        evidence:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportKeyValue:
      type: object
      additionalProperties: false
      required: [value, evidence]
      properties:
        value: { type: string, maxLength: 10000 }
        evidence:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportDraftAnswer:
      type: object
      additionalProperties: false
      required: [state, optionIds, evidence]
      description: |
        unknown means the source has no key; it is never a set of false options.
        Choice keys are optionIds, a short answer's sample is text, fill-blank
        keys live on blanks. conflict keeps every source value in candidates.
      properties:
        state: { type: string, enum: [known, unknown, conflict] }
        optionIds:
          type: array
          maxItems: 26
          items: { type: string, maxLength: 64 }
        text: { type: string, maxLength: 10000 }
        evidence:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportSourceRef' }
        candidates:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ImportKeyValue' }
    ImportDraftOption:
      type: object
      additionalProperties: false
      required: [id, label, content]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 8 }
        content: { $ref: '#/components/schemas/ContentDocument' }
    ImportDraftBlank:
      type: object
      additionalProperties: false
      required: [gapId, accepted, caseSensitive]
      properties:
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        label: { type: string, maxLength: 32 }
        accepted:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        caseSensitive: { type: boolean }
    ImportFieldOrigins:
      type: object
      additionalProperties: false
      required: [type, prompt, options, answer, points]
      properties:
        type: { $ref: '#/components/schemas/ImportOrigin' }
        prompt: { $ref: '#/components/schemas/ImportOrigin' }
        options: { $ref: '#/components/schemas/ImportOrigin' }
        answer: { $ref: '#/components/schemas/ImportOrigin' }
        points: { $ref: '#/components/schemas/ImportOrigin' }
    ImportDraftQuestion:
      type: object
      additionalProperties: false
      required: [id, label, type, prompt, options, blanks, answer, points, origins, source]
      description: unsupported marks content no interaction can represent; it must be retyped or excluded.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, maxLength: 32 }
        task: { type: string, maxLength: 32 }
        type: { type: string, enum: [single_choice, multiple_choice, true_false, fill_blank, short_answer, unsupported] }
        prompt: { $ref: '#/components/schemas/ContentDocument' }
        options:
          type: array
          maxItems: 26
          items: { $ref: '#/components/schemas/ImportDraftOption' }
        blanks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ImportDraftBlank' }
        answer: { $ref: '#/components/schemas/ImportDraftAnswer' }
        points: { type: string, pattern: '^\d{1,6}(\.\d{1,2})?$' }
        excluded:
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
        origins: { $ref: '#/components/schemas/ImportFieldOrigins' }
        source:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportGapLink:
      type: object
      additionalProperties: false
      required: [gapId, questionId]
      description: Binds a passage gap to a choice question, or to one blank of a fill-blank question.
      properties:
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        questionId: { type: string, minLength: 1, maxLength: 64 }
        blankGapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
    ImportDraftGroup:
      type: object
      additionalProperties: false
      required: [id, gaps, questions, source]
      description: Questions sharing one passage; the passage gaps bind to members by stable IDs.
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, maxLength: 32 }
        instructions: { type: string, maxLength: 2000 }
        stimulus: { $ref: '#/components/schemas/ContentDocument' }
        gaps:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportGapLink' }
        questions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportDraftQuestion' }
        source:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportDraftItem:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: Exactly one of question or group.
      properties:
        question: { $ref: '#/components/schemas/ImportDraftQuestion' }
        group: { $ref: '#/components/schemas/ImportDraftGroup' }
    ImportDraftSection:
      type: object
      additionalProperties: false
      required: [id, title, origin, items, source]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, maxLength: 2000 }
        origin: { $ref: '#/components/schemas/ImportOrigin' }
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ImportDraftItem' }
        source:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportSourceRef' }
    ImportDraft:
      type: object
      additionalProperties: false
      required: [version, title, sections, notices, acknowledged]
      description: The reviewable exam. Notices are source observations and are kept by the server; edits never change them.
      properties:
        version: { type: string, enum: [word-draft-v1] }
        title: { type: string, maxLength: 200 }
        sections:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ImportDraftSection' }
        notices:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/ImportFinding' }
        acknowledged:
          type: array
          maxItems: 2000
          items: { type: string, minLength: 1, maxLength: 64 }
    ImportReviewSummary:
      type: object
      additionalProperties: false
      required: [sections, groups, questions, included, excluded, totalPoints, answersKnown, answersMissing, answersConflicting, blocking, needsDecision]
      properties:
        sections: { type: integer, minimum: 0 }
        groups: { type: integer, minimum: 0 }
        questions: { type: integer, minimum: 0 }
        included: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
        totalPoints: { type: string }
        answersKnown: { type: integer, minimum: 0 }
        answersMissing: { type: integer, minimum: 0 }
        answersConflicting: { type: integer, minimum: 0 }
        blocking: { type: integer, minimum: 0 }
        needsDecision: { type: integer, minimum: 0 }
    ImportReview:
      type: object
      additionalProperties: false
      required: [importId, revision, draft, findings, summary, ready, reprocessed, updatedAt]
      description: |
        The draft with every current finding. ready is true only when nothing blocks
        and every review_required finding has a decision. reprocessed means a newer
        machine draft exists that has not replaced the teacher's edits.
      properties:
        importId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, format: int64, minimum: 1 }
        draft: { $ref: '#/components/schemas/ImportDraft' }
        findings:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/ImportFinding' }
        summary: { $ref: '#/components/schemas/ImportReviewSummary' }
        ready: { type: boolean }
        reprocessed: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SaveImportReview:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, sections, acknowledged]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        title: { type: string, maxLength: 200 }
        sections:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ImportDraftSection' }
        acknowledged:
          type: array
          maxItems: 2000
          items: { type: string, minLength: 1, maxLength: 64 }
    ImportSourceSpan:
      type: object
      additionalProperties: false
      required: [start, end, marks]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        marks:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ContentMark' }
        colored: { type: boolean }
    ImportSourceBlock:
      type: object
      additionalProperties: false
      required: [id, text, spans]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, maxLength: 400000 }
        spans:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/ImportSourceSpan' }
        tableId: { type: string, maxLength: 200 }
        row: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }
    ImportSourceView:
      type: object
      additionalProperties: false
      required: [sourceId, role, filename, blocks]
      description: The extracted main-body text of one source, in document order, for side-by-side review.
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 128 }
        role: { $ref: '#/components/schemas/ImportSourceRole' }
        filename: { type: string, minLength: 1, maxLength: 255 }
        blocks:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/ImportSourceBlock' }

    # ------------------------------------------------------------------ auth

    Role:
      type: string
      enum: [admin, student]
      description: |
        Guards are written so a third role (`teacher`, limited admin) can be
        added without restructuring (§1.1).

    PermissionKey:
      type: string
      enum:
        - content.tests.write
        - content.tests.publish
        - content.questions.write
        - content.media.write
        - content.share
        - teaching.classes.write
        - teaching.assignments.write
        - teaching.grading
        - teaching.attempts.intervene
        - teaching.attendance
        - people.students.read
        - people.students.create
        - people.students.reset_password
        - people.users.manage
        - people.roles.manage
        - system.audit.read
        - system.settings.write
        - learning.take_tests
        - scope.all
        - system.api_reference
        - system.data_export
        - system.leads
      description: |
        The permission catalogue, in the order of the Roles & permissions
        matrix, and equal to the rows of `app.permissions`. Each key and the
        matrix row it is:

        - `content.tests.write`: Create and edit tests
        - `content.tests.publish`: Publish tests
        - `content.questions.write`: Manage question bank
        - `content.media.write`: Upload and delete media
        - `content.share`: Share own content with other teachers
        - `teaching.classes.write`: Create classes
        - `teaching.assignments.write`: Assign tests to classes
        - `teaching.grading`: Grade answers
        - `teaching.attempts.intervene`: Reset, void or extend attempts
        - `teaching.attendance`: Take attendance
        - `people.students.read`: See students in own classes
        - `people.students.create`: Create student accounts
        - `people.students.reset_password`: Reset student passwords
        - `people.users.manage`: Add and disable users
        - `people.roles.manage`: Change roles
        - `system.audit.read`: View audit log
        - `system.settings.write`: Change system settings
        - `learning.take_tests`: Take tests and view own results

        The last four keys in the enum are hidden: no matrix row shows them,
        no role is granted them, and only the Admin holds them. The Admin
        holds every key, and `learning.take_tests` only when that cell is
        turned on. `scope.all` reads and edits any teacher's content, classes
        and people by id, and widens the lists of classes, students and
        attempts and the dashboard's figures to every teacher's. It does not
        widen the teaching workspace's six content lists: `listTests`,
        `listQuestions`, `listQuestionGroups`, `listMedia`, `listWordImports`
        and `listAssignments`, with their facets, tags and counts, hold the
        caller's own rows for every caller (for assignments, those the caller
        created and those that target a class the caller teaches).

    User:
      type: object
      required: [id, email, fullName, role, hasPassword, linkedProviders, mustChangePassword, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        hasPassword:
          type: boolean
          description: false for Google-only accounts. Gates the unlink affordance.
        linkedProviders:
          type: array
          items: { type: string, enum: [google] }
          maxItems: 1
        mustChangePassword:
          type: boolean
          description: Forces `/change-password`. Always false for Google-only users (§5.4).
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    Workspace:
      type: string
      enum: [teacher, admin, app]
      description: |
        A console the signed-in user may enter: `teacher` for any `content.*`,
        `teaching.*` or `people.students.*` permission; `admin` for
        `people.users.manage`, `people.roles.manage`, `system.audit.read`,
        `system.settings.write` or `scope.all`; `app` for
        `learning.take_tests`.

    CurrentUser:
      type: object
      description: |
        The signed-in user, as only the user sees it: `User`'s properties plus
        the permissions the user's role holds, in catalogue order, and the
        workspaces they open. Written flat, because a closed schema cannot be
        extended with `allOf` (issue #41). `User` stays where a response
        describes someone else, so a student's permissions never reach a
        teacher's payload.

        `role` keeps its two legacy values, derived from the role, so a tab
        still open on v0.7.0 keeps routing.
      required: [id, email, fullName, role, hasPassword, linkedProviders, mustChangePassword, createdAt, permissions, workspaces]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        hasPassword:
          type: boolean
          description: false for Google-only accounts. Gates the unlink affordance.
        linkedProviders:
          type: array
          items: { type: string, enum: [google] }
          maxItems: 1
        mustChangePassword:
          type: boolean
          description: Forces `/change-password`. Always false for Google-only users (§5.4).
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        permissions:
          type: array
          uniqueItems: true
          maxItems: 64
          items: { $ref: '#/components/schemas/PermissionKey' }
        workspaces:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { $ref: '#/components/schemas/Workspace' }



    GoogleSignInSuccess:
      type: object
      description: |
        AuthSuccess plus the class a join code enrolled the student in.

        Flat rather than `allOf: [AuthSuccess, ...]`: AuthSuccess is
        `additionalProperties: false`, and in JSON Schema 2020-12 that keyword
        cannot see a sibling allOf branch, so the composed form rejects the very
        body it documents (issue #41).
      required: [accessToken, expiresIn, user]
      additionalProperties: false
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds. }
        user: { $ref: '#/components/schemas/CurrentUser' }
        enrolledClass:
          description: Present only when a `joinCode` produced an enrolment.
          oneOf: [{ $ref: '#/components/schemas/Class' }, { type: 'null' }]

    PublishConflict:
      type: object
      description: |
        The publish 409: the error envelope plus every blocking violation, so the
        builder marks them all inline rather than surfacing one per attempt (§8).
        Flat for the same reason as GoogleSignInSuccess.
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
        violations:
          type: array
          items: { $ref: '#/components/schemas/PublishValidationError' }

    GradingQueue:
      type: object
      additionalProperties: false
      required: [groups, items, answersRemaining, studentsWaiting]
      description: Complete filtered pending counts with a deterministic prefix of at most 200 saved answers.
      properties:
        groups:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GradingQueueGroup' }
          description: Only groups represented in items, in queue order; remaining counts each group's complete filtered work.
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GradingQueueItem' }
        answersRemaining: { type: integer, minimum: 0 }
        studentsWaiting: { type: integer, minimum: 0, description: Distinct student UUIDs across all filtered eligible answers. }

    GradingQueueGroup:
      type: object
      additionalProperties: false
      required: [key, kind, label, sub, remaining]
      properties:
        key:
          type: string
          minLength: 36
          maxLength: 73
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$'
          description: Canonical lowercase student UUID, or assignmentUUID:versionQuestionUUID in question mode.
        kind: { type: string, enum: [student, question] }
        label: { type: string, description: Raw current student full name or decimal paper question number for client localization. }
        sub: { type: string, description: Live assignment title of this group's first returned item. }
        remaining: { type: integer, minimum: 1, description: Complete filtered eligible answer count; may exceed the returned prefix for this group. }

    GradingQueueItem:
      type: object
      additionalProperties: false
      required: [attemptId, questionId, assignmentId, assignmentTitle, studentId, studentName, questionNumber, type, prompt, answer, points, score, comment]
      description: One saved pending-manual answer and its frozen teacher question; identity is attemptId plus questionId.
      properties:
        attemptId: { $ref: '#/components/schemas/Uuid' }
        questionId: { $ref: '#/components/schemas/Uuid' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        assignmentTitle: { type: string }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string, description: Raw current full name, without private account fields. }
        questionNumber: { type: integer, minimum: 1, description: One-based section/question paper order, independent of the student's shuffle. }
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string, minLength: 1 }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        answer: { $ref: '#/components/schemas/Answer' }
        points: { $ref: '#/components/schemas/Points' }
        score: { type: [number, 'null'], format: double, minimum: 0, description: Manual score; null while this answer remains in the pending queue. }
        comment: { type: [string, 'null'] }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
        transcript: { type: [string, 'null'] }
        options: { type: array, items: { $ref: '#/components/schemas/AdminQuestionOption' } }
        blanks: { type: array, items: { $ref: '#/components/schemas/AdminQuestionBlank' } }
        explanation: { type: [string, 'null'] }
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        sampleAnswer: { type: [string, 'null'] }
        sharedContext: { $ref: '#/components/schemas/SharedReviewContext' }

    QuestionAnswerRow:
      type: object
      description: One paper's answer to the question G-04 is grading.
      required: [attemptId, studentId, studentName, attemptNo, answer, manualScore, graderComment]
      additionalProperties: false
      properties:
        attemptId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        attemptNo: { type: integer, minimum: 1 }
        answer:
          oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }]
          description: Null when the student left it blank, which cannot be marked.
        manualScore: { oneOf: [{ $ref: '#/components/schemas/Points' }, { type: 'null' }] }
        graderComment: { type: [string, 'null'] }

    ReferencingTest:
      type: object
      description: |
        A test that holds a reference the caller asked to remove, named so a
        blocked delete can say where to look instead of only that it is
        blocked (A-06a, A-07).
      required: [id, title]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        version:
          type: integer
          minimum: 1
          description: |
            The published version holding the reference. Absent when the
            reference is a draft outline, which has no version yet.

    ReferencingGroup:
      type: object
      description: Teacher-only shared context that protects an immutable media asset, including archived bank groups.
      additionalProperties: false
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        testId:
          type: [string, 'null']
          format: uuid
          description: Owning test, absent for an independent bank group.

    ReferencedBy:
      type: string
      description: |
        What still references a row whose permanent delete answered
        `RESOURCE_REFERENCED`, carried as `details.referencedBy` by
        `deleteClass` and `deleteUser`. `other` is a reference the server does
        not name. Later releases add values; a client treats an unknown one as
        `other`.
      enum: [assignments, attempts, audit, members, owned_content, other]

    MediaReplacementCounts:
      type: object
      additionalProperties: false
      required: [questions, groups]
      properties:
        questions: { type: integer, minimum: 0 }
        groups: { type: integer, minimum: 0 }
    MediaReplacement:
      type: object
      additionalProperties: false
      required: [asset, repointed, left]
      properties:
        asset: { $ref: '#/components/schemas/LibraryAsset' }
        repointed:
          $ref: '#/components/schemas/MediaReplacementCounts'
          description: Distinct live question rows and groups actually changed; question rows differ from LibraryAsset.questionCount's derived usage.
        left:
          $ref: '#/components/schemas/MediaReplacementCounts'
          description: Other owners' live question rows and groups still using the old asset; excludes versions, import reviews and late same-owner bindings.
    LibraryAsset:
      type: object
      description: |
        A MediaAsset as the teacher's media library lists it: with the name the
        library shows, its default play limit, an image's size in pixels, how
        many questions use the file and how many published versions reference
        it. Flat for the same reason (issue #41) -- this is
        the site that was actually shipping a body its own contract rejected.
      required:
        [id, kind, url, mimeType, bytes, originalFilename, createdAt,
         displayName, defaultMaxPlays, width, height, questionCount]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [image, audio] }
        url: { type: string, description: Short-lived signed URL (§11.2). }
        # The same closed set as MediaAsset: flattening must not quietly widen
        # what the server may claim it stored.
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/aac, image/png, image/jpeg, image/webp]
        bytes: { type: integer, minimum: 0 }
        durationMs: { type: [integer, 'null'], description: Audio only. }
        originalFilename: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The name the library shows: the one `updateMedia` stored, or
            `originalFilename` while none was set.
        defaultMaxPlays:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
          description: |
            The default play limit stored with this audio, for a client to
            start a question's own limit from when it attaches the file; the
            server applies it to nothing. `0` is unlimited and `null` is not
            set. Always `null` for an image.
        width:
          type: [integer, 'null']
          minimum: 1
          description: |
            An image's width in pixels. `null` for audio, and for an image
            whose header could not be read; `width` and `height` are `null`
            together.
        height:
          type: [integer, 'null']
          minimum: 1
          description: An image's height in pixels; `null` exactly when `width` is.
        questionCount:
          type: integer
          minimum: 0
          description: |
            How many questions use the file, each counted once: a question
            that is not deleted and attaches it, and every member that is not
            deleted of a question group whose recordings or materials hold it.
            Any owner's questions count. A published version, and a group with
            no member, add nothing here; `usageCount` counts versions.
        usageCount:
          type: integer
          description: Published-version references. Non-zero blocks delete (§8).
        usedIn:
          type: array
          items: { $ref: '#/components/schemas/ReferencingTest' }
          description: |
            The published tests behind `usageCount`, one entry per version,
            so the blocked-delete dialog can name them (A-07).

    MediaFacets:
      type: object
      description: |
        How many files of the caller's library each tab holds for the CURRENT
        search, ignoring the `kind` and `unused` filters themselves, so that
        choosing a tab does not zero the others. `unused` counts the files
        whose `questionCount` is zero.
      required: [all, audio, image, unused]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        audio: { type: integer, minimum: 0 }
        image: { type: integer, minimum: 0 }
        unused: { type: integer, minimum: 0 }

    MediaUsage:
      type: object
      description: |
        The bytes the caller's whole library holds, whatever the search and
        the filters, beside the quota an upload is measured against. A deleted
        or replaced file counts in neither figure.
      required: [audioBytes, imageBytes, quotaBytes]
      additionalProperties: false
      properties:
        audioBytes: { type: integer, format: int64, minimum: 0 }
        imageBytes: { type: integer, format: int64, minimum: 0 }
        quotaBytes:
          type: integer
          format: int64
          minimum: 1
          description: The most one owner's library may hold, as the deployment sets it.

    MediaUpdate:
      type: object
      description: |
        What `updateMedia` changes. A property left out keeps its stored
        value.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed by the server; a name that is blank once trimmed is refused.
        defaultMaxPlays:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
          description: |
            `0` is unlimited and `null` clears the limit. A number is refused
            for an image.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true

    StudentAssignmentDetail:
      type: object
      description: |
        The intro screen's card: what StudentAssignmentCard carries, without
        `classId`, `classIds` and `liveAnsweredCount`, plus the policies §10.2 states in
        plain Vietnamese before the student starts.
      required:
        [id, testTitle, status, opensAt, closesAt, durationMinutes,
         attemptsUsed, maxAttempts, questionCount, totalPoints, review,
         integrity, hasAudio, showsTranscript]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testTitle: { type: string }
        className: { type: [string, 'null'], description: See StudentAssignmentCard. }
        teacherName:
          type: [string, 'null']
          description: The assignment's author.
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        opensAt: { $ref: '#/components/schemas/Timestamp' }
        closesAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer, minimum: 1 }
        questionCount: { type: integer, minimum: 0 }
        totalPoints: { $ref: '#/components/schemas/Points' }
        attemptsUsed: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        hasLiveAttempt: { type: boolean }
        liveDeadlineAt: { type: [string, 'null'], format: date-time }
        lastAttemptId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lastSubmittedAt: { type: [string, 'null'], format: date-time }
        score: { oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }] }
        review: { $ref: '#/components/schemas/ReviewPolicy' }
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }
        hasAudio:
          type: boolean
          description: Any question audio or shared recording on the assigned frozen version.
        hasSharedAudio:
          type: boolean
          description: A shared recording has one allowance across its group's questions; absent means false for legacy readers.
        showsTranscript:
          type: boolean
          description: True when any question audio or shared recording releases its transcript after submitting.
        audioMaxPlays:
          type: [integer, 'null']
          description: The strictest finite `maxPlays` across question audio and shared recordings on the assigned version; null when all are unlimited. Individual recordings can have higher limits.

    StudentClass:
      type: object
      description: A class the student is in, with how they got there (§6.4's D-10).
      required: [id, name, joinedVia, joinedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        joinedVia:
          type: string
          enum: [admin, join_code]
        joinedAt: { $ref: '#/components/schemas/Timestamp' }

    StudentActivity:
      type: object
      description: |
        Backs G-07's "Hoạt động" column, which has three renderings and needs
        two facts to pick between them: "đang làm bài" while an attempt is live,
        a relative time when there is a last one, and an em dash when the student
        has never started anything.

        `live` is not `lastAttemptAt is recent`. Nothing in this system flips an
        attempt when its deadline passes -- assignment status is derived for
        exactly that reason (D-18) -- so a stale in-progress row would read as
        "đang làm bài" forever. The server ANDs the status with `deadline_at`.
      required: [live]
      additionalProperties: false
      properties:
        live: { type: boolean, description: An attempt is in progress and inside its deadline. }
        lastAttemptAt: { type: [string, 'null'], format: date-time }

    StudentStats:
      type: object
      description: |
        Per-student teaching figures for §8's students table (G-07) and the class
        roster (G-06), over only the assignments the caller reaches: those they
        created and those targeting a class they teach, or every one with
        `scope.all`.

        Deliberately NOT on `User`. `User` is the `/auth/me`, `/auth/login` and
        `/auth/refresh` payload, so a field added there is shipped to the student
        about themselves on every cold load and every token refresh. §13.5's
        student-projection guard would not catch it either -- it sweeps `/app/*`
        and `/auth/me` is not one.
      required: [submittedCount, flaggedCount, activity]
      additionalProperties: false
      properties:
        submittedCount:
          type: integer
          minimum: 0
          description: |
            Distinct ASSIGNMENTS with at least one attempt that reached the
            teacher, not attempts. With `maxAttempts > 1` the two differ, and
            counting attempts would print "14" beside an average taken over 7
            things.
        score:
          description: |
            Weighted: the sum of earned points over the sum of available points,
            across each assignment's best graded attempt. Sent as the pair rather
            than a percentage because every other score in this contract is an
            (earned, total) pair, and the client can render either reading.

            Null when nothing is graded yet, which is G-07's "—". An unsubmitted
            assignment is never a zero: "chưa nộp" and "—" are different facts,
            and collapsing them is how a gradebook lies.
          oneOf:
            - $ref: '#/components/schemas/AttemptScore'
            - type: 'null'
        flaggedCount: { type: integer, minimum: 0 }
        activity: { $ref: '#/components/schemas/StudentActivity' }

    StudentRow:
      type: object
      description: |
        One row of §8's students table. Flat rather than `allOf: [User, ...]`:
        `User` is `additionalProperties: false`, and in JSON Schema 2020-12 that
        keyword cannot see a sibling `allOf` branch, so the composed form
        rejects the very body it documents (see issue #41).
      required:
        [id, email, fullName, hasPassword, linkedProviders, mustChangePassword,
         createdAt, disabledAt, classes, stats]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        hasPassword: { type: boolean }
        linkedProviders:
          type: array
          items: { type: string, enum: [google] }
          maxItems: 1
        mustChangePassword: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        disabledAt:
          type: [string, 'null']
          format: date-time
          description: |
            Set means the account cannot sign in. Present on the row because
            `updateStudent` accepts `disabled: false` in both directions, and a
            state that can be written but never read is a one-way door: the
            student would vanish from every listing with nothing able to name
            them again.
        classes:
          type: array
          items: { $ref: '#/components/schemas/StudentClass' }
          description: Memberships in classes the caller teaches, or every one with `scope.all`. The table truncates; the drawer lists them.
        stats: { $ref: '#/components/schemas/StudentStats' }

    StudentFacets:
      type: object
      description: |
        G-07's "31 học viên · 23 hoạt động 7 ngày qua". Counts a page
        cannot express, in the same shape as TestStatusFacets. Both count only
        the students the caller reaches, and `activeLast7Days` only work on
        assignments the caller reaches.

        `active` reuses the dashboard's window verbatim rather than defining a
        second meaning of active on a second screen.
      required: [total, activeLast7Days]
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 0 }
        activeLast7Days: { type: integer, minimum: 0 }

    AuthSuccess:
      type: object
      required: [accessToken, expiresIn, user]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: Held in memory only (§5.2). The refresh token is set as a cookie, not returned here.
        expiresIn: { type: integer, description: Seconds. }
        user: { $ref: '#/components/schemas/CurrentUser' }

    # ---------------------------------------------------------------- classes

    Class:
      type: object
      required: [id, name, studentCount, openAssignmentCount, selfJoinEnabled, archivedAt, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'] }
        studentCount: { type: integer, minimum: 0 }
        openAssignmentCount:
          type: integer
          minimum: 0
          description: Assignments whose derived status is `open` and that target this class (G-08).
        selfJoinEnabled: { type: boolean }
        archivedAt:
          description: Set once archived. An archived class leaves every picker and keeps its record (G-08).
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        joinCode:
          description: Teacher responses only. Never present on a `/app/*` response.
          oneOf:
            - $ref: '#/components/schemas/JoinCodeInfo'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    JoinCodeInfo:
      type: object
      description: |
        Metadata about the active code — **not the code itself**, which
        `getJoinCode` reads for its teacher. A code issued from v0.8.0 on
        is stored encrypted under a key the database does not hold and found
        by a keyed hash (§13.3), so a database dump does not hand it over. A
        code issued before v0.8.0 is held only as its SHA-256 hash, which a
        dump can reverse beside the hint, until it is rotated (D5).
      required: [hint, expiresAt, maxUses, usesCount]
      additionalProperties: false
      properties:
        hint: { type: string, minLength: 4, maxLength: 4, examples: ['7K3M'] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        usesCount: { type: integer, minimum: 0 }

    JoinCode:
      type: object
      description: |
        A class's active join code, read back for its teacher (D5), with the
        metadata `JoinCodeInfo` carries.
      required: [code, hint, legacy, expiresAt, maxUses, usesCount]
      additionalProperties: false
      properties:
        code:
          type: [string, 'null']
          description: Grouped `XXXX-XXXX`, or `null` when the code cannot be read back.
          examples: ['K7M3-P9QR']
        hint: { type: string, minLength: 4, maxLength: 4, examples: ['7K3M'] }
        legacy:
          type: boolean
          description: True for a code issued before v0.8.0, held only as a hash until it is rotated.
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxUses: { type: [integer, 'null'], minimum: 1 }
        usesCount: { type: integer, minimum: 0 }

    ClassFacets:
      type: object
      description: G-08's tab counts for the current search, ignoring the status filter; `students` are distinct live members.
      required: [all, joinable, archived, students]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        joinable: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }
        students: { type: integer, minimum: 0 }

    ClassMember:
      type: object
      required: [userId, fullName, email, joinedVia, joinedAt, stats]
      additionalProperties: false
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        stats:
          $ref: '#/components/schemas/StudentStats'
          description: The same figures G-07 shows, so G-06's roster carries "Bài đã nộp" and "Điểm TB".
        fullName: { type: string }
        email: { type: string, format: email }
        joinedVia:
          type: string
          enum: [admin, join_code]
          description: Lets the teacher spot unexpected enrolments (§6.4).
        joinedAt: { $ref: '#/components/schemas/Timestamp' }
        joinCodeHint:
          type: [string, 'null']
          description: |
            Which code this member used, if any. After a rotation this
            distinguishes "joined via the code that leaked" from "joined via the
            current one" (D-10).

    MyClass:
      type: object
      description: |
        A class as its student sees it (S-10): the name, who teaches it and
        when they joined. Never the join code or the roster.
      required: [id, name, description, teacherName, joinedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        teacherName:
          type: [string, 'null']
          description: The display name of the class's own teacher.
        joinedAt: { $ref: '#/components/schemas/Timestamp' }

    # ------------------------------------------------------------------ media

    MediaKind:
      type: string
      enum: [image, audio]

    MediaAsset:
      type: object
      description: |
        A stored file as a question, a preview and a student's paper carry it.
        `x-media-limits` is what an upload may be (§11.1): audio of at most
        `audioBytes` and `durationMs`, an image of at most `imageBytes`. The
        server's constants and the web's pre-check are tested against it.
      required: [id, kind, url, mimeType, bytes, originalFilename, createdAt]
      additionalProperties: false
      x-media-limits:
        audioBytes: 52428800
        imageBytes: 10485760
        durationMs: 300000
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        url:
          type: string
          format: uri
          description: |
            Short-lived signed URL, 10 minutes (§11.2). Treat as expiring: on a
            403, refetch rather than failing. Hiding this URL is not protection
            and no further investment is planned.
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/aac, image/png, image/jpeg, image/webp]
        bytes:
          type: integer
          minimum: 1
          maximum: 52428800
          description: At most `audioBytes` for audio, and `imageBytes` for an image.
        durationMs:
          type: [integer, 'null']
          minimum: 1
          maximum: 300000
          description: Audio only, and always present for audio. Probed server-side (§11.1).
        originalFilename: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    # --------------------------------------------------------------- questions
    #
    # THE SECURITY BOUNDARY OF THIS API.
    #
    # There are three question shapes, and they are separate components on
    # purpose — not one schema with optional fields:
    #
    #   AdminQuestion    everything, including the grading key
    #   StudentQuestion  what a student sees WHILE TAKING a test
    #   ResultQuestion   what a student sees AFTERWARDS, gated by review policy
    #
    # §13.5 requires that `sampleAnswer`, `transcript`, `isCorrect` and
    # `acceptedAnswers` never reach a student. One schema with `nullable: true`
    # fields would make that a runtime discipline; three schemas make it a type
    # error. The Go side mirrors this with separate structs in separate
    # packages, so a forgotten field is a compile failure rather than a leak.
    #
    # Note what the review-policy fields on ResultQuestion are NOT called. When
    # `showCorrectAnswers` is on, a choice question returns `correctOptionIds`
    # and a fill-blank returns `correctAnswer` (singular, one canonical value
    # per blank) — never `isCorrect` per option and never the full
    # `acceptedAnswers` list. Two reasons: handing over every accepted spelling
    # is handing over the grading key, and keeping the four forbidden key names
    # absent from every `/app/*` schema lets the contract test be a literal
    # string search rather than a judgement call.

    QuestionType:
      type: string
      enum: [single_choice, multiple_choice, true_false, fill_blank, short_answer]

    AudioPolicy:
      type: object
      description: Present if and only if the attached asset is audio (§7).
      required: [maxPlays, allowSeek, showTranscriptAfterSubmit]
      additionalProperties: false
      properties:
        maxPlays:
          type: [integer, 'null']
          minimum: 1
          description: |
            `null` is unlimited. Enforcement is server-side and advisory: over-limit
            plays are reported to the teacher, never blocked or retroactively
            penalised (§11.4).
        allowSeek: { type: boolean, description: Defaults to false for listening (§11.1). }
        showTranscriptAfterSubmit: { type: boolean }

    QuestionContent:
      type: object
      description: |
        Bounded semantic prose for prompts and explanations: paragraphs, headings,
        lists and tables with marked text, breaks and safe links. No media, gaps,
        source metadata or answer-key properties. ContentDocument aggregate budgets
        and cross-node validation apply to original raw JSON. The companion string
        must equal the exact plain projection. Explanations never contain gaps.
        On question updates, omitting a rich field preserves its stored document
        only if the companion string is unchanged; otherwise the whole write is
        rejected. Explicit null removes the document.
      x-go-type: json.RawMessage
      additionalProperties: false
      required: [format, blocks]
      properties:
        format: { type: string, const: semantic_v1 }
        blocks: { $ref: '#/components/schemas/QuestionContentBlocks' }
    QuestionContentBlocks:
      type: array
      minItems: 1
      maxItems: 2048
      items: { $ref: '#/components/schemas/QuestionContentBlock' }
    QuestionContentBlock:
      oneOf:
        - $ref: '#/components/schemas/QuestionContentParagraph'
        - $ref: '#/components/schemas/QuestionContentHeading'
        - $ref: '#/components/schemas/QuestionContentList'
        - $ref: '#/components/schemas/QuestionContentTable'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/QuestionContentParagraph'
          heading: '#/components/schemas/QuestionContentHeading'
          list: '#/components/schemas/QuestionContentList'
          table: '#/components/schemas/QuestionContentTable'
    QuestionContentInlines:
      type: array
      maxItems: 2048
      items:
        oneOf:
          - { $ref: '#/components/schemas/ContentText' }
          - { $ref: '#/components/schemas/ContentBreak' }
          - { $ref: '#/components/schemas/ContentLink' }
    QuestionContentParagraph:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [paragraph] }
        content: { $ref: '#/components/schemas/QuestionContentInlines' }
    QuestionContentHeading:
      type: object
      additionalProperties: false
      required: [type, level, content]
      properties:
        type: { type: string, enum: [heading] }
        level: { type: integer, enum: [1, 2, 3] }
        content: { $ref: '#/components/schemas/QuestionContentInlines' }
    QuestionContentList:
      type: object
      additionalProperties: false
      required: [type, ordered, start, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean }
        start: { type: integer, minimum: 1, maximum: 9999 }
        items:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/QuestionContentBlocks' }
    QuestionContentTable:
      type: object
      additionalProperties: false
      required: [type, rows]
      properties:
        type: { type: string, enum: [table] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            maxItems: 12
            items: { $ref: '#/components/schemas/QuestionContentCell' }
    QuestionContentCell:
      type: object
      additionalProperties: false
      required: [header, rowSpan, colSpan, content]
      properties:
        header: { type: boolean }
        rowSpan: { type: integer, minimum: 1, maximum: 50 }
        colSpan: { type: integer, minimum: 1, maximum: 12 }
        content: { $ref: '#/components/schemas/QuestionContentBlocks' }

    QuestionPromptContent:
      type: object
      description: |
        Bounded semantic question prompt without media or answer keys. Gaps are
        supported only for fill_blank and must match blank gapId values exactly.
        Gap identity is stable within this question; labels never select answers.
        The companion prompt equals the exact plain projection. Omitted content
        on update preserves the stored document only when prompt is unchanged.
      x-go-type: json.RawMessage
      additionalProperties: false
      required: [format, blocks]
      properties:
        format: { type: string, const: semantic_v1 }
        blocks: { $ref: '#/components/schemas/QuestionPromptContentBlocks' }
    QuestionPromptContentBlocks:
      type: array
      minItems: 1
      maxItems: 2048
      items: { $ref: '#/components/schemas/QuestionPromptContentBlock' }
    QuestionPromptContentBlock:
      oneOf:
        - $ref: '#/components/schemas/QuestionPromptContentParagraph'
        - $ref: '#/components/schemas/QuestionPromptContentHeading'
        - $ref: '#/components/schemas/QuestionPromptContentList'
        - $ref: '#/components/schemas/QuestionPromptContentTable'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/QuestionPromptContentParagraph'
          heading: '#/components/schemas/QuestionPromptContentHeading'
          list: '#/components/schemas/QuestionPromptContentList'
          table: '#/components/schemas/QuestionPromptContentTable'
    QuestionPromptContentInlines:
      type: array
      maxItems: 2048
      items:
        oneOf:
          - { $ref: '#/components/schemas/ContentText' }
          - { $ref: '#/components/schemas/ContentBreak' }
          - { $ref: '#/components/schemas/ContentLink' }
          - { $ref: '#/components/schemas/ContentGap' }
    QuestionPromptContentParagraph:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [paragraph] }
        content: { $ref: '#/components/schemas/QuestionPromptContentInlines' }
    QuestionPromptContentHeading:
      type: object
      additionalProperties: false
      required: [type, level, content]
      properties:
        type: { type: string, enum: [heading] }
        level: { type: integer, enum: [1, 2, 3] }
        content: { $ref: '#/components/schemas/QuestionPromptContentInlines' }
    QuestionPromptContentList:
      type: object
      additionalProperties: false
      required: [type, ordered, start, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean }
        start: { type: integer, minimum: 1, maximum: 9999 }
        items:
          type: array
          minItems: 1
          maxItems: 2048
          items: { $ref: '#/components/schemas/QuestionPromptContentBlocks' }
    QuestionPromptContentTable:
      type: object
      additionalProperties: false
      required: [type, rows]
      properties:
        type: { type: string, enum: [table] }
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: array
            maxItems: 12
            items: { $ref: '#/components/schemas/QuestionPromptContentCell' }
    QuestionPromptContentCell:
      type: object
      additionalProperties: false
      required: [header, rowSpan, colSpan, content]
      properties:
        header: { type: boolean }
        rowSpan: { type: integer, minimum: 1, maximum: 50 }
        colSpan: { type: integer, minimum: 1, maximum: 12 }
        content: { $ref: '#/components/schemas/QuestionPromptContentBlocks' }

    OptionContent:
      type: object
      description: |
        Versioned inline option text: one paragraph of marked text and line breaks.
        No links, gaps, media, tables, source metadata or answer keys. The server
        validates the original JSON and requires text to equal its plain projection.
        Omitted content preserves rich formatting only when the current option id and
        text match; stale or changed legacy writes are rejected. Explicit null
        removes formatting. Options without rich content remain plain text.
      x-go-type: json.RawMessage
      required: [format, blocks]
      additionalProperties: false
      properties:
        format: { type: string, const: semantic_v1 }
        blocks:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
              type: { type: string, const: paragraph }
              content:
                type: array
                maxItems: 2048
                items:
                  oneOf:
                    - { $ref: '#/components/schemas/ContentText' }
                    - { $ref: '#/components/schemas/ContentBreak' }

    AdminQuestionOption:
      type: object
      required: [id, ordinal, text, isCorrect]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal: { type: integer, minimum: 0 }
        content:
          oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        text: { type: string, minLength: 1 }
        isCorrect: { type: boolean }

    AdminQuestionBlank:
      type: object
      required: [id, ordinal, acceptedAnswers, caseSensitive]
      additionalProperties: false
      properties:
        gapId:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          description: Stable identity of the rich prompt gap; null for legacy Markdown.
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal:
          type: integer
          minimum: 1
          maximum: 32767
          description: Stable 1-indexed answer label; matches `{{1}}` only for legacy Markdown.
        acceptedAnswers:
          type: array
          items: { type: string, minLength: 1 }
          minItems: 1
        caseSensitive: { type: boolean }

    TestStatusFacets:
      type: object
      description: |
        How many tests each status holds for the CURRENT search, ignoring the
        status filter itself — selecting one tab must not zero the others.
        Backs A-03's "Tất cả 12 · Bản nháp 3 · Đã phát hành 8".
      required: [all, draft, published, archived]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }

    AssignmentStatusFacets:
      type: object
      description: |
        How many assignments each derived status holds right now, ignoring
        the status filter itself, so the list's tabs carry counts the way
        A-03's do.
      required: [all, draft, scheduled, open, closed]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        scheduled: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }

    QuestionTypeFacets:
      type: object
      description: |
        How many questions each type holds for the CURRENT tag and search,
        ignoring the type filter itself. Backs A-06's rail counts.
      required: [all, single_choice, multiple_choice, true_false, fill_blank, short_answer]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        single_choice: { type: integer, minimum: 0 }
        multiple_choice: { type: integer, minimum: 0 }
        true_false: { type: integer, minimum: 0 }
        fill_blank: { type: integer, minimum: 0 }
        short_answer: { type: integer, minimum: 0 }

    AdminQuestion:
      type: object
      required: [id, type, prompt, points, tags, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/QuestionType' }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt:
          type: string
          minLength: 1
          description: |
            Legacy Markdown, or exact plain projection when promptContent is present. Markdown is rendered with rehype-sanitize — never
            `dangerouslySetInnerHTML` (§2). For `fill_blank`, blanks are marked
            `{{1}}`, `{{2}}`, 1-indexed, matching `blanks[].ordinal`.
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
        transcript: { type: [string, 'null'] }
        options:
          type: array
          items: { $ref: '#/components/schemas/AdminQuestionOption' }
        blanks:
          type: array
          items: { $ref: '#/components/schemas/AdminQuestionBlank' }
        points: { $ref: '#/components/schemas/Points' }
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        explanation: { type: [string, 'null'] }
        sampleAnswer:
          type: [string, 'null']
          description: |
            `short_answer` only. **Teacher-only, shown during grading.** Never
            appears in any `/app/*` schema, including the result endpoint.
        tags: { type: array, items: { type: string } }
        usedInTests:
          type: integer
          minimum: 0
          description: |
            How many DRAFT test outlines reference this question. Editing the
            bank copy changes every one of them, which is a versioning event the
            teacher deserves to know about before they type (A-06). Published
            versions are deliberately not counted: they hold their own snapshot
            and a bank edit cannot reach them (§7).
        usedIn:
          type: array
          items: { $ref: '#/components/schemas/ReferencingTest' }
          description: Current test outlines using the question, sorted by title. Included on individual question responses; loaded on demand for the bank's nested usage table. Published snapshots are excluded.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    StudentOption:
      type: object
      description: No `isCorrect`. Deliberately not a subset-by-omission of AdminQuestionOption.
      required: [id, text]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        content:
          oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        text: { type: string }

    StudentBlank:
      type: object
      description: |
        No `acceptedAnswers` — that is the grading key. `caseSensitive` is a
        rule, not a key: the engine states it under the blanks (S-05, "Không
        phân biệt hoa thường"), and a rule the student cannot read is one they
        are graded on blind.
      required: [id, ordinal, caseSensitive]
      additionalProperties: false
      properties:
        gapId:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          description: Stable identity of the rich prompt gap; null for legacy Markdown.
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal: { type: integer, minimum: 1, maximum: 32767 }
        caseSensitive: { type: boolean }

    StudentSection:
      type: object
      description: |
        One part of the paper, in test order. `instructions` is the teacher's
        text to the student for this part; the engine shows it above the
        section's first question and the navigator groups the numbers under
        `title` (S-05, S-06, S-08).
      required: [id, title, instructions]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        instructions: { type: [string, 'null'] }

    StudentQuestion:
      type: object
      description: |
        What a student receives while taking a test. Contains none of
        `isCorrect`, `sampleAnswer`, `acceptedAnswers`, `transcript` — asserted
        by a contract test over this file and by an E2E test over a live
        response (§14 E2E 9).

        Options arrive in the order the student must see them, already shuffled
        server-side from the attempt's `shuffleSeed` so a reload cannot reorder
        them (D-02).
      required: [id, sectionId, type, prompt, points]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: A `test_version_questions` id — never a bank question id (§7).
        sectionId:
          $ref: '#/components/schemas/Uuid'
          description: The `AttemptSession.sections` entry this question belongs to.
        type: { $ref: '#/components/schemas/QuestionType' }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt: { type: string }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
        options: { type: array, items: { $ref: '#/components/schemas/StudentOption' } }
        blanks: { type: array, items: { $ref: '#/components/schemas/StudentBlank' } }
        points: { $ref: '#/components/schemas/Points' }

    StudentGroup:
      type: object
      description: |
        Frozen shared context with ordered version-question identities. Contains
        no answer keys or transcripts. Assets are explicitly authorized by the
        containing preview/session, never by an arbitrary content assetId.
      additionalProperties: false
      required: [id, sectionId, title, questionIds, stimuli, recordings, assets]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sectionId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        instructions:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        questionIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        stimuli: { type: array, items: { $ref: '#/components/schemas/GroupStimulus' } }
        recordings: { type: array, items: { $ref: '#/components/schemas/StudentGroupRecording' } }
        assets: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }

    StudentGroupRecording:
      type: object
      description: One versioned group playback scope, independent of other groups using the same file.
      additionalProperties: false
      required: [id, assetId, policy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assetId: { $ref: '#/components/schemas/Uuid' }
        policy: { $ref: '#/components/schemas/AudioPolicy' }

    SharedReviewContext:
      type: object
      required: [groups, transcripts]
      additionalProperties: false
      description: |
        Frozen material for completed-attempt results and teacher grading.
        Learner transcripts contain only recordings whose own policy releases
        them after submission; teacher grading includes all available transcripts.
        No grading key is added to groups. Listening here never consumes a play.
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/StudentGroup' } }
        transcripts:
          type: object
          additionalProperties: { type: string }
          description: Released transcript text keyed by frozen recording ID; suppressed entries are absent.
        audioPlays:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Used plays by recording for a single attempt; omitted when grading across attempts.

    ResultQuestion:
      type: object
      description: |
        The post-submission view. Every revealing field is gated by the
        assignment's review policy and simply absent when the policy is off —
        the client has no fallback that could surface a suppressed value.
      required: [id, sectionId, type, prompt, points, answer]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sectionId:
          $ref: '#/components/schemas/Uuid'
          description: >-
            The part of the paper this question belongs to, one of the result's
            `sections`. Present under every review policy: the paper already
            showed the student which part a question was in.
        type: { $ref: '#/components/schemas/QuestionType' }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt: { type: string }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }]
        options: { type: array, items: { $ref: '#/components/schemas/StudentOption' } }
        blanks: { type: array, items: { $ref: '#/components/schemas/StudentBlank' } }
        points: { $ref: '#/components/schemas/Points' }
        answer:
          oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }]
          description: What the student submitted. `null` if unanswered.
        earned:
          oneOf: [{ $ref: '#/components/schemas/Points' }, { type: 'null' }]
          description: Present only when `review.showScore`. `null` while awaiting manual grading.
        pendingManual: { type: boolean }
        graderComment: { type: [string, 'null'] }
        correctOptionIds:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Uuid' }
          description: |
            Only when `review.showCorrectAnswers`. Replaces per-option
            `isCorrect` so that key name never appears under `/app/*`.
        correctAnswers:
          type: [array, 'null']
          items:
            type: object
            required: [blankId, answer]
            additionalProperties: false
            properties:
              blankId: { $ref: '#/components/schemas/Uuid' }
              answer:
                type: string
                description: |
                  **One canonical accepted answer**, not the full accepted list.
                  Showing every accepted spelling would hand over the grading key.
          description: Only when `review.showCorrectAnswers`, for `fill_blank`.
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          description: Absent unless review.showExplanations permits the frozen explanation.
        explanation:
          type: [string, 'null']
          description: Only when `review.showExplanations`.
        transcript:
          type: [string, 'null']
          description: |
            Only when the question's `showTranscriptAfterSubmit` is on, and only
            on this endpoint — never on `GET /app/attempts/{id}` (§13.5). Also
            serves as the accessibility fallback for hard-of-hearing students (§11.3).
        audioPlaysUsed: { type: [integer, 'null'], minimum: 0 }

    # ------------------------------------------------------------------ tests

    TestStatus:
      type: string
      enum: [draft, published, archived]

    QuestionGroup:
      type: object
      description: |
        Independent shared-context draft graph, written through the group endpoints.
        Array order defines member/material order. Empty draft groups are allowed;
        publication requires a member. Members belong to one group in one section.
        Copy with context creates fresh group, member, material, gap and recording
        identities. Immutable asset bytes may be reused through protected bindings.
        Validate graph references and aggregate limits in addition to JSON Schema.
        The byte budget includes resolved question content/keys; a transport must
        also bound original input before decoding. This is a teacher authoring
        shape, never a learner payload or an asset access grant.
      additionalProperties: false
      required: [id, title, members, stimuli, recordings]
      x-group-limits:
        bytes: 4194304
        members: 200
        stimuli: 16
        recordings: 16
        title: 200
        transcript: 100000
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        members:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GroupMember' }
        stimuli:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/GroupStimulus' }
        recordings:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/GroupRecording' }

    GroupMember:
      type: object
      additionalProperties: false
      required: [questionId, optionOrder]
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        optionOrder:
          type: string
          enum: [shuffle, fixed]
          description: Fixed is for choice members whose text depends on authored option labels and forbids option shuffling; other members use shuffle. Neither changes member order.

    GroupStimulus:
      type: object
      additionalProperties: false
      required: [id, title, content, gaps]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        content:
          $ref: '#/components/schemas/ContentDocument'
          x-go-type: json.RawMessage
        gaps:
          type: array
          maxItems: 2048
          items: { $ref: '#/components/schemas/GroupGapBinding' }
          description: Exactly one binding per material gap; targets must be distinct within the group and refer to its members.

    GroupGapBinding:
      oneOf:
        - $ref: '#/components/schemas/GroupQuestionGap'
        - $ref: '#/components/schemas/GroupBlankGap'
      discriminator:
        propertyName: kind
        mapping:
          question: '#/components/schemas/GroupQuestionGap'
          blank: '#/components/schemas/GroupBlankGap'

    GroupQuestionGap:
      type: object
      additionalProperties: false
      required: [kind, gapId, questionId]
      properties:
        kind: { type: string, enum: [question] }
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        questionId: { $ref: '#/components/schemas/Uuid' }
      description: A material gap targets a choice member; display labels never determine identity.

    GroupBlankGap:
      type: object
      additionalProperties: false
      required: [kind, gapId, questionId, blankGapId]
      properties:
        kind: { type: string, enum: [blank] }
        gapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        questionId: { $ref: '#/components/schemas/Uuid' }
        blankGapId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
      description: A material gap targets the stable prompt gap of a rich fill-blank member, never a mutable answer-row ID.

    GroupRecording:
      type: object
      description: |
        Teacher-only authoring shape. One explicit playback binding per audio asset
        used in the group's materials. All member questions share its allowance;
        another group using the same asset has a different binding. Transcripts
        require a separate policy-gated review projection, never a learner cast.
      additionalProperties: false
      required: [id, assetId, policy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assetId: { $ref: '#/components/schemas/Uuid' }
        policy: { $ref: '#/components/schemas/AudioPolicy' }
        transcript: { type: [string, 'null'], maxLength: 100000 }

    QuestionGroupBundle:
      type: object
      additionalProperties: false
      required: [group, questions]
      properties:
        group: { $ref: '#/components/schemas/QuestionGroup' }
        questions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/GroupQuestionInput' }

    GroupQuestionInput:
      type: object
      additionalProperties: false
      required: [id, input]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        input: { $ref: '#/components/schemas/QuestionInput' }

    StoredQuestionGroup:
      type: object
      additionalProperties: false
      required: [bundle, ownerSectionId, revision, archivedAt, createdAt, updatedAt, assets, unavailableAssetIds]
      properties:
        bundle: { $ref: '#/components/schemas/QuestionGroupBundle' }
        ownerSectionId: { type: [string, 'null'], format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        testUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Enclosing test revision for section-owned groups; absent for bank groups.
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/MediaAsset' }
          description: Authorized media referenced by members or shared materials.
        unavailableAssetIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: Bound assets whose metadata or signed link could not be loaded. A media outage does not turn a committed edit into an ambiguous save failure; clients show a retryable material state.

    QuestionGroupSummary:
      type: object
      additionalProperties: false
      required: [id, title, revision, questionCount, recordingCount, totalPoints, tags, archivedAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        questionCount: { type: integer, minimum: 0 }
        recordingCount: { type: integer, minimum: 0 }
        totalPoints: { $ref: '#/components/schemas/Points' }
        tags: { type: array, items: { type: string } }
        archivedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    GroupCreateInput:
      type: object
      additionalProperties: false
      required: [bundle]
      properties:
        bundle: { $ref: '#/components/schemas/QuestionGroupBundle' }
        ownerSectionId: { type: [string, 'null'], format: uuid }
        expectedTestUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Required when ownerSectionId identifies a section; no ownerSectionId means an independent bank group.

    GroupUpdateInput:
      type: object
      additionalProperties: false
      required: [bundle, expectedRevision]
      properties:
        bundle: { $ref: '#/components/schemas/QuestionGroupBundle' }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        expectedTestUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Required for a section-owned group; owner cannot change through this operation.

    GroupCopyInput:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        ownerSectionId: { type: [string, 'null'], format: uuid }
        expectedTestUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: Required when copying into a section; omitted destination creates an independent bank group.

    DraftSectionUnit:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [question, group] }
        id:
          $ref: '#/components/schemas/Uuid'
          description: Standalone question ID or owned group ID, according to kind.

    TestSection:
      type: object
      required: [id, ordinal, title, questionIds]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ordinal: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1 }
        instructions: { type: [string, 'null'] }
        questionIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: Legacy standalone references; group members belong to their group and are excluded here.
        units:
          type: array
          items: { $ref: '#/components/schemas/DraftSectionUnit' }
          description: Complete mixed order when the section has shared groups; absent on historical standalone outlines.

    Test:
      type: object
      required: [id, title, status, currentVersion, totalPoints, questionCount, audioCount, sections, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TestStatus' }
        currentVersion:
          type: integer
          minimum: 0
          description: 0 while never published. A `published` test always has ≥ 1.
        totalPoints: { $ref: '#/components/schemas/Points' }
        questionCount: { type: integer, minimum: 0 }
        audioCount:
          type: integer
          minimum: 0
          description: Draft questions with their own audio or a shared group recording, counted once per question. Backs A-03's headphone badge.
        sections:
          type: array
          items: { $ref: '#/components/schemas/TestSection' }
          description: The **draft** outline. Published content lives in versions.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt: { type: [string, 'null'], format: date-time }

    TestVersion:
      type: object
      description: Immutable. Editing a published test creates a new one; in-flight attempts keep theirs (§7).
      required:
        [id, version, totalPoints, questionCount, audioCount, manualCount,
         publishedAt, publishedBy]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        totalPoints: { $ref: '#/components/schemas/Points' }
        questionCount: { type: integer, minimum: 0 }
        audioCount:
          type: integer
          minimum: 0
          description: Questions with their own audio or a shared group recording, counted once per question; shown when picking a version to assign (G-01).
        manualCount:
          type: integer
          minimum: 0
          description: |
            Questions needing manual grading. G-01 multiplies it by the roster to
            show the teacher what they are committing to marking before they
            commit to it.
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedBy: { type: string, description: Display name. }

    PublishValidationError:
      type: object
      description: |
        Publish returns **every** problem at once, each anchored to a question,
        so the builder can mark them inline rather than surfacing one per attempt.
      required: [rule, message]
      additionalProperties: false
      properties:
        rule:
          type: string
          enum:
            - points_positive
            - choice_has_correct_option
            - option_content_valid
            - question_content_valid
            - question_valid
            - group_valid
            - total_points_valid
            - blank_has_accepted_answer
            - blank_placeholders_match
            - audio_question_has_asset
            - section_not_empty
        message: { type: string }
        sectionId: { type: [string, 'null'], format: uuid }
        questionId: { type: [string, 'null'], format: uuid }
        groupId: { type: [string, 'null'], format: uuid }

    # ------------------------------------------------------------- assignments

    AssignmentStatus:
      type: string
      enum: [draft, scheduled, open, closed]
      description: |
        **Derived**, never stored (D-18). A pure function of `publishedAt`,
        `opensAt`, `closesAt` and an optional early `closedAt`, so it cannot go
        stale and needs no scheduler.

        `draft` is what an unpublished assignment reads as. It does not weaken
        D-18: publishing is an explicit act by the teacher, not a timestamp
        arriving, so nothing has to flip a row on a schedule. A draft is
        invisible to students and counts towards nothing.

    ReviewPolicy:
      type: object
      required: [showScore, showCorrectAnswers, showExplanations]
      additionalProperties: false
      properties:
        showScore: { type: boolean, default: true }
        showCorrectAnswers: { type: boolean, default: false }
        showExplanations: { type: boolean, default: false }

    IntegrityPolicy:
      type: object
      description: |
        Defaults are §10.3's, conservative on purpose — the teacher opts into
        stricter modes per test. Whatever is enabled is stated in plain
        Vietnamese on the intro page before the student starts (§10.2).
      required: [requireFullscreen, blockCopyPaste, maxFocusLoss, onLimitExceeded, minAwayMs]
      additionalProperties: false
      properties:
        requireFullscreen: { type: boolean, default: false }
        blockCopyPaste: { type: boolean, default: true }
        maxFocusLoss: { type: integer, minimum: -1, default: 0, description: '-1 = no away episodes allowed; 0 = unlimited; positive values = allowed counted episodes.' }
        onLimitExceeded:
          type: string
          enum: [warn, flag, auto_submit]
          default: flag
          description: '`auto_submit` immediately submits after the allowed number of counted away episodes is exceeded, preserving answers and recording the violation.'
        minAwayMs:
          type: integer
          minimum: 0
          default: 3000
          description: |
            An away episode shorter than this is not a strike. A 2-second blur is
            a notification; a 90-second blur is a search (§10.1).

    Assignment:
      type: object
      required:
        [id, testId, testVersionId, testVersion, testTitle, targets, window,
         publishedAt, updatedAt, durationMinutes, maxAttempts, shuffleQuestions,
         shuffleOptions, review, integrity, status]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testId: { $ref: '#/components/schemas/Uuid' }
        testVersionId: { $ref: '#/components/schemas/Uuid' }
        testVersion: { type: integer, minimum: 1 }
        testTitle: { type: string }
        targets:
          type: object
          required: [classes, students]
          additionalProperties: false
          properties:
            classes:
              type: array
              description: The classes this assignment targets, with their names and live member counts.
              items:
                type: object
                required: [id, name, studentCount]
                additionalProperties: false
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  studentCount: { type: integer, minimum: 0 }
            students:
              type: array
              description: The students targeted by name, with their names (G-09's chips).
              items:
                type: object
                required: [id, name]
                additionalProperties: false
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
        publishedAt:
          type: [string, 'null']
          format: date-time
          description: Null while the assignment is a draft.
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        window:
          type: object
          required: [opensAt, closesAt]
          additionalProperties: false
          properties:
            opensAt: { $ref: '#/components/schemas/Timestamp' }
            closesAt: { $ref: '#/components/schemas/Timestamp' }
            closedAt: { type: [string, 'null'], format: date-time, description: Set when closed early by the teacher. }
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 600
          description: |
            Server-enforced. An attempt's deadline is
            `min(startedAt + duration, closesAt)`, so starting late does not buy
            a full duration and does not cut the student off mid-window (O-05).
        maxAttempts: { type: integer, minimum: 1 }
        shuffleQuestions: { type: boolean }
        shuffleOptions: { type: boolean }
        review: { $ref: '#/components/schemas/ReviewPolicy' }
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        submittedCount: { type: integer, minimum: 0, description: Distinct enabled students with at least one handed-in non-voided attempt. }
        targetCount: { type: integer, minimum: 0 }
        flaggedCount: { type: integer, minimum: 0 }
        pendingManualCount:
          type: integer
          minimum: 0
          description: Outstanding manual answers across handed-in attempts, including partially graded papers.
        pendingGradingCount:
          type: integer
          minimum: 0
          description: Handed-in attempts with a manual answer still unmarked (G-09's "Chờ chấm").

    # ---------------------------------------------------------------- attempts

    AttemptStatus:
      type: string
      enum: [in_progress, submitted, timed_out, graded, voided]

    Answer:
      description: Discriminated by `type` (§7).
      oneOf:
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/TrueFalseAnswer'
        - $ref: '#/components/schemas/FillBlankAnswer'
        - $ref: '#/components/schemas/TextAnswer'
      discriminator:
        propertyName: type
        mapping:
          choice: '#/components/schemas/ChoiceAnswer'
          true_false: '#/components/schemas/TrueFalseAnswer'
          fill_blank: '#/components/schemas/FillBlankAnswer'
          text: '#/components/schemas/TextAnswer'

    ChoiceAnswer:
      type: object
      required: [type, optionIds]
      additionalProperties: false
      properties:
        type: { type: string, const: choice }
        optionIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    TrueFalseAnswer:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, const: true_false }
        value: { type: boolean }

    FillBlankAnswer:
      type: object
      required: [type, values]
      additionalProperties: false
      properties:
        type: { type: string, const: fill_blank }
        values:
          type: object
          additionalProperties: { type: string }
          description: Keyed by blank id.

    TextAnswer:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, const: text }
        value: { type: string }

    AttemptScore:
      type: object
      required: [earned, total, pendingManual]
      additionalProperties: false
      properties:
        earned: { $ref: '#/components/schemas/Points' }
        total: { $ref: '#/components/schemas/Points' }
        pendingManual: { type: integer, minimum: 0, description: Questions still awaiting manual grading. }

    Attempt:
      type: object
      required: [id, assignmentId, studentId, testVersionId, attemptNo, status, startedAt, deadlineAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        testVersionId: { $ref: '#/components/schemas/Uuid' }
        attemptNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        deadlineAt:
          $ref: '#/components/schemas/Timestamp'
        submittedAt: { type: [string, 'null'], format: date-time }
        gradedAt: { type: [string, 'null'], format: date-time }
        score:
          oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }]
        integrity:
          type: [object, 'null']
          required: [focusLossCount, flagged]
          additionalProperties: false
          properties:
            focusLossCount: { type: integer, minimum: 0 }
            flagged: { type: boolean }

    AttemptSession:
      type: object
      description: |
        Returned when an attempt is created, resumed or read. Everything the
        engine needs to run authoritatively.
      required: [attempt, testTitle, sections, questions, sessionId, beaconToken, serverTime, audioPlays, answers, integrity]
      additionalProperties: false
      properties:
        remainingAttempts: { type: integer, minimum: 0, description: Additional attempts available after this one, excluding voided attempts. }
        attempt: { $ref: '#/components/schemas/Attempt' }
        testTitle:
          type: string
          description: The engine's header names the paper from 1024px up (S-08).
        sections:
          type: array
          items: { $ref: '#/components/schemas/StudentSection' }
          description: In test order. `questions` never interleaves two sections, whatever the shuffle.
        questions:
          type: array
          items: { $ref: '#/components/schemas/StudentQuestion' }
          description: |
            Already in presentation order, shuffled server-side and stable
            across reloads (D-02). Shuffling happens inside each section, so
            the order of sections is the order of `sections`.
        groups:
          type: array
          items: { $ref: '#/components/schemas/StudentGroup' }
          description: |
            Frozen shared context for this attempt's version. Member IDs name
            questions in this session; presentation order comes from questions.
            No answer keys or recording transcripts. Only version-bound assets
            reachable through this student's own attempt receive signed URLs.
            Empty for historical standalone papers; optional for compatibility.
        sessionId:
          $ref: '#/components/schemas/Uuid'
          description: |
            Identifies this device/tab. Every write carries it; a superseded
            session gets `SESSION_SUPERSEDED`, which is how the first tab learns
            it lost (§10.1, E2E 7).
        beaconToken:
          type: string
          description: |
            Opaque, valid until `deadlineAt`, **append-only event access**.
            `navigator.sendBeacon` cannot set an `Authorization` header and the
            15-minute access token has usually expired by `pagehide`, so the
            beacon carries this in its body instead. Grants no read access.
        superseded:
          type: boolean
          description: |
            Present and true only in an answer of `getAttempt` to a tab that
            named a session the attempt no longer has. `sessionId` is then the
            session that tab named, `beaconToken` is empty, and every write
            under that session answers `SESSION_SUPERSEDED`.
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        audioPlays:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: |
            Keyed by question id. **Server-authoritative** — the client renders
            remaining plays from this, decrements optimistically, and reconciles
            on the next fetch. A client-side counter would reset on reload and
            make the limit meaningless (§11.4).
        groupAudioPlays:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: |
            Server counts keyed by frozen group recording ID, shared across all
            members and sessions of this attempt. Different groups using the same
            file have independent counts. Optional for historical clients.
        answers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Answer' }
          description: Keyed by question id. The base for the resume merge.
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }

    GroupAudioPlayInput:
      type: object
      additionalProperties: false
      required: [recordingId, playId, sessionId]
      properties:
        recordingId: { $ref: '#/components/schemas/Uuid' }
        playId:
          $ref: '#/components/schemas/Uuid'
          description: Stable random ID for one gesture, reused unchanged by retries; unique within the attempt.
        sessionId: { $ref: '#/components/schemas/Uuid' }

    GroupAudioPlayResult:
      type: object
      additionalProperties: false
      required: [playId, plays, maxPlays]
      properties:
        playId: { $ref: '#/components/schemas/Uuid' }
        plays: { type: integer, minimum: 1 }
        maxPlays: { type: [integer, 'null'], minimum: 1 }

    IntegrityEventInput:
      type: object
      required: [kind, occurredAt, clientSeq]
      additionalProperties: false
      properties:
        kind:
          type: string
          maxLength: 40
          description: |
            Not an enum: an append-only telemetry log reliably gains kinds, and a
            newer client must not fail against an older server. Unknown kinds are
            stored, not rejected. Known set is §10.1.
          examples: [tab_hidden, window_blur, paste, audio_play, network_offline]
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        clientSeq:
          type: integer
          minimum: 0
          description: |
            The event's offset in milliseconds from the attempt's start, as the
            tab that recorded it measured it against the server's clock, and
            never below the number after that tab's last one: it increases
            **within a tab**. Uniqueness is `(attempt, session, clientSeq)`: an
            event that repeats a number its session has used is taken for a
            retry and is not stored. A new session may use any number again
            (D-01). A client that sends a plain counter is accepted.
        questionId: { type: [string, 'null'], format: uuid }
        meta: { type: [object, 'null'], additionalProperties: true }

    IntegrityEvent:
      type: object
      required: [id, kind, occurredAt, offsetMs, clientSeq]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        offsetMs: { type: integer, description: Milliseconds since the attempt started. }
        durationMs:
          type: [integer, 'null']
          description: |
            For paired events (hidden/visible, blur/focus, fullscreen in/out),
            computed server-side. `null` on an unpaired trailing event — the
            student never came back — which renders open-ended rather than being
            dropped (§10.4).
        clientSeq: { type: integer }
        sessionId: { $ref: '#/components/schemas/Uuid' }
        questionId: { type: [string, 'null'], format: uuid }
        meta: { type: [object, 'null'], additionalProperties: true }

    IntegritySummary:
      type: object
      description: The §10.4 summary strip. Neutral by construction — counts, not verdicts.
      required: [totalAwayMs, awayEpisodes, pasteCount, resumeCount, audioReplays, offlineEpisodes]
      additionalProperties: false
      properties:
        totalAwayMs: { type: integer, minimum: 0 }
        awayEpisodes: { type: integer, minimum: 0, description: Episodes exceeding `minAwayMs`. }
        pasteCount: { type: integer, minimum: 0 }
        resumeCount: { type: integer, minimum: 0 }
        audioReplays: { type: integer, minimum: 0 }
        offlineEpisodes:
          type: integer
          minimum: 0
          description: Shown distinctly from focus loss — distinguishing bad wifi from cheating matters for fairness (§10.1).

    MonitorRow:
      type: object
      description: One row per **targeted student**, including those who never started.
      required: [studentId, fullName, state]
      additionalProperties: false
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
        state: { type: string, enum: [not_started, in_progress, submitted, timed_out, graded, voided] }
        attemptId: { type: [string, 'null'], format: uuid }
        attemptNo: { type: [integer, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        deadlineAt: { type: [string, 'null'], format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        answeredCount:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Questions whose saved answer says something, by the rule of
            `StudentAssignmentCard.liveAnsweredCount`, against the response's
            `questionCount` (G-02's progress column).
        score: { oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }] }
        focusLossCount: { type: [integer, 'null'] }
        flagged: { type: boolean }
        audioOverLimit: { type: boolean, description: Reported, never enforced (§11.4). }

    AttemptListRow:
      type: object
      required: [id, studentId, studentName, assignmentId, testTitle, status, flagged]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        testTitle: { type: string }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        pendingManual: { type: integer, minimum: 0 }
        flagged: { type: boolean }

    Dashboard:
      type: object
      description: |
        The Teacher dashboard covers the caller's own teaching, including an Admin:
        assignments they created or targeting classes they teach, reachable papers on
        them, and their classes. Its repository supports scope.all for a future Admin
        console, but this operation never requests it. Legacy fields retain their
        meaning; T-R4.23 stops reading openAssignments, activeStudents, totalStudents
        and recentAttempts, and R5 removes them. Range affects submissions only.
      required: [openAssignments, awaitingGrading, activeStudents, flaggedAttempts, newestFlaggedAttempt, recentAttempts, takingNow, submissions, today, recentActivity]
      additionalProperties: false
      properties:
        closingSoon: { type: integer, minimum: 0, description: Open assignments closing within the next 24 hours. }
        waitingStudents: { type: integer, minimum: 0, description: Distinct students with unmarked manual answers in handed-in papers. }
        oldestWaitingAt: { type: [string, 'null'], format: date-time }
        totalStudents: { type: integer, minimum: 0, description: 'Enabled student-like accounts in the classes the caller teaches, for an Admin too; this operation never requests the repository wide scope.' }
        nextClosing:
          oneOf: [{ $ref: '#/components/schemas/ClosingAssignment' }, { type: 'null' }]
        openAssignments: { type: integer, minimum: 0 }
        awaitingGrading: { type: integer, minimum: 0 }
        activeStudents: { type: integer, minimum: 0, description: 'Of the enabled student-like members of classes the caller teaches, those who started an attempt in the last seven days on an assignment they reach; an Admin has the same own scope and cannot request the repository wide reading here.' }
        flaggedAttempts: { type: integer, minimum: 0 }
        newestFlaggedAttempt:
          oneOf: [{ $ref: '#/components/schemas/DashboardFlaggedAttempt' }, { type: 'null' }]
          description: Newest started currently flagged reachable paper, ordered by started_at then id descending, from the flagged count statement snapshot; null without grading or intervention permission or a matching paper. Historical, voided and former-roster papers remain eligible.
        recentAttempts:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AttemptListRow' }

        takingNow: { $ref: '#/components/schemas/DashboardTakingNow' }
        submissions: { $ref: '#/components/schemas/DashboardSubmissions' }
        today:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DashboardToday' }
        recentActivity:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/DashboardActivity' }

    DashboardFlaggedAttempt:
      type: object
      additionalProperties: false
      required: [assignmentId, attemptId]
      properties:
        assignmentId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }

    DashboardTakingNow:
      type: object
      additionalProperties: false
      required: [students, assignments, assignmentId]
      description: Distinct students and assignments with reachable in-progress attempts before their deadline.
      properties:
        students: { type: integer, minimum: 0 }
        assignments: { type: integer, minimum: 0 }
        assignmentId:
          type: [string, 'null']
          format: uuid
          description: Assignment of the newest started reachable in-progress paper strictly before its deadline at the supplied application clock, ordered by started_at then id descending, from the taking count statement snapshot; null when none qualifies.

    DashboardSubmissions:
      type: object
      additionalProperties: false
      required: [days, total, averagePercent]
      description: Handed-in papers within the chosen calendar range in the actor's zone, including graded papers.
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 30
          description: One entry per day, oldest first and today last, including zero days.
          items: { $ref: '#/components/schemas/DashboardDay' }
        total: { type: integer, minimum: 0 }
        averagePercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Mean graded paper percentage, rounded half up; null when no graded paper has a score.

    DashboardDay:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }

    DashboardToday:
      type: object
      additionalProperties: false
      required: [kind, at, assignmentId, title, notSubmitted]
      description: Published assignment openings and effective closings today in the actor's zone, oldest first.
      properties:
        kind: { type: string, enum: [opens, closes] }
        at: { $ref: '#/components/schemas/Timestamp' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        notSubmitted:
          type: integer
          minimum: 0
          description: Distinct enabled reached targets without a submitted, timed-out or graded attempt on this assignment.

    DashboardActivity:
      type: object
      additionalProperties: false
      required: [kind, at, studentName, subject, flagged]
      description: Latest ten activities, newest first; one row per non-voided attempt, plus student-like joins by code into taught classes.
      properties:
        kind: { type: string, enum: [submitted, started, joined] }
        at: { $ref: '#/components/schemas/Timestamp' }
        studentName: { type: string }
        subject: { type: string }
        flagged: { type: boolean }

    TeacherSummary:
      type: object
      additionalProperties: false
      required: [liveAssignments, answersToGrade, unreadNotifications]
      description: Cheap nav counts in the caller's own teaching scope, for an Admin too.
      properties:
        liveAssignments:
          type: [integer, 'null']
          minimum: 0
          description: Rows the caller's Assignments list shows as open; always a number under the current workspace.teacher gate.
        answersToGrade:
          type: [integer, 'null']
          minimum: 0
          description: Unmarked manual answers in reachable handed-in papers; null without teaching.grading, when the count is not run.
        unreadNotifications:
          type: integer
          minimum: 0
          description: The caller's own unread notifications.

    ClosingAssignment:
      type: object
      required: [id, title, closesAt, submittedCount, targetCount]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        closesAt: { type: string, format: date-time }
        submittedCount: { type: integer, minimum: 0, description: Distinct enabled students who have handed in at least one non-voided attempt. }
        targetCount: { type: integer, minimum: 0, description: 'Enabled students in the union of class and individual targets, counting only the classes the caller teaches and the students they reach.' }

    StudentAssignmentCard:
      type: object
      required:
        [id, testTitle, status, opensAt, closesAt, durationMinutes,
         attemptsUsed, maxAttempts, questionCount, totalPoints]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        testTitle: { type: string }
        className:
          type: [string, 'null']
          description: >-
            The class this assignment reached the student through. Null unless
            exactly one targeted class that is not archived contains them.
        classId:
          type: [string, 'null']
          format: uuid
          description: The id behind `className`, so S-17 can count a class's papers. Null when `className` is.
        classIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          description: >-
            Every class this assignment targets that contains the student and is
            not archived, so each class card can name its next paper. Empty for
            a student targeted only by name.
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        opensAt: { $ref: '#/components/schemas/Timestamp' }
        closesAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer }
        questionCount:
          type: integer
          minimum: 0
          description: Questions on the pinned version.
        totalPoints:
          $ref: '#/components/schemas/Points'
          description: What the paper is out of.
        attemptsUsed: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        lastAttemptId: { type: [string, 'null'], format: uuid }
        lastSubmittedAt:
          type: [string, 'null']
          format: date-time
          description: When the last attempt was handed in. Null while it is in progress.
        hasLiveAttempt: { type: boolean, description: Drives Start vs Resume (§9). }
        liveDeadlineAt:
          type: [string, 'null']
          format: date-time
          description: The live attempt's deadline. Absent exactly when `hasLiveAttempt` is false.
        liveAnsweredCount:
          type: [integer, 'null']
          minimum: 0
          description: >-
            How many of the live attempt's saved answers say something, by the
            rule the engine's navigator uses: a choice with an option picked, a
            true/false with a value, a text that is not blank, a fill-in with
            every blank filled. An answer that exists only in the browser's
            draft is not counted. Absent exactly when `hasLiveAttempt` is false.
        score:
          oneOf: [{ $ref: '#/components/schemas/AttemptScore' }, { type: 'null' }]
          description: Only when the assignment's `review.showScore` is on.

    # ----------------------------------------------------------- notifications

    NotificationKind:
      type: string
      description: |
        What a notification is about. The server sends no sentence: the client
        words the item from `kind` and `params` in the reader's language.

        Each kind carries exactly these `params`:

        | Kind | For | Params |
        |---|---|---|
        | `attempt.submitted` | a teacher | `title`, `count`, `toGrade` |
        | `attempt.flagged` | a teacher | `studentName`, `title`, `focusLost` |
        | `assignment.closing` | a teacher | `title`, `notSubmitted` |
        | `class.joined` | a teacher | `studentName`, `className` |
        | `join_codes.rotated` | a teacher | `count`, `classNames` |
        | `assignment.opened` | a student | `title`, `closesAt` |
        | `assignment.due_soon` | a student | `title`, `closesAt` |
        | `assignment.extended` | a student | `title`, `closesAt` |
        | `result.ready` | a student | `title` |
      enum:
        - attempt.submitted
        - attempt.flagged
        - assignment.closing
        - class.joined
        - join_codes.rotated
        - assignment.opened
        - assignment.due_soon
        - assignment.extended
        - result.ready

    NotificationEvent:
      type: string
      description: |
        One switch of the notification settings. `attempt.submitted`,
        `attempt.flagged` and `assignment.closing` are the teacher's;
        `assignment.due_soon` and `result.ready` the student's. A switch
        governs the kind of the same name, and `assignment.due_soon` also
        governs `assignment.opened` and `assignment.extended`. `class.joined`
        and `join_codes.rotated` have no switch.
      enum:
        - attempt.submitted
        - attempt.flagged
        - assignment.closing
        - assignment.due_soon
        - result.ready

    NotificationParams:
      type: object
      description: |
        What the client builds a notification's sentence from. One closed set
        of fields for every kind; `NotificationKind` says which of them a kind
        carries. Plain values only: never markup, never a score, a band or an
        answer. A name is a copy taken when the notification was written.
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300, description: The title of the test the assignment gives. }
        count:
          type: integer
          minimum: 0
          description: Papers handed in (`attempt.submitted`), or classes whose join code was replaced (`join_codes.rotated`).
        toGrade: { type: integer, minimum: 0, description: 'Of the papers handed in, those with an answer waiting for a mark.' }
        focusLost: { type: integer, minimum: 0, description: Times the student left the test. }
        notSubmitted: { type: integer, minimum: 0, description: Students who have not handed in. }
        studentName: { type: string, minLength: 1, maxLength: 200 }
        className: { type: string, minLength: 1, maxLength: 200 }
        classNames:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 200 }
          description: At most five names; `count` holds how many classes there are.
        closesAt: { $ref: '#/components/schemas/Timestamp' }

    NotificationTarget:
      type: object
      description: |
        Where a click on the notification goes: a page the client resolves from
        `route`, never a URL. `assignmentId` is present for `assignment` and
        `studentAssignment`, and `attemptId` for `attempt` and `result`; either
        may accompany any other route.
      required: [route]
      additionalProperties: false
      properties:
        route:
          type: string
          description: |
            `assignment`, `attempt`, `grading` and `classes` are pages of the
            teaching workspace; `result` and `studentAssignment` are the
            student's result and the student's page of an assignment.
          enum: [assignment, attempt, grading, classes, result, studentAssignment]
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        attemptId: { $ref: '#/components/schemas/Uuid' }

    Notification:
      type: object
      required: [id, kind, params, target, createdAt, readAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        params: { $ref: '#/components/schemas/NotificationParams' }
        target:
          description: Null when the notification leads nowhere.
          oneOf: [{ $ref: '#/components/schemas/NotificationTarget' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        readAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the caller marked it read; null while it is unread. A
            notification that is written again after it was read, as a count
            that grew is, is unread again.

    NotificationPreference:
      type: object
      required: [event, inApp, email]
      additionalProperties: false
      properties:
        event: { $ref: '#/components/schemas/NotificationEvent' }
        inApp: { type: boolean, description: 'While false, no notification this switch governs is written for the caller.' }
        email: { type: boolean, description: Stored and returned. Nothing is sent by email yet. }

    NotificationPreferences:
      type: array
      description: Every `NotificationEvent` once. The server answers them in the enum's order.
      minItems: 5
      maxItems: 5
      items: { $ref: '#/components/schemas/NotificationPreference' }

    MySummary:
      type: object
      description: What the caller's shell shows before any page is open.
      required: [unreadNotifications]
      additionalProperties: false
      properties:
        unreadNotifications: { type: integer, minimum: 0 }

    # ----------------------------------------------------------- write shapes

    QuestionInput:
      type: object
      description: |
        Create/update body for a bank question. Cross-field rules that a single
        schema cannot express — single_choice and true_false need exactly one correct
        option (true_false has exactly two options), multiple_choice needs at least one correct
        option, a `fill_blank` needs exact gapId bindings for rich prompts or matching
        `{{n}}` ordinals for legacy Markdown, an audio policy requires an audio asset — are validated by the
        server and again at publish (§8). Failing them returns
        `VALIDATION_FAILED` with per-field `details`.
      required: [type, prompt, points]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        promptContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionPromptContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        prompt:
          type: string
          minLength: 1
          description: Legacy Markdown, or exact plain projection when promptContent is present. `fill_blank` uses stable gapId bindings in rich content and `{{n}}` placeholders in legacy Markdown.
        mediaAssetId: { type: [string, 'null'], format: uuid }
        audio:
          oneOf: [{ $ref: '#/components/schemas/AudioPolicy' }, { type: 'null' }]
          description: Required if and only if the asset is audio (§7).
        transcript:
          type: [string, 'null']
          description: Audio questions only. Teacher-authored; the student sees it only per policy.
        options:
          type: array
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              id: { type: [string, 'null'], format: uuid, description: Omit to create. }
              content:
                oneOf: [{ $ref: '#/components/schemas/OptionContent' }, { type: 'null' }]
                x-go-type: json.RawMessage
                x-go-type-skip-optional-pointer: true
              text: { type: string, minLength: 1 }
              isCorrect: { type: boolean }
          description: Order in the array is the stored ordinal.
        blanks:
          type: array
          items:
            type: object
            required: [ordinal, acceptedAnswers]
            additionalProperties: false
            properties:
              id: { type: [string, 'null'], format: uuid }
              gapId: { type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
              ordinal: { type: integer, minimum: 1, maximum: 32767 }
              acceptedAnswers:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
              caseSensitive: { type: boolean, default: false }
        points:
          allOf: [{ $ref: '#/components/schemas/Points' }]
          exclusiveMinimum: 0
          multipleOf: 0.01
        explanationContent:
          oneOf: [{ $ref: '#/components/schemas/QuestionContent' }, { type: 'null' }]
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        explanation: { type: [string, 'null'] }
        sampleAnswer:
          type: [string, 'null']
          description: '`short_answer` only. Rejected on any other type.'
        tags: { type: array, items: { type: string, minLength: 1 } }

    AssignmentInput:
      type: object
      required: [testVersionId, targets, window, durationMinutes, maxAttempts, review, integrity]
      additionalProperties: false
      properties:
        testVersionId:
          $ref: '#/components/schemas/Uuid'
          description: Must be a published version. Immutable once any attempt exists.
        targets:
          type: object
          required: [classIds, studentIds]
          additionalProperties: false
          properties:
            classIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            studentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        window:
          type: object
          required: [opensAt, closesAt]
          additionalProperties: false
          properties:
            opensAt: { $ref: '#/components/schemas/Timestamp' }
            closesAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        maxAttempts: { type: integer, minimum: 1, default: 1 }
        shuffleQuestions:
          type: boolean
          default: false
          description: Shuffle standalone questions and complete groups as units inside each section; preserve member order.
        shuffleOptions:
          type: boolean
          default: false
          description: Rejected with VALIDATION_FAILED on shuffleOptions when the selected version contains a group member with fixed option-label dependencies.
        review: { $ref: '#/components/schemas/ReviewPolicy' }
        integrity: { $ref: '#/components/schemas/IntegrityPolicy' }
        draft:
          type: boolean
          default: false
          description: |
            Save without giving it out — G-01's "Lưu nháp". Saving again with
            `false` publishes it, which is what the "Giao bài" button sends.

            A draft is the only assignment allowed to have no targets: the point
            of saving one is to come back to it.
        closeNow:
          type: boolean
          description: PATCH only. Sets `closedAt`, closing the assignment before `closesAt`.

paths:

  # ======================================================================
  # PUBLIC — unauthenticated.
  #
  # Every operation below has `security: []` and the `public` tag. The server
  # cross-references this file at startup and refuses to boot if any of them
  # lacks a registered rate limiter, so §14's "public endpoint is rate-limited"
  # checkbox is structural rather than procedural.
  # ======================================================================

  /join/preview:
    post:
      operationId: previewJoinCode
      tags: [public]
      security: []
      summary: Look up a class by join code
      description: |
        Backs the inline preview on `/join` and `/join/:code`, which exists so
        the student sees **which class they are joining** before authenticating.
        Never create an account and enrol in one blind tap (§6.2).

        Lookup is by a keyed hash of the normalized code, or by its SHA-256 for
        a code issued before v0.8.0, compared in constant time. The plaintext
        is never stored; a code issued from v0.8.0 on is stored encrypted
        (§6.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinCode]
              additionalProperties: false
              properties:
                joinCode:
                  type: string
                  minLength: 8
                  maxLength: 9
                  description: |
                    Accepted with or without the dash and in any case; normalized
                    before lookup. The alphabet excludes `0`, `O`, `1` and `I` (§6.1).
                  examples: ['K7M3-P9QR', 'k7m3p9qr']
      responses:
        '200':
          description: |
            **Leak review (§6.5).** Exactly three fields. No student names, no
            counts, no member list, no assignment titles. `classId` is included
            because the confirm step needs an idempotency key for the subsequent
            enrolment; it is a uuidv7 that reveals only the class's creation time
            and grants nothing on its own.
          content:
            application/json:
              schema:
                type: object
                required: [classId, className, teacherName]
                additionalProperties: false
                properties:
                  classId: { $ref: '#/components/schemas/Uuid' }
                  className: { type: string }
                  teacherName: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: |
            Invalid, expired, exhausted, revoked, or self-join disabled.

            **Leak review.** These return distinct `code` values so the client can
            show an accurate message, but identical `details` — empty — and no
            class-identifying text. A disabled-self-join class is indistinguishable
            from a nonexistent one. Nothing here lets a caller enumerate classes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perCode: { perHour: 200 }

  /public/status:
    get:
      operationId: getPublicStatus
      tags: [public]
      security: []
      summary: Whether the API is down for maintenance, or soon will be
      description: |
        The earliest maintenance window that was not cancelled and has not
        ended, or `null`. `active` is true while it is under way. During an
        active window every other operation answers `503 MAINTENANCE`, and this
        one keeps answering, so the client can tell the student when to come
        back.

        **Leak review (§6.5).** The answer is identical for every caller and
        never depends on a token: two timestamps and a flag. No id, no creator,
        no count, no free text. It is served from a snapshot the server
        refreshes at most every 30 s, so neither its content nor its timing
        says anything about the database.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              required: true
              description: '`public, max-age=30`, the snapshot''s own refresh interval.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStatus' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 2000 }

  /auth/login:
    post:
      operationId: login
      tags: [public, auth]
      security: []
      summary: Email and password sign-in
      description: |
        Teacher-created accounts and staff sign-in (§5.1). Self-signup
        requires Google (§6.3); there is no password registration endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 512 }
      responses:
        '200':
          description: Signed in. Sets the rotating refresh cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_refresh=…; HttpOnly; Secure; SameSite=Lax; Path=/auth`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            **Leak review.** `INVALID_CREDENTIALS` for both an unknown email and
            a wrong password, with the same message and comparable timing, so the
            endpoint is not a user-enumeration oracle. A disabled account returns
            the same thing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Maintenance' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perAddressAndEmail: { perMinute: 10 }
        perEmail: { perHour: 20 }

  /auth/google:
    post:
      operationId: googleAuth
      tags: [public, auth]
      security: []
      summary: Google sign-in, and the only self-signup path
      description: |
        The frontend obtains an **authorization code with PKCE** — not an
        implicit ID token — and this endpoint exchanges it server-side. The
        client secret never leaves the backend (§5.3).

        Resolution order (§5.3 step 4), in full:

        1. identity exists → log in
        2. verified email matches a user → link identity, log in
        3. no match **and** a valid `joinCode` → create account + enrol (§6.3)
        4. no match, no join code → `403 ACCOUNT_NOT_PROVISIONED`

        An ID token with `email_verified: false` is **rejected outright** — no
        link, no create, regardless of `joinCode`. This closes an
        account-takeover path and is not negotiable (§5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, redirectUri]
              additionalProperties: false
              properties:
                code: { type: string }
                codeVerifier: { type: string, minLength: 43, maxLength: 128 }
                redirectUri: { type: string, format: uri }
                joinCode:
                  type: string
                  minLength: 8
                  maxLength: 9
                  description: Present only when signing in to join a class, after the class preview on `/join` or `/join/:code`. Turns this into a signup.
      responses:
        '200':
          description: Signed in, or signed up and enrolled.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_refresh=…; HttpOnly; Secure; SameSite=Lax; Path=/auth` — §5.3 step 5. Without it the sign-in has no session.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleSignInSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Code exchange failed, or `email_verified` was false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            `ACCOUNT_NOT_PROVISIONED` — a valid Google identity with no matching
            account and no join code. The client explains that a class code is
            needed rather than offering a signup form (§5.3).

            `ACCOUNT_DISABLED` — the matched account is suspended. Named
            explicitly here, unlike at password login: the caller has just
            proved to Google that they control this address, so the fact
            discloses nothing they could not confirm themselves, and an
            unexplained failure would send them to support instead of to the
            teacher.

            `IDENTITY_ALREADY_LINKED` — the verified email matches an account
            that is already linked to a DIFFERENT Google `sub`. Linking a second
            one would make "unlink Google" ambiguous, so it is refused (D-08).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The supplied `joinCode` was invalid, expired, exhausted or revoked. **No account is created.**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: The body is over 8 KiB, which the rate limiter's keys read in full.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-max-body-bytes: 8192
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 600 }
        perCode: { perHour: 200 }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [public, auth]
      security:
        - refreshCookie: []
      summary: Rotate the refresh token
      description: |
        Reads the opaque token from the cookie and rotates it. Presenting an
        already-rotated token revokes the **whole family** and forces re-login
        (§5.2).

        The client must call this **single-flight** — one shared in-flight
        promise. Parallel calls on a cold page load would each present the same
        token, trip reuse detection, and log the user out on every load.
      responses:
        '200':
          description: Rotated. Sets the replacement cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                The REPLACEMENT `quizzivy_refresh` cookie. Rotation is only
                half-done without it: the predecessor is revoked server-side, so
                a client that kept the old value is logged out on its next call.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                additionalProperties: false
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
        '401':
          description: |
            Absent, expired, revoked, or reused. Client clears state and goes to `/login`.

            **Leak review.** `REFRESH_TOKEN_REUSED` when §5.2 reuse detection
            fires, `REFRESH_TOKEN_INVALID` otherwise — including for a suspended
            account, which is not disclosed here any more than it is at login.

            Distinguishing reuse does tell whoever presented the token that the
            replay was noticed. That is accepted: by then the family is revoked,
            so the information arrives with no access attached. The reason to
            separate them is the victim, not the attacker — "someone else used
            your session" is a message a student can act on, and "your session
            expired" is not. The revocation is also written to `audit_log`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Maintenance' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 1200 }

  # ====================================================================== auth

  /auth/me:
    get:
      operationId: getCurrentUser
      x-permission: self
      tags: [auth]
      summary: Current session
      description: Called on app load. A 401 sends the client to `/login` (§5.4).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Maintenance' }
    patch:
      operationId: updateCurrentUser
      x-permission: self
      tags: [auth]
      summary: Rename yourself
      description: |
        The one thing an account may change about itself, and the only write
        behind the "Hồ sơ" card both settings boards draw (S-10, S-17).

        The name is the account's own; the email is not. An address is issued
        by the teacher or arrives from Google, it is the login, and moving it
        would move who the account is — so it stays read-only here and only
        `PATCH /teacher/students/{id}` can change it. Role, password and provider
        links each have their own endpoint for the same reason.

        Bounds match `users_full_name_check` and createStudent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Saved. The whole user, so the client can replace its session copy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400':
          description: '`VALIDATION_FAILED` — the name is empty or too long.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      description: |
        Revokes the presented refresh token family. The client also clears its
        store and calls `queryClient.clear()` (§5.4).

        Authenticated by the refresh COOKIE, not the access token. An expired
        access token must not be able to strand a live refresh family: the one
        moment a user most wants to log out is the moment their session has
        gone strange.

        A logout that is refused or fails still clears the refresh and docs
        cookies when the request carried the refresh cookie: during a
        maintenance window (`503 MAINTENANCE`), over the rate limit
        (`429 RATE_LIMITED`) and when the revoke fails (`500 INTERNAL`). In
        none of the three is the family revoked: this device is signed out,
        but a copy of the token held elsewhere stays usable for as long as it
        is rotated, and only a password reset, a disable or a password change
        ends it. A request without the cookie gets nothing cleared.
      tags: [auth]
      summary: Revoke the refresh family and clear the cookie
      security:
        - refreshCookie: []
      responses:
        '204':
          description: |
            Revoked, and the cookie is cleared. Returned even for a token that
            was already expired or revoked — logging out is idempotent, and
            reporting "that token was not valid" would answer a question the
            caller has no business asking.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                Two headers. `quizzivy_refresh=; Max-Age=0` with the same Path and flags,
                or the browser keeps the old cookie; and `quizzivy_docs=; Path=/docs;
                Max-Age=0`, so signing out also ends an open API reference session (§5.5).
        '401':
          description: No refresh cookie was presented, so there is no session to end.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      x-rate-limit:
        perIp: { perMinute: 120, perHour: 1200 }

  /auth/change-password:
    post:
      operationId: changePassword
      x-permission: self
      tags: [auth]
      summary: Change own password
      description: |
        Clears `mustChangePassword` and revokes every **other** refresh family
        for this user, so a second device is signed out.

        The calling session is identified by the refresh cookie, which reaches
        this endpoint because it is scoped `Path=/auth`. Without it the server
        cannot tell the caller's family from a stranger's and revokes them all,
        signing the caller out too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                  description: |
                    Required, EXCEPT while `mustChangePassword` is true.

                    In that window the current password is one a teacher
                    generated and read aloud, so re-entering it proves nothing
                    the access token has not already proved — and demanding it
                    strands the case G-07 is drawn for: a student whose password
                    was reset, who then signs in with Google and is redirected
                    here without ever having held the temporary one.
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 512
                  pattern: '[\p{N}\p{P}\p{S}]'
                  description: |
                    At least 8 characters, at least one of which is a digit, a
                    punctuation mark or a symbol, in any script. It must also
                    differ from the password it replaces, which only the server
                    can check (`PASSWORD_UNCHANGED`). The rules apply to a new
                    password only: existing passwords are never re-checked and
                    sign-in does not change.
      responses:
        '204':
          description: Changed. The calling session survives; every other one is revoked.
        '400':
          description: |
            `INVALID_CREDENTIALS` — `currentPassword` is wrong.
            `PASSWORD_REQUIRED` — the account signs in with Google only and has
            no current password to verify; it needs a set-password flow, not this one.
            `PASSWORD_UNCHANGED` — `newPassword` is the password it would replace:
            the verified `currentPassword`, or, while `mustChangePassword` is set,
            the temporary password on the account.
            `VALIDATION_FAILED` — `newPassword` breaks a rule above.

            **A wrong current password is deliberately 400, not 401.** The SPA
            treats 401 as "the session died": it refreshes once and retries, and
            a second 401 signs the user out (§5.2, `client.ts`). Returning 401
            here would mean mistyping your own password rotates your refresh
            token and then logs you out — with no hint that the typo was the
            cause. 401 on this endpoint means the SESSION is invalid, nothing else.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/google/link:
    post:
      operationId: linkGoogle
      x-permission: self
      tags: [auth]
      summary: Link Google to the current account
      description: Same `email_verified` rule as sign-in (§5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, redirectUri]
              additionalProperties: false
              properties:
                code: { type: string }
                codeVerifier: { type: string }
                redirectUri: { type: string, format: uri }
      responses:
        '200':
          description: |
            Linked, or already linked to this same Google account — re-linking
            is a no-op success rather than a conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            The session is invalid, or the exchange failed, or `email_verified`
            was false — the same §5.1 rule sign-in applies, for the same reason:
            an unverified address is not evidence of anything, and binding one
            to an existing account is the takeover path with the account
            already chosen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `IDENTITY_ALREADY_LINKED` covers three cases, all of which mean
            "this link cannot be made":

            - that Google account is already bound to another user;
            - this account already has a *different* Google account linked
              (D-08 allows one, so that "unlink" is unambiguous);
            - the Google address is already some other account's email.

            The third is refused for where it leads rather than where it starts.
            Linking binds the Google `sub` to this account, and §5.3's first
            branch matches on `sub` before email — so the owner of that address
            signing in with their own Google would land in someone else's
            account. Silent, and very hard to diagnose from the inside.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: unlinkGoogle
      x-permission: self
      tags: [auth]
      summary: Unlink Google
      description: |
        **Rejected if it would leave no login method** (§15). A Google-only
        account cannot unlink; the client disables the control and explains why.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`LAST_LOGIN_METHOD` — the account has no password to fall back to.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =============================================================== teacher/tests

  /teacher/question-groups:
