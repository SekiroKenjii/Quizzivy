              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`IMPORT_NOT_READY` — blocking findings remain or decisions are missing. `VALIDATION_FAILED` — the draft names a media asset that is gone, that the importer cannot read, or that is of another kind than its block; nothing is created.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /teacher/media:
    get:
      operationId: listMedia
      x-resource-list: media
      x-permission: workspace.teacher
      description: |
        The §8 media library: the caller's own files, whatever the caller
        holds, newest first. A deleted file is not listed, and neither is one
        that was replaced. Each row carries how many questions use it and how
        many published versions reference it, so a file that cannot be deleted
        can be shown as such. `q` is matched on `displayName` and on
        `originalFilename`, without accents and without case.
      tags: [teacher-media]
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MediaKind' } }
        - name: unused
          in: query
          required: false
          description: |
            `true` keeps only the files whose `questionCount` is zero. `false`
            is the same as leaving it out. A file that only a published
            version or an empty group still holds is unused here, and
            `deleteMedia` still refuses it.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, totalBytes, facets, usage]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LibraryAsset' }
                      totalBytes:
                        type: integer
                        minimum: 0
                        description: |
                          Every file the search and the filters match, not
                          just this page, for A-07's "18 tệp · 42 MB". `total`
                          follows them in the same way.
                      facets: { $ref: '#/components/schemas/MediaFacets' }
                      usage: { $ref: '#/components/schemas/MediaUsage' }
          headers:
            Cache-Control:
              description: |
                `private, no-store`. Every item carries a signed URL with the
                same ten-minute life as `/app/media/{assetId}/url`, so a cached
                page would keep showing URLs that stopped working — and unlike
                the single-URL response there is nothing worth re-serving, since
                the library changes on every upload and delete. `no-store`
                rather than `max-age` for that reason (§11.2).
              required: true
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: uploadMedia
      x-permission: content.media.write
      tags: [teacher-media]
      summary: Upload an audio or image asset
      description: |
        Upload goes **through the backend** in v1 — volume is low, and the
        backend must validate anyway. Presigned direct-to-R2 is the P1
        optimisation, and the client contract will not change beyond this one
        call (§11.1).

        The file part is streamed to disk and never held in memory.
        Audio is mp3 or m4a, at most 50 MB and 5 minutes; an image is png,
        jpg or webp, at most 10 MB (`MediaAsset`'s `x-media-limits`).
        Validation order is the audio size → magic bytes → the image size →
        duration, so an oversized upload is cut off before anything is parsed.
        **Never trusts the `Content-Type` header or the file extension**
        (§11.1): the type comes from sniffing, and the duration from probing
        the container. An image's pixel size is read from its header; an image
        whose header cannot be read is stored without one.

        The file joins the caller's library, which may hold at most the
        deployment's quota (`listMedia`'s `usage.quotaBytes`); a file that
        would take it past the quota is not kept. The quota counts the files
        in the library and the replaced or deleted files that something still
        uses (`usage.heldBytes`).

        Assets are immutable. Re-uploading the same file creates a new row with
        a new key; it never overwrites (§11.1). That is what lets a version
        snapshot reference an asset without copying the file.
      x-max-body-bytes: 52559872
      parameters:
        - name: defaultMaxPlays
          in: query
          required: false
          description: |
            The default play limit to store with the audio, as
            `LibraryAsset.defaultMaxPlays` reads it; `0` is unlimited. Left
            out, none is set. Audio only: sent with a file that turns out to
            be an image, the upload is refused and nothing is stored.
          schema: { type: integer, minimum: 0, maximum: 3 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
            # Deliberately no `encoding.file.contentType`. That would make the
            # part's Content-Type header a gate, and this endpoint must never
            # trust it (§11.1) -- the accepted types below are decided by
            # sniffing the bytes. It would also reject honest clients that send
            # `application/octet-stream` (curl, Go's multipart writer) or
            # `audio/x-m4a` (macOS), with a 400 instead of the 415 below.
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: |
            `MEDIA_QUOTA_EXCEEDED` — the caller's library, with the files it
            still holds, would hold more than its quota with this file.
            `STORAGE_LIMIT` — the centre's files would take more than the
            storage limit an Admin set on Plan & usage.
            Nothing was stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: |
            `MEDIA_TOO_LARGE` — over 50 MB, or an image over 10 MB (§11.1).
            The message names the limit that was passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: |
            `MEDIA_TYPE_UNSUPPORTED` (not mp3/m4a — §11.1 and §17.3),
            `MEDIA_TOO_LONG` (over 5 minutes), or `MEDIA_UNREADABLE` (sniffed
            correctly but the duration could not be probed — rejected rather
            than stored with an unknown duration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/media/{id}/replace:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: replaceMedia
      x-permission: content.media.write
      x-resource: [{ in: path, name: id, kind: media }]
      tags: [teacher-media]
      summary: Replace a library file without changing published versions
      description: |
        Creates a new immutable file of the same kind, retaining the old owner's
        display name and default play limit. Repoints that owner's editable
        questions and bank or draft-owned groups atomically. Published versions,
        other owners' rows and import review documents retain the old live file.
        The old file leaves the library but remains readable and bindable.

        What becomes of the old file is `previous`. While a published version or
        another owner's content still uses it, it stays in storage and keeps
        counting toward the owner's quota (`listMedia`'s `usage.heldBytes`).
        Seven days after nothing uses it, it is removed from storage for good;
        nothing restores it, and `previous.url` is the chance to download it.
        Missing, foreign, deleted and already replaced IDs answer the same 404
        before multipart bytes are read, after routing, authentication and header validation.
        Audio is mp3 or m4a, at most 50 MB and 5 minutes; an image is png,
        jpg or webp, at most 10 MB (MediaAsset's x-media-limits). Identification
        and streamed validation match uploadMedia; kind is checked before storage.
        Quota is the old owner's: the library with the new file in it, and the
        old file only while something still uses it, so a replacement that
        published versions hold needs room for both files. Every changed group
        revision advances once, so cached question and group data must be reloaded.
        A caller may replace ten files a minute and sixty an hour; beyond that
        the answer is 429 with `Retry-After`, before the file is read.
        This operation is not idempotent. An uncertain commit or a committed
        replacement whose response fails returns an internal error and retains
        the new object; retrying the old ID may answer 404. Failed storage
        compensation also returns an internal error, without public internal details.
      x-max-body-bytes: 52559872
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Replaced; asset is the new library file under the retained name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaReplacement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: MEDIA_QUOTA_EXCEEDED — the old owner's library would exceed its quota, counting the old file while something still uses it; STORAGE_LIMIT — the centre's files would pass its storage limit; either way no replacement committed and fresh-object compensation succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: |
            `MEDIA_TOO_LARGE` — over 50 MB, or an image over 10 MB (§11.1).
            The message names the limit that was passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: |
            `MEDIA_TYPE_UNSUPPORTED` (not mp3/m4a — §11.1 and §17.3),
            `MEDIA_TOO_LONG` (over 5 minutes), or `MEDIA_UNREADABLE` (sniffed
            correctly but the duration could not be probed — rejected rather
            than stored with an unknown duration). `MEDIA_KIND_MISMATCH` means
            the identified file differs from the old asset's kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /teacher/media/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      operationId: updateMedia
      x-resource:
        - { in: path, name: id, kind: media }
      x-permission: content.media.write
      tags: [teacher-media]
      summary: Rename a file or set its default play limit
      description: |
        Changes the name the library shows for a file and the default play
        limit stored with it; the stored file and its `originalFilename` never
        change, and neither does a question that uses it. It reaches the
        caller's own file, or any file with `scope.all`, as `deleteMedia`
        does. A missing, deleted or replaced file, and another owner's,
        answer the same 404. The change is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUpdate' }
      responses:
        '200':
          description: The file as the library now lists it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMedia
      x-resource:
        - { in: path, name: id, kind: media }
      x-permission: content.media.write
      description: |
        Soft-deletes an unreferenced asset: it leaves the library at once and
        its object is removed from storage seven days after nothing uses it,
        which `deleteMedia` has just checked for published versions and
        independent groups. Nothing restores it; the answer's `url` is the
        chance to download it. A file a live question outside any group still
        attaches keeps counting toward the quota (`listMedia`'s
        `usage.heldBytes`) and is removed seven days after that stops.
      tags: [teacher-media]
      responses:
        '200':
          description: Deleted; the answer says when the file's object goes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaRetirement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `MEDIA_REFERENCED` — a published version or independent question group still uses it (§8, §15).
            `details.tests` names those versions as `ReferencingTest[]`,
            sorted by title then version (A-07). `details.groups` names protected
            draft/bank context as `ReferencingGroup[]`, sorted by title then ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ========================================================= teacher/assignments

  /teacher/assignments:
    get:
      operationId: listAssignments
      x-resource:
        - { in: query, name: classId, kind: class }
      x-resource-list: assignment
      x-permission: workspace.teacher
      description: |
        Backs the §8 assignments list. `status` is derived per assignment, not
        stored (D-18). The list holds the assignments the caller created and
        those that target a class the caller teaches, for every caller:
        `scope.all` does not widen it. A row names only the target classes and
        students the caller reaches, and `targetCount` counts those; for a
        caller who holds `scope.all` that is every target, as in
        `getAssignment`.
        `classId` narrows the list to assignments that target
        any of the classes named, one or several (G-06's "Xem tất cả", G-12);
        the facets follow it, so the tab counts are those of the classes and
        never disagree with the rows. A class named twice, in whatever spelling
        of its id, answers 400 `VALIDATION_FAILED`. A class the caller does not
        teach lists nothing, as a missing class does, unless the caller holds
        `scope.all`: it then lists those of the caller's own assignments that
        target it.
        `q` keeps the assignments whose test title, or the name of a target
        class the caller reaches, contains the text; it is accent-insensitive
        and the facets follow it too. Every row carries `questionCount`.
      tags: [teacher-assignments]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssignmentStatus' } }
        - name: classId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            uniqueItems: true
            items: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
                      facets: { $ref: '#/components/schemas/AssignmentStatusFacets' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createAssignment
      x-resource:
        - { in: body, name: /testVersionId, kind: test-version }
        - { in: body, name: /targets/classIds/-, kind: class }
        - { in: body, name: /targets/studentIds/-, kind: student }
      x-permission: teaching.assignments.write
      tags: [teacher-assignments]
      description: Only a **published** version may be assigned (§8).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`TEST_NOT_PUBLISHED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/results.csv:
    get:
      operationId: exportResultsCsv
      x-resource:
        - { in: query, name: ids, kind: assignment }
      x-permission: teaching.grading
      tags: [teacher-assignments]
      summary: Download the results of up to 50 assignments as a CSV file
      description: |
        One row per student of each assignment the caller reaches, in the order
        of `ids` and then by name, for the students the caller reaches: the
        roster the assignment's Students tab draws, so a student who has not
        started has a row. The attempt that stands for a student is the one
        that tab shows: their latest attempt that is not voided, else the
        latest. Columns: Assignment (the test's title), Version, Class (the
        target classes the caller reaches that the student belongs to, joined
        by `; `), Student, Email, Status, Score, Max, Percent (score over max,
        one decimal), Submitted (in the caller's own time zone, named in the
        header; the default zone when the stored one is invalid), Focus lost
        and Flagged. Score, Max and Percent are empty until every manually
        marked answer of the attempt has a mark. Headers and the Status and
        Flagged words follow `Accept-Language`, Vietnamese by default.

        The file is UTF-8 with a byte-order mark and CRLF line ends, so
        spreadsheets open it correctly. A cell that a spreadsheet would run as
        a formula (it starts with `=`, `+`, `-`, `@`, a tab or a carriage
        return, also after leading spaces, or with the full-width forms of the
        first four) is written with a leading `'`. Overdue attempts are closed
        before the file is read, as the monitor does.

        An id the caller does not reach answers 404 for the whole request, as
        a missing one does. More than 20000 rows answer 422. The response is
        `private, no-store`.

        Each caller has two token buckets: 10 files, and 60 files, that refill
        evenly over a minute and over an hour. A file spends one token from
        each, so a caller can fetch 10 files at once and then about one every
        six seconds, up to 60 an hour. A request that finds either bucket empty
        answers 429 `RATE_LIMITED`, with `Retry-After` in seconds.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              required: true
              description: '`attachment; filename="results-YYYYMMDD.csv"`.'
              schema: { type: string }
            Cache-Control:
              required: true
              description: '`private, no-store`.'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`VALIDATION_FAILED` — the assignments hold more than 20000 rows; `details.ids` says so. Pick fewer.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      operationId: deleteAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: teaching.assignments.write
      tags: [teacher-assignments]
      description: Permanently deletes a draft or closed assignment with no attempts. Open or scheduled assignments and any historical attempts block deletion.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The resource is still referenced or has not reached its required inactive state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: getAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: workspace.teacher
      description: A single assignment with its targets, window, and review and integrity policies.
      tags: [teacher-assignments]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: body, name: /testVersionId, kind: test-version }
        - { in: body, name: /targets/classIds/-, kind: class }
        - { in: body, name: /targets/studentIds/-, kind: student }
      x-permission: teaching.assignments.write
      tags: [teacher-assignments]
      description: |
        `testVersionId` may be changed **only while no attempt exists**.
        Re-pointing an untouched assignment at a corrected version is a
        legitimate workflow; doing it once students have started is not.
        Existing attempts always carry their own version regardless (§7).

        While the assignment is `open`, a **change** to `testVersionId`,
        `durationMinutes` or `maxAttempts` is refused with `ASSIGNMENT_LOCKED`
        (DG-65: only "Test & timing" locks); sending the stored value passes,
        and every other field stays editable. Outside `open` the version check
        above is the only one.

        A **closed** assignment, by its window or by an early close, at the
        moment of the request, stays closed: a `window` that would make it
        `scheduled` or `open` again, or that opens after the early close the
        assignment keeps, is refused with `ASSIGNMENT_CLOSED`, because that is
        a reopening and `reopenAssignment` does it, asking for a reason and
        writing its own audit entry. A request that leaves it closed passes:
        the stored window, an earlier `closesAt`, `closeNow` (while `opensAt`
        is not ahead of now) and every other field. An early close is never
        lifted here.

        `review.release`, `review.showClassAverage` and `studentNote` are
        partial: omitted, they keep what is stored. `studentNote: null` clears
        the note. Every other field is replaced as before.

        An attempt already in progress moves with a later close, in the same
        transaction: its deadline becomes the earlier of its start plus the
        student's time limit and the student's own close, when that is later
        than the deadline it has. A deadline never moves earlier, so a shorter
        close, or `closeNow`, leaves every attempt in progress where it is, and
        an attempt whose deadline has already passed is over and is not
        revived. Each attempt moved is audited as `attempt.extended`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `ASSIGNMENT_LOCKED` — the assignment is open, so the version, the
            duration and the attempts cannot be changed; `ASSIGNMENT_CLOSED` —
            the assignment is closed and the window would open it again, so it
            is reopened with `reopenAssignment`; `VERSION_LOCKED` — attempts
            exist, so the version cannot be changed; or `TEST_NOT_PUBLISHED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/grading/queue:
    get:
      operationId: listGradingQueue
      x-permission: teaching.grading
      x-resource:
        - { in: query, name: assignmentId, kind: assignment }
        - { in: query, name: studentId, kind: student }
      x-resource-list: attempt
      tags: [teacher-attempts]
      summary: Pending manual answers in grading order
      description: |
        Read-only queue of reachable submitted or timed_out papers' saved answers
        requiring manual grading with no manual score. Graded, voided, in-progress,
        missing saved answers and marked zero scores are excluded. Normal
        AssignmentIDs and Papers reach apply; scope.all widens the existing read.
        Filters apply before complete counts, grouping and the first 200 items.
        Groups order by their earliest known eligible submitted_at ascending,
        all-null groups last, then student UUID or assignment/question UUID tuple.
        Within a group items order by submitted_at ascending nulls last, attempt
        UUID, paper ordinal and frozen question UUID. Only represented groups are
        returned, with full remaining counts even when split at the cap.
        Each supplied reference is independently checked: unknown and foreign
        references answer the same 404, while reachable empty intersections are
        empty successes. studentId selects an already authorized historical paper
        taker, not a student-account target: it requires either a current strict
        student-like account in StudentIDs reach or existing history satisfying
        BOTH AssignmentIDs and Papers reach, independent of status or pending work.
        A privileged account without reached history cannot use the strict branch.
        Membership, counts, reference flags and prefix share one statement snapshot;
        later immutable-content and signed-media enrichment is not a live whole
        response snapshot. Names and titles are current text; question/group keys
        and content are frozen. Grades and completion use existing gradeAttempt
        and finishGrading; this read never writes or finishes a paper.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [student, question], default: student }
        - name: assignmentId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: studentId
          in: query
          description: Historical paper-taker identity filter, not a strict student-account lookup.
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Full filtered counts and the first 200 pending answers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradingQueue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/assignments/{id}/answers:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: listAnswersForQuestion
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: query, name: questionId, kind: version-question }
      x-resource-list: attempt
      x-permission: teaching.grading
      tags: [teacher-attempts]
      summary: One question across every paper
      description: |
        G-04's "Chấm theo câu hỏi": one manually graded question across every
        handed-in, non-voided attempt of the assignment, so the rubric is
        decided once instead of per student. The write stays
        `POST /teacher/attempts/{id}/grade`, one attempt per call. Rows come in
        attempt order rather than by name, because the mode hides names until
        the question is graded (anonymous marking).
      parameters:
        - { name: questionId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [question, questionNumber, questionCount, manualQuestionIds, items]
                additionalProperties: false
                properties:
                  question: { $ref: '#/components/schemas/AdminQuestion' }
                  sharedContext: { $ref: '#/components/schemas/SharedReviewContext' }
                  questionNumber: { type: integer, minimum: 1, description: 1-based position on the paper. }
                  questionCount: { type: integer, minimum: 1 }
                  manualQuestionIds:
                    type: array
                    items: { $ref: '#/components/schemas/Uuid' }
                    description: The paper's manually graded questions in paper order, for "Câu tiếp theo".
                  items: { type: array, items: { $ref: '#/components/schemas/QuestionAnswerRow' } }
        '404':
          description: The assignment, or a question that is not on its paper.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: duplicateAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: body, name: /classIds/-, kind: class }
      x-permission: teaching.assignments.write
      tags: [teacher-assignments]
      summary: Copy an assignment as a draft
      description: |
        Creates a **draft** that pins the same version and keeps the original's
        time limit, attempts, shuffle flags, review options, integrity policy
        and note to students, owned by the caller. Its window opens now and
        lasts as long as the original's (`closesAt - opensAt`). It is assigned
        to `classIds` and to no student by name; students never see a draft.
        The original is not changed.

        The original must be one the caller reaches, and its version one the
        caller may assign (a published test of their own, or any under
        `scope.all`): otherwise 409 `TEST_NOT_PUBLISHED`. A class the caller
        does not teach answers 400 as an unknown one does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateAssignmentInput' }
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TEST_NOT_PUBLISHED` — the original''s version is not one the caller can assign.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/{id}/item-analysis:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getItemAnalysis
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-resource-list: version-question
      x-permission: teaching.grading
      tags: [teacher-attempts]
      summary: How often students got each question wrong
      description: |
        Every question of the pinned version, hardest first, over the papers
        handed in by the students the caller reaches (see `handedIn`). Overdue
        attempts are closed before it is read, as the monitor does. A question
        no paper has a mark for sorts last with a null rate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAnalysis' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/assignments/{id}/reopen:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: reopenAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: teaching.assignments.write
      tags: [teacher-assignments]
      description: |
        G-09's "Gia hạn cho tất cả": a closed assignment gets a later
        `closesAt` and its early close, if any, is lifted, so every student
        with attempts left can go back in. Only a closed assignment can be
        reopened, and only to a moment still ahead. Audited with the reason.

        An attempt still in progress moves with it, in the same transaction,
        as it does on `extendAssignment`: its deadline becomes the earlier of
        its start plus the student's time limit and the student's own close,
        when that is later than the deadline it has. An attempt whose deadline
        has already passed is over and is not revived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closesAt, reason]
              additionalProperties: false
              properties:
                closesAt: { $ref: '#/components/schemas/Timestamp' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Reopened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ASSIGNMENT_NOT_CLOSED` — only a closed assignment has anything to reopen.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/{id}/extend:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: extendAssignment
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: teaching.assignments.write
      tags: [teacher-assignments]
      description: |
        Moves the assignment's `closesAt` later by `minutes`, for everyone. A
        draft, a scheduled and an open assignment can be extended; a **closed**
        one goes through `reopenAssignment` instead and answers
        `ASSIGNMENT_CLOSED` here. Audited with the old and new close, in the
        statement that moves it.

        `notify` says the teacher wants the students told. It is recorded with
        the audit entry. When it is true, each enabled student of a published
        assignment whose own close the extension changed is sent an
        `assignment.extended` notification naming the close they now have,
        once the extension has committed: a student without an override, and
        one whose override closes before the new close. A student whose
        override closes at or after it keeps the close they had and is told
        nothing. A failure to send is logged and never fails the extension.

        An attempt already in progress moves with it, in the same transaction:
        its deadline becomes the earlier of its start plus the student's time
        limit and the student's own close, when that is later than the deadline
        it has. A deadline never moves earlier, a student whose own
        override already closes later keeps it, and an attempt whose deadline
        has already passed is over and is not revived. Each attempt moved is
        audited as `attempt.extended`. A student who starts afterwards gets the new
        close, even if the start and the extension run at the same moment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              additionalProperties: false
              properties:
                minutes: { type: integer, minimum: 1, maximum: 10080 }
                notify: { type: boolean, description: Absent means false. }
      responses:
        '200':
          description: Extended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ASSIGNMENT_CLOSED` — a closed assignment is reopened, not extended.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/{id}/student-overrides:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: listStudentOverrides
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-resource-list: override
      x-permission: teaching.attempts.intervene
      tags: [teacher-assignments]
      summary: The overrides on an assignment the caller reaches
      description: |
        Every override on the assignment for a student the caller reaches, by
        student name. It is not paged: an assignment holds at most one override
        per targeted student.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StudentOverride' } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setStudentOverrides
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: body, name: /studentIds/-, kind: student }
      x-permission: teaching.attempts.intervene
      tags: [teacher-assignments]
      description: |
        Gives each named student an override, or changes the one they have: a
        later close, a longer time limit, more attempts, with the reason. It is
        an accommodation, so it can open an assignment that has closed for
        everyone else, for those students alone.

        A field the request names replaces the stored one and a field it
        leaves out keeps it, so lengthening a student's time does not take
        away the attempts they were given. The reason always replaces; the
        audit log keeps every earlier one. An override is removed with
        `deleteStudentOverride`, not by sending zeros: a request that would
        leave a row changing nothing is a `VALIDATION_FAILED`.

        `closesAt` must be ahead of the database's clock. `extendBy` adds minutes to the student's
        current close (their override's, when it is later, else the
        assignment's) and is refused with `ASSIGNMENT_CLOSED` for a student
        whose close has passed: a closed assignment is reopened for a student
        with `closesAt`. A request names `extendBy` or `closesAt`, not both,
        and at least one of the four. An override never shortens a close: the
        later of it and the assignment's own is the student's.

        Every id in `studentIds` must be a student of the assignment the caller
        reaches: in a target class they teach or named on an assignment they
        created, enabled, with a student role. One that is not answers `422
        VALIDATION_FAILED` for the whole request and names the ids in
        `details.studentIds`; nothing is written. A student who does not exist
        and one the caller may not know exist answer the same.

        Audited per student with the old and new values, in the statement that
        writes them. `notify` is recorded with them. When it is true and the
        request moves a close (`extendBy` or `closesAt`), each student named
        whose override now closes after the assignment's own close is sent an
        `assignment.extended` notification naming their close, once the
        override has committed; more attempts or a longer time limit move no
        close and tell nobody. A failure to send is logged and never fails the
        request.

        Each named student's attempt in progress moves with the override, as it
        does on `extendAssignment`: its deadline becomes the earlier of its
        start plus the student's time limit and the student's own close, when
        that is later than the deadline it has. An attempt whose deadline has
        already passed is over and is not revived.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentOverrideInput' }
      responses:
        '200':
          description: The overrides as they now stand, by student name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StudentOverride' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ASSIGNMENT_CLOSED` — `extendBy` names a student whose close has passed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`VALIDATION_FAILED` — `details.studentIds` names the ids that are not students of this assignment the caller reaches.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/assignments/{id}/student-overrides/{studentId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    delete:
      operationId: deleteStudentOverride
      x-resource:
        - { in: path, name: id, kind: assignment }
        - { in: path, name: studentId, kind: override }
      x-permission: teaching.attempts.intervene
      tags: [teacher-assignments]
      description: |
        Takes the override off one student: they have the assignment's own
        window from then on. An override that does not exist is a 404, as one
        on an assignment or a student the caller does not reach is. Audited
        with the values removed. An attempt in progress keeps its deadline: a
        deadline never moves earlier.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/assignments/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAssignmentMonitor
      x-resource:
        - { in: path, name: id, kind: assignment }
      x-permission: workspace.teacher
      tags: [teacher-assignments, teacher-attempts]
      summary: Monitor rows, one per targeted student
      description: |
        Includes students who have not started — the roster is the left side of
        the join, not the attempts table. Two queries total, never one per
        student: N+1 is the named default failure mode of this screen (§13.8).

        The client polls every 15s while the assignment is `open`, and stops when
        the tab is hidden (§8).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, questionCount, rows]
                additionalProperties: false
                properties:
                  serverTime:
                    $ref: '#/components/schemas/Timestamp'
                  questionCount:
                    type: integer
                    minimum: 0
                    description: Questions on the pinned version, the denominator of every row's progress.
                  rows: { type: array, items: { $ref: '#/components/schemas/MonitorRow' } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ teacher/attempts

  /teacher/attempts:
    get:
      operationId: listAttempts
      x-resource-list: attempt
      x-permission: [teaching.grading, teaching.attempts.intervene]
      tags: [teacher-attempts]
      summary: Cross-assignment attempt list
      description: |
        Backs §8's dashboard rows — attempts awaiting grading, flagged attempts —
        which spec §15 has no endpoint for. `status=submitted` and `flagged=true`
        each hit a partial index that stays near-empty (D-19).
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AttemptStatus' } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { name: pendingGrading, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AttemptListRow' } }

  /teacher/attempts/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAttemptForReview
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: [teaching.grading, teaching.attempts.intervene]
      tags: [teacher-attempts]
      summary: Full attempt for review and grading
      description: |
        The teacher's view, so it carries the grading key: `AdminQuestion` includes
        `isCorrect`, `sampleAnswer` and `acceptedAnswers`. This is the only
        question shape that does.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [attempt, student, testTitle, maxAttempts, questions, answers, audioPlays, integrity, teacherNote]
                additionalProperties: false
                properties:
                  attempt: { $ref: '#/components/schemas/Attempt' }
                  student: { $ref: '#/components/schemas/User' }
                  testTitle: { type: string }
                  maxAttempts: { type: integer, minimum: 1, description: For "lượt 1/2" in the header (G-03). }
                  questions: { type: array, items: { $ref: '#/components/schemas/AdminQuestion' } }
                  sharedContext: { $ref: '#/components/schemas/SharedReviewContext' }
                  answers:
                    type: object
                    additionalProperties:
                      type: object
                      required: [answer]
                      additionalProperties: false
                      properties:
                        answer: { oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }] }
                        answerRemoved:
                          type: boolean
                          description: Present and true when the answer was removed under the retention policy; `answer` is then `null` and it cannot be graded.
                        autoScore: { oneOf: [{ $ref: '#/components/schemas/Points' }, { type: 'null' }] }
                        manualScore: { oneOf: [{ $ref: '#/components/schemas/Points' }, { type: 'null' }] }
                        requiresManual: { type: boolean }
                        graderComment: { type: [string, 'null'] }
                  audioPlays:
                    type: object
                    additionalProperties: { type: integer }
                    description: Shown as used-vs-allowed, including over-limit. Reported, not enforced (§11.4).
                  integrity: { $ref: '#/components/schemas/IntegritySummary' }
                  teacherNote:
                    type: [string, 'null']
                    description: |
                      G-05's "Ghi chú của bạn": the teacher's private note on
                      this attempt. Teacher-only by construction — it lives on
                      this response and nowhere under `/app/*`.
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/attempts/{id}/events:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getAttemptEvents
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: [teaching.grading, teaching.attempts.intervene]
      tags: [teacher-attempts]
      summary: Integrity timeline
      description: |
        Integrity timeline, with paired durations computed server-side so the client
        does not reimplement pairing (§10.4).

        Events are grouped by session, ordered by each session’s earliest
        received event time, with session ID breaking ties. Within a session,
        resume events come first and session_takeover events last. Within that
        priority, two events with different, non-null clientSeq values are
        compared by clientSeq; otherwise they are compared by occurredAt, then
        event ID. Current clients derive clientSeq from an attempt-relative
        millisecond offset calibrated from serverTime, never below the tab’s
        stored next sequence. This generally aligns separate tabs with elapsed
        attempt time, but response latency, clock changes and per-tab increments
        can cause reordering or collisions; chronology and uniqueness across
        tabs are not guaranteed. Older counters can overlap newer values and
        generally sort before offset-based events.

        **The UI presenting this must be neutral** — no red banners, no
        "CHEATING DETECTED". These signals are evidence for a conversation, not
        proof: they cannot see a second device, a phone beside the laptop, a
        person in the room, or a printed sheet (§10.5).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [events, summary, startedAt]
                additionalProperties: false
                properties:
                  startedAt: { $ref: '#/components/schemas/Timestamp' }
                  events: { type: array, items: { $ref: '#/components/schemas/IntegrityEvent' } }
                  summary: { $ref: '#/components/schemas/IntegritySummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/attempts/{id}/extend:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: extendAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: teaching.attempts.intervene
      tags: [teacher-attempts]
      description: |
        May push the deadline past the assignment's `closesAt` — that is the
        point of an accommodation. Audited in the same statement as the update,
        via an `OLD`/`NEW` data-modifying CTE (§13.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes, reason]
              additionalProperties: false
              properties:
                minutes: { type: integer, minimum: 1, maximum: 600 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Extended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ATTEMPT_CLOSED` — only an attempt still in progress has a deadline to move.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/attempts/{id}/reset:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: resetAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: teaching.attempts.intervene
      tags: [teacher-attempts]
      description: |
        **Voids** the existing attempt and permits a new one at `attemptNo + 1`.
        Nothing is deleted — §6.4's retention principle, and deleting would lose
        the record §13.4 exists to keep (O-08).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The voided attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ATTEMPT_VOIDED` — already voided; nothing to reset.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/attempts/{id}/void:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: voidAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: teaching.attempts.intervene
      description: Marks an attempt void with a required reason. Nothing is deleted, and the audit row is written in the same statement (§13.4).
      tags: [teacher-attempts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Voided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ATTEMPT_VOIDED` — already voided.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/attempts/{id}/note:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      operationId: setAttemptNote
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: teaching.grading
      tags: [teacher-attempts]
      description: |
        G-05's "Ghi chú của bạn": a note only the teacher reads, kept on the
        attempt so it is there next term. `null` clears it. Never surfaces on
        any `/app/*` response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              additionalProperties: false
              properties:
                note: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                additionalProperties: false
                properties:
                  note: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/attempts/{id}/flag:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: flagAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: teaching.grading
      tags: [teacher-attempts]
      description: |
        G-05's "Đánh dấu" and "Bỏ đánh dấu": marks an attempt to look at
        again, or clears the mark, by hand. A mark, not a verdict (§10.4).
        Audited in the same statement as the update, as `attempt.flagged` or
        `attempt.unflagged`, with the reason when one is given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flagged]
              additionalProperties: false
              properties:
                flagged: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ATTEMPT_VOIDED` — a voided attempt is out of the queue already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/attempts/{id}/grade:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: gradeAttempt
      x-resource:
        - { in: path, name: id, kind: attempt }
        - { in: body, name: /items/-/questionId, kind: version-question }
      x-permission: teaching.grading
      tags: [teacher-attempts]
      summary: Save manual grades
      description: |
        Saved per call rather than as one giant submit, so a half-graded attempt
        survives a refresh. `points` is rejected above the question's ceiling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [questionId, points]
                    additionalProperties: false
                    properties:
                      questionId: { $ref: '#/components/schemas/Uuid' }
                      points: { $ref: '#/components/schemas/Points' }
                      comment: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptScore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `ATTEMPT_IN_PROGRESS` or `ATTEMPT_VOIDED` — nothing to grade yet, or
            nothing that counts. `ANSWER_REMOVED` — an item names an answer
            removed under the retention policy; `details.questionIds` lists them
            and nothing was saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/attempts/{id}/finish-grading:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: finishGrading
      x-resource:
        - { in: path, name: id, kind: attempt }
      x-permission: teaching.grading
      tags: [teacher-attempts]
      description: |
        Recomputes the score from `SUM(final_score)` — the PG18 virtual generated
        column, so manual precedence over auto cannot drift (§13.3) — and sets
        status `graded`. Re-enterable: a graded attempt can be re-graded.
      responses:
        '200':
          description: Graded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`GRADING_INCOMPLETE` — a `short_answer` is still ungraded; `ATTEMPT_IN_PROGRESS` / `ATTEMPT_VOIDED` as for grade.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/dashboard:
    get:
      operationId: getDashboard
      x-permission: workspace.teacher
      tags: [teacher-attempts]
      description: The dashboard in the caller's own teaching scope, Admin included; the repository wide scope is never requested here.
      parameters:
        - name: range
          in: query
          description: Calendar range for submissions only; all other dashboard figures keep their own windows.
          schema: { type: string, enum: [7d, 14d, 30d], default: 14d }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /teacher/summary:
    get:
      operationId: getTeacherSummary
      x-permission: workspace.teacher
      tags: [teacher-attempts]
      description: |
        Three nav counts in the caller's own teaching scope, Admin included; answersToGrade is null without teaching.grading.

        `audience` narrows `unreadNotifications` to one console's kinds and
        changes neither of the other two counts. The teacher's bell passes
        `teacher`; without it the count is every kind the caller has.
      parameters:
        - name: audience
          in: query
          required: false
          schema: { $ref: '#/components/schemas/NotificationAudience' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ==================================================== teacher/students+classes

  /teacher/students:
    get:
      operationId: listStudents
      x-resource:
        - { in: query, name: classId, kind: class }
      x-resource-list: student
      x-permission: people.students.read
      description: Backs the §8 students table. CSV import is P1 and deliberately not built (§16).
      tags: [teacher-students]
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: classId
          in: query
          description: |
            Only students who are in at least one of these classes (`classId=a&classId=b`;
            one value still works). A class the caller does not reach matches nothing,
            as a missing class does.
          schema:
            type: array
            maxItems: 50
            items: { $ref: '#/components/schemas/Uuid' }
        - name: mustChangePassword
          in: query
          description: |
            `true` lists only the accounts still on a temporary password; after a
            `resetStudentsPasswords` whose answer was lost, those are the students
            whose password must be reset again. `false` lists only the others.
            Absent lists both.
          schema: { type: boolean }
        - name: neverSignedIn
          in: query
          description: |
            `true` lists only the accounts that have never signed in
            (`last_sign_in_at` is null); `false` lists only the others. Absent
            lists both. It narrows beside `mustChangePassword`, as a plain
            predicate: an account on a temporary password that never signed in
            is in both.
          schema: { type: boolean }
        - name: accountStatus
          in: query
          description: |
            Only the accounts listed under one of these statuses
            (`accountStatus=active&accountStatus=never_signed_in`), in
            `AccountStatus`'s order of precedence. A `disabled` account is
            returned only when `status` is `disabled` or `all`.
          schema:
            type: array
            maxItems: 4
            uniqueItems: true
            items: { $ref: '#/components/schemas/AccountStatus' }
        - name: status
          in: query
          description: |
            Defaults to `active`. Without `disabled` there is no request that can
            return a suspended account, so `updateStudent`'s `disabled: false`
            would be unreachable.
          schema:
            type: string
            enum: [active, disabled, all]
            default: active
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/StudentRow' } }
                      facets: { $ref: '#/components/schemas/StudentFacets' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createStudent
      x-resource:
        - { in: body, name: /classIds/-, kind: class }
      x-permission: people.students.create
      tags: [teacher-students]
      description: |
        Teacher-created accounts get a temporary password and
        `mustChangePassword` as the organization's "force password change"
        setting says (on by default). Self-signup requires Google (§6.3).

        Every `classIds` entry must be a class the caller teaches, or any class
        with `scope.all`. Anything else answers 404, exactly as a missing class
        does, and nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                fullName: { type: string, minLength: 1, maxLength: 200 }
                classIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '201':
          description: Created. The temporary password is returned **once**.
          content:
            application/json:
              schema:
                type: object
                required: [user, temporaryPassword]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/StudentRow' }
                  temporaryPassword: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `EMAIL_TAKEN` — already in use, compared case-insensitively.
            `SEAT_LIMIT` — the centre has used every seat an Admin allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/students/reset-passwords:
    post:
      operationId: resetStudentsPasswords
      x-resource:
        - { in: body, name: /studentIds/-, kind: student }
      x-permission: people.students.reset_password
      tags: [teacher-students]
      summary: Reset the passwords of up to 40 students at once
      description: |
        Does for each student what `resetStudentPassword` does, one transaction
        each: a new temporary password, `mustChangePassword` set, every refresh
        family revoked, the session epoch moved, one audit row. The same guards
        apply to each student, in the same order (`student` in the caller's reach
        and student-like, the subset rule, then the shared-student rule), so a
        batch cannot do what one reset cannot.

        A student that fails does not stop the others: `failed` names it with
        `NOT_FOUND` (another teacher's student, a disabled one, a missing id, an
        account that is not a student, all alike), `FORBIDDEN` (the student's
        permissions are not a subset of the caller's), `STUDENT_SHARED` (someone
        else also reaches the student, so only a holder of `people.users.manage`
        may reset them) or `INTERNAL` (a fault with that student alone, logged on
        the server). The answer is 200 whenever the request was accepted, even
        when every student failed. `items` and `failed` keep the order of
        `studentIds`.

        Each `temporaryPassword` is returned **once** and stored nowhere: the
        server keeps only its hash. A reset that committed before the connection
        dropped has lost its password for good; those students are on a
        temporary password, so `listStudents` with `mustChangePassword=true`
        lists them for another reset. The answer is never cached. Repeating a
        request resets the same students again with new passwords.

        Limited to 2 a minute and 10 an hour per signed-in user, a call counting
        once however many students it names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentIds]
              additionalProperties: false
              properties:
                studentIds:
                  type: array
                  minItems: 1
                  maxItems: 40
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: The batch ran. Passwords are returned **once**.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [items, failed]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 40
                    items: { $ref: '#/components/schemas/StudentPasswordReset' }
                  failed:
                    type: array
                    maxItems: 40
                    items: { $ref: '#/components/schemas/StudentResetFailure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /teacher/students/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getStudent
      x-resource:
        - { in: path, name: id, kind: student }
      x-permission: people.students.read
      description: A student with their class memberships, linked providers and `joinedVia` (§8).
      tags: [teacher-students]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentRow' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateStudent
      x-resource:
        - { in: path, name: id, kind: student }
      x-permission: people.students.create
      description: |
        Edits profile fields, or disables the account. Disabling blocks login
        without deleting any attempt history. `disabled`, either value, also
        needs `people.users.manage`. A new `email` needs `people.users.manage`
        too unless no one else reaches the student, by the rule
        `resetStudentPassword` states, because a new address can take over the
        account through Google sign-in. Sending the address the student already
        has is not a change. The student's permissions, except
        `learning.take_tests`, must be a subset of the caller's.
      tags: [teacher-students]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                # Bounds match users_email_check and createStudent. Without them
                # a 260-character address passes validation, violates the column
                # CHECK, and surfaces as a 500 rather than a 400.
                email: { type: string, format: email, minLength: 3, maxLength: 254 }
                disabled: { type: boolean }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: |
            `FORBIDDEN` — `disabled` without `people.users.manage`, or a student
            whose permissions are not a subset of the caller's.
            `STUDENT_SHARED` — a new `email` for a student someone else also
            reaches, without `people.users.manage`. Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EMAIL_TAKEN` — another account already uses that address.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/students/{id}/reset-password:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: resetStudentPassword
      x-resource:
        - { in: path, name: id, kind: student }
      x-permission: people.students.reset_password
      tags: [teacher-students]
      description: |
        Sets a temporary password and `mustChangePassword`. There is no
        self-service email reset in v1 — that needs an email provider, which is
        the same dependency §6.3 declines (§5.4, §17.1). Only a student no one
        else reaches may be reset by a teacher: every class they are in,
        archived ones included, is the caller's; no other account created them;
        no other account's assignment targets them individually; and a student
        in no class must have been created by the caller. A holder of
        `people.users.manage` resets any student.
      responses:
        '200':
          description: Reset. Password returned **once**.
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                additionalProperties: false
                properties:
                  temporaryPassword: { type: string }
        '403':
          description: |
            `STUDENT_SHARED` — someone else also reaches the student, so only a
            holder of `people.users.manage` may reset them. `FORBIDDEN` — the
            student's permissions are not a subset of the caller's. Nothing is
            written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      operationId: listUsers
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Every account, whatever its role
      description: |
        The Users table: every account in the centre, newest first: highest id
        first, which is creation order for every account the app creates. Pages
        are offset based, so accounts added between two requests shift the later
        pages. `q` matches the name and the email together, ignoring case and
        accents (D-11), and `email` is an exact, case-insensitive match for the
        Add user form's "already taken" check. `status` narrows to the accounts
        in that state, which never includes a disabled one (`AccountStatus`
        lists `disabled` first).
      parameters:
        - name: tab
          in: query
          schema: { $ref: '#/components/schemas/AdminUserTab' }
        - name: status
          in: query
          schema: { type: string, enum: [must_change_password, never_signed_in] }
        - $ref: '#/components/parameters/Query'
        - name: email
          in: query
          schema: { type: string, format: email, maxLength: 254 }
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema: { type: integer, enum: [10, 20, 50], default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminUserRow' } }
                      facets: { $ref: '#/components/schemas/AdminUserFacets' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createUser
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Add an account with a role
      description: |
        Creates an account of any role the caller may give (`listAssignableRoles`):
        its permissions, `learning.take_tests` apart, must be the caller's own,
        and the Assistant is never offered. `created_by` is the caller. The role
        is held against edits from the check to the commit; if it changed in
        between, the check is made again, up to three times.

        `fullName` is composed to NFC, trimmed, and each run of white space is
        one space. A name that is then empty, longer than 200 characters, holds
        a control, format, bidirectional or filler character or a code point
        that is unassigned, or holds no letter, digit, punctuation mark or
        symbol, is refused with `VALIDATION_FAILED` naming `fullName`.

        `delivery: email_link` sets no password and enqueues a set-password
        link (an invite) in the same transaction as the account, so the account
        and its message exist together or not at all. While the centre has
        turned password sign-in off, the message is a sign-in invite and
        carries no link. `delivery: temporary_password` returns a temporary
        password **once** and keeps only its hash; the account must change it
        at the first sign-in unless the centre's sign-in policy lets it keep
        it. It is refused with `PASSWORD_SIGN_IN_DISABLED` while password
        sign-in is off.

        `classId` is allowed only for a student-target role and only with
        `scope.all`, and must name a class that is not archived. Writes one
        audit row, `user.created`, with the role and the delivery.

        Limited to 30 a minute and 300 an hour per signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created. A temporary password is returned **once**, and the answer is never cached.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/AdminUserRow' }
                  temporaryPassword:
                    type: string
                    description: "Present only for `delivery: temporary_password`."
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `EMAIL_TAKEN` — already in use, compared case-insensitively.
            `STALE_WRITE` — the role changed three times while the account was being created; nothing was written, so the same request may be sent again.
            `SEAT_LIMIT` or `TEACHER_LIMIT` — the account would take the centre past a limit an Admin set on Plan & usage; nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `ROLE_NOT_ASSIGNABLE` — the role is the Assistant.
            `PASSWORD_SIGN_IN_DISABLED` — a temporary password was asked for while the centre has turned password sign-in off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501':
          description: This server has no key to seal a link with (`SECRETS_KEY`), so it cannot send one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getUser
      x-permission: people.users.manage
      tags: [admin-users]
      summary: One account for the Users sheet
      description: |
        The account with what the sheet draws beside it: who created it, its
        classes, what it owns, the tests it is taking, its latest activity and
        what the caller may do to it (`can`). Any account is visible, whatever
        its role; the subset rule limits what may be done, not what is seen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteUser
      x-permission: people.users.manage
      tags: [admin-users]
      description: Permanently deletes a disabled student account only when no assignment, attempt, retained audit record or owned content references it, and only when the student's permissions, except `learning.take_tests`, are a subset of the caller's. Historical identities use the approved manual anonymization process instead.
      responses:
        '204': { description: Deleted. }
        '403':
          description: '`FORBIDDEN` — the student''s permissions are not a subset of the caller''s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `RESOURCE_NOT_ARCHIVED` — the account is not disabled.
            `RESOURCE_REFERENCED` — something still references it, and
            `details.referencedBy` (`ReferencedBy`) always names what:
            `assignments` (an individual assignment target, or an assignment it
            created), `attempts`, `audit` (audit history it acted in),
            `owned_content` (tests, questions, question groups, media, classes,
            join codes, published versions or Word imports it owns or created),
            or `other`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/users/{id}/role:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      operationId: changeUserRole
      x-permission: people.roles.manage
      tags: [admin-users]
      summary: Give an account another role
      description: |
        Both roles, the account's own and the one it is given, must pass the
        subset rule (`TARGET_ROLE_NOT_ALLOWED`); the Assistant is never offered
        (`ROLE_NOT_ASSIGNABLE`), as in `createUser`. The caller cannot change
        their own role (`CANNOT_ACT_ON_SELF`), and the last active Admin cannot
        be moved off the Admin role (`LAST_ADMIN`). The guards apply in that
        order, so an account the caller may not touch is not told it is the last
        Admin.

        An account that owns classes or content (`ownedContent` of `getUser`)
        cannot be given a role that does not open the teacher workspace: it
        answers `USER_OWNS_CONTENT` with the counts in `details`, and the
        content is moved first (`transferUserContent`). Sending the role the
        account already has writes nothing and answers the account as it is.

        The new role is held against edits from the check to the commit; if it
        or the account's own role changed in between, the check is made again,
        up to three times, and then `STALE_WRITE` asks the caller to send the
        request again; so does a write the database ended three times over a
        lock another write held. A change ends the account's sessions: every refresh
        family is revoked and the session epoch moves, so its next request is
        authorised by the new role on this machine and within 10 seconds on any
        other. Writes one audit row, `user.role_changed`, with the old and the
        new role.

        Limited to 30 a minute per signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              additionalProperties: false
              properties:
                roleId:
                  $ref: '#/components/schemas/Uuid'
                  description: A role from `listAssignableRoles`.
      responses:
        '200':
          description: The account with its new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the account''s role, or the new one, holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `LAST_ADMIN` — the account is the only active Admin.
            `USER_OWNS_CONTENT` — the account owns classes or content and the new role opens no teacher workspace; `details` holds `classes`, `tests`, `questions`, `media` and `assignments`, each a count.
            `STALE_WRITE` — a role changed, or another write to the account held what this one needed, three times while the change was being made; nothing was written, so the same request may be sent again.
            `TEACHER_LIMIT` — the new role opens the teacher workspace and the centre has used every teacher place an Admin allowed; nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `CANNOT_ACT_ON_SELF` — the account is the caller's own.
            `ROLE_NOT_ASSIGNABLE` — the new role is the Assistant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: disableUser
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Disable an account
      description: |
        Blocks sign-in without deleting anything the account has done. The
        subset rule, then not oneself (`CANNOT_ACT_ON_SELF`), then the last
        active Admin (`LAST_ADMIN`) apply in that order. In the same
        transaction every refresh family is revoked, the session epoch moves,
        every set-password link not yet used is revoked and every message still
        waiting in the outbox for the account is cancelled, so nothing sent
        before the disable lets the person in afterwards; enabling the account
        again restores none of them. Disabling an account that is disabled
        already writes nothing and answers the account as it is. Writes one
        audit row, `user.disabled`.

        Limited to 30 a minute per signed-in user.
      responses:
        '200':
          description: The account, disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserRow' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the account''s role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`LAST_ADMIN` — the account is the only active Admin. `STALE_WRITE` — the account''s role, or another write to the account, changed while it was being written; try again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`CANNOT_ACT_ON_SELF` — the account is the caller''s own.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{id}/transfer-content:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: transferUserContent
      x-permission: scope.all
      tags: [admin-users]
      summary: Give everything a disabled account owns to another teacher
      description: |
        Moves every class the account teaches (archived ones too) and every
        test, question, question group, media asset and assignment it owns,
        deleted ones too, to `toUserId`, in one transaction, so a reader sees
        all of it with the old owner or all of it with the new one. A test and
        its questions move together, so a draft still uses only its owner's
        questions, and the classes' students keep their assignments and
        results. Who made a row (`createdBy`, `uploadedBy`) does not change.
        The account's Word imports that are not finished stay with it and are
        counted in `leftBehind`.

        The subset rule applies to the account. The account must be disabled
        (`USER_NOT_DISABLED`); the recipient must exist, be active, hold
        `workspace.teacher` and be another account (`INVALID_RECIPIENT`).
        Writes one audit row, `user.content_transferred`, with the recipient
        and the counts. With `notify`, the recipient finds a
        `content.transferred` notification in their bell when anything moved.
        An account that owns nothing answers zeros and still writes its row.

        Limited to 10 a minute per signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserContentTransfer' }
      responses:
        '200':
          description: What moved, and what stayed behind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserContentTransferResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the account''s role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`USER_NOT_DISABLED` — disable the account first. `STALE_WRITE` — the account''s role, or another write to the account or its content, changed while it was being moved. Nothing was moved; try again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`INVALID_RECIPIENT` — the recipient does not exist, is disabled, has no teacher workspace or is the account itself.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/disable:
    post:
      operationId: disableUsers
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Disable up to 100 accounts at once
      description: |
        Does for each account what `disableUser` does, one transaction each, so
        a batch cannot do what one disable cannot. An account that fails does
        not stop the others: `failed` names it with `NOT_FOUND`,
        `TARGET_ROLE_NOT_ALLOWED`, `CANNOT_ACT_ON_SELF`, `LAST_ADMIN`,
        `STALE_WRITE` (the account's role, or another write to it, kept
        changing while it was being written; nothing was written to it) or
        `INTERNAL` (a fault with that account alone, logged on the server). The
        answer is 200 whenever the request was accepted, even when every
        account failed. An account disabled already counts in `disabled`.
        `disabled` and `failed` keep the order of `userIds`. The audit rows of
        one call carry one batch id.

        Limited to 30 a minute per signed-in user, a call counting once however
        many accounts it names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              additionalProperties: false
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: The batch ran.
          content:
            application/json:
              schema:
                type: object
                required: [disabled, failed]
                additionalProperties: false
                properties:
                  disabled:
                    type: array
                    maxItems: 100
                    description: The ids of the accounts that are disabled now.
                    items: { $ref: '#/components/schemas/Uuid' }
                  failed:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/UserActionFailure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: enableUser
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Enable a disabled account
      description: |
        Lets the account sign in again. The subset rule applies
        (`TARGET_ROLE_NOT_ALLOWED`). The sessions and links a disable ended stay
        ended: the person signs in again, and an Admin sends a new link with
        `resetUserPassword`. Enabling an account that is enabled already writes
        nothing and answers the account as it is. Writes one audit row,
        `user.enabled`.
      responses:
        '200':
          description: The account, enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserRow' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the account''s role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `STALE_WRITE` — the account's role, or another write to the account, changed while it was being written. Nothing was written; try again.
            `SEAT_LIMIT` or `TEACHER_LIMIT` — enabling the account would take the centre past a limit an Admin set on Plan & usage; it stays disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/{id}/sign-out:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: signOutUser
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Sign an account out everywhere
      description: |
        Revokes every refresh family the account has and moves its session
        epoch, so its access tokens stop working at once, on this machine and,
        within 10 seconds, on any other. The subset rule applies
        (`TARGET_ROLE_NOT_ALLOWED`). Signing oneself out is allowed, and ends
        the caller's own session too. Writes one audit row,
        `user.signed_out_everywhere`.
      responses:
        '204': { description: Signed out. }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the account''s role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`STALE_WRITE` — the account''s role, or another write to the account, changed while it was being written. Nothing was written; try again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/{id}/reset-password:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: resetUserPassword
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Reset an account's password
      description: |
        `delivery: temporary_password` sets a temporary password, returned
        **once** and kept nowhere but as a hash; the account must change it at
        the first sign-in unless the centre's sign-in policy lets it keep it.
        `delivery: email_link` clears the password, so the old one stops working
        at once, and emails a link to choose a new one (24 hours, once).

        Either way the account's sessions end: every refresh family is revoked,
        the session epoch moves and the unused links it held are revoked. The
        subset rule, then not oneself (`CANNOT_ACT_ON_SELF`; the caller changes
        their own password with `changePassword`) apply in that order. A
        disabled account is refused (`ACCOUNT_DISABLED`). While the centre has
        turned password sign-in off the answer is `PASSWORD_SIGN_IN_DISABLED`.
        The answer is never cached. Writes one audit row,
        `user.password_reset`, with the delivery.

        Limited to 5 a minute and 30 an hour per signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery]
              additionalProperties: false
              properties:
                delivery: { $ref: '#/components/schemas/UserResetDelivery' }
      responses:
        '200':
          description: Reset. A temporary password is returned **once**, and the answer is never cached.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  temporaryPassword:
                    type: string
                    description: "Present only for `delivery: temporary_password`."
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the account''s role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ACCOUNT_DISABLED` — the account is disabled; enable it first. `STALE_WRITE` — the account''s role, or another write to the account, changed while it was being written. Nothing was written; try again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `CANNOT_ACT_ON_SELF` — the account is the caller's own.
            `PASSWORD_SIGN_IN_DISABLED` — the centre has turned password sign-in off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501':
          description: This server has no key to seal a link with (`SECRETS_KEY`), so it cannot send one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/users/reset-passwords:
    post:
      operationId: resetUsersPasswords
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Reset the passwords of up to 100 accounts at once
      description: |
        Does for each account what `resetUserPassword` does, one transaction
        each, with the same guards in the same order, so a batch cannot do what
        one reset cannot. `userIds` holds at most 40 ids for
        `delivery: temporary_password`, because each password is hashed, two at
        a time, and at most 100 for `email_link`.

        An account that fails does not stop the others: `failed` names it with
        `NOT_FOUND`, `TARGET_ROLE_NOT_ALLOWED`, `CANNOT_ACT_ON_SELF`,
        `ACCOUNT_DISABLED`, `STALE_WRITE` (the account's role, or another write
        to it, kept changing while it was being written; nothing was written to
        it) or `INTERNAL` (a fault with that account alone,
        logged on the server). The answer is 200 whenever the request was
        accepted, even when every account failed. `items` and `failed` keep the
        order of `userIds`. `PASSWORD_SIGN_IN_DISABLED` refuses the whole
        request while the centre has turned password sign-in off.

        Each `temporaryPassword` is returned **once** and stored nowhere. A
        reset that committed before the connection dropped has lost its
        password for good; `listUsers` with `status=must_change_password` lists
        those accounts for another reset. The answer is never cached. The audit
        rows of one call carry one batch id.

        Limited to 2 a minute and 10 an hour per signed-in user, a call counting
        once however many accounts it names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, delivery]
              additionalProperties: false
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Uuid' }
                delivery: { $ref: '#/components/schemas/UserResetDelivery' }
      responses:
        '200':
          description: The batch ran. Passwords are returned **once**.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [items, failed]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/UserPasswordReset' }
                  failed:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/UserActionFailure' }
        '400':
          description: |
            Fails the schema, or `VALIDATION_FAILED` naming `userIds`: more than 40 ids for `temporary_password`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`PASSWORD_SIGN_IN_DISABLED` — the centre has turned password sign-in off.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501':
          description: This server has no key to seal a link with (`SECRETS_KEY`), so it cannot send one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/user-imports/preview:
    post:
      operationId: previewUserImport
      x-permission: people.users.manage
      tags: [admin-users]
      summary: What a CSV or XLSX file of accounts would come to
      description: |
        Reads the file under a one-slot gate and judges every row against what
        the caller may do, writing nothing. The first sheet of a workbook, or a
        UTF-8 CSV file, holds the columns `full_name` and `email` and may hold
        `role` and `class`, named in any case and order; any other column is
        ignored. The format is read from the bytes and never from the name.
        A file is at most 5 MiB, 2,000 data rows, 20 columns and 1,000
        characters a cell.

        `role` is a built-in key (`student`, `teacher`), a role's name (the
        built-ins are "Học viên" and "Giáo viên") or empty, which takes
        `defaultRole`. `class` is the exact name of an active class, only for a
        student-target role and only for a caller holding `scope.all`. An
        address that already belongs to an account is counted and skipped, never
        updated. Every refused cell is reported once, so one pass shows
        everything to correct.

        `defaultRole` must be a role the caller may give, as `createUser`
        requires of `roleId`. Limited to 10 a minute per signed-in user.
      x-max-body-bytes: 5259264
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, defaultRole, delivery]
              properties:
                file: { type: string, format: binary }
                defaultRole: { $ref: '#/components/schemas/UserImportDefaultRole' }
                delivery: { $ref: '#/components/schemas/UserImportDelivery' }
      responses:
        '200':
          description: The counts. Nothing was stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — `defaultRole` holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: |
            `USER_IMPORT_FILE_TOO_LARGE` — over 5 MiB. The message tells the user
            to save the sheet as CSV UTF-8 and upload that.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/UserImportRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/UserImportUnavailable' }

  /admin/user-imports:
    post:
      operationId: createUserImport
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Import the accounts of a file
      description: |
        Reads and judges the file again, never trusting a preview, stores the
        job and every row that passed in one transaction, and wakes the worker,
        which creates the accounts a few at a time. The caller's `requestId`,
        held for as long as the dialog is open, makes the request idempotent:
        the same `requestId` returns the job it stored the first time, whatever
        the file then holds, and creates no second one. Audits
        `user_import.requested`; the accounts are audited as `user.created`
        with `via: import` when the worker creates them.

        The file, `defaultRole` and `delivery` are those of `previewUserImport`.
        A file in which no row would create an account is refused with
        `USER_IMPORT_NOTHING_TO_CREATE`. Limited to 5 an hour per signed-in
        user.
      x-max-body-bytes: 5259264
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, defaultRole, delivery, requestId]
              properties:
                file: { type: string, format: binary }
                defaultRole: { $ref: '#/components/schemas/UserImportDefaultRole' }
                delivery: { $ref: '#/components/schemas/UserImportDelivery' }
                requestId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '202':
          description: Queued. Poll `getUserImport` for its progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — `defaultRole` holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: '`USER_IMPORT_FILE_TOO_LARGE` — over 5 MiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            Any code `previewUserImport` answers with, and
            `USER_IMPORT_NOTHING_TO_CREATE` — no row of the file would create an
            account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/UserImportUnavailable' }

  /admin/user-imports/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getUserImport
      x-permission: people.users.manage
      tags: [admin-users]
      summary: How an import is going
      description: |
        The progress of one of the caller's own imports. Another user's import
        answers as a missing one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserImportJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/user-imports/{id}/sheet:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: downloadUserImportSheet
      x-permission: people.users.manage
      tags: [admin-users]
      summary: Take the sheet of temporary passwords an import made
      description: |
        For a job delivered by `sheet`, hands its importer one CSV file, once:
        a row for every account the job created, with `full_name`, `email`,
        `role`, `class` and `temporary_password`. One transaction opens the
        passwords, erases them from the job and records the download, so the
        file is the only copy and a second request cannot have it. A job that is
        not done, was delivered by email, created no account, has been
        downloaded, or finished more than 24 hours ago answers
        `410 SHEET_UNAVAILABLE`; another user's job is `404`. The response is
        `no-store`, a UTF-8 file with a byte-order mark and CRLF line ends in
        which a cell that a spreadsheet would run as a formula starts with `'`.
        Audited as `user_import.sheet_downloaded`. Limited to 5 a minute per
        signed-in user.
      responses:
        '200':
          description: The sheet.
          headers:
            Content-Disposition:
              required: true
              description: '`attachment; filename="new-accounts-YYYYMMDD.csv"`.'
              schema: { type: string }
            Cache-Control:
              required: true
              description: '`no-store`.'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: '`SHEET_UNAVAILABLE` — the job has no sheet to give: it is not done, was delivered by email, created no account, was downloaded already, or finished more than 24 hours ago.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/UserImportUnavailable' }

  /admin/classes:
    get:
      operationId: listAllClasses
      x-permission: scope.all
      tags: [admin-classes]
      summary: Every teacher's classes
      description: |
        The Admin Classes table: every class in the centre, newest first, with
        its teacher and its active join code read in full. `tab` is `active`
        (the default) or `archived`. `q` matches the class's name or its
        teacher's name, ignoring case and accents (D-11). `teacher=disabled`
        keeps the classes whose teacher's account is disabled.
        `disabledTeacherClasses` counts the centre's classes that are not
        archived and whose teacher is disabled, whatever the search, the tab
        and the filter.

        Each `joinCode.code` is a bearer secret, so the answer is never cached
        and the operation is limited like the others that reveal one: 60 a
        minute and 600 an hour per signed-in user.
      parameters:
        - name: tab
          in: query
          required: false
          schema: { type: string, enum: [active, archived], default: active }
        - $ref: '#/components/parameters/Query'
        - name: teacher
          in: query
          required: false
          schema: { type: string, enum: [disabled] }
        - $ref: '#/components/parameters/Page'
        # Inline: the default is per resource, and
        # TestEveryPageSizeMatchesItsContract reads it from here.
        - name: limit
          in: query
          required: false
          schema: { type: integer, enum: [10, 20, 50], default: 20 }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets, disabledTeacherClasses]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminClassRow' } }
                      facets: { $ref: '#/components/schemas/AdminClassFacets' }
                      disabledTeacherClasses: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createClassForTeacher
      x-permission: scope.all
      tags: [admin-classes]
      summary: Create a class for a teacher
      description: |
        Creates a class `teacherId` teaches, with self-join on. The teacher
        must exist, be active and hold `workspace.teacher`
        (`INVALID_RECIPIENT`). While the centre lets students join with a code
        the class gets a new code in the same transaction, as
        `rotateJoinCode` would issue it with its defaults; while joining with
        a code is off it gets none, and `joinCode` is `null`. Writes the audit
        row `class.created` with `onBehalfOf`, the teacher's id, and
        `class.join_code_issued` when a code was issued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminClassCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: '`INVALID_RECIPIENT` — the teacher does not exist, is disabled or has no teacher workspace.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/classes/{id}/teacher:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      operationId: changeClassTeacher
      x-permission: scope.all
      tags: [admin-classes]
      summary: Give a class to another teacher
      description: |
        Makes `teacherId` the class's teacher. The class, archived or not, its
        members, its join code and the assignments that target it stay as they
        are: the new teacher reaches them through the class, and the previous
        one no longer does, except for the assignments they created. The
        teacher must exist, be active and hold `workspace.teacher`
        (`INVALID_RECIPIENT`). Writes the audit row `class.teacher_changed`
        with `teacher {old, new}`; with `notify`, the new teacher and the
        previous one, unless their account is disabled, find a
        `class.teacher_changed` item in their bells. Naming the class's
        current teacher changes nothing, writes nothing and tells nobody.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassTeacherChange' }
      responses:
        '200':
          description: The class with its new teacher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`INVALID_RECIPIENT` — the teacher does not exist, is disabled or has no teacher workspace.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/roles:
    get:
      operationId: listRoles
      x-permission: people.roles.manage
      tags: [admin-roles]
      summary: The roles and the permission catalogue
      description: |
        Every role with its permissions, head count and revision, and the
        catalogue of matrix rows, for the Roles & permissions page. The
        Assistant is listed as the deck draws it; only the role pickers
        (`listAssignableRoles`) leave it out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleList' }
    post:
      operationId: createRole
      x-permission: people.roles.manage
      tags: [admin-roles]
      summary: Create a custom role
      description: |
        The new role takes the icon `key-round` and the colour `gray`, and starts
        with the permissions of `copyFromRoleId`, if given. The source must pass
        the subset rule: its permissions, `learning.take_tests` apart, are the
        caller's own. The Assistant cannot be a source. A name and a description
        are stored in Unicode NFC, so the composed and decomposed forms of one
        name are the same name. The limits of 60 and 300 characters count the
        text after NFC; the schema bounds the text as sent at four times that,
        so a name typed decomposed is not refused before it is composed. A name
        holds a letter, a digit, a punctuation mark or a symbol. Neither field
        holds a control or invisible character, a tab included: a zero-width
        one, a blank filler such as the Hangul filler or the Braille blank, a
        lone code point nothing assigns. A description may hold line breaks,
        which are stored as LF whether they arrive as CR LF, CR or LF; a name
        may not. At most 200 roles exist, the four built-in ones included; past
        that the answer is `ROLE_LIMIT_REACHED`. Writes one audit row,
        `role.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: The new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the source role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ROLE_NAME_TAKEN` — another role has the name, in any letter case.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`ROLE_NOT_ASSIGNABLE` — the source is the Assistant. `ROLE_LIMIT_REACHED` — 200 roles exist already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/roles/assignable:
    get:
      operationId: listAssignableRoles
      x-permission: people.users.manage
      tags: [admin-roles]
      summary: The roles the caller may give to a user
      description: |
        The roles whose permissions, `learning.take_tests` apart, are a subset of
        the caller's, without the Assistant, which no picker offers. For the Add
        user dialog and the user sheet.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/AssignableRole' }

  /admin/roles/permissions:
    put:
      operationId: setRolePermissions
      x-permission: people.roles.manage
      tags: [admin-roles]
      summary: Save the matrix
      description: |
        Grants and revokes permissions across roles in one transaction, and
        refuses the whole save when any change breaks a rule:

        - `KEY_NOT_GRANTABLE` — a hidden key.
        - `ROLE_LOCKED` — an Admin cell other than `learning.take_tests`.
        - `STUDENT_NEEDS_TAKE_TESTS` — `learning.take_tests` off the built-in Student.
        - `CANNOT_ACT_ON_SELF` — a change to the caller's own role, except the
          Admin role's `learning.take_tests` cell, which gives no power over anyone.
        - `TARGET_ROLE_NOT_ALLOWED` (403) — a role, or a key granted or revoked,
          that the subset rule keeps from the caller.
        - `STALE_WRITE` (409) — a role is past its expected revision, or the
          save names no revision for it.

        A change that leaves a cell as it was is accepted and writes nothing.
        Everyone's permissions are read again on their next request on the
        machine that served the save, and within about ten seconds on any other. Writes
        one `role.permissions_changed` audit row per role changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePermissionsInput' }
      responses:
        '200':
          description: The roles the save touched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePermissionsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the subset rule keeps the caller from a role or a key.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`STALE_WRITE` — a role changed since the matrix was read.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`KEY_NOT_GRANTABLE`, `ROLE_LOCKED`, `STUDENT_NEEDS_TAKE_TESTS` or `CANNOT_ACT_ON_SELF`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/roles/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      operationId: updateRole
      x-permission: people.roles.manage
      tags: [admin-roles]
      summary: Edit a role's name, description, icon or colour
      description: |
        A supplied field is changed and the others are kept; a body with only
        `expectedRevision` is refused. A built-in role may be renamed; its key never changes. The target must pass the subset rule.
        A name and a description are stored in Unicode NFC and follow the rules
        of a role's creation: the limits count the text after NFC, a name holds
        a letter, a digit, a punctuation mark or a symbol, and neither holds a
        control or invisible character.
        A change moves the revision. Writes one audit row, `role.updated`, naming
        what changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
      responses:
        '200':
          description: The role after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`TARGET_ROLE_NOT_ALLOWED` — the role holds a permission the caller lacks.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`STALE_WRITE` — the role changed since `expectedRevision`. `ROLE_NAME_TAKEN` — another role has the name, in any letter case.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/overview:
    get:
      operationId: getAdminOverview
      x-permission: workspace.admin
      tags: [admin-overview]
      summary: The Admin console's Overview
      description: |
        Everything the Overview draws in one read: the centre's name, how many
        people and classes it holds, who was active on each of the last
        fourteen days, what needs attention, the five newest audit entries and
        the storage meters.

        Each section is `null` for a caller who lacks its key, never an error,
        so a custom role sees only what it may: `people` and `dailyActive` need
        `people.users.manage`, `classes` needs `scope.all`, `recentChanges`
        `system.audit.read` and `storage` `system.settings.write`. An attention
        row is held to the key of the page it leads to: `must_change_password`
        and `never_signed_in` need `people.users.manage`,
        `disabled_teacher_classes` `scope.all`, `storage` `system.settings.write`
        and `ai_credit_requests` `ai.credits.manage`, which exists only while the
        AI assistant is configured. A row whose count is zero is left out.

        Days are the local dates of the centre's `APP_TIMEZONE`, the same days
        the activity table records. `people.activeThisWeek` counts the
        distinct accounts active on any of the last seven of them, today
        included.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/summary:
    get:
      operationId: getAdminSummary
      x-permission: workspace.admin
      tags: [admin-overview]
      summary: The Admin console's nav counts
      description: |
        The one count the Admin sidebar draws as a badge: the accounts that
        must change their password (DG-54). It is the number the Overview's
        `must_change_password` attention row carries, counted by the same rule.
        `mustChangePassword` is `null` without `people.users.manage`, when the
        count is not run.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/usage:
    get:
      operationId: getUsage
      x-permission: system.settings.write
      tags: [admin-overview]
      summary: What the centre uses against its limits
      description: |
        The Plan & usage figures, each beside its limit as `UsageLimits`
        resolves it (CR-002). `aiCredits` is the month's credits used against
        the centre pool, and is `null` without `ai.credits.manage` and while the
        AI assistant is off.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/docs-session:
    post:
      operationId: openDocsSession
      x-permission: system.api_reference
      tags: [admin-docs]
      summary: Open the API reference for fifteen minutes
      description: |
        Sets `quizzivy_docs`, a docs-only session cookie. `/docs` and
        `/docs/openapi.json` answer only to it: 401 without a valid one, 403 for
        a role without `system.api_reference`. The cookie carries a token for the `docs`
        audience signed with its own key, so it is never an access token and an
        access token never opens the docs. `Path=/docs` keeps it off every API
        request, and `SameSite=Strict` still travels on the SPA's same-site
        navigation to the API origin. Admin only, through `system.api_reference`, and
        rate-limited as an operation that mints a credential.
      responses:
        '204':
          description: The docs session is open for fifteen minutes.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`quizzivy_docs=<token>; Path=/docs; Max-Age=900; HttpOnly; Secure; SameSite=Strict`'

  /admin/api-reference:
    get:
      operationId: getApiReferenceSummary
      x-permission: system.api_reference
      tags: [admin-docs]
      summary: What the API reference holds
      description: |
        The contract's OpenAPI and document versions, how many operations it
        declares and, for each tag in the order the contract lists them, how
        many operations carry it (an operation with two tags is counted under
        both). It is read once from the spec the server embeds, so it always
        describes the build that answers. The page draws its own names and
        blurbs for the groups; this is the part only the server knows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiReferenceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/api-reference/openapi.json:
    get:
      operationId: downloadOpenApi
      x-permission: system.api_reference
      tags: [admin-docs]
      summary: Download the contract
      description: |
        This file, `api/openapi.yaml`, converted to JSON with its keys, values
        and order unchanged (DG-10), an attachment named `quizzivy-openapi.json`.
        It is not the spec the server routes by, whose operation ids the code
        generator has rewritten and whose descriptions beside a `$ref` it has
        dropped. The body is that JSON document, declared as a byte stream so
        the generated server writes it as it is and does not encode it a second
        time. The response is
        `no-store`. It needs the bearer token and `system.api_reference`,
        unlike `/docs/openapi.json`, which answers to a docs session.
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              required: true
              description: '`attachment; filename="quizzivy-openapi.json"`.'
              schema: { type: string }
            Cache-Control:
              required: true
              description: '`no-store`.'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-log:
    get:
      operationId: listAuditLog
      x-permission: system.audit.read
      tags: [admin-audit]
      summary: The audit log
      description: |
        One page of the audit log, newest first, and how many entries each
        category holds. The log is append-only: nothing here changes it.

        **Range.** `range` is `today` (from midnight), `7d` (the last seven
        calendar days, today included), `30d` (the last thirty), `all`, or
        `custom`, which takes `from` and `to` as dates, both inclusive. Every
        day is the viewer's own: their stored time zone, else the centre's
        default. `from` and `to` without `custom`, `custom` without both, and a
        `to` before `from` answer `400 VALIDATION_FAILED` naming the field.

        **Search.** `q` matches, without regard to case or accents, the actor's
        name or email, the sentence that words the action in either language,
        and the label of the user, class, test, assignment, attempt, media file,
        import or question group an entry is about.

        **Categories.** An entry's category follows from the kind of thing it
        is about. Entries about the organization, exports, maintenance,
        retention and the AI credits belong to no category: `category` is
        `null` and only the unfiltered list holds them.

        **Facets.** `facets` counts the entries that match the current `q` and
        range and ignores `category`, so selecting one never zeroes the others;
        `all` counts every such entry, those in no category included, so it can
        exceed the sum of the six. `total` is the selected category's count, or
        `all`.

        **Entries.** `changes` lists the fields an entry changed, each with the
        value it had and the value it has. `details` holds anything else the
        entry recorded. A join code is shown as `••••-` and its last four
        characters, and a password, token or secret is never shown. `label` is
        `null` when the row the entry is about no longer exists.
      parameters:
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AuditCategory' }
        - $ref: '#/components/parameters/Query'
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [today, 7d, 30d, all, custom], default: 7d }
        - name: from
          in: query
          required: false
          description: First day of a `custom` range, `YYYY-MM-DD`.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Last day of a `custom` range, `YYYY-MM-DD`, inclusive.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                      facets: { $ref: '#/components/schemas/AuditCategoryFacets' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-log/export:
    get:
      operationId: exportAuditLog
      x-permission: system.audit.read
      tags: [admin-audit]
      summary: Download the audit log
      description: |
        The entries of a period, newest first, as one file. `period` is the
        last seven or thirty calendar days or the calendar year so far, counted
        in the viewer's own time zone; `range`, `from` and `to` are not
        parameters here. `category` and `q` narrow it as they narrow the list.

        The file is an attachment named `audit-log-YYYYMMDD` with `.csv` or
        `.json`, and the response is `no-store`. A CSV is UTF-8 with a
        byte-order mark and CRLF line ends, headers in the viewer's language
        by `Accept-Language`, and every cell that a spreadsheet would run as a
        formula is written with a leading `'`. A JSON file is an array of the
        entries `listAuditLog` returns. Both are streamed.

        More than 100,000 entries answer `422 EXPORT_TOO_LARGE`, and the caller
        is asked for a shorter period. Each file is itself audited as
        `audit.exported`, with the period, the format and the number of rows.
        A caller is limited to 5 files a minute and 30 an hour.
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [7d, 30d, year], default: 7d }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, json], default: csv }
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AuditCategory' }
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              required: true
              description: '`attachment; filename="audit-log-YYYYMMDD.csv"` or `.json`.'
              schema: { type: string }
            Cache-Control:
              required: true
              description: '`no-store`.'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`EXPORT_TOO_LARGE` — the period holds more than 100,000 entries.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/data-exports:
    post:
      operationId: requestDataExport
      x-permission: system.data_export
      tags: [admin-exports]
      summary: Ask for a full export of the centre's data
      description: |
        Queues one export for the worker and answers at once. It builds a ZIP
        of `users.csv` (no password hashes or tokens), `roles.csv`,
        `classes.csv` (no join codes), `class_members.csv`, `tests.csv`,
        `test_versions.csv`, `assignments.csv`, `attempts.csv`, with
        `answers.csv` when `includeAnswers` is true, and a `README.txt` in
        Vietnamese and English that describes each file. Every CSV is UTF-8
        with a byte-order mark and CRLF line ends, and a cell that a
        spreadsheet would run as a formula is written with a leading `'`.

        Only one export runs at a time for the whole centre: while any is
        queued or running, another request answers `409 EXPORT_IN_PROGRESS`.
        When the file is ready the requester gets an email that links to the
        app page `/admin/exports/{id}`, never to the file. The file can be
        fetched up to three times, by the requester, within 24 hours
        (`downloadDataExport`).
        The request is audited as `data_export.requested`. A caller who has an
        export from the last hour that has not failed (queued, running, ready
        or fetched) is refused with `429 RATE_LIMITED` and `Retry-After`, the
        seconds until that export is an hour old. A failed export, a request
        refused with `409` and a request refused with `429` do not count.
        Without object storage and the worker the answer is `501 EXPORT_OFF`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataExportRequest' }
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`EXPORT_IN_PROGRESS` — an export is already queued or running.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/ExportOff' }

  /admin/data-exports/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getDataExport
      x-permission: system.data_export
      tags: [admin-exports]
      summary: Where an export stands
      description: |
        The state of an export the caller requested; another user's export
        answers `404` exactly as a missing one does. A `ready` export whose
        24 hours have passed reads `expired`, whether or not the housekeeping
        has removed its file yet.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/ExportOff' }

  /admin/data-exports/{id}/download:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: downloadDataExport
      x-permission: system.data_export
      tags: [admin-exports]
      summary: Fetch an export, up to three times
      description: |
        Hands the requester a presigned URL for the ZIP, valid for 60 seconds,
        that forces an attachment named `quizzivy-export-YYYYMMDD.zip`. One
        statement checks that the export is `ready`, unexpired and signed fewer
        than three times, and counts the signing in `downloads`, so a failed
        transfer can be tried again; the fourth request, and a request after the
        24 hours, answer `410 EXPORT_UNAVAILABLE`. Another user's export answers
        `404`. The response is `no-store`, because the URL is a credential. Each
        signing is audited as `data_export.downloaded`, and a caller may fetch
        ten an hour.
      responses:
        '200':
          description: The URL.
          headers:
            Cache-Control:
              required: true
              description: '`no-store`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExportDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: '`EXPORT_UNAVAILABLE` — the export is not ready, has expired, failed, or was already signed three times.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/ExportOff' }

  /admin/ai/credits:
    get:
      operationId: getAiCredits
      x-permission: ai.credits.manage
      tags: [admin-ai]
      summary: The month's AI credits
      description: |
        The pool, the teachers with their month, the requests waiting and the
        rules in force. The projection is `used` over the days elapsed times
        the days in the month, computed from the server's clock.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiAdminCredits' }
        '501': { $ref: '#/components/responses/AiOff' }

  /admin/ai/rules:
    patch:
      operationId: updateAiRules
      x-permission: ai.credits.manage
      tags: [admin-ai]
      summary: Change the centre's AI rules
      description: |
        A supplied field is changed and the others are kept. A new default
        allowance rewrites this month's allowances that are not custom, never
        below what a teacher has already used. One audit row names the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiRulesInput' }
      responses:
        '200':
          description: The rules after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiRulesChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/AiOff' }

  /admin/ai/credits/additions:
    post:
      operationId: addAiCredits
      x-permission: ai.credits.manage
      tags: [admin-ai]
      summary: Add credits to this month's pool
      description: |
        How an Admin approves use beyond the plan: the pool is never overspent
        without it. The credits do not carry into next month. The audit row
        names the caller as the approver.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCreditsAddition' }
      responses:
        '201':
          description: The pool after the addition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiPool' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/AiOff' }

  /admin/ai/teachers/{userId}/allowance:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    put:
      operationId: setAiAllowance
      x-permission: ai.credits.manage
      tags: [admin-ai]
      summary: Change a teacher's AI allowance, or pause or resume them
      description: |
        Takes effect at once and usage so far still counts, so an allowance
        below it is refused (`AI_ALLOWANCE_BELOW_USE`). Approved requests'
        credits stay on top. Subject to the subset rule: the teacher's
        permissions, except `learning.take_tests`, must be a subset of the
        caller's (`FORBIDDEN`), as for a student's account. One audit row names
        the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiAllowanceInput' }
      responses:
        '200':
          description: The teacher's month after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiTeacherMonth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`FORBIDDEN` — the teacher''s permissions are not a subset of the caller''s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 'No such teacher: the id names no active user who is not a student.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: '`AI_ALLOWANCE_BELOW_USE` — the allowance is below what the teacher has used or holds this month.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }

  /admin/ai/credit-requests/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: approveAiCreditRequest
      x-permission: ai.credits.manage
      tags: [admin-ai]
      summary: Approve a request for more credits
      description: |
        Raises the teacher's allowance for the request's month by the amount and
        tells the teacher. Subject to the subset rule, as `setAiAllowance` is.
        One audit row names the caller.
      responses:
        '200':
          description: The decided request and the teacher's allowance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCreditDecision' }
        '403':
          description: '`FORBIDDEN` — the teacher''s permissions are not a subset of the caller''s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `AI_REQUEST_DECIDED` — decided already. `AI_REQUEST_EXPIRED` — the
            request is from an earlier month, whose allowance is no longer the
            teacher's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }

  /admin/ai/credit-requests/{id}/decline:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      operationId: declineAiCreditRequest
      x-permission: ai.credits.manage
      tags: [admin-ai]
      summary: Decline a request for more credits
      description: |
        Changes only the request's status and tells the teacher. Subject to the
        subset rule, as `setAiAllowance` is. One audit row names the caller.
      responses:
        '200':
          description: The decided request; `allowance` is zero.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCreditDecision' }
        '403':
          description: '`FORBIDDEN` — the teacher''s permissions are not a subset of the caller''s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`AI_REQUEST_DECIDED` — decided already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }

  /admin/settings:
    get:
      operationId: getOrganizationSettings
      x-permission: system.settings.write
      tags: [admin-settings]
      summary: The centre's settings
      description: The whole settings document as stored, read from the database.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              required: true
              description: '`private, no-store`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
    put:
      operationId: updateOrganizationSettings
      x-permission: system.settings.write
      tags: [admin-settings]
      summary: Save the centre's settings
      description: |
        Replaces the whole document when `expectedRevision` is the stored one,
        and answers it as stored, its revision one higher. A logo is named by
        the hash `uploadOrganizationLogo` answered; until a save names it, an
        upload changes nothing. A policy that would leave the caller, or every
        active built-in Admin, without a way to sign in is refused, judged
        inside the save as `getSignInImpact` judges it. One audit row,
        `organization.updated`, names the caller and the fields that changed,
        and each changed limit with its value before and after (`null` for the
        default).
        Other servers apply the new document within 30 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSettingsInput' }
      responses:
        '200':
          description: |
            The document as stored. A document equal to the stored one changes
            nothing: the same revision comes back and no audit row is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
        '400':
          description: |
            The body fails its schema, or `VALIDATION_FAILED` with a message per
            field: a text that is empty or too long after trimming, a name that
            holds a line break or an invisible character, a website that is not a
            domain or an `https` address without credentials, an email or a
            phone number that is not one, a repeated domain, or a logo the server
            does not hold (as `organization.logo.light` or `organization.logo.dark`),
            or a limit outside its range (as `limits.seats` and so on).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: '`STALE_WRITE` — saved elsewhere since `expectedRevision`; read again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `SIGN_IN_POLICY_LOCKOUT` — the policy would leave the caller, or every
            active built-in Admin, with no way to sign in. `details.affectedUsers`
            and `details.affectedAdmins` count the active accounts it leaves
            without one. Nothing was stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/settings/sign-in-impact:
    post:
      operationId: getSignInImpact
      x-permission: system.settings.write
      tags: [admin-settings]
      summary: What a sign-in policy would do to the active accounts
      description: |
        Counts, without storing anything, the active accounts the proposed
        policy would leave with no way to sign in, the built-in Admins among
        them, and whether the caller is one. The settings page asks before it
        offers Save; the save judges again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signIn]
              additionalProperties: false
              properties:
                signIn: { $ref: '#/components/schemas/SignInPolicy' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInImpact' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/settings/retention-impact:
    post:
      operationId: getRetentionImpact
      x-permission: system.settings.write
      tags: [admin-settings]
      summary: What a retention policy would remove today
      description: |
        Counts, without storing or removing anything, what the nightly sweep
        would do today under the proposed policy: the answers it would remove
        and the attempts they belong to, the focus-loss events it would delete,
        and the disabled accounts it would anonymise, with those it would leave
        because they own classes or content. The counts are the sweep's dry run
        (T-R5.17a), built from the same rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retention]
              additionalProperties: false
              properties:
                retention: { $ref: '#/components/schemas/RetentionPolicy' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionImpact' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/settings/logo:
    post:
      operationId: uploadOrganizationLogo
      x-permission: system.settings.write
      tags: [admin-settings]
      summary: Upload a logo
      description: |
        Stores a logo and answers its hash, which a save of the settings then
        names; the upload alone changes nothing ("Logo uploaded. Save settings
        to apply."). The object is content-addressed, so the same file uploaded
        twice is stored once.

        A PNG is at most 1 MiB, square within 2% and 256 to 2048 pixels a side.
        Its type is read from its first bytes, its header before any pixel is
        decoded, and it is decoded and encoded afresh, which drops every
        metadata chunk. Any other type, an SVG included, answers
        `MEDIA_TYPE_UNSUPPORTED`: the settings page draws an SVG to a PNG in the
        browser before it uploads (D-019). A caller
        may upload 20 logos an hour.

        The request may carry 16 KiB more than the 1 MiB file for the multipart
        framing.
      x-max-body-bytes: 1064960
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, variant]
              properties:
                file: { type: string, format: binary }
                variant: { type: string, enum: [light, dark] }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationLogoUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: '`MEDIA_TOO_LARGE` — a file over 1 MiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: |
            `MEDIA_TYPE_UNSUPPORTED` (not a PNG), `MEDIA_UNREADABLE` (the header or
            the pixels cannot be read) or `IMAGE_DIMENSIONS` (not square within 2%,
            a side outside 256 to 2048 pixels, or needing more memory to decode
            than the server allows). Nothing was stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501':
          description: Object storage is not configured, so no logo can be kept.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /teacher/classes:
    get:
      operationId: listClasses
      x-resource-list: class
      x-permission: workspace.teacher
      description: |
        Classes, newest first. Paginated and searchable like every other list:
        §1.3 promised single-digit classes, and a development database already
        holds over a hundred, which is what broke the class pickers.

        **Codes.** Each item's `joinCode.code` is a bearer secret, so it is opened
        only when the request says `withCodes=true`, which the class cards send and
        the pickers do not. It is then the code exactly when `getJoinCode` would
        read it for the same caller and class: the caller holds
        `teaching.classes.write`, reaches the class, and the code is readable (not
        a legacy code, and sealed under a key this server holds). In every other
        case `code` is `null`, a missing permission included, which is not an
        error. The answer is never cached, whether or not codes are asked for, and
        the operation is limited like the others that reveal one: 60 a minute and
        600 an hour per user.
      tags: [teacher-classes]
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Defaults to `active`, so every picker drops archived classes without asking (G-08).
          schema:
            type: string
            enum: [active, joinable, archived, all]
            default: active
        - name: withCodes
          in: query
          required: false
          description: Open each item's join code. Only the screen that shows codes asks.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items, facets]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ClassListItem' } }
                      facets: { $ref: '#/components/schemas/ClassFacets' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createClass
      x-permission: teaching.classes.write
      description: Creates a class. A join code is not issued automatically; rotate to get one (§6.4).
      tags: [teacher-classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'] }
                scheduleLabel:
                  type: [string, 'null']
                  maxLength: 120
                  description: Plain text, trimmed by the server; omitted, `null` and blank are all none. The 120 characters are counted before trimming.
                room:
                  type: [string, 'null']
                  maxLength: 60
                  description: As `scheduleLabel`, 60 characters.
                selfJoinEnabled: { type: boolean, default: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /teacher/classes/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      operationId: deleteClass
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      description: Permanently deletes an archived class and its owned memberships/join codes. Assignment references block deletion; student accounts and papers are retained.
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `RESOURCE_NOT_ARCHIVED` — the class is not archived.
            `RESOURCE_REFERENCED` — something still references it, and
            `details.referencedBy` (`ReferencedBy`) always names what:
            `assignments` (an assignment targets the class), `members` (a
            membership in another class came through one of its join codes),
            or `other`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: getClass
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: workspace.teacher
      description: A single class, including its active join code metadata -- but never the code itself (§13.3).
      tags: [teacher-classes]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateClass
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      description: Edits name, description, schedule and room, toggles self-join, or archives and restores. Disabling self-join does not revoke the existing code; use the delete endpoint for that.
      tags: [teacher-classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'] }
                scheduleLabel:
                  type: [string, 'null']
                  maxLength: 120
                  x-go-type: json.RawMessage
                  x-go-type-skip-optional-pointer: true
                  description: |
                    Plain text, trimmed by the server; a value that is blank once
                    trimmed is the same as none. Omitted, the stored value is kept;
                    `null` or blank clears it. The 120 characters are counted before
                    trimming.
                room:
                  type: [string, 'null']
                  maxLength: 60
                  x-go-type: json.RawMessage
                  x-go-type-skip-optional-pointer: true
                  description: As `scheduleLabel`, 60 characters.
                selfJoinEnabled: { type: boolean }
                archived: { type: boolean, description: 'true archives, false restores; either is idempotent.' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/classes/{id}/members:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: listClassMembers
      x-resource:
        - { in: path, name: id, kind: class }
      x-resource-list: student
      x-permission: people.students.read
      tags: [teacher-classes]
      description: |
        Shows `joinedVia` and `joinedAt` so the teacher can spot unexpected
        enrolments — the mitigation §6.5 relies on instead of an approval queue.
        Spec §15 has no endpoint for this. `q` searches name and email.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ClassMember' } }
    post:
      operationId: addClassMember
      x-resource:
        - { in: path, name: id, kind: class }
        - { in: body, name: /userId, kind: student }
      x-permission: teaching.classes.write
      description: |
        Enrols an existing user directly, bypassing the join code. Recorded as
        `joinedVia: admin` so the teacher can tell the two apart.

        `userId` must be an active student the caller reaches. Anything else
        answers 404, whatever the reason, so the answer reveals nothing about
        accounts beyond the caller's reach.
      tags: [teacher-classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201':
          description: 'Added with `joinedVia: admin`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/classes/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    delete:
      operationId: removeClassMember
      x-resource:
        - { in: path, name: id, kind: class }
        - { in: path, name: userId, kind: student }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      description: |
        Revokes access. **Attempts are retained, not deleted** (§6.4), and an
        in-flight attempt is not revoked — eligibility is evaluated at attempt
        creation.

        Idempotent for a user who is not a member: the class ends up in the
        requested state either way. A class that does not exist is still a 404,
        so a typo in the URL does not look like it worked.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teacher/classes/{id}/join-code:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      operationId: getJoinCode
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      summary: Read the class's active join code
      description: |
        The active code of a class the caller teaches, or of any class under
        `scope.all`, with its metadata (D5). The code is a bearer secret: the
        response is never cached, and the operation is rate-limited like every
        other that reveals one. It is not audited, because the teacher's
        screens show the code on every class card.

        `code` is `null` when the code cannot be read back: it is sealed under
        a key this server no longer holds, and can be neither read nor
        redeemed. Rotate it to get a readable code. `legacy` is always false:
        a code issued before v0.8.0, held only as a hash, was rotated in R4,
        and the database refuses one that is not revoked (§13.3).

        404 when the class is not the caller's, exactly as a missing class
        answers, or when it has no active code.
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: rotateJoinCode
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      summary: Issue a new join code, revoking the old one
      description: |
        Revoke-and-issue happens in **one transaction**, so the one-active-code-
        per-class constraint cannot be violated. Previously enrolled students are
        unaffected (§6.1).

        An archived class is refused with `409 CLASS_ARCHIVED` and nothing is
        written: its current code, if any, stays as it was. Nobody can join an
        archived class, so a code issued for one would be a dead secret that
        reads as live. The archived check runs after the class has been found
        for the caller, so another teacher's archived class answers 404 exactly
        as a missing one does. Restore the class (`updateClass` with
        `archived: false`) to rotate again. `revokeJoinCode` stays allowed on an
        archived class.

        The plaintext code is returned here, and `getJoinCode` reads it again.
        It is stored encrypted under a key the database does not hold, with a
        keyed hash to find it, so a database dump does not hand over class
        access (§13.3).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 30
                  description: |
                    The code works through 23:59:59 on the day this many days from
                    today, in the caller's time zone: the profile preference, or
                    `Asia/Ho_Chi_Minh` when there is none or it cannot be read. A code
                    made at any hour of a day expires at the end of the same day.
                maxUses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 40
                  description: |
                    Defaults to 40 rather than spec §6.1's `null = unlimited`
                    (O-06). The realistic threat to a bearer code is being
                    *forwarded*, not guessed, and a use cap is the mitigation
                    that costs nothing.

                    **Not nullable on the way in, unlike the stored column.**
                    A nullable request field cannot express what it promises:
                    an omitted field and an explicit `null` both arrive as "no
                    value", so "unlimited" would have been indistinguishable
                    from "use the default" and one of the two would silently
                    never happen. A cap of 1000 covers every real cohort, and
                    the column stays nullable for codes issued before this.
      responses:
        '201':
          description: Issued.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, maxUses]
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Plaintext, grouped `XXXX-XXXX`. `getJoinCode` reads it again.
                    examples: ['K7M3-P9QR']
                  expiresAt: { $ref: '#/components/schemas/Timestamp' }
                  maxUses: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CLASS_ARCHIVED` — the class is archived, so it can have no new code.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: revokeJoinCode
      x-resource:
        - { in: path, name: id, kind: class }
      x-permission: teaching.classes.write
      tags: [teacher-classes]
      description: |
        Revokes without issuing a replacement, and sets `selfJoinEnabled: false`
        (§6.4). Both, or neither: a revoked code with self-join still on
        advertises a flow that cannot succeed, and a cleared flag without the
        revocation leaves a live bearer secret the teacher believes is cancelled.

        Idempotent. A class with no active code still returns 204 — "there is no
        way in" is the requested state, and reporting failure would invite a
        retry that changes nothing.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =================================================================== student

  /teacher/ai/questions/generate:
    post:
      operationId: generateAiQuestions
      x-resource:
        - { in: body, name: /testId, kind: test }
        - { in: body, name: /stimulusId, kind: none }
        - { in: body, name: /sectionId, kind: none }
      x-permission: ai.use
      tags: [teacher-ai]
      summary: Draft questions from a passage, a transcript, a topic or for a section
      description: |
        Answers draft questions and writes nothing: the teacher adds the ones
        they keep through `createQuestion` or the section writes. The request
        names one of the shapes `AiGenerateRequest` describes. `stimulusId` and
        `sectionId` resolve only inside the test `testId` names. Only the source
        text, the section's own title, instructions and question prompts and
        types, and the settings are sent to the provider; no answer key of an
        existing question is sent.

        Reserves the call's ceiling before it reaches the provider and settles
        what the provider billed after; `usage` says what it cost.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiGenerateRequest' }
      responses:
        '200':
          description: Draft questions, at most `count` of them, fewer when the provider's answer held some that could not be used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/AiCreditsExhausted' }
        '403': { $ref: '#/components/responses/AiNotAllowed' }
        '404':
          description: No such test, passage or section in the caller's reach.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '501': { $ref: '#/components/responses/AiOff' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /teacher/ai/tests/{id}/check:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
